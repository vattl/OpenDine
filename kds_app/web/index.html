<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kds_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KDS 厨显</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #0f172a;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <div id="loading">KDS 厨显加载中…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var loading = document.getElementById('loading');
      function hideLoading() {
        if (loading) loading.remove();
        loading = null;
      }
      window.addEventListener('flutter-first-frame', hideLoading);
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!loading) return;
          loading.textContent = '仍在加载… 可打开 F12 查看 Console 是否有报错';
        }, 20000);
      });
      window.addEventListener('error', function (ev) {
        if (!loading) return;
        var src = ev.filename || (ev.target && ev.target.src) || '';
        if (/main\.dart\.js|flutter|canvaskit/i.test(src)) {
          loading.textContent = '脚本加载失败，请重新执行 flutter run -d chrome 或 flutter build web';
        }
      }, true);
    })();
  </script>
</body>
</html>
