name: kds_app
description: KDS 厨显 Android 端 — 厨房显示系统
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.4
  logger: ^2.5.0
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.3.2
  share_plus: ^10.1.4
  device_info_plus: ^12.4.0
  crypto: ^3.0.3
  collection: ^1.19.0
  sqlite3: ^3.4.0
  sqlite3_flutter_libs: ^0.5.42
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name: sqlite3
