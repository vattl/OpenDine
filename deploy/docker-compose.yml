version: '3.8'

services:
  opendine-mysql:
    image: mysql:8.0
    container_name: opendine-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_diancan
      TZ: Asia/Shanghai
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  opendine-redis:
    image: redis:7.0-alpine
    container_name: opendine-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  opendine-server:
    image: openjdk:8-jre-alpine
    container_name: opendine-server
    restart: always
    depends_on:
      opendine-mysql:
        condition: service_healthy
      opendine-redis:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://opendine-mysql:3306/db_diancan?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: opendine-redis
      SPRING_REDIS_PORT: 6379
      APP_PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ../server/target/diancan-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
      - ./data/uploads:/www/wwwroot/upload
    entrypoint: ["java", "-jar", "-Dfile.encoding=UTF-8", "/app/app.jar"]

  opendine-nginx:
    image: nginx:alpine
    container_name: opendine-nginx
    restart: always
    depends_on:
      - opendine-server
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/uploads:/www/wwwroot/upload:ro
