      summary: 更新门店夜间九折配置
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        门店账号仅可写本店；不可写 **`shop_id=0`** 全店模板。请求体字段同 **`PUT /admin/config/wechat-prepay-ninefold`**。
      parameters:
        - name: shopId
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, description: 本店夜间九折独立开关 }
                payRate: { type: number, format: double }
                minBaseYuan: { type: number, format: double }
                timeStart: { type: string }
                timeEnd: { type: string }
                zoneId: { type: string }
                eligibleDiningTypes:
                  type: array
                  items: { type: string, enum: [堂食, 打包, 外卖] }
      responses:
        '200': { description: 成功 }
        '403': { description: 无权限 }

  /admin/payment/capabilities:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 获取门店支付能力开关
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      description: |
        **门店隔离**：门店账号须带 **`X-Shop-Id`**，仅查看本店；总部无门店上下文时 **`shopId` 缺省为 0**（全店默认模板）。
        响应在 C 端字段基础上增加 **`targetShopId`**、**`scope`**（`global`|`shop`）、**`hasOwnConfig`**、**`inheritsGlobal`**。
        终端隔离配置见 **`clients.cashier`** 与 **`clients.miniProgram`**。`enabled/channels` 是持久化配置值，设置页保存后按此回显；`effectiveEnabled/effectiveChannels` 是支付时的实际可用值。
        两端总开关和同名渠道完全独立，任何一端的保存、关闭或商户就绪状态都不会改写另一端配置。
        `effectiveEnabled` 与本端 `enabled` 相同；`effectiveChannels` 还会叠加本端总开关和商户就绪条件。
        收银端 `effectiveChannels.combined` 仅在组合开关开启且至少两个收银基础渠道生效时为 `true`。
        **`paymentMethods` 已弃用且不再返回**。
        小程序节点另返回 **`wechatMerchantReady`**、**`wechatMissingFields`**；顶层兼容字段为 **`miniProgramWechatMerchantReady`**、**`miniProgramWechatMissingFields`**。
        **D014**：`clients.cashier` 新增 `wechat_qr`/`alipay_qr`（收银微信/支付宝收款码独立开关）；`clients.miniProgram.channels/effectiveChannels` 新增 `alipay`（小程序支付宝，默认关）。
        **D015**：新增 `channelStates`（同上）；`available=false` 的渠道不可开启。
        **D017**：C 端 `GET /config/payment-capabilities` 已精简（`effective*/canEnable*/hint/missing` 及 `clients.*.wechat_qr/alipay_qr` 不再返回）；本 B 端接口**保留全量**字段（含 `effectiveEnabled/effectiveChannels/wechatReadyHint/wechatMissingFields/canEnable*/globalOnlinePayEnabled`），配置页继续可用。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
          description: 目标门店；门店账号不可与 X-Shop-Id 不一致；总部未传时 0
      responses:
        '200':
          description: 成功
        '4003':
          description: 跨店或无权访问全店模板
        '500': { description: 失败 }
    put:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 更新门店支付能力开关
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        门店账号**不可**写入 **`shop_id=0`** 全店模板；跨店返回 **4003**。
        收银端微信渠道（`clients.cashier.channelStates.wechat`）可**独立开启**，不要求存在启用的 **`default`** 微信商户（可走线下收款；线上微信支付发起时由服务端兜底校验商户配置，见 D012）。
        开启小程序微信渠道前，该商户还必须完整配置 **AppID、商户号、支付回调地址、32 位 APIv3 密钥、商户证书序列号、平台公钥 ID/公钥引用、商户私钥引用**；否则返回 **`code=40203`** 和缺失字段。
        **D013**：`GET` 响应新增 `clients.cashier.wechatMerchantReady/wechatReadyHint` 与顶层 `canEnableCashierWechatPay`（口径同 C 端）；支付宝线上收款=个人码 + webhook 验签，不依赖支付商户配置。
        **D014**：收银新增微信/支付宝收款码独立开关（`channelStates.wechat_qr/alipay_qr`）与小程序支付宝（`channelStates.alipay`）。
        **D015**：`body` 支持 `clients.*.channelStates.<渠道>.enabled` 写入；开启校验：请求置 `true` 的渠道若 `available=false`（收银组合基础渠道 <2、小程序微信商户未配齐）返回错误并拒绝保存。
        删除、禁用或更新为不完整配置后，不改写任何已保存开关；对应终端的 `effectiveChannels.wechat` 自动变为 `false`。重新补齐商户配置后无需再次打开渠道。
        **D016/D017（写入无兼容）**：`body` 仅接受 `clients.*.enabled`、`clients.*.channelStates.<渠道>.enabled`、`disabledMessage`；全部旧平铺键（`onlinePayEnabled`/`wechatEnabled`/`alipayEnabled`/`balanceEnabled`/`combinedEnabled`/`cashier*Enabled`/`miniProgram*Enabled`/`offlineCollect*`）与 `clients.*.channels.*` 嵌套布尔不再处理（请求携带即忽略）。
        **D021**：收款码开关单一来源 = 收银端 `cashier`（`channelStates.wechat_qr/alipay_qr` → `cashier_wechat_qr_enabled`/`cashier_alipay_qr_enabled` 列）；**不再双写** `offline_collect_channels`/`offline_collect_enabled`（列弃用）。响应中顶层 `channels.offlineCollect`（`enabled`/`modes`）为派生展示：`enabled`=任一收款码开启，`modes`=开启的收款码集合；`clients.cashier.wechat_qr/alipay_qr` 与 `channelStates.wechat_qr/alipay_qr` 同源。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clients:
                  type: object
                  properties:
                    cashier:
                      type: object
                      properties:
                        enabled: { type: boolean, description: 收银端支付总开关 }
                        channels:
                          type: object
                          description: 只读（GET 返回保存值；写入仅接受 channelStates，D017）
                        channelStates:
                          type: object
                          description: D015 简化模型：渠道键 → {enabled, available, hint}；enabled 可写（available=false 时拒绝开启）；available/hint 只读
                          additionalProperties:
                            type: object
                            properties:
                              enabled: { type: boolean, description: 保存的开关值（可写） }
                              available: { type: boolean, description: 后端计算的可用性（只读）；false=不具备开启条件 }
                              hint: { type: string, description: available=false 时的原因文案（只读） }
                    miniProgram:
                      type: object
                      properties:
                        enabled: { type: boolean, description: 微信小程序端支付总开关 }
                        channels:
                          type: object
                          description: 只读（GET 返回保存值；写入仅接受 channelStates，D017）
                        channelStates:
                          type: object
                          description: D015 简化模型：渠道键 → {enabled, available, hint}；enabled 可写（available=false 时拒绝开启）；available/hint 只读
                          additionalProperties:
                            type: object
                            properties:
                              enabled: { type: boolean, description: 保存的开关值（可写） }
                              available: { type: boolean, description: 后端计算的可用性（只读）；false=不具备开启条件 }
                              hint: { type: string, description: available=false 时的原因文案（只读） }
                disabledMessage: { type: string, description: 关闭线上支付时 C 端提示，默认「请联系服务员结账」 }
      responses:
        '200': { description: 成功，返回更新后的完整能力对象（含 hasOwnConfig 等） }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/merchants:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 支付商户配置列表（脱敏，按门店隔离）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      description: |
        返回 **`owned`**（当前 **`targetShopId`** 下本店配置）与 **`inheritedTemplates`**（**`shop_id=0`** 全店模板，**`readOnly=true`**，门店账号不可改）。
        运行时默认只解析本店商户；仅该门店通过 **merchant-policy** 显式开启 `allowGlobalFallback` 后才补充全局模板。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
        - name: channel
          in: query
          schema: { type: string, default: wechat, enum: [wechat, alipay] }
      responses:
        '200': { description: 成功，body 含 targetShopId、scope、owned、inheritedTemplates }
        '4003': { description: 跨店 }
        '500': { description: 失败 }
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 新增支付商户配置
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        写入当前门店上下文对应 **`shop_id`**；门店账号不可创建 **`shop_id=0`** 行。
        成功响应为商户编辑对象，并附带 **`capabilities`**（保存后最新支付能力）。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMerchantConfigUpsert'
      responses:
        '200': { description: 成功，返回保存后的 PaymentMerchantEditForm，并附带 capabilities }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/merchants/edit-form:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 支付商户编辑表单（本店，可新建）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      description: |
        按 **`shopId` + `channel` + `merchantKey`** 查询**本店** `t_payment_merchant_config` 行。
        - 已存在：返回 **`exists=true`** 及可编辑字段（`apiV3Key` 为 `******` 表示已配置、提交时不改；`hasApiV3Key`/`hasPrivateKey`）。
        - 不存在：返回 **`exists=false`** 空白模板，含 **`notifyUrlSuggestions`** 推荐回调地址。
        - `default` 微信商户返回 **`payReady`** 与 **`missingFields`**；前端仅可在 `payReady=true` 时开放“小程序微信支付”开关。
        门店账号不可查全店模板行（请用列表 `inheritedTemplates` 只读参考）。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
        - name: channel
          in: query
          schema: { type: string, default: wechat, enum: [wechat, alipay] }
        - name: merchantKey
          in: query
          schema: { type: string, default: default }
      responses:
        '200': { description: 成功，body 为 PaymentMerchantEditForm }
        '4003': { description: 跨店或不可写门店 }
        '500': { description: 失败 }

  /admin/payment/merchants/save:
    put:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 保存支付商户配置（新建或更新本店）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        **推荐**运营端统一用此接口保存表单。
        - body 带 **`id`**：更新该条（须属于当前可写门店）。
        - 无 **`id`**：按 **`channel` + `merchantKey`** 查找本店行，有则更新、无则新建。
        - 部分更新：只传需要修改的字段；**`apiV3Key`/`privateKeyRef` 传 `******` 或不传表示不修改**。
        - 已存在商户的 `channel/merchantKey` 为稳定身份，不可修改；需要新身份时新建配置。
        - **`apiV3Key` 必须为 32 位**；成功响应附带保存后的 **`capabilities`**。
        支持 snake_case（如 `mch_id`、`notify_url`）。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMerchantConfigUpsert'
      responses:
        '200': { description: 成功，返回保存后的 PaymentMerchantEditForm，并附带 capabilities }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/merchants/{id}:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 支付商户配置详情（编辑表单）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      description: |
        校验 **`shop_id`** 属于当前门店上下文；返回与 **edit-form** 相同结构的 **`PaymentMerchantEditForm`**（含 `notifyUrlSuggestions`）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功 }
        '4003': { description: 不属于当前门店 }
        '500': { description: 失败 }
    put:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 更新支付商户配置
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        不可修改 **`shop_id=0`** 的全店模板（门店账号）；不可跨店更新。
        支持部分更新；`apiV3Key` 新值必须为 32 位。成功响应附带最新 **`capabilities`**。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMerchantConfigUpsert'
      responses:
        '200': { description: 成功，返回更新后的 PaymentMerchantEditForm，并附带 capabilities }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }
    delete:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 退役支付商户配置（可恢复）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        同 PUT，门店账号不可退役全店模板行。接口写入 `status=RETIRED、enabled=0`，保留凭据与历史交易解析能力。
        响应含 **`retiredId`**、**`retired=true`**、**`physicallyDeleted=false`** 与最新 **`capabilities`**。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功，返回 retiredId、retired、physicallyDeleted=false、capabilities }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/merchants/{id}/restore:
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 恢复已退役支付商户
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功，返回 PaymentMerchantEditForm、restored=true 与 capabilities }
        '4003': { description: 门店账号不可跨店恢复 }

  /admin/payment/merchant-policy:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 查询门店商户解析策略
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: shopId, in: query, schema: { type: integer } }
      responses:
        '200': { description: 返回 shopId、allowGlobalFallback；未配置时为 false }
    put:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 更新门店商户解析策略
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: shopId, in: query, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowGlobalFallback]
              properties:
                allowGlobalFallback: { type: boolean, default: false }
      responses:
        '200': { description: 返回已保存策略 }
        '4003': { description: 门店账号不可跨店修改 }

  /admin/payment/private-key/upload:
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 上传微信商户 PEM 私钥并返回服务器文件路径
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        前端上传完整 PEM 私钥文件，后端保存到服务器目录 **`payment.private-key-upload-dir`**（默认 `payment-keys`），
        响应返回 **`privateKeyRef`** / **`private_key_ref`**。数据库只应保存该路径，不保存 PEM 内容。
        适用于「先上传文件，再把返回路径填入新增商户配置」的流程。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
          description: 目标门店；门店账号不可与 X-Shop-Id 不一致；总部未传时 0
        - name: merchantKey
          in: query
          schema: { type: string, default: default }
          description: 商户实例键，如 default、small_amount，用于生成服务器文件名
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PEM 私钥文件（BEGIN PRIVATE KEY / BEGIN RSA PRIVATE KEY）
      responses:
        '200': { description: 成功，返回 privateKeyRef/private_key_ref 文件路径 }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/platform-public-key/upload:
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 上传微信支付平台公钥或 X.509 平台证书并返回服务器文件路径
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        前端上传完整 PEM 平台公钥或 X.509 证书文件，后端保存到服务器安全目录并校验 RSA 格式，
        响应返回 **`platformPubKeyRef`** / **`platform_pub_key_ref`** 与 **`materialType`**（`PUBLIC_KEY` 或 `CERTIFICATE`）。
        数据库只应保存该路径，不保存 PEM 内容。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
          description: 目标门店；门店账号不可与 X-Shop-Id 不一致；总部未传时 0
        - name: merchantKey
          in: query
          schema: { type: string, default: default }
          description: 商户实例键，如 default、small_amount，用于生成服务器文件名
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 微信支付平台公钥（BEGIN PUBLIC KEY）或 X.509 平台证书（BEGIN CERTIFICATE）
      responses:
        '200': { description: 成功，返回 platformPubKeyRef/platform_pub_key_ref 文件路径及 materialType }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/merchants/{id}/private-key/upload:
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 上传并绑定指定商户的微信 PEM 私钥
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        前端上传完整 PEM 私钥文件，后端保存到服务器文件系统，并立即更新该商户配置的 **`private_key_ref`**。
        响应返回脱敏后的商户配置，同时包含未脱敏的 **`privateKeyRef`** 路径，便于前端回显/保存状态。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PEM 私钥文件（BEGIN PRIVATE KEY / BEGIN RSA PRIVATE KEY）
      responses:
        '200': { description: 成功，返回更新后的商户配置与 privateKeyRef 路径 }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/certificate/upload:
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 统一上传支付证书、私钥或公钥凭据（支持 PKCS12、PEM、X.509 CRT）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        统一支持全格式证书与凭据上传，支持智能格式探测与指定类型校验（CLIENT_CERT_P12, PRIVATE_KEY, PLATFORM_PUBLIC_KEY, ALIPAY_*）。
        保存到服务器目录 payment.private-key-upload-dir 下的门店隔离子目录，返回 standardized fileRef 路径。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          schema: { type: integer }
          description: 目标门店；门店账号不可跨店
        - name: merchantKey
          in: query
          schema: { type: string, default: default }
          description: 商户实例键（default、small_amount）
        - name: type
          in: query
          schema:
            type: string
            enum: [AUTO, CLIENT_CERT_P12, PRIVATE_KEY, PLATFORM_PUBLIC_KEY, ALIPAY_ROOT_CERT, ALIPAY_APP_CERT, ALIPAY_PUBLIC_CERT]
            default: AUTO
          description: 证书凭证类型，未指定或传 AUTO 时由系统自动嗅探识别
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 证书/密钥文件（.p12, .pfx, .pem, .crt）
      responses:
        '200':
          description: 成功，返回 certificateType 与 fileRef 及别名字段
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  certificateType: { type: string, example: CLIENT_CERT_P12 }
                  fileRef: { type: string, example: /upload/payment-keys/shop-1/wechat-default-xxx-apiclient-cert.p12 }
                  filename: { type: string, example: apiclient_cert.p12 }
                  fileSize: { type: integer, example: 5120 }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/merchants/{id}/certificate/upload:
    post:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 上传证书并直接绑定至指定商户配置（支持 PKCS12 双向客户端证书、私钥与公钥）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:write
      description: |
        前端上传证书文件，后端保存至服务器安全目录，并自动根据类型写入商户配置对应的凭证引用字段（如 client_cert_p12_ref、private_key_ref），自增凭据版本并记录快照。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema:
            type: string
            enum: [AUTO, CLIENT_CERT_P12, PRIVATE_KEY, PLATFORM_PUBLIC_KEY, ALIPAY_ROOT_CERT, ALIPAY_APP_CERT, ALIPAY_PUBLIC_CERT]
            default: AUTO
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 证书文件
      responses:
        '200': { description: 成功，返回更新后的商户配置对象与 certificateType/fileRef 路径 }
        '4003': { description: 门店账号不可修改全店默认或跨店 }
        '500': { description: 失败 }

  /admin/payment/wechat/pay-auth-audit:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 微信支付 JSAPI 鉴权配置诊断（排查 401，不请求微信）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
        - name: merchantKey
          in: query
          required: false
          schema: { type: string, enum: [default, small_amount, '1', '2'], default: default }
          description: default=主商户；small_amount=小金额商户
      responses:
        '200':
          description: 成功，含 serialMatchCert、issues、privateKeyRefUsed 等
        '500': { description: 失败 }

  /admin/payment/notify-urls:
    get:
      tags: [配置管理, 运营后台, 支付与回调]
      summary: 支付回调 URL 模板（只读）
      security: [{ BearerAuth: [] }]
      x-permission: payment:config:read
      responses:
        '200':
          description: 成功，含 wechatPayNotify、wechatRefundNotify、alipayPayNotify
        '500': { description: 失败 }

  /admin/config/zsq-auto-api:
    get:
      tags: [配置管理, 运营后台]
      summary: 获取真省钱开关（按门店）
      security: [{ BearerAuth: [] }]
      x-permission: order:config
      parameters:
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
          description: 门店 id；未传时使用 X-Shop-Id，仍无则 shop_id=0（全门店默认）
      description: |
        返回当前门店真省钱开关（**`t_system_config.shop_id`** + 键名）：
        - **`autoDispatchEnabled`** / **`autoApiEnabled`**（兼容）：**`zsq.auto_api.enabled`**，系统接单后是否自动发真省钱配送
        - **`takeoutSyncEnabled`**：**`zsq.takeout_sync.enabled`**，是否参与外卖配送状态定时同步
        未单独配置的门店回退 **`shop_id=0`** 默认值。
      responses:
        '200':
          description: 成功，body 含 shopId、autoDispatchEnabled、takeoutSyncEnabled 及 code(0)
        '500': { description: 失败 }
    put:
      tags: [配置管理, 运营后台]
      summary: 更新真省钱开关（按门店）
      security: [{ BearerAuth: [] }]
      x-permission: order:config
      description: |
        写入 **`t_system_config`**（**`shop_id`** + **`zsq.auto_api.enabled`** / **`zsq.takeout_sync.enabled`**），立即生效。
        请求体可传 **`shopId`**；未传时使用 **`X-Shop-Id`**，仍无则 **`shop_id=0`**（全门店默认）。
        配置值支持 **`1`/`0`** 或 boolean。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopId: { type: integer, description: '门店 id；0 或未传（且无 X-Shop-Id）表示全门店默认' }
                autoDispatchEnabled: { type: boolean, description: 'zsq.auto_api.enabled，接单后自动发真省钱配送' }
                autoApiEnabled: { type: boolean, description: '同 autoDispatchEnabled（兼容旧字段）' }
                takeoutSyncEnabled: { type: boolean, description: 'zsq.takeout_sync.enabled，外卖状态定时同步' }
      responses:
        '200':
          description: 成功，body 为更新后的完整开关字段
        '500': { description: 失败 }

