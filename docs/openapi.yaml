                        label: { type: string }
                        transaction_count: { type: integer }
                        refund_count: { type: integer }
                        refund_amount_fen: { type: integer, format: int64, description: '单位：分' }
                        net_amount_fen: { type: integer, format: int64, description: '单位：分' }
                  audit_events: { type: array, items: { type: object } }
                  integrity: { type: object, description: '包含 version/status/source_watermarks/report_hash' }
                  approval_status: { type: string }
                  approved_by_name: { type: string }
                  approved_at: { type: string, format: date-time }
                  member_recharge_summary:
                    type: object
                    description: 仅汇总显式归属该钱箱会话的成功人工充值；不以时间重叠猜测归属
                    properties:
                      success_count: { type: integer, format: int64 }
                      principal_fen: { type: integer, format: int64 }
                      gift_fen: { type: integer, format: int64 }
                      credited_total_fen: { type: integer, format: int64 }
                  total_collections_fen: { type: integer, format: int64, description: 订单渠道净收款 + 充值本金；不含赠送额 }
                  order_sales_summary:
                    type: object
                    description: 订单交易汇总（数据窗口 = 该钱箱会话成功支付台账关联的已结订单，与 channels 同源；异常时为空对象）
                    properties:
                      paid_order_count: { type: integer, format: int64, description: 已结订单数（去重 order_no） }
                      gross_sales_fen: { type: integer, format: int64, description: 总营收 = Σ(sett_amount + service_fee) 订单原价合计 }
                      discount_fen: { type: integer, format: int64, description: 优惠 = Σ(discount_amount) 合计 }
                      refund_fen: { type: integer, format: int64, description: 退款 = Σ(refund_amount) 累计成功退款合计 }
                      gift_paid_fen: { type: integer, format: int64, description: 赠送金实付 = Σ(pay_amount_gift) 合计 }
                      net_sales_fen: { type: integer, format: int64, description: 净营收 = Σ(sett_amount + service_fee - discount_amount - refund_amount - pay_amount_gift) }
                  change_summary:
                    type: object
                    description: 现金找零汇总（t_order.checkout_change_amount，按找零渠道分组）
                    properties:
                      total_change_fen: { type: integer, format: int64, description: 找零合计 }
                      by_channel:
                        type: object
                        description: 按找零渠道（wechat/cash/alipay）分组的找零金额（分）
                        additionalProperties: { type: integer, format: int64 }
                  dish_operations:
                    type: object
                    description: 退菜/赠菜操作明细（订单明细 t_order_detail 统计，排除套餐子项 combo_component；赠菜为单价 0 的普通行，无原价故金额记 0）
                    properties:
                      refund_dish_count: { type: integer, format: int64, description: 退菜道数（Σ refunded_quantity） }
                      refund_dish_amount_fen: { type: integer, format: int64, description: 退菜金额（按退菜数量占行数量比例折算行金额） }
                      give_dish_count: { type: integer, format: int64, description: 赠菜道数（Σ 单价为 0 行 quantity） }
                      give_dish_amount_fen: { type: integer, format: int64, description: 赠菜金额（无原价来源，恒为 0） }
        '409': { description: '班次未交班，error_code=SHIFT_NOT_CLOSED（兼容 error）' }

