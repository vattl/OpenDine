  /kds/item/status/update:
    post:
      deprecated: true
      x-kds-retired: true
      x-kds-retired-status: 410
      tags: [KDS-Client]
      summary: 工作流快速划菜（高频写）
      description: |
        **统一工作流单条快速写主接口**。主事务更新工单数量/状态，HTTP 返回最小 **`patch`** 与新的 **`row_version`**。
        `row_version` 当前是工单 **`updated_at` 毫秒时间戳代理值**，不是独立自增列；可选传入做乐观锁，冲突时响应体 **`code=5001`**（HTTP 通常仍为 200）。
        建议同时传 **`expected_order_id`**、**`expected_table_number`**、**`expected_dish_name`**，防止旧卡片误划。
        事务提交后后端通过 WS **`update_order`** 通知订阅端；当前不发送 `board_changed`，也不保证 WS 含完整 `line`，字段不足时重拉 `workflow/board` 或 `order/item/list`。
        本接口仅处理单个 `detail_id`；合并组 `detail_ids[]` 请调用 **`POST /kds/workflow/advance-item`**。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsWorkflowAdvanceRequest' }
            example:
              detail_id: 123
              from_queue: pending_cook
              quantity: 1
              row_version: 1784476800123
              expected_order_id: 9625
              expected_table_number: A08
              expected_dish_name: 羊肉串
      responses:
        '200':
          description: '`code=0`，业务字段见 **KdsWorkflowAdvanceFastResponse**'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 0 }
                  - { $ref: '#/components/schemas/KdsWorkflowAdvanceFastResponse' }
        '400': { description: 参数错误、队列不匹配或传菜数量超出剩余量 }
        '401': { description: 缺少或无效 X-Kds-Device-Token }
        '403': { description: 保留；当前快速入口主要按设备令牌、门店和工单队列校验 }

