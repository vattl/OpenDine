  /config/subscribe-templates:
    get:
      tags: [系统配置]
      summary: 获取微信订阅消息模板 ID
      description: 前端读取 `tmplIds` 后传给 `wx.requestSubscribeMessage`；同时返回具名的 `templates.orderStatus` 与 `templates.pickupNotice`。
      responses:
        '200':
          description: 成功，body 含 templates、tmplIds、subscribeTemplateId1、subscribeTemplateId2
        '500':
