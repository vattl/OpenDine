  /admin/order/list:
    post:
      tags: [运营后台]
      summary: 订单分页列表
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      description: |
        按条件分页查询订单。请求体为 PageBean（query 传 transac_status 筛选结账状态，start、pageSize 分页）。
        可选传 **startTime/endTime**（支持 `yyyy-MM-dd HH:mm:ss`、`yyyy-MM-dd HH:mm`、`yyyy-MM-dd`）按 `t_order.order_time` 筛选；未传时默认查询昨天 00:00:00 到当前请求时间。只传一端时，缺少的 startTime 补昨天 00:00:00，缺少的 endTime 补当前时间。
        响应除 orderList、total 外，增加 **todayCount**：当前营业日订单数（营业日窗口 [open_time, settle_time)，门店配置优先、默认 16:00～次日 04:00；逻辑与 GET /admin/order/todayCount 一致），并返回本次筛选实际使用的 **startTime/endTime**。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageBean'
      responses:
        '200':
          description: 成功，body 含 code、orderList、total（符合 query + 时间范围条件总数）、todayCount、startTime、endTime
        '500':
          description: 失败

  /admin/order/todayCount:
    get:
      tags: [运营后台]
      summary: 获取订单数（按营业日，24小时实时窗口）
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      description: |
        按 **实时数据 24 小时窗口** 统计订单数。实时窗口 = **[班次起始日 settle_time, 班次起始日+1天 settle_time)**：
        - 门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
        - 不传 date 时查询当前活动营业班次（24 小时）。
        - 传 date（yyyy-MM-dd，班次起始日）时统计指定 24 小时营业窗口。
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 营业班次起始日（yyyy-MM-dd）；不传则按当前活动营业班次
      responses:
        '200':
          description: 成功，body 含 code、todayCount（当前营业日订单条数）
        '500':
          description: 失败

  /admin/order/todayUnsettledAmount:
    get:
      tags: [运营后台]
      summary: 获取当天营业待结账金额（按营业日，24小时实时窗口）
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      description: |
        按 **实时数据 24 小时窗口** 统计待结账金额（仅 `transac_status=unsettled` 且 `merchantId="1"`），窗口与 /admin/order/todayCount 一致。
        - 门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
        - 不传 `date` 按当前活动营业班次；传 `date`（班次起始日）按指定 24 小时营业窗口。
        金额口径：与净实付一致，`sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift`（待结账订单上退款/礼品列多为 0），接口返回汇总后保留两位小数。
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 营业班次起始日（yyyy-MM-dd）；不传则按当前活动营业班次
      responses:
        '200':
          description: 成功，body 含 code、todayUnsettledAmount、todayUnsettledCount、startTime、endTime
        '500':
          description: 失败

  /admin/orderDetail/list:
    get:
      tags: [运营后台]
      summary: 订单详情（含明细）
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      description: |
        按订单主键查询 **`t_order`** 与 **`t_order_detail`** 明细列表。
        响应 **`order`** 为完整 **Order** 实体（含 **`pay_amount_*`** 五渠道实收）；若结账时登记了找零（见 **v1.2.67**），另含：
        - **`checkout_cash_tender`**：客人付现（元）
        - **`checkout_change_amount`**：找零金额（元，不计入营业额）
        - **`checkout_change_channel`**：`wechat` / `cash` / `alipay`
        - **`checkout_change_channel_label`**：找零渠道中文（微信/现金/支付宝），仅展示、不落库
        无找零时 **`checkout_change_amount`** 为 **0**，其余找零字段多为 **null**。
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
          description: 订单主键 t_order.id
      responses:
        '200':
          description: 成功；**list** 为 OrderDetail[]，**KDS 启用门店**每项另含 kds_item_status/kds_status_text/kds_served_quantity（无厨显工单为 null，见 D011）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  order:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                    description: 订单主表；含找零字段 checkout_cash_tender、checkout_change_amount、checkout_change_channel、checkout_change_channel_label
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/OrderDetail' }
                    description: 订单明细 t_order_detail
        '500':
          description: 失败

  /admin/order/receiving:
    post:
      tags: [运营后台]
      summary: 接单（更新订单接单状态）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, order_receiving]
              properties:
                id: { type: integer, description: '订单主键 t_order.id' }
                order_receiving: { type: string, description: '接单状态，如 rec_order' }
      responses:
        '200':
          description: 成功
        '500':
