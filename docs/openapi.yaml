        maxPick: { type: integer, default: 1 }
        sortOrder: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ComboGroupItemDef' }

    ComboCustomerDetail:
      type: object
      description: |
        **GET /combo/detail** 成功时业务字段（与 **ApiResponse** 平级，**非** 运营 **`combo` + `definition`** 结构）。
      properties:
        configured: { type: boolean, description: '是否已配置且启用的套餐' }
        comboId: { type: integer, format: int64, description: '下单 goods_list 使用的 t_combo.id' }
        dishId: { type: integer, description: '套餐头 t_dish.id' }
        comboType: { type: string, enum: [fixed, groups] }
        baseUnitPrice: { type: number, description: '套餐基准单价（元，已套门店价）' }
        originalPrice: { type: number, description: '门市参考原价（各子菜价格加总，元）' }
        savedAmount: { type: number, description: '立省金额（元）' }
        limitPerOrder: { type: integer, nullable: true, description: '单单限购份数' }
        limitPerUser: { type: integer, nullable: true, description: '单用户限购份数' }
        limitCycle: { type: string, enum: [daily, lifetime], description: '用户限购周期' }
        applyDiningType: { type: string, enum: [all, dine_in, take_out], description: '适用用餐方式' }
        allowCoupon: { type: integer, enum: [0, 1], description: '是否允许叠加优惠券：1允许 0禁止' }
        startTime: { type: string, format: date-time, nullable: true, description: '生效开始时间' }
        endTime: { type: string, format: date-time, nullable: true, description: '生效结束时间' }
        availableDays: { type: string, nullable: true, description: '可用星期，逗号分隔，如 1,2,3,4,5' }
        timeRangeStart: { type: string, nullable: true, description: '每日可用起始时段，如 11:00' }
        timeRangeEnd: { type: string, nullable: true, description: '每日可用截止时段，如 14:00' }
        isAvailableNow: { type: boolean, description: '当前时刻是否可售' }
        header: { $ref: '#/components/schemas/ComboCustomerDishItem' }
        fixedItems:
          type: array
          description: 固定包含的子菜（不可改选）
          items: { $ref: '#/components/schemas/ComboCustomerDishItem' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ComboCustomerGroup' }
        message:
          type: string
