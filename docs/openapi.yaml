  /kds/sync/changes:
    get:
      tags: [KDS-Client]
      summary: 增量变更（断线补偿）
      x-kds-profile: cloud-or-cashier-lan
      description: |
        WebSocket 断线重连后，以 **`since`**（上次收到的最大 `updated_at` 毫秒时间戳）拉取变更工单/订单摘要。
        当前每条只保证工单摘要字段：`ticket_id`、`detail_id`、`dish_id`、`order_id`、`item_status`、`screen_tag`、`updated_at`、催/加/超标志及对应时间。
        **不是**与 WS/board 同构的完整 patch，不保证返回 `workflow_queue`、各 `*_remaining`、`row_version` 或 `operation`。
        `updated_at` 按全局 Jackson 配置序列化为 ISO-8601 字符串；前端可用 `Date.parse(updated_at)` 更新本地毫秒游标。
        返回非空时建议按 `detail_id` 标记受影响行，并调用 **`GET /kds/order/item/list`** 或 **`GET /kds/workflow/board`** reconcile。当前接口没有分页，长断线应直接拉快照。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
        - name: since
          in: query
          required: true
          schema: { type: integer, format: int64, description: 毫秒时间戳（不含边界以实现为准） }
      responses:
        '200':
          description: '`code=0`，`changes` 为 **KdsSyncChange** 摘要数组'
          content:
            application/json:
              schema:
                type: object
                properties:
