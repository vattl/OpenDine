      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyCode, policyName, permissionCode, policyType]
              properties:
                policyCode: { type: string }
                policyName: { type: string }
                permissionCode: { type: string }
                policyType: { type: string, enum: [MAX_AMOUNT, MIN_DISCOUNT_RATE, MAX_DISCOUNT_AMOUNT, MAX_DAILY_COUNT] }
                effect: { type: string, enum: [ALLOW, DENY], default: ALLOW }
                priority: { type: integer, default: 100 }
                configJson: { type: string }
      responses:
        '200': { description: '成功，返回策略详情' }

  /admin/access/policies/{id}:
    put:
      tags: [系统设置, 权限策略, 运营后台]
      summary: 更新权限策略
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '成功' }
    delete:
      tags: [系统设置, 权限策略, 运营后台]
      summary: 删除权限策略
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '成功' }

  /admin/access/policies/assign:
    post:
      tags: [系统设置, 权限策略, 运营后台]
      summary: 绑定权限策略至角色
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, policyId]
              properties:
                roleId: { type: integer }
                policyId: { type: integer }
                shopId: { type: integer }
      responses:
        '200': { description: '成功' }

  /admin/access/approvals:
    get:
      tags: [系统设置, 权限审批, 运营后台]
      summary: 审批流水列表
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      parameters:
        - { name: shopId, in: query, schema: { type: integer } }
        - { name: bizType, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: '成功，返回分页流水。items 含 id/approvalNo/permissionCode/operatorId/authorizerId/shopId/bizType/bizId/amount/reason/authMethod/status/expiresAt/consumedAt/requestId/terminalId/createdAt，以及 operatorName/operatorWorkNo（操作人姓名/工号）、authorizerName/authorizerWorkNo（授权人姓名/工号）'

  /admin/access/approvals/{id}:
    get:
      tags: [系统设置, 权限审批, 运营后台]
      summary: 审批流水详情
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: '成功，返回流水记录（含 operatorName/operatorWorkNo/authorizerName/authorizerWorkNo）'

  /cashier/access/recent-authors:
    get:
      tags: [系统设置, 权限审批, 收银端]
      summary: 本门店最近授权人（快捷选择历史账号）
      description: 返回本门店最近成功授权（APPROVED/CONSUMED）的店长/管理员去重列表，按时间倒序，供收银端授权弹窗快捷填入账号
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 20 }, description: 返回条数上限 }
      responses:
        '200':
          description: '成功，返回数组，每项含 authorizerId/authorizerName/authorizerWorkNo/lastApprovalAt'

  /admin/access/roles:
    get:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 角色列表（含引用计数与版本）
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      responses:
        '200': { description: "成功，items 含 id/roleCode/roleName/remark/sortOrder/version/adminCount/permissions[]（permissions 含 id/permissionCode/permissionName）" }
    post:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 创建角色
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode, roleName]
              properties:
                roleCode: { type: string }
                roleName: { type: string }
