  # ---------- 邀请 ----------
  /invite/getCode:
    post:
      tags: [邀请]
      summary: 获取用户专属邀请码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string }
      responses:
        '200':
          description: 当前返回“活动未开始”；正常时 body 含 invite_code 等
        '500':
          description: 失败

  /invite/getRecords:
    post:
      tags: [邀请]
      summary: 邀请记录列表
      description: |
        返回 **`InviteRecordDTO[]`**（`data`），含 **`id`**（`t_invite_record.id`）、被邀请人信息、**`status`**（0 邀请中/未发奖 1 已注册发奖）、**`create_time`**、**`reward_time`** / **`reward_type`** / **`reward_id`**（券等）、**`first_order_reward_amount`** / **`first_order_reward_time`** / **`first_order_no`**（首单余额返现，与 `POST /order/pay/notify` 入账逻辑一致）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string, description: '用户 openid' }
      responses:
        '200':
          description: 成功，body 含 code、data（InviteRecordDTO[]）
        '500':
          description: 失败

  /invite/getReward:
    get:
      tags: [邀请]
      summary: 获取奖励记录（注册礼 + 首单余额返现）
      description: |
        数据源为 **`t_invite_record`**：返回 **`reward_time` 非空**（已发注册/券奖）或 **`first_order_reward_time` 非空**（含已冲正收回金额后时间仍保留）的记录。
        **首单余额返现**在列表中作为独立行返回：若同一条邀请同时有注册礼与首单返现，接口拆成 **两行**——注册礼行仅含券相关字段；返现行为 **`reward_type=first_order_balance`**，含 **`first_order_reward_amount` / `first_order_reward_time` / `first_order_no`**。
        每行带 **`reward_row_uid`**（`{id}-full` | `{id}-reg` | `{id}-cash`）供前端作列表 `key` 去重；整行按该行「主事件时间」（注册礼用 `reward_time`，返现用 `first_order_reward_time`，单行取二者较晚者）倒序。
        **`reward_type=coupon`** 时联 **`t_coupon`** 返回 **`coupon_name`、`coupon_type`、`discount_value`、`min_amount`**。
      parameters:
        - name: openid
          in: query
          required: true
          schema: { type: string }
          description: 用户 openid
      responses:
        '200':
          description: 成功，body 含 code、data（InviteRecordDTO[]，排序同 description）
        '500':
          description: 失败
    post:
      tags: [邀请]
      summary: 获取奖励记录（注册礼 + 首单余额返现，POST）
      description: 同 GET；`data` 为展开后的奖励行列表（含 `reward_row_uid`、`first_order_balance` 返现行），排序规则同 GET。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string }
      responses:
        '200':
          description: 成功，body 含 code、data（InviteRecordDTO[]）
        '500':
          description: 失败

  /invite/poster:
    get:
      tags: [邀请]
      summary: 根据邀请码生成海报（返回 Base64 或 URL）
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: 邀请码（invite_code）
      responses:
        '200':
          description: 成功，body 含 posterUrl（如 data:image/jpeg;base64,...）
        '400':
          description: 邀请码为空
        '500':
          description: 海报生成失败

