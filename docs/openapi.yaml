      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
        - $ref: '#/components/parameters/XCashierAuthorityEpoch'
        - $ref: '#/components/parameters/XCashierLeaseToken'
      responses:
        '101': { description: WebSocket protocol switch；握手需 Bearer、门店、device code、authority epoch 和 lease token }

  # ---------- 收银系统扩展：营业状态 ----------
  /cashier/shop/business:
    post:
      tags: [收银机端, 营业状态]
      summary: 收银端切换门店营业接单开关（开/关）
      description: |
        与运营端 **`POST /order/ChangeBusiness`** 共用同一核心逻辑（`OrderController#changeBusinessCore`），
        按 **`X-Shop-Id`** 更新 **`t_shop.ordering_open`**（**`1`** 营业 / **`0`** 休息），行为完全一致：
        - **开门强制开班**：门店开启 **`shift_required=1`** 且当前无进行中班次（`t_shift.end_time IS NULL`）→ **`code=4001`**「未开班不得营业」；
        - **关门强制交班/日结**：门店 **`shift_required=1`** 存在进行中班次、或 **`settle_required=1`** 当日营业日未日结 → **`code=4000`**「无法打烊…」；
        - **逃生通道**：body 带 **`force="1"`** 且当前用户具备 **`admin:manage`** 权限时跳过上述校验，并写安全审计日志（`open_forced`/`close_forced`）；
        - **营业时**（`bus=1`）自动处理该店待接单订单；成功后向 **`/ws/menu`** 推送 **`type=business_changed`**（`business`、`shopId`）。
        权限码：**`cashier:operate`**（force 内部校验 admin:manage）。开关字段迁移见 **`docs/db_migration_shop_settle_flow.sql`**。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bus]
              properties:
                bus:
                  type: string
                  description: '传 `"1"` 表示营业（business=true），其它值表示休息（business=false）'
                force:
                  type: string
                  description: '传 `"1"` 强制跳过未开班/未交班/未日结校验（需 admin:manage 权限）'
      responses:
        '200':
          description: 成功，body 含 code(0)、business、shopId
        '4000':
          description: '关门被拦截：存在进行中班次未交班 / 当日营业日未日结（force 逃生能力仍可用）'
        '4001':
          description: '开门被拦截：未开班不得营业（force 逃生能力仍可用）；或缺少门店上下文'
        '500':
          description: 失败（数据访问失败等）

  # ---------- 收银系统扩展：日结 ----------
  /admin/daily/context:
    get:
      tags: [日结与对账, 运营后台]
      summary: 日结页面统一上下文聚合（时序、汇总、渠道、预检与阻断）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|report:view
      description: |
        日结工作台单请求聚合接口。单次调用返回日结工作台所需全部数据，彻底消除多接口分散请求导致的参数不一致、时差和数据不对称问题。
        入参支持 stat_date 与 date 双向互通别名（优先级 stat_date > date）。
        若目标营业日已结（已生成快照），直接返回归档快照 summary、渠道实收 channels/channel_details（包含微信、支付宝、现金、会员余额及挂账渠道）、历史快照信息与 adjustments；
        若目标营业日未结，执行前置检查并返回实时 summary、channels、channel_details、blockers、warnings、voidable_stale_pack_takeout 与预检凭证 precheck_token。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 目标营业日（yyyy-MM-dd）；与 date 互为别名。门店已有快照时不传则选择最早待结营业日，否则使用当前营业日
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: stat_date 的别名（yyyy-MM-dd）
        - name: minutes
          in: query
          required: false
          schema: { type: integer, default: 30 }
          description: 超时未支付打包外卖单阈值分钟数（默认 30）
      responses:
        '200':
          description: 成功，返回日结全景上下文（含 stat_date, is_already_settled, can_settle, summary, channels, channel_details, blockers, warnings 等）
        '400': { description: 门店未配置 settle_time 或入参非法 }
        '409': { description: 日结时序冲突（DAILY_CLOSE_OUT_OF_SEQUENCE） }
        '500': { description: 预检或汇总计算失败 }
  /admin/daily/pre-check:
    get:
      tags: [日结与对账, 运营后台]
      summary: 日结前置检查与阻断器（POS-SDC-301）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        营业时段硬阻断：若当前处于门店营业时段（open_time ~ close_time），返回 blocker: IN_BUSINESS_HOURS 且 can_settle=false；
        检查当前门店在指定营业日关账前的就绪状态。若存在未关钱箱会话（OPEN_DRAWER_SESSIONS）、未结订单（OPEN_ORDERS）、未支付流水（PENDING_PAYMENTS）、未审批长短款差异（UNAPPROVED_CASH_VARIANCES），将返回硬阻断列表；
        门店已有日结快照时，未传 stat_date 自动选择最早缺失或 REOPENED 营业日；显式请求其他未结日或未来营业日返回 HTTP 409 DAILY_CLOSE_OUT_OF_SEQUENCE。响应新增 current_business_day、next_close_business_day、pending_day_count、has_previous_unclosed_day。
        对成功非挂账订单逐单比较订单渠道实收投影与成功资金流水净额；缺失、渠道或金额不一致时返回硬阻断 `ORDER_LEDGER_MISMATCH`。阻断项的 `reason_summary` 按原因码统计全部异常订单；`details` 最多返回 50 笔，保留 `order_no/expected_by_channel_fen/ledger_by_channel_fen`，并增加 `order_id/shop_id/payment_method/reason_codes/reason/expected_total_fen/ledger_total_fen/difference_fen/channel_differences`。每个 `channel_differences[]` 包含 `channel/reason_code/reason/expected_fen/ledger_fen/difference_fen`。
        `difference_fen` 固定为“成功资金流水净额 - 订单实收投影”：负数表示流水不足，正数表示流水超额。原因码包括 `LEDGER_MISSING/ORDER_PROJECTION_MISSING/TOTAL_AMOUNT_SHORT/TOTAL_AMOUNT_EXCESS/CHANNEL_LEDGER_MISSING/UNEXPECTED_LEDGER_CHANNEL/CHANNEL_AMOUNT_SHORT/CHANNEL_AMOUNT_EXCESS`。
        若仅存在小额长短款差异（MINOR_CASH_VARIANCE），将返回软警告并提示需店长授权；
        仅在 can_settle=true 时签发 5 分钟有效的 precheck_token，并绑定操作人、门店、营业日及 payment_ledger_id/cash_event_id/order_id/member_recharge_id/member_recharge_success_count 五项水位。
        阻断时 precheck_token 和 precheck_expires_at 均为 null；请求失败使用非 2xx，不得将空响应解释为通过。
        preview.channels[].code 可为 wechat/wechat_qr/alipay/alipay_qr/cash/balance/gift/receivable/other；收款码分类优先依据关联订单 payment_method，挂账消费归入 receivable（挂账）。
        preview.member_recharge_summary 固定包含 success_count/principal_fen/gift_fen/credited_total_fen；preview.total_collections_fen 仅在净销售实收上增加充值本金，不含赠送额。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；门店已有快照时不传则选择最早待结营业日，否则使用当前营业日
      responses:
        '200':
          description: '成功，body 含 code、can_settle、stat_date、current_business_day、next_close_business_day、pending_day_count、has_previous_unclosed_day、blockers、warnings、precheck_token、precheck_expires_at、watermarks、preview'
        '409': { description: 'DAILY_CLOSE_OUT_OF_SEQUENCE：请求日不是服务端计算的最早待结营业日' }
        '500': { description: 失败 }
  /admin/daily/void-stale-takeout-orders:
    post:
      tags: [日结与对账, 运营后台]
      summary: 作废目标营业日内超时未支付的打包/外卖单
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|order:operate
      description: 仅处理服务端计算的最早待结营业日窗口；显式跳到后续营业日时返回 HTTP 409 DAILY_CLOSE_OUT_OF_SEQUENCE。成功作废会回退库存、取消配送和收款意向、通知 KDS 并记录安全审计。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stat_date: { type: string, format: date, description: '可选；不传时选择最早待结营业日' }
                minutes: { type: integer, minimum: 1, default: 30, description: '判定超时的分钟数' }
      responses:
        '200': { description: '成功，返回作废笔数、金额和订单号列表' }
        '409': { description: 'DAILY_CLOSE_OUT_OF_SEQUENCE：请求日不是最早待结营业日' }
        '500': { description: 失败 }
  /admin/daily/settle:
    post:
      tags: [日结与对账, 运营后台]
      summary: 商业级原子门店日结快照（POS-SDC-302）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        营业时段硬阻断防线：若结算请求时当前处于门店营业时段，返回 HTTP 400 DAILY_CLOSE_BLOCKED 强行阻断日结；
        执行原子日结关账并在单一数据库事务内完成：前置预检校验、店长二次密码鉴权、订单/支付/现金/充值水位线抓取、不可变日结快照生成（t_daily_close_snapshot）、SHA-256 数据防篡改哈希计算以及 t_daily_stat 汇总记录持久化。
        快照的 member_recharge_fen 表示充值本金，member_recharge_gift_fen 表示赠送额，member_recharge_count 表示成功笔数，cutoff_recharge_id 表示充值截止水位。提交时重新校验 token、操作人、门店、营业日和全部水位。同 idempotency_key 重试幂等返回；不同键重复日结返回 409 DAILY_ALREADY_SETTLED。
        服务端在事务内再次要求 stat_date 等于最早待结营业日；force 不绕过该规则。重开后的再次日结更新原快照行并保留重开审计字段。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stat_date: { type: string, format: date, description: '可选；不传时选择最早待结营业日' }
                precheck_token: { type: string, description: '日结预检凭据 precheck_token' }
                password: { type: string, description: '店长二级授权密码（存在警告或差异时必须）' }
                force: { type: boolean, description: '是否在存在警告时强制日结' }
                idempotency_key: { type: string, maxLength: 64, description: '日结幂等键，断网重试必须保持不变' }
      responses:
        '200':
          description: 成功，body 含 code、dailyStat（DailyStat）、snapshot（DailyCloseSnapshot）、idempotent、message
        '400': { description: 预检阻断或密码错误 }
        '409': { description: 'error_code: DAILY_CLOSE_OUT_OF_SEQUENCE / PRECHECK_EXPIRED / WATERMARK_CHANGED / DAILY_ALREADY_SETTLED（兼容 error）' }
        '500': { description: 失败 }
  /admin/daily/z-report:
    get:
      tags: [日结与对账, 运营后台]
      summary: 商用级 Z 报表查询（POS-SDC-304）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        获取指定营业日（已日结或实时预览）的完整 Z 报表数据。顶层 watermarks 包含 payment_ledger_id/cash_event_id/order_id/member_recharge_id；member_recharge_summary 返回成功笔数、本金、赠送与会员入账合计，total_collections_fen 为净销售实收加充值本金。drawer_summary.sessions 固定返回 session_id/terminal_id/drawer_code/operator_id/operator_name/expected_cash_fen/counted_cash_fen/variance_fen。channels[].code 可为 wechat/wechat_qr/alipay/alipay_qr/cash/balance/gift/other。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；不传时展示最早待结营业日，显式日期可查询历史
      responses:
        '200':
          description: 成功，body 含 code、zReport 对象
        '500': { description: 失败 }
  /admin/daily/z-reports:
    get:
      tags: [日结与对账, 运营后台]
      summary: 按营业日时序查询历史 Z 报表与日结状态
      description: |
        按营业日倒序、逐日连续返回从门店首张日结快照到当前权威营业日的状态。
        缺少快照的日期为 PENDING，重开快照为 REOPENED，正常关账为 CLOSED。
        只有权威 next_close_business_day 对应的未结项 can_close=true；客户端可使用该项 business_day 进入日结页，但正式日结仍由 pre-check/settle 的服务端时序守卫控制。
        cursor 是不透明的数值游标，客户端只能原样回传；新游标编码营业日 yyyyMMdd，服务端在迁移期仍接受旧快照 ID 游标。
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      parameters:
        - { name: shop_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - name: cursor
          in: query
          schema: { type: integer, format: int64 }
          description: 不透明排他游标；只能原样回传 next_cursor，不得解释为快照 ID
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: |
            按营业日游标分页，body 含 current_business_day、next_close_business_day、pending_day_count、items、next_cursor、has_more。
            items 每项包含 business_day、close_state(CLOSED/PENDING/REOPENED)、can_close、is_next_close_business_day，以及兼容字段 id、snapshot_no、snapshot_hash、closed_at、net_sales_fen、order_count、member_recharge_summary、receivable_summary、total_collections_fen、operator_id、operator_name、watermarks。PENDING 项没有快照，快照身份和财务事实字段可为 null。
  /admin/daily/adjustments:
    get:
      tags: [日结与对账, 运营后台]
      summary: 查询指定营业日日结后差异调整流水（POS-SDC-303）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: 获取指定营业日快照下的全部日结后调整明细及调整后净销售额聚合结果。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；不传时使用当前营业班次
      responses:
        '200':
          description: 成功，body 含 code、snapshot_id、stat_date、adjustments、net_adjustment_fen、adjusted_net_sales_fen
        '500': { description: 失败 }
    post:
      tags: [日结与对账, 运营后台]
      summary: 登记日结后差异调整（POS-SDC-303）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: 在日结完成后独立记录事后退款、冲正或财务补录，原始快照保持不可变，增量生成调整单并持久化至 t_daily_adjustment。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id, amount]
              properties:
                snapshot_id: { type: integer, description: '日结快照 ID' }
                amount: { type: number, description: '调整金额（元，可为负）' }
                type: { type: string, description: '调整类型（AFTER_CLOSE_CORRECTION 等）' }
                order_id: { type: integer, description: '关联订单 ID（可选）' }
                ledger_id: { type: integer, description: '关联支付台账 ID（可选）' }
                reason: { type: string, description: '调整原因说明' }
                approved_by: { type: integer, description: '授权店长管理员 ID' }
      responses:
        '200':
          description: 成功，body 含 code、adjustment（DailyAdjustment）
        '400': { description: 参数缺失或校验失败 }
        '500': { description: 失败 }
  /admin/daily/reopen:
    post:
      tags: [日结与对账, 运营后台]
      summary: 店长授权重开日结（POS-SDC-303）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: 当必须推翻日结重新做账时，由店长输入二级密码并填写重开原因。只允许重开最后一个快照营业日，防止在已关闭的后续营业日前制造时序缺口；重开后再次日结复用原快照行并保留审计字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, reason]
              properties:
                stat_date: { type: string, format: date, description: '可选结算日；不传时使用当前营业班次' }
                password: { type: string, description: '店长二级验证密码' }
                reason: { type: string, description: '重开原因' }
      responses:
        '200':
          description: 成功，body 含 code、reopened、stat_date、message
        '400': { description: 密码错误或未日结 }
        '409': { description: 'DAILY_REOPEN_OUT_OF_SEQUENCE：目标之后仍存在日结快照' }
        '500': { description: 失败 }
  /admin/daily/summary:
    get:
      tags: [日结与对账, 运营后台]
      summary: 日结汇总查询
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        stat_date 可选；不传时查询当前活动营业班次 24 小时窗口（实时数据），显式传入时查询指定历史结算日 24 小时窗口 `[date-1天 settle_time, date settle_time)`（已结算数据）。
        门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；不传时使用当前营业班次
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、summary（DailyStat）、income、deduction
        '500': { description: 失败 }
  /admin/daily/income:
    get:
      tags: [日结与对账, 运营后台]
      summary: 营业收入明细（堂食/外卖/会员/现金）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        date 可选；不传时使用当前活动营业班次 24 小时窗口（实时数据）。显式 date 为**结算日（yyyy-MM-dd）**，统计 24 小时窗口 = **[date-1天 settle_time, date settle_time)**（已结算数据，order_time 落窗）。
        门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
        返回 Map 的稳定中文渠道键包含：微信支付、微信收款码、支付宝、支付宝收款码、现金、会员余额、赠送金；手动/自动收款码合并统计。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 目标营业日（yyyy-MM-dd）；与 date 互为别名（优先级 stat_date > date）
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；与 stat_date 互为别名
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、list（按渠道/类型汇总）
        '500': { description: 失败 }
  /admin/daily/byChannel:
    get:
      tags: [日结与对账, 运营后台]
      summary: 支付渠道对账（微信/支付宝/现金等）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        date 可选；不传时使用当前活动营业班次 24 小时窗口（实时数据）。显式 date 为**结算日（yyyy-MM-dd）**，统计 24 小时窗口 = **[date-1天 settle_time, date settle_time)**（已结算数据，pay_time 落窗）。
        入参支持 stat_date 与 date 双向互通别名（优先级 stat_date > date）。
        门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
        渠道优先依据关联订单 payment_method 分类；返回 Map 的稳定中文渠道键新增微信收款码、支付宝收款码，手动/自动收款码合并统计。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 目标营业日（yyyy-MM-dd）；与 date 互为别名（优先级 stat_date > date）
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；与 stat_date 互为别名
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、channels（按稳定中文渠道名聚合的金额 Map）
        '500': { description: 失败 }
  /admin/daily/grossProfit:
    get:
      tags: [日结与对账, 运营后台]
      summary: 每日毛利（营业额 - 原材料成本）
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        date 可选；不传时使用当前活动营业班次 24 小时窗口（实时数据）。显式 date 为**结算日（yyyy-MM-dd）**，营业额统计 24 小时窗口 = **[date-1天 settle_time, date settle_time)**（已结算数据，order_time 落窗）。
        入参支持 stat_date 与 date 双向互通别名（优先级 stat_date > date）。
        门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 目标营业日（yyyy-MM-dd）；与 date 互为别名（优先级 stat_date > date）
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选结算日；与 stat_date 互为别名
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、revenue、materialCost、grossProfit
        '500': { description: 失败 }

  # ---------- 商业级收银结算扩展：渠道对账单与三层差异处理 (POS-SDC-401 ~ POS-SDC-402) ----------
  /admin/reconciliation/import:
    post:
      tags: [日结与对账, 运营后台]
      summary: 渠道对账单安全导入（POS-SDC-401）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        支持导入微信支付、支付宝商户对账单（CSV/JSON）及通用 POS CSV 对账单。
        具备 SHA-256 文件哈希防重复导入、逐行格式校验、错误行明细定位与解析批次审计落库（t_channel_statement_batch / t_channel_statement_entry）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                channel: { type: string, enum: [WECHAT, ALIPAY, GENERIC], description: '支付渠道编码' }
                file_name: { type: string, description: '对账单文件名' }
                content: { type: string, description: '对账单文本或 Base64 内容' }
      responses:
        '200':
          description: 成功，返回解析批次信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  batch: { type: object, description: '对账单导入批次对象' }
        '400': { description: 对账单解析格式错误或内容无效 }
        '409': { description: 重复导入（文件哈希已存在） }
        '500': { description: 失败 }

  /admin/reconciliation/overview:
    get:
      tags: [日结与对账, 运营后台]
      summary: 三层对账全景概览（POS-SDC-402）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|report:view
      description: |
        获取指定营业日（或当前营业日）的三层差异核对全景概览：
        - 第 1 层：订单 vs 内部支付台账（t_order vs t_payment_ledger）
        - 第 2 层：内部支付台账 vs 外部渠道账单（t_payment_ledger vs t_channel_statement_entry）
        - 第 3 层：渠道账单 vs 净到账结算（手续费/平台扣费与实收到账）
        订单范围按门店营业窗口内 `pay_time` 统计（历史空值回退 `order_time`）并排除挂账订单；渠道退款金额标准化为负数，支付与退款按条目类型逐笔匹配，同订单重复条目不会覆盖。核心原则：若当日未导入任何渠道对账单，has_channel_statement 必为 false，summary_status 必为 UNIMPORTED；已导入时，只要第一层不平、内部或渠道任一方未匹配、金额不符或存在未关闭差异单，summary_status 必为 DISCREPANCY，绝不可显示“已对平”。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选营业日（yyyy-MM-dd）；不传时使用当前营业班次
      responses:
        '200':
          description: 成功返回三层核对概览数据
        '500': { description: 失败 }

  /admin/reconciliation/batches:
    get:
      tags: [日结与对账, 运营后台]
      summary: 查询对账单导入批次历史（POS-SDC-401）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|report:view
      description: 按营业日和渠道筛选已导入的对账单批次记录（t_channel_statement_batch）。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选营业日
        - name: channel
          in: query
          required: false
          schema: { type: string }
          description: 可选支付渠道编码（WECHAT/ALIPAY/GENERIC）
      responses:
        '200':
          description: 成功，body 含 code、batches 数组
        '500': { description: 失败 }

  /admin/reconciliation/cases:
    get:
      tags: [日结与对账, 运营后台]
      summary: 查询差异处理单列表（POS-SDC-402）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|report:view
      description: 查询指定营业日的对账差异案件列表，支持按案件状态及差异类型过滤。
      parameters:
        - name: stat_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 可选营业日
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, INVESTIGATING, ADJUSTED, WRITTEN_OFF, CLOSED] }
          description: 案件状态
        - name: discrepancy_type
          in: query
          required: false
          schema: { type: string, enum: [INTERNAL_MISSING, CHANNEL_MISSING, AMOUNT_MISMATCH, TIMING_DIFFERENCE, ORDER_LEDGER_MISMATCH] }
          description: 差异类型
      responses:
        '200':
          description: 成功，body 含 code、cases 数组
        '500': { description: 失败 }

  /admin/reconciliation/cases/{id}/resolve:
    post:
      tags: [日结与对账, 运营后台]
      summary: 差异处理单状态流转与平账解决（POS-SDC-402）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        对指定对账差异单进行状态推进（INVESTIGATING、ADJUSTED、WRITTEN_OFF、CLOSED），记录责任人、处理说明及平账操作审计。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 差异案件 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [INVESTIGATING, ADJUSTED, WRITTEN_OFF, CLOSED], description: '流转后状态' }
                resolution_note: { type: string, description: '处理说明或平账备注' }
                responsible_person: { type: string, description: '责任人姓名或工号' }
      responses:
        '200':
          description: 成功，body 含 code、case（ReconciliationCase）
        '400': { description: 案件不存在或状态流转不合法 }
        '500': { description: 失败 }

  # ---------- 商业级收银结算扩展：历史账本回填与双写影子切读 (POS-SDC-501 & POS-SDC-502) ----------
  /admin/migration/ledger/backfill:
    post:
      tags: [日结与对账, 运营后台]
      summary: 历史订单账本回填（POS-SDC-501）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        对历史订单进行幂等扫描，补齐生成不可变支付流水（t_payment_ledger），标记 source=BACKFILLED_ORDER 与可信等级（TRUST_HIGH/TRUST_SUSPECT）。
        支持干跑演练（dry_run: true）只统计不落库，并输出带 SHA-256 签名的审计报告与异常清单。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stat_date: { type: string, format: date, description: '可选指定营业日；不传则回填全量历史' }
                dry_run: { type: boolean, description: '是否为演练预览模式，true 时不落库' }
      responses:
        '200':
          description: 回填执行报告（含扫描数、回填数、跳过数、总金额分、异常单数、哈希签名）
        '500': { description: 失败 }

  /admin/migration/ledger/shadow-verify:
    get:
      tags: [日结与对账, 运营后台]
      summary: 双写影子验证（POS-SDC-502）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|report:view
      description: |
        对指定营业日进行旧订单口径与新台账口径的逐笔及渠道汇总对碰，输出差异详情与切读就绪判定（ready_for_cutover）。
      parameters:
        - name: stat_date
          in: query
          required: true
          schema: { type: string, format: date }
          description: 待核对营业日 (yyyy-MM-dd)
      responses:
        '200':
          description: 影子核对结果
        '400': { description: 参数缺失 }
        '500': { description: 失败 }

  /admin/migration/ledger/status:
    get:
      tags: [日结与对账, 运营后台]
      summary: 查询账本切读状态与统计（POS-SDC-502）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle|report:view
      description: |
        查询当前门店的数据读源（PAYMENT_LEDGER / LEGACY_ORDER）、账本行数（原生 vs 回填）及最近回填日志。
      responses:
        '200':
          description: 切读状态
        '500': { description: 失败 }

  /admin/migration/ledger/cutover:
    post:
      tags: [日结与对账, 运营后台]
      summary: 切换数据读源（POS-SDC-502）
      security: [{ BearerAuth: [] }]
      x-permission: daily:settle
      description: |
        切换数据读源至 PAYMENT_LEDGER 或 LEGACY_ORDER，更新 t_system_config 并记录操作审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read_source]
              properties:
                read_source: { type: string, enum: [PAYMENT_LEDGER, LEGACY_ORDER], description: '目标读源' }
      responses:
        '200':
          description: 读源切换成功
        '400': { description: 读源类型无效 }
        '500': { description: 失败 }

