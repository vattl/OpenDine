                table_numbers:
                  type: array
                  items: { type: string }
                  example: ["A01", "A02"]
                operator_account:
                  type: string
                  example: cashier_01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: 批量清台成功 }
                  data:
                    type: object
                    properties:
                      success_count: { type: integer, example: 3 }
                      failed_table_numbers:
                        type: array
                        items: { type: string }
                        example: []

  /api/pos/tables/pulse:
    get:
      tags:
        - 桌台管理
      summary: 实时经营脉搏指标 (Operation Pulse Metrics)
      description: 统计门店实时开台率、在席客单总额、待翻台数与总桌数，口径与 POS 底部悬浮状态栏完全对齐
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      occupancy_rate: { type: number, example: 0.75 }
                      occupancy_rate_percent: { type: number, example: 75.0 }
                      active_dining_count: { type: integer, example: 3 }
                      total_tables: { type: integer, example: 4 }
                      available_table_count: { type: integer, example: 4 }
                      total_seated_amount: { type: number, example: 1256.5 }
                      pending_clear_count: { type: integer, example: 1 }
