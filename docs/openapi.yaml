  /admin/stock-prep/config:
    get:
      tags: [库存与成本, 智能备货, 运营后台]
      summary: 读取门店备货规则 t_stock_prep_config
      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      responses:
        '200': { description: 成功，body.config 可为 null }
  /admin/stock-prep/config/save:
    post:
      tags: [库存与成本, 智能备货, 运营后台]
      summary: 保存门店备货规则
      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      responses:
        '200': { description: 成功 }
  /admin/stock-prep/plan/generate:
    post:
      tags: [库存与成本, 智能备货, 运营后台]
      summary: 由预测批次生成原材料备货计划
      description: |
        读取 `t_stock_prep_forecast_dish` 与 `t_dish_material_bom`，按文档公式汇总原料消耗并写入 `t_stock_prepare_plan`（先删该 run_id 旧行再插入）。
        仅汇总**当前已上架**菜品行；旧批次中含已下架菜品的预测行会跳过（`result.skippedOffsaleForecastLines`）。
        需已执行 `docs/db_migration_stock_prep_bom_plan_config.sql`。
      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: runId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功 }
  /admin/stock-prep/plan/list:
    get:
      tags: [库存与成本, 智能备货, 运营后台]
      summary: 备货计划列表
      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: prepareDate
          in: query
          schema: { type: string, format: date }
        - name: runId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功 }
  /admin/stock-prep/plan/update:
    post:
      tags: [库存与成本, 智能备货, 运营后台]
      summary: 更新备货计划（人工调整/状态）
      description: |
        `status=3`（已入库）首次从非 3 转入时：按 `final_qty`（若≤0 则用 `suggest_qty`）写入 **`t_stock_in`** 并增加 **`t_material.stock`**；重复设为 3 不会重复入库。
        `final_qty` 相对 `suggest_qty` 默认校验 ±`stock-prep-forecast.plan-max-adjust-ratio`（如 0.30）；`skip_adjust_ratio_check=true` 可跳过。
      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, format: int64 }
                manual_adjust: { type: number, description: 与 suggest 叠加；未传 final_qty 时 final = suggest + manual_adjust }
                final_qty: { type: number }
                status: { type: integer, description: '0草稿 1已确认 2已备货 3已入库' }
                operator_id: { type: integer, description: 缺省取当前登录管理员 }
                skip_adjust_ratio_check: { type: boolean, default: false }
      responses:
        '200': { description: 成功 }
  /admin/stock-prep/plan/batchStatus:
    post:
      tags: [库存与成本, 智能备货, 运营后台]
      summary: 批量更新备货计划状态（不改数量）
      description: 逐条调用与 plan/update 相同逻辑；单条失败记入 result.errors，仍处理其余 id。
      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                status: { type: integer }
                operator_id: { type: integer }
      responses:
        '200':
          description: 成功，body.result 含 successCount、failureCount、errors[]

  # ---------- 收银系统扩展：会员营销 ----------
  /admin/member/recharge:
    post:
      tags: [会员营销, 运营后台]
      summary: 会员充值（按手机号）
      description: |
        增加 **`t_user.balance`**（会员储值与小程序余额支付唯一数据源）；成功后写入 **`t_member_recharge`**（**`channel=admin`**，含 **`gift_amount`** 赠送拆分），供 C 端 **`POST /order/rechargeHistory`** 展示。若当前操作员在该门店存在活动班次，服务端自动写入 **`operator_id`** 与 **`drawer_session_id`** 供交班汇总；无活动班次时保持为空且仍进入门店日结。
        **`amount`（本金）单笔不得低于 50 元**（与 C 端微信充值一致）。
      security: [{ BearerAuth: [] }]
      x-permission: user:points
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone:
                  type: string
                  description: 会员手机号，对外唯一标识；后端内部再根据手机号查 openid
                amount:
                  type: number
                  description: 充值金额（元），单笔不低于 50
                gift_amount:
                  type: number
                  description: 赠送金额，可选
      responses:
        '200': { description: 成功 }
        '500': { description: 失败 }

  /admin/member/recharge/list:
    get:
      tags: [会员营销, 运营后台]
      summary: 会员充值流水分页列表
      description: |
        数据源 **`t_member_recharge`**。默认按 **`created_at`** 降序。
        每条流水记录均包含会员手机号 **`phone`**（后端根据流水 `user_id` / `openid` 自动关联 `t_user` 补全返回）。
        **门店**：解析到当前门店（`X-Shop-Id`）且未传 **`allShops=true`** 时，默认 **`shop_id` 等于当前店**（后台人工充值流水 `shop_id` 多为空，门店视角下可能不可见；总部或不带门店上下文可查全量）。
        传 **`shopId`** 时按指定店精确筛选；**`allShops=true`** 时忽略门店上下文。
        **排序**：`sortField` 仅允许 `id|created_at|updated_at|pay_time|recharge_amount|gift_amount|total_amount|order_no`；`sortOrder` 为 `asc`/`desc`。
      security: [{ BearerAuth: [] }]
      x-permission: user:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: phone
          in: query
          schema: { type: string }
          description: 与 openid 二选一优先 phone；按手机号解析 openid 后过滤
        - name: openid
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: integer }
        - name: orderNo
          in: query
          schema: { type: string }
          description: 模糊匹配商户单号
        - name: transactionId
          in: query
          schema: { type: string }
          description: 模糊匹配微信支付单号等
        - name: channel
          in: query
          schema: { type: string, enum: [wechat, admin] }
        - name: status
          in: query
          schema: { type: string, enum: [pending, success, cancelled] }
        - name: shopId
          in: query
          schema: { type: integer }
        - name: allShops
          in: query
          schema: { type: boolean, default: false }
        - name: payTimeStart
          in: query
          schema: { type: string }
        - name: payTimeEnd
          in: query
          schema: { type: string }
        - name: createdStart
          in: query
          schema: { type: string }
        - name: createdEnd
          in: query
          schema: { type: string }
        - name: minRechargeAmount
          in: query
          schema: { type: number }
        - name: maxRechargeAmount
          in: query
          schema: { type: number }
        - name: minTotalAmount
          in: query
          schema: { type: number }
        - name: maxTotalAmount
          in: query
          schema: { type: number }
        - name: sortField
          in: query
          schema: { type: string, default: created_at }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, description: 最大 200 }
      responses:
        '200':
          description: 成功，body 含 code、list（MemberRecharge[]，每项均包含会员手机号 phone 字段）、total、page、pageSize
        '500': { description: 失败 }

  /admin/member/balance/deduct:
    post:
      tags: [会员营销, 运营后台]
      summary: 扣减用户余额（按手机号）
      description: 从 **`t_user.balance`** 原子扣减；余额不足时失败。
      security: [{ BearerAuth: [] }]
      x-permission: user:points
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone: { type: string }
                amount: { type: number, description: 扣减金额（元），须大于 0 }
      responses:
        '200': { description: 成功 }
        '500': { description: 失败（余额不足等） }

  /admin/member/consumption:
    get:
      tags: [会员营销, 运营后台]
      summary: 会员消费记录（按手机号）
      security: [{ BearerAuth: [] }]
      x-permission: user:view
      description: |
        根据手机号查 `t_user` 得 `openid`，再查 **`t_order`**：`transac_status=success`，且 **`openid` 或 `pay_openid`** 等于该会员（与画像一致）。
        门店范围见 **`orderShopScope`**（默认全连锁/可访问店汇总，避免头部门店与消费门店不一致时列表为空）。
        手机号支持规范化匹配（去空格、`+86` 等），详见画像接口说明。
        **缺参处理**：`phone` 缺失或为空时返回业务错误 **`手机号不能为空`**（HTTP 200 + `code=500` 的统一 R 结构），**不再返回 HTTP 500**。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: phone
          in: query
          required: true
          schema: { type: string }
          description: 会员手机号；后端内部据此查 User 并取 openid 再查订单（规范化规则同 GET /admin/member/profile）
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: 返回条数限制（如最近 3~5 笔）
        - name: startTime
          in: query
          schema: { type: string, format: date-time }
          description: 过滤 `pay_time >= startTime`
        - name: endTime
          in: query
          schema: { type: string, format: date-time }
          description: 过滤 `pay_time <= endTime`
        - $ref: '#/components/parameters/OrderShopScopeQuery'
      responses:
        '200':
          description: 成功，body 含 code、list、data（Order[]，含 amount/actual_amount 等，按 pay_time 降序）
        '500': { description: 失败 }
  /admin/member/profile:
    get:
      tags: [会员营销, 运营后台]
      summary: 会员画像（基础标签、消费行为、菜品偏好、价值分层、推荐画像）
      security: [{ BearerAuth: [] }]
      x-permission: user:view
      description: |
        **入参**：`phone` 必填（业务上必填；**缺失或为空**时返回业务错误 **`手机号不能为空`**（HTTP 200 + `code=500` 的统一 R 结构），**不再返回 HTTP 500**）；`orderShopScope` 控制统计用订单的门店范围（见 **`OrderShopScopeQuery`**，默认 **accessible**：总部全连锁、门店账号仅可访问店）。
        **用户解析**：`getUserByPhone` 对手机号做规范化（trim、去中间空格、去掉 `+86` / 前缀 `86`、去横线）后先精确匹配 `t_user.phone`；仍无结果时再按 SQL 对库内 `phone` 做同类归一化比较，兼容历史带空格/`+86` 数据。
        **订单范围**：仅 **`transac_status=success`**，且 **`openid` 或 `pay_openid`** 等于该会员 `openid`；金额统计为实付净额 `sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift`（与后端 `AdminMemberController` 一致）。
        **响应**：除画像标签外，`profile.user` 含会员基础信息（id、name、phone、openid、user_type、birthday、points、**balance**），便于前端在无私募订单时仍能展示会员资料。
        **统计字段（D024）**：`profile` 顶层另含 `consume_amount`（累计消费，与 `totalAmount` 同值）、`last_consume_time`（最近支付时间，无记录为 null）、`invite_registered_count`（邀请注册数）、`available_coupon_count`（可用券数）——口径与 `POST /admin/order/getUserInfo` 全量一致。
        **失败**：用户不存在或未绑定 openid 时返回业务错误（非 200 内 code=0）；前端应读 `code`/`msg`，勿假设仅有 `data` 包裹。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: phone
          in: query
          required: true
          schema: { type: string }
          description: 会员手机号（支持规范化，见本接口 description）
        - $ref: '#/components/parameters/OrderShopScopeQuery'
      responses:
        '200':
          description: 成功，body 含 code、profile；profile 各字段及标签取值说明见下方 schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  profile:
                    type: object
                    description: 会员画像汇总
                    properties:
                      user:
                        type: object
                        description: 会员基础信息（来自 t_user），与订单统计独立
                        properties:
                          id: { type: integer }
                          name: { type: string, nullable: true }
                          phone: { type: string, nullable: true }
                          openid: { type: string, nullable: true }
                          user_type: { type: integer, nullable: true, description: 会员类型 }
                          birthday: { type: string, nullable: true, description: 生日 }
                          points: { type: integer, nullable: true, description: 积分 }
                      orderCount: { type: integer, description: 已支付订单笔数 }
                      totalAmount: { type: number, description: 累计消费金额（实付汇总） }
                      avgOrderValue: { type: number, description: 客单价（实付均单） }
                      consume_amount: { type: number, description: 累计消费金额（实付净额汇总，与 totalAmount 同值；口径同 GET /admin/order/getUserInfo） }
                      last_consume_time: { type: string, nullable: true, description: 最近一次支付时间（yyyy-MM-dd HH:mm:ss），无成功记录为 null；与 lastVisit 同值 }
                      invite_registered_count: { type: integer, description: 邀请注册数（t_invite_record 中 inviter_openid 为本会员且 invitee_openid 非空的记录数；口径同用户列表） }
                      available_coupon_count: { type: integer, description: 可用优惠券张数（status=0、未过期、模板存在且模板 end_time 未过；口径同用户列表） }
                      basicTags:
                        type: object
                        description: 一、会员基础标签（登记/小程序可收集）
                        properties:
                          gender: { type: string, nullable: true, description: 性别。男 / 女；未登记为 null }
                          ageRange: { type: string, nullable: true, description: 年龄档。18-25 / 26-35 / 36-45 / 45+；由生日推断，未登记为 null }
                          hasPhone: { type: string, description: 是否已留手机号。是 / 否 }
                          location: { type: string, nullable: true, description: 位置。本店3km内 / 3-5km / 外地 / 路过；未登记为 null }
                          occupation: { type: string, nullable: true, description: 职业。学生 / 上班族 / 个体户 / 其他；未登记为 null }
                          diningPreference: { type: string, nullable: true, description: 就餐偏好（由订单推断）。堂食 / 外卖 / 都可 }
                      behaviorTags:
                        type: object
                        description: 二、消费行为标签（核心，决定怎么营销）
                        properties:
                          lastConsumeRange: { type: string, description: 最近消费时间。7天内 / 30天内 / 30-60天 / 60天+ }
                          consumeFrequency: { type: string, description: 消费频次。每周≥1次 / 每周1次 / 每月2-3次 / 每月1次 }
                          avgOrderValue: { type: string, description: 客单价档。低(＜50) / 中(50-100) / 高(＞100) }
                          paymentPreference: { type: string, nullable: true, description: 支付偏好。微信 / 支付宝 / 会员卡 / 储值 等（出现最多的方式） }
                          promotionSensitivity: { type: string, description: 促销敏感度。高（有券才来）/ 中 / 低（吃味道） }
                          diningPeriod: { type: string, nullable: true, description: 就餐时段（可多选，顿号分隔）。午餐 / 晚餐 / 夜宵(21点后) }
                          partySize: { type: string, nullable: true, description: 同行人数（可多选，顿号分隔）。1人 / 2-3人 / 4人以上 }
                      dishTags:
                        type: object
                        description: 三、菜品偏好标签（影响备货与推荐）
                        properties:
                          preferredCategories: { type: array, items: { type: string }, description: 偏好品类（预留）。烤肉类/烤串类/海鲜生蚝/素菜/小吃凉菜/酒水饮料 等，当前可为空数组 }
                          taste: { type: string, nullable: true, description: 口味。微辣 / 中辣 / 特辣 / 不辣（订单明细 selectedSpicy 汇总） }
                          topDishNames: { type: array, items: { type: string }, description: 常点菜品名 Top5，按出现次数排序 }
                      valueTier:
                        type: string
                        description: 四、会员价值分层（决定给谁发券）。高价值会员（重点维护）/ 潜力会员（重点激活）/ 新客会员（先留住）/ 沉睡会员（唤醒）
                      suggestedPersona:
                        type: string
                        nullable: true
                        description: 五、推荐画像（四类常见画像匹配）。夜宵酒友男（26-35岁）/ 上班族晚餐（25-40岁）/ 学生党（18-25岁）/ 家庭朋友聚餐（30-45岁）；无匹配为 null
        '500': { description: 失败 }

  # ---------- 收银系统扩展：会员营销 ----------
  /admin/member/persona-tags:
    get:
      tags: [会员营销, 运营后台]
      summary: 会员大数据画像智能标签推荐（UI061）
      security: [{ BearerAuth: [] }]
      x-permission: user:view
      description: |
        根据会员手机号（phone）或主键 ID（memberId）分析该会员的消费历史、偏好及行为特征，
        输出结构化画像 Chip 标签列表（包含频次 frequency、口味 taste、酒水 drink、座位 seat、时段 time、行为 behavior 等）。
      parameters:
        - name: phone
          in: query
          required: false
          schema: { type: string }
          description: 会员手机号
        - name: memberId
          in: query
          required: false
          schema: { type: integer }
          description: 会员主键 ID
        - name: orderShopScope
          in: query
          required: false
          schema: { type: string, default: accessible }
          description: 订单门店范围
      responses:
        '200':
          description: 成功返回会员画像标签列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  msg: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      memberId: { type: integer, example: 88 }
                      phone: { type: string, example: '13800138000' }
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            label: { type: string, example: '🔥 高频熟客 (月均4+次)' }
                            type: { type: string, example: 'frequency' }

  /admin/member/stats:
    get:
      tags: [会员营销, 运营后台]
      summary: 会员看板统计（会员总数、今日新增、储值总额、积分发放）
      security: [{ BearerAuth: [] }]
      x-permission: user:view
      description: |
        **口径（v1.2.330 门店隔离支持）**：
        - **指定门店（通过 shopId 参数或 X-Shop-Id 请求头）**：
          - **memberCount**：属于本店的去重有效会员数（在本店有订单、充值或储值钱包的 `t_user` 去重计数；1号店兼容历史 `shop_id IS NULL`）；
          - **todayNewCount**：属于本店且今日 00:00 起注册的会员数；
          - **totalBalance**：储值总额（若有门店钱包优先统计门店钱包余额，否则统计全量余额）；
          - **totalPoints**：全量 `t_user.points` 合计（累计发放积分）。
        - **全连锁（未传门店且无 X-Shop-Id，或 allShops=true）**：
          - **memberCount**：全部注册会员数；
          - **todayNewCount**：今日 00:00 起注册的会员数；
          - **totalBalance**：全量 `t_user.balance` 合计；
          - **totalPoints**：全量 `t_user.points` 合计。
      parameters:
        - name: shopId
          in: query
          required: false
          schema:
            type: integer
          description: 指定统计的门店ID
        - name: allShops
          in: query
          required: false
          schema:
            type: boolean
          description: true 时统计全连锁会员（仅总部超级管理员可用）
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      responses:
        '200':
          description: 成功，body 含 code 与 memberCount、todayNewCount、totalBalance、totalPoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  memberCount: { type: integer, description: 会员总数（全部注册用户数） }
                  todayNewCount: { type: integer, description: 今日新增（今日 00:00 起注册数） }
                  totalBalance: { type: number, description: 储值总额（t_user.balance 合计，含本金+赠送金） }
                  totalPoints: { type: integer, description: 积分发放（t_user.points 合计） }
        '500': { description: 失败 }

