      记录操作者 admin_id、门店 shop_id、IP、参数快照（脱敏 + 2000 字符截断）、结果状态（SUCCESS/FAILED）与失败原因；支持 DiffProvider 捕获前后状态（`OrderRefundDiffProvider` 记录退款前后 `refund_amount`/渠道列合计，
      落库 `t_operation_log.before_state/after_state`）。审计记录失败仅 error、绝不阻断业务。首批埋点：收银 `POST /cashier/order/quickOrder`、`/addDishes`、`/refundDish`、`/refund`（现金/组合人工退款）、`/updatePrice`、`/discount`、`/checkout`、`/unCheckout`；
