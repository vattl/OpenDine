          application/json:
            schema: { $ref: '#/components/schemas/KdsWorkflowRevokeRequest' }
      responses:
        '200':
          description: 成功，字段同 KdsWorkflowAdvanceResponse（advanced_quantity 为实际撤销份数）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 0 }
                  - { $ref: '#/components/schemas/KdsWorkflowAdvanceResponse' }
        '400': { description: 参数错误或队列不支持撤销 }
        '401': { description: 缺少或无效 X-Kds-Device-Token }

