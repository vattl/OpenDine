                coupon_id: { type: integer, format: int64, description: '与 template_id 二选一' }
                openid: { type: string, description: '可选，用于 has_received' }
                shop_id: { type: integer, description: '可选，与 X-Shop-Id 二选一等价' }
      responses:
        '200':
          description: 成功，body 含 code、data（CouponDTO）
        '500':
