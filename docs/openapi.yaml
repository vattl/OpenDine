        返回 **全量 `t_dish`**（不按 **`t_dish_shop`** 过滤），排序与门店列表一致（类目 sorting、菜品 sorting）。
        请求体与 **`POST /admin/dish/list`** 相同（**PageBean**：`pageNum`、`pageSize`、可选 **`query`** 按菜名模糊筛选）；成功体含 **`dishList`**、**`total`**。
        导入到门店请调 **`POST /admin/dish/importFromHq`**（依赖 **`X-Shop-Id`** 解析目标店）。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
