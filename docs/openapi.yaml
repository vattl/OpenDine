    - **v1.2.191（完全移除历史 t_payment_method 支付配置与直通匹配升级）**：废弃并移除历史 `t_payment_method` 相关 CRUD 接口（`/admin/payment-method/*`）与模型；全端统一收敛至 `t_payment_capability` 架构（`/admin/payment/capabilities` 与 `/config/payment-capabilities`）；新增 `PaymentCapabilityMatcher` 直通匹配引擎，结账与能力校验接口直接支持传入响应字段名（如 `cashier_wechat_enabled` / `cashierWechatEnabled`）、JSON 路径（如 `clients.cashier.channels.wechat` / `cashier.wechat`）或业务名称，无需调用方硬编码映射。
