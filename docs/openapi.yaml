  /admin/order/salesvolume:
    get:
      tags: [运营后台]
      summary: 数据分析：营业额统计（当天实时、历史按结算日）
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      description: |
        仅统计已支付订单（`t_order.transac_status=success`）。
        门店必须配置 **`settle_time`**（HH:mm），未配置返回 400（`SETTLE_TIME_NOT_CONFIGURED`），无兜底。
        - `period=day` 且**不传 `date`**：实时统计当前活动营业班次 **[班次起始日 settle_time, 次日 settle_time)**；班次内新支付订单立即累计。
        - `period=day` 且**传 `date`**（yyyy-MM-dd，结算日）：按指定完整 24 小时结算窗口统计。
        - `week/month/year`：分别返回近 7 天 / 12 月 / 5 年（按同一 24 小时营业日切分规则聚合）。
        金额按净实付口径计算：`sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift`。
        可选 **`payment_method`**：与 **`t_order.payment_method`** 精确匹配（如 `cash`、微信支付落库值等）；不传则统计全部支付方式。
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, default: day, enum: [day, week, month, year], description: 'day=当前营业日片段(1条)，week=前七天(7条)，month=前12月(12条)，year=前5年(5条)' }
        - name: payment_method
          in: query
          required: false
          schema: { type: string }
          description: 支付方式，与 `t_order.payment_method` 一致；不传则不过滤支付方式
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 历史结算日（yyyy-MM-dd），仅 `period=day` 生效；不传则实时统计当前活动营业班次
      responses:
        '200':
          description: 成功，body 含 code、salesVolumeList（TIME 格式 yyyy-MM-dd HH:mm:ss；day 默认当前活动班次，week 为近 7 日逐日，month 为前 12 月，year 为前 5 年）
        '500':
          description: 失败

