      tags: [运营后台]
      summary: 从总部模板挂到当前门店菜单
      description: |
        请求体 **`dishIds`** 为总部菜品 ID 列表。服务端按 **`X-Shop-Id`/`X-Shop-Code`** 解析目标店，对每条执行 **`INSERT IGNORE`** 写入 **`t_dish_shop`**：
        已存在 **`(shop_id, dish_id)`** 则跳过（**skipped**）；**不复制 `t_dish` 行**，分类沿用原 **`typeId`**（与总部共用类目主数据）。
        成功体含 **`imported`**、**`skipped`**、**`invalidIds`**（不存在的菜品 ID）。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishImportFromHqRequest'
      responses:
        '200':
          description: 成功，body 含 code、imported、skipped、invalidIds
        '500':
          description: 失败

  /admin/dish/save:
    post:
      tags: [运营后台]
      summary: 新增或编辑菜品
      description: |
        请求体为 **Dish**，可含 **`stock`** / **`sold_out`** / **`serving_duration_minutes`**。`serving_duration_minutes` 必须为大于 0 的整数分钟，新增未传时默认 **10**；编辑未传时保留原值。**门店上下文下**（`X-Shop-Id` / `X-Shop-Code`）：`stock` / `sold_out` 分别写入 **`t_dish_shop.stock`** / **`t_dish_shop.sold_out`**；`unitprice` / `name` / `image` / `unit` / `specification` / `typeId` / `sorting` / `serving_duration_minutes` 等门店差异字段仅写入 **`t_dish_shop` 覆盖列**（`unitprice`、`name_override`、`image_override`、`unit_override`、`specification_override`、`type_id_override`、`sorting_override`、`serving_duration_override`），**不写 `t_dish`**，避免跨店联动；覆盖列为 NULL 时 C 端回退总部值。返回给前端字段名仍保持 **`stock`** / **`sold_out`**；**新增**时若未传 **`sold_out`**，后端默认 **0**。
        保存成功后：① 向 **`/ws/menu`** 已连接客户端广播 **`dish_catalog_changed`**（`action` 为 `save_new` 或 `save_update`）；② 服务端 **AI 在售菜单本地缓存** 失效，下次推荐重新读库。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dish'
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /admin/dish/delete:
    get:
      tags: [运营后台]
      summary: 删除菜品
      description: 删除成功后广播 **`dish_catalog_changed`**（`action=delete`），并失效 AI 在售菜单缓存。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
          description: 菜品主键 t_dish.id
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /admin/dish/updateOnSale:
    post:
      tags: [运营后台]
      summary: 上架/下架菜品
      description: |
        仅更新当前门店 **`t_dish_shop.onsale_override`**，不写 **`t_dish.onsale`**，避免跨店联动。**`onsale=true`（上架）时**，服务端按当前门店 **`t_dish_shop.stock`** 同步 **`t_dish_shop.sold_out`**，避免「上架仍标售罄」且不影响其他门店。
        成功上架/下架后广播 **`dish_catalog_changed`**（`action=updateOnSale`，payload 含 **onsale**），并失效 AI 在售菜单缓存。菜品不存在时返回错误（code 非 0），不推送。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, onsale]
              properties:
                id: { type: integer, description: '菜品主键 t_dish.id' }
                onsale: { type: boolean, description: 'true 上架，false 下架' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /admin/dish/updateSaleStatus:
    post:
      tags: [运营后台]
      summary: 更新菜品可售状态（售罄标记）
      description: |
        仅更新当前门店 **`t_dish_shop.sold_out`**（**0** 可售 / **1** 已售罄），**不修改 `onsale`**，不写 **`t_dish.sold_out`**，避免跨店联动。已下架菜品仍可调用（便于预置状态）；C 端 **`GET /dish/listAll`** 仍只按 **`onsale`** 过滤，售罄由下单校验拦截。响应给前端的字段名仍为 **`sold_out`**。
        成功后广播 **`dish_catalog_changed`**（`action=updateSaleStatus`，payload 含 **onsale** 为当前上下架状态），并失效 AI 在售菜单缓存。后续**库存扣减/取消回退**仍可能按库存规则重写 **`sold_out`**（见顶层「库存与下单/取消」）。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, sold_out]
              properties:
                id: { type: integer, description: '菜品主键 t_dish.id' }
                sold_out: { type: integer, enum: [0, 1], description: '0 可售，1 已售罄（暂不可下单）' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败（如 id/sold_out 非法、菜品不存在）

  /admin/dish/sort:
    post:
      tags: [运营后台]
      summary: 拖拽更新菜品排序
      description: 排序更新成功后广播 **`dish_catalog_changed`**（`action=sort`），并失效 AI 在售菜单缓存。仅更新当前门店、被拖菜品**生效分类内**的 `t_dish_shop.sorting_override`；排序键为 `(ifnull(sorting_override, t_dish.sorting), dish_id)`，该分类写为连续 `1..n`。不修改其他分类、其他门店或 `t_dish.sorting`。同店分类/菜品排序通过门店行锁串行并在事务内完成。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 传入被拖拽菜品 id 与当前门店、该菜品生效分类内的目标位置 targetIndex（1-based）
              required: [id, targetIndex]
              properties:
                id: { type: integer, description: 被拖拽的菜品ID }
                targetIndex: { type: integer, description: '当前分类内的 1-based 目标位置；0/越界自动收敛到首/末位' }
      responses:
        '200':
          description: 成功
        '400':
          description: 缺少/无权访问门店上下文（业务 code 4001/4003）
        '500':
          description: 失败（菜品不存在、未挂当前门店、未绑定有效分类或更新未生效）

  /admin/dish/uploadImage:
    post:
      tags: [运营后台]
      summary: 上传菜品/广告图
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                type: { type: string, description: advertising 为广告图 }
      responses:
        '200':
          description: 成功，body 含 code(0)、msg、data（imageName、src）
        '500':
          description: 失败

  /admin/combo/getByDishId:
    get:
      tags: [运营后台]
      summary: 「运营端」按套餐头菜品 ID 查询套餐定义（编辑回显）
      description: |
        **仅运营后台**（须 **Bearer JWT**，权限 **`dish:manage`**）。用于后台编辑页回显 **`t_combo`** 及子表；**含 `status=0` 停用套餐**。
        **`dishId`** 为套餐头 **`t_dish.id`**（须先 **`POST /admin/dish/save`** 创建菜品再 **`POST /admin/combo/save`**）。
        小程序选规格请用 **`GET /combo/detail`**（仅返回启用套餐且带子菜门店展示字段）。
        未配置时 **`combo`**、**`definition`** 均为 **null**。
      security: [{ BearerAuth: [] }]
      x-permission: dish:manage
