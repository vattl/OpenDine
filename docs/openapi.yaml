      description: |
        **仅 `boss_overview` 屏**设备可调用。汇总 **meat_grill / veg_grill / seafood_special** 全部工单（**不**受 `skewer_gate` 过滤，未抓串亦可见并带 **`skewer_picked`**）。
        - **`queue=pending`**（默认）：仅 **待制作** `item_status=0`，`archived=0`。
        - **`queue=cooking`**：仅 **制作中** `item_status=1`，`archived=0`。
        - **`queue=ready_serve`**：待传菜，`item_status=2` 且 `archived=0`。
        - **`queue=done`**：已完成归档，`archived=1`；仅当前营业日（门店 **open_time** 起点，默认 **16:00**；**v1.2.147** 引入）内归档工单。
        - **`dining`**：`all` / `dine_in`（堂食）/ `takeout`（外卖）/ `pack`（打包）。
        - **`view`**：默认 **`dish`** 按菜名+岗位合并 **`dish_groups`**；**`order`** / **`table`** 返回 **`order_cards`**（table 按桌号排序）。
        - **`extra`**：逗号分隔 **`overdue`**（待做超时）、**`rush`**（催菜）、**`add_dish`**（加菜轮次>1）、**`hold`**（明细 `order_rece` 空或 `mis_order`，等叫未送厨）。
