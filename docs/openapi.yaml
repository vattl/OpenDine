    - **v1.2.205（个人收款监听 App 异步通知回调与 Ping 接口）**：新增 **`POST /api/v1/personal-alipay/notify`** 与 **`POST|GET /api/v1/personal-alipay/ping`**；通过 `X-Signature`（HMAC-SHA256，`channel\namount\ntimestamp\nevent_id`）进行身份验签，支持 `event_id` 幂等去重与 `t_personal_payment_event` 流水入库，并自动核销匹配的未结账扫码收款意向（`t_cashier_collection_intent`）。
    - **v1.2.204（旧版无 Token 临时兼容外卖与收货地址链路）**：在 `LegacyUserIdentityCompatibilityResolver` 中补充外卖地址（`POST /order/takeout/address/save`、`GET /order/takeout/address/list`、`POST /order/takeout/address/delete`、`POST /order/takeout/address/setDefault`）与外卖下单/详情（`POST /order/takeout/preview`、`POST /order/takeout/create`、`POST /order/takeout/order/list`、`GET /order/takeout/order/detail`、`GET /order/takeout/order/tracking`）受控兼容白名单；支持从 `t_user_address` 与 `t_order` 反查归属。
    - **v1.2.203（全场景库存一致性与退菜动作模式）**：退菜接口（`POST /cashier/order/refundDish` 与 `POST /admin/orderDetail/delete_menu`）新增可选参数 **`stock_action`**（`RESTORE` 回退库存，`NO_RESTORE` 损耗不回退，`OUT_OF_STOCK` 缺货清零并置售罄）与 **`reason/remark`**；新增 **`t_dish_stock_log`** 库存变动流水表与实体，全链路记录下单、加菜、取消、退菜、估清库存流水。
