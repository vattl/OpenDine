  /admin/order/getUserInfo:
    post:
      tags: [运营后台]
      summary: 用户列表（分页）
      description: |
        分页查询用户，不一次性返回全部数据。请求体可传 pageNum、pageSize、query、phone、userType/user_type、registerStartTime/registerEndTime、minAmount/maxAmount、amountSort、shopId、allShops。pageSize 最大 100。
        **门店隔离（v1.2.330）**：
        - 门店会员口径：若在门店有消费订单（`t_order` 的 `openid`/`pay_openid`）、充值记录（`t_member_recharge` 的 `user_id`/`openid`）或独立钱包（`t_shop_member_wallet`），即属于该门店（1号店兼容历史 `shop_id IS NULL`）。
        - 当请求体传 `shopId` 或请求头带 `X-Shop-Id` 时，自动限定查询本店会员，并自动计算该店统计数据。
        - 总部账号可传 `allShops=true` 查询全连锁全量会员。
        **有效会员口径（v1.2.301）**：仅返回已绑定手机号的有效会员（`phone IS NOT NULL AND TRIM(phone) != ''`），底层自动过滤未绑定手机号的匿名微信访客。
        **D023（默认轻量）**：未传 `includeStats`（或 false）且未指定门店时，仅返回 `t_user` 基础字段与分页，4 个统计字段（`consume_amount`/`last_consume_time`/`invite_registered_count`/`available_coupon_count`）固定为 `null`；指定门店或传 `includeStats=true`/携带 `minAmount`/`maxAmount`/`amountSort` 时，自动聚合返回。
        **敏感字段**：列表**不返回** session_key（微信会话密钥，属敏感凭据）；POST /admin/order/getOneUserInfo 同样将该字段置空后返回。
        **consume_amount**：`transac_status=success` 订单的实付净额（sett_amount−discount_amount+service_fee−refund_amount−pay_amount_gift），与会员画像/消费记录一致：同一笔订单若 **openid 与 pay_openid 不同**则分别计入对应用户；若相同则只计一次；仅 **openid** 有值时按 openid 计，仅 **pay_openid** 有值时按 pay_openid 计。
        **invite_registered_count**：`t_invite_record` 中 **`inviter_openid` 为本用户**且 **`invitee_openid` 非空**的记录数（表示已通过邀请链路绑定注册的被邀请人数）。
        **available_coupon_count**：当前用户 **`t_user_coupon.status=0`**，用户券未过期、关联券模板存在且模板 **`end_time` 未过** 的张数（与小程序「usable」列表一致；**不按门店**过滤 `apply_shop_ids`）。
        **last_consume_time**：该会员在统计门店范围内的**最近一次支付时间**（`transac_status=success` 且 `openid`/`pay_openid` 匹配该用户的订单中 `MAX(pay_time)`），口径与 `consume_amount` 完全一致（含门店过滤与 openid/pay_openid 归属规则）；无成功消费记录时为 null。
        请求头解析出门店时：`shop_id=1` 含历史 **`shop_id` 为空** 的订单；其它门店仅统计该 `shop_id`。
      security: [{ BearerAuth: [] }]
      x-permission: user:view
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shopId: { type: integer, description: '可选，指定查询的目标门店ID；门店账号不可越权；缺省时由请求头 X-Shop-Id 解析' }
                allShops: { type: boolean, description: '可选，true 时查询全连锁会员（仅总部超级管理员可用）', default: false }
                includeStats: { type: boolean, description: 'D023：默认 false。true 时返回 consume_amount/last_consume_time/invite_registered_count/available_coupon_count 聚合字段（null 时表示无记录或未开启）；携带 minAmount/maxAmount/amountSort 任一参数时自动按 true 处理', default: false }
                pageNum: { type: integer, description: '页码，从 1 开始', default: 1 }
                pageSize: { type: integer, description: '每页条数，最大 100', default: 20 }
                query: { type: string, description: '可选，按 name/phone/openid 模糊查询' }
                phone: { type: string, description: '手机号模糊筛选，可和 query 同时使用' }
                userType: { type: integer, description: '用户类型，对应 t_user.user_type' }
                user_type: { type: integer, description: 'userType 的兼容写法' }
                registerStartTime: { type: string, description: '注册开始时间，对应 t_user.time，如 2026-05-01 00:00:00' }
                registerEndTime: { type: string, description: '注册结束时间，对应 t_user.time，如 2026-05-31 23:59:59' }
                minAmount: { type: number, description: '最小消费金额，可写 minConsumeAmount' }
                maxAmount: { type: number, description: '最大消费金额，可写 maxConsumeAmount' }
                amountSort: { type: string, enum: [asc, desc], description: '按消费金额排序，asc/desc；可写 sortAmount' }
      responses:
        '200':
          description: 成功，body 含 code、user（当前页：t_user 字段（**不含 session_key**）；includeStats=true 时另含 consume_amount + invite_registered_count + available_coupon_count + last_consume_time，否则四者固定为 null）、total（总记录数）
        '500':
          description: 失败

