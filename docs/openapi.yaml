  /config/payment-capabilities:
    get:
      tags: [系统配置, 支付与回调]
      summary: 门店支付能力（线上开关、渠道、线下收款码、九折）
      description: |
        **免签**（与 **`GET /config/wechat-prepay-ninefold`** 一致）。
        **门店解析（订单详情推荐传 `order_no`）**：
        1. 传 **`order_no`** 或 **`orderNo`** 时，按该订单 **`t_order.shop_id`** 查询（**不使用**请求头当前选中门店）。
        2. 否则 query **`shop_id`** / **`shop_code`** **优先于** **`X-Shop-Id`** / **`X-Shop-Code`**；二者同时存在且不一致时返回错误。
        3. 均未传时按 **`shop_id=0`** 全店默认模板解析（运行时门店行覆盖 global）。
        响应 **`shopId`** 为实际解析门店。
        **【当前响应契约（D017）】**：本接口只返回与支付可用性直接相关的字段——顶层 `wechatMerchantReady`、`onlinePayEnabled`、`channels`（legacy 兼容结构）、`disabledMessage`、`nineFold`，以及 `clients.*` 的 `enabled/channels/channelStates/wechatMerchantReady`。其余历史字段（`effectiveEnabled/effectiveChannels`、`canEnable*`、`wechatPayEnableHint`、`globalOnlinePayEnabled`、`wechatMissingFields`、`wechatReadyHint`、`clients.*.wechat_qr/alipay_qr`）**一律不在本接口返回**；下方 D013–D015 为历史变更记录，冲突处以本契约与 changelog 最新条目（v1.2.233）为准。
        云端配置按终端返回：
        - **`clients.cashier`**：`enabled`、`channels.wechat/alipay/balance/combined/wechat_qr/alipay_qr` 为保存的收银端开关；`channelStates.<渠道>.available` 为后端可用性（false=不可开启）、`hint` 为原因；`wechatMerchantReady` 为宽松就绪。
        - **`clients.miniProgram`**：`enabled`、`channels.wechat/balance/alipay` 为保存的小程序开关；`channelStates.<渠道>.available/hint` 同上；`wechatMerchantReady` 为严格就绪。
        两端完全独立：关闭 `clients.cashier` 不影响小程序，关闭 `clients.miniProgram` 不影响收银端；关闭某端单一渠道也不会改写另一端同名渠道。
        **D017（C 端精简）**：`effectiveEnabled/effectiveChannels` 不再在本接口返回（移入 B 端 `GET /admin/payment/capabilities`）；付款前可用性统一按 `clients.*.channelStates.<渠道>.available` 判断。顶层兼容字段仅保留 **`wechatMerchantReady`**、**`channels`**、**`onlinePayEnabled`**。
        **`paymentMethods` 已弃用且不再返回**；支付方式名称和 code 由各终端固定维护，不应再从能力接口生成。
         - **D013（就绪口径；字段已随 D017 精简）**：`clients.cashier.wechatMerchantReady`=宽松就绪（default 微信商户行存在）；`clients.miniProgram.wechatMerchantReady`=严格就绪（default 商户字段齐全）。支付宝线上收款=个人码 + webhook 共享密钥验签，**不依赖支付商户配置**（`t_payment_merchant_config` 的 alipay 证书字段为预留）。`canEnableCashierWechatPay`/`canEnableMiniProgramWechatPay`/`wechatReadyHint`/`effectiveChannels` 已随 D017 移入 B 端，本接口不再返回；就绪原因见 `clients.*.channelStates.<渠道>.hint`。`channels` 旧兼容组：`wechat`=小程序口径、`alipay`=收银口径、`combined`=收银组合口径、`offlineCollect`=线下收款码，与 `clients.*` 并存不删除。
        - **D014**：新增 `clients.cashier.wechat_qr` / `clients.cashier.alipay_qr`（收银微信/支付宝收款码独立开关）与 `clients.miniProgram.channels.alipay`（小程序支付宝，默认关）；既有键名/结构不变。
        - **D015**：新增 `clients.cashier.channelStates` / `clients.miniProgram.channelStates`（渠道键 → `{enabled, available, hint}`，`enabled`=保存值、`available`=后端可用性、`hint`=原因）；前端可直接按 `available` 判断能否开启，无需自行计算 effective。
        新前端必须读取自身 `clients` 节点（`channelStates` 为开关+可用性唯一来源）。顶层兼容字段仅保留 **`wechatMerchantReady`**（宽松就绪）、**`channels`**（legacy 结构）、**`onlinePayEnabled`**（= `clients.miniProgram.enabled`）。**D017 起 `effectiveEnabled/effectiveChannels`、`canEnable*`、`wechatPayEnableHint`、`globalOnlinePayEnabled`、`wechatMissingFields`、`wechatReadyHint` 不再返回**。
      parameters:
        - name: order_no
          in: query
          schema: { type: string }
          description: 业务订单号；与 orderNo 二选一。订单详情/待支付页推荐传入，按下单门店拉配置
        - name: orderNo
          in: query
          schema: { type: string }
          description: 同 order_no
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/ShopIdQuery'
        - $ref: '#/components/parameters/ShopCodeQuery'
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /config/wechat-prepay-ninefold:
    get:
      tags: [系统配置]
      summary: 微信统一下单夜间九折规则（只读，免签，按门店）
      description: |
        返回指定门店生效的夜间九折参数（与 `getPrepayId` 结算一致）。**`shop_id=0`** 为全店默认，各店可独立 **`enabled`** 与规则（**`t_payment_ninefold_config`**）。
        推荐订单场景传 **`order_no`** 或订单 **`shop_id`**（优先于 `X-Shop-Id`）。
        body 含 **shopId**、**enabled**、**payRate**、**minBaseYuan**、时段、**eligibleDiningTypes** 等。
      parameters:
        - name: order_no
          in: query
          schema: { type: string }
          description: 按下单门店解析
        - name: orderNo
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/ShopIdQuery'
        - $ref: '#/components/parameters/ShopCodeQuery'
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /image/{category}/{filename}:
    get:
      tags: [图片资源]
      summary: 图片文件（可选 q 服务端裁图）
      description: |
        路径示例：`/image/dish/xxx.jpg`、`/image/img/...`、`/image/avatar/...`。
        - 无 `q`：返回磁盘原图。
        - `q=300`：按宽度 300px 等比缩放后返回（大于原图宽度则不放大）。
        category 与磁盘目录映射见服务端 `ImageFileServeService`（dish/qrcode/img/avatar/advertising/offline-collect）。
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          schema: { type: integer, minimum: 1, maximum: 1200 }
          description: 目标宽度（像素），服务端缩放
      responses:
        '200':
          description: 图片二进制；裁图时响应头可能含 X-Image-Resized=1
        '404':
          description: 文件不存在

  /config/invite-first-order-balance-reward:
    get:
      tags: [系统配置]
      summary: 邀请好友首单余额返利规则（只读，免签）
      description: |
        被邀请人「首笔」点餐订单支付成功后，可按实付的一定比例给邀请人增加账户余额（与 `t_system_config` 键 `invite.reward.first_order.*` 一致）。
        返现金额 = 实付(元)×比例÷100，**按元整数四舍五入**（无小数分）。
        订单退款（微信退款回调入账或余额支付本地退款）后，服务端会按**剩余实付**重算返现并调整邀请人余额；全额退款时收回返现并取消该被邀请人的首单返现资格（逻辑见 `POST /order/refund/notify` 说明）。
        body 顶层含 code(0)、enabled、rewardPercent（百分比数值，如 5 表示 5%）。
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  # ---------- 排队取号 ----------
  /queue/config:
    get:
      tags: [排队取号]
      summary: 获取排队页基础配置
      description: |
        返回排队开关、门店名与公告文案。
        连锁门店解析规则与 C 端菜单一致：`X-Shop-Id` / `X-Shop-Code` / `shop_id` / `shop_code`，未传时默认门店 `1`。
      parameters:
        - $ref: '#/components/parameters/ShopIdHeader'
        - $ref: '#/components/parameters/ShopCodeHeader'
        - $ref: '#/components/parameters/ShopIdQuery'
        - $ref: '#/components/parameters/ShopCodeQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueConfigResponse'
        '500':
          description: 失败

  /queue/ticket/create:
    post:
      tags: [排队取号]
      summary: 创建排队号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueTicketCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicketResponse'
        '500':
          description: 失败

  /queue/ticket/status:
    get:
      tags: [排队取号]
      summary: 查询排队状态
      description: 按当前解析门店 + ticketNo 查询，避免跨店串号。
      parameters:
        - $ref: '#/components/parameters/ShopIdHeader'
        - $ref: '#/components/parameters/ShopCodeHeader'
        - $ref: '#/components/parameters/ShopIdQuery'
        - $ref: '#/components/parameters/ShopCodeQuery'
        - name: ticketNo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicketResponse'
        '500':
          description: 失败

  /queue/ticket/cancel:
    post:
      tags: [排队取号]
      summary: 取消排队
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueTicketCancelRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCancelResponse'
        '500':
          description: 失败

  # ---------- 运营后台（admin_panel 与 server 共用）----------
  /adminLogin:
    post:
      tags: [运营后台]
      summary: 管理员登录
      description: |
        公开接口，无需 Token。登录成功后返回 JWT、权限列表及**连锁数据范围**（见 **`docs/admin_chain_permission_architecture.md`**）。
        响应 body 含 code(0)、token（JWT）、permissions（权限码数组）、adminId、userName、**scope**（`HQ`|`REGION`|`SHOP`）、**shops**（可管门店 `{id,code,name}`）、**regionIds**（当前账号可访问区域 ID 列表，HQ/SHOP 可为空）、**roles**（角色数组 `{roleCode,roleName}`，一个管理员可关联多个角色）。
        后续 B 端请求需在请求头携带 Authorization: Bearer &lt;token&gt;；需门店上下文的接口另带 **`X-Shop-Id`** 或 **`X-Shop-Code`**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - $ref: '#/components/schemas/AdminLoginResponseData'
        '500':
          description: 失败（用户名/密码错误等）

  /admin/me/permissions:
    get:
      tags: [运营后台]
      summary: 获取当前登录管理员的权限列表
      description: |
        需请求头 Authorization Bearer JWT。用于前端刷新页面后仅凭本地存储的 token 恢复权限与**连锁门店范围**，无需重新登录。
        返回 permissions、adminId、**scope**、**shops**、**regionIds**（与 **`POST /adminLogin`** 一致）。不要求特定业务权限码，任意已登录管理员可调。
      security: [{ BearerAuth: [] }]
      x-permission: 无（仅需登录）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - $ref: '#/components/schemas/AdminMePermissionsData'
        '401':
          description: 未登录或 token 无效/过期

  /admin/me/shops:
    get:
      tags: [运营后台]
      summary: 获取当前管理员可访问门店（分页）
      description: |
        需请求头 Authorization Bearer JWT。用于 HQ 或多门店账号的前端懒加载选店。
        返回 scope、regionIds、list（门店摘要数组）以及分页信息。

        响应体包含 `regions`（区域 id/名称列表），供权限页「区域」多选。
      security: [{ BearerAuth: [] }]
      x-permission: 无（仅需登录）
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码，从 1 开始
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
          description: 每页条数，最大 200
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 按门店名称或编码模糊匹配
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - $ref: '#/components/schemas/AdminMeShopsData'
        '401':
          description: 未登录或 token 无效/过期

  /admin/modifyPassword:
    post:
      tags: [运营后台]
      summary: 管理员修改密码
      security: [{ BearerAuth: [] }]
      x-permission: admin:password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password, newPassword]
              properties:
                password: { type: string, description: '当前密码' }
                newPassword: { type: string, description: '新密码' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /admin/administrator/list:
    get:
      tags: [运营后台]
      summary: 管理员列表（含角色信息）
      description: |
        获取所有管理员及各自绑定的角色，用于权限分配页。返回项不含密码。仅具备 admin:manage 权限可访问。

        每项包含 **`scope`**（HQ|REGION|SHOP）、**`shopIds`**、**`regionIds`**（及 **`shops`** 摘要），与 `PUT /admin/administrator/{id}/shops`、登录/me 数据域一致，供权限页展示与编辑。
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      responses:
        '200':
          description: 成功，body 含 code、list（管理员项数组）、total、allRoles（全部角色列表）。每项含 id、userName、roleIds、roles（角色详情 id/role_code/role_name）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        userName: { type: string }
                        workNo: { type: string, nullable: true, description: '员工工号' }
                        realName: { type: string, nullable: true, description: '员工姓名' }
                        jobTitle: { type: string, nullable: true, description: '员工岗位' }
                        displayName: { type: string, description: '界面展示姓名（优先真实姓名）' }
                        name: { type: string, description: '界面展示姓名' }
                        roleIds: { type: array, items: { type: integer } }
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              role_code: { type: string }
                              role_name: { type: string }
                        scope:
                          type: string
                          enum: [HQ, REGION, SHOP]
                          description: 数据范围（HQ/REGION/SHOP）
                        shopIds:
                          type: array
                          items: { type: integer }
                          description: 显式绑定门店 ID
                        regionIds:
                          type: array
                          items: { type: integer }
                          description: 显式绑定区域 ID
                        shops:
                          type: array
                          description: 可选，门店摘要（与 shopIds 对应展示）
                          items: { $ref: '#/components/schemas/AdminAccessibleShopSummary' }
                  total: { type: integer }
                  allRoles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        role_code: { type: string }
                        role_name: { type: string }
        '403':
          description: 无 admin:manage 权限

  /admin/administrator/{id}:
    put:
      tags: [运营后台]
      summary: 更新管理员/员工资料
      description: 仅具备 admin:manage 权限可访问。支持修改工号、姓名、岗位及重置密码。
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 管理员 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workNo: { type: string, description: '员工工号（全局唯一校验）' }
                realName: { type: string, description: '员工真实姓名' }
                jobTitle: { type: string, description: '岗位名称' }
                password: { type: string, description: '可选，新密码（重置时传）' }
      responses:
        '200':
          description: 成功
        '403':
          description: 无 admin:manage 权限
        '500':
          description: 管理员不存在或工号已存在
    delete:
      tags: [运营后台]
      summary: 删除管理员/员工账号
      description: 仅具备 admin:manage 权限可访问。操作不可逆，级联清理角色与门店绑定；不允许删除当前登录账号；需显式传 confirm=true。
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 管理员 ID
        - name: confirm
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 二次确认标记（必须传 true）
      responses:
        '200':
          description: 成功，员工账号已删除
        '400':
          description: 未确认或不能删除当前登录账号
        '403':
          description: 无 admin:manage 权限
        '500':
          description: 管理员不存在

  /admin/administrator/create:
    post:
      tags: [运营后台]
      summary: 创建新管理员账号
      description: 仅具备 admin:manage 权限的管理员可调用。支持同时绑定工号、姓名、岗位及初始角色列表。
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName: { type: string, description: 管理员用户名，全局唯一 }
                password: { type: string, description: 初始密码（当前统一通过 BCrypt 散列入库） }
                workNo: { type: string, description: '员工工号（全局唯一校验）' }
                realName: { type: string, description: '员工姓名' }
                jobTitle: { type: string, description: '员工岗位' }
                roleIds:
                  type: array
                  items: { type: integer }
                  description: 角色 ID 列表（t_role.id，可选），用于同时绑定该管理员的角色
      responses:
        '200':
          description: 成功
        '500':
          description: 失败（用户名已存在、工号已存在、部分角色ID不存在等）

  /admin/administrator/{id}/roles:
    put:
      tags: [运营后台]
      summary: 修改指定管理员的角色（权限）
      description: 请求体传 roleIds 数组，覆盖该管理员当前绑定的角色。roleIds 为空时清空该管理员所有角色（按现有逻辑将视为超级管理员）。仅具备 admin:manage 权限可访问。
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 管理员 ID（t_admin.id）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: integer }
                  description: 角色 ID 列表（t_role.id），可为空数组
      responses:
        '200':
          description: 成功
        '403':
          description: 无 admin:manage 权限
        '500':
          description: 管理员不存在等

  /admin/administrator/{id}/shops:
    put:
      tags: [运营后台]
      summary: 更新指定管理员的数据范围（门店/区域）
      description: |
        覆盖该管理员可访问的 **`shopIds`** 与 **`regionIds`**（与连锁数据域一致）。
        需 `admin:manage`。语义由后端定义（如 HQ 账号是否允许收窄、与 `scope` 字段如何联动）。
        含 **super_admin**（或等价超级角色）的账号建议拒绝修改或忽略本次写入。

      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 管理员 ID（t_admin.id）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopIds:
                  type: array
                  items: { type: integer }
                  description: 门店 ID 列表，空数组表示不按门店列表约束（依后端规则）
                regionIds:
                  type: array
                  items: { type: integer }
                  description: 区域 ID 列表
      responses:
        '200':
          description: 成功
        '403':
          description: 无 admin:manage 权限
        '500':
          description: 管理员不存在等

