      responses:
        '200':
          description: 成功，body 含 couponId、count、codes（[{id, redeem_code}]）
        '500': { description: 失败 }

  /admin/coupon/batch-send:
    post:
      tags: [运营后台]
      summary: 一键发券（按人群筛选）
      security: [{ BearerAuth: [] }]
      x-permission: coupon:manage
      description: |
        **人群**：从 `t_user` 筛选 **已绑定手机号**（`phone` 非空且 trim 后非空）的用户；可按 `registerStart`/`registerEnd`、`userType`/`userTypes` 过滤。
        **券与门店**：优惠券须 **属于当前请求头门店**（`CouponShopFilter.appliesToShop`，与 `X-Shop-Id` 解析结果一致）；否则 **4003**「优惠券不属于当前门店」。
        **历史消费条件**：若传 `minConsumeAmount` 或 `maxConsumeAmount`，服务端按候选人 `openid` 分批查询 **`t_order`**（`transac_status=success`，**按 `openid` 汇总**，与画像侧的 `pay_openid` 扩展不同，以发券实现为准），在 **`consumeShopScope`** 限定的门店范围内聚合实付后筛选；默认 **accessible** 与会员 **`orderShopScope`** 一致（**总部**=全连锁汇总，**门店账号**=`shop_id IN (可访问门店)`）；**resolved**/**current**=仅当前头部门店。
        **发券**：非预览时对命中用户逐个调用 **`receiveCoupon`**，与 C 端领券、库存及规则一致；任一失败则整批返回错误（事务回滚）。
        **预览**：`previewOnly=true` 时只返回统计字段，**不发券、不扣库存**。
        **金额语义**：`maxConsumeAmount=0` 表示 **上限为 0 元**（仅保留汇总 ≤0 的用户），**不是**「不限制上限」；不限上限请 **省略** `maxConsumeAmount`。`minConsumeAmount`/`maxConsumeAmount` 均 **≥0**，且 min≤max。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [couponId]
              properties:
                couponId: { type: integer, format: int64, description: 优惠券ID（须属于当前头部门店） }
                registerStart: { type: string, description: 注册开始时间，格式 yyyy-MM-dd HH:mm:ss 或 yyyy-MM-dd；过滤 `t_user.time >= registerStart` }
                registerEnd: { type: string, description: 注册结束时间；纯日期时服务端按当日 23:59:59 闭区间处理 }
                minConsumeAmount:
                  type: number
                  format: double
                  description: 历史消费金额下限（元）。在 consumeShopScope 范围内按订单汇总后与该值比较；可与 max 同时传
                maxConsumeAmount:
                  type: number
                  format: double
                  description: |
                    历史消费金额上限（元）。**传 0 表示仅允许汇总金额 ≤0**，不是「不设上限」；不设上限请不传本字段。
                userType: { type: integer, description: 单个会员类型（如 0 普通 / 1 会员） }
                userTypes:
                  type: array
                  description: 多个会员类型（与 userType 取并集）
                  items: { type: integer }
                previewOnly:
                  type: boolean
                  description: true=仅预览命中人数并返回统计（candidateUserCount、openidReadyCount、consumeMatchedCount、targetUserCount 等），不发券、不扣库存
                consumeShopScope:
                  $ref: '#/components/schemas/ConsumeShopScope'
      responses:
        '200':
          description: |
            成功时 `code=0`。body 常见字段：`couponId`、`previewOnly`、`candidateUserCount`（注册条件命中人数）、`openidReadyCount`（有 openid 人数）、`consumeMatchedCount`/`targetUserCount`（金额与类型筛选后人数）、`grantedCount`（实际发券数；预览时为 0）。
        '500': { description: 失败（参数错误、库存不足、receiveCoupon 失败等） }

  /admin/coupon/redeem-code/delete:
    post:
      tags: [运营后台]
