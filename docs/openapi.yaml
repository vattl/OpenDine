  # ---------- 收银系统扩展：数据报表 ----------
  /admin/report/daily:
    get:
      tags: [数据报表, 运营后台]
      summary: 营业日报
      description: |
        按营业日起始标签统计。`date=D` 对应门店窗口
        `[D settle_time, D+1天 settle_time)`；开始时刻计入、结束时刻不计入。
        财务归属使用 `pay_time`，仅 `pay_time IS NULL` 的历史记录回退 `order_time`。
        当 `detail=true` 时，返回商业级 8 大维度完整日结营业报告（基础信息、营收核心、支付渠道、钱箱对账、就餐方式、会员运营、风控异常、热销菜品榜与热敏小票文本）。
        详细日报增量返回 `receivableSummary`（`chargedFen/collectedFen/writeoffFen/reversedFen/outstandingFen/cutoffLedgerId`）、`totalCollectionsFen` 和元单位 `totalCollections`。`netRevenue` 是包含挂账销售的净销售额；`totalCollections` 才是实际收款合计。支付渠道明细只包含真实支付，不包含新增挂账。
        会员维度（`report.member.newMembers`）严格按照门店上下文进行数据隔离，仅统计在当前门店产生过交易、充值或持有当前分店钱包的新增有效会员，杜绝跨店数据混入。
        当 `detail=false` 时，返回轻量级财务汇总数据，兼容既有字段。
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      parameters:
        - name: date
          in: query
          required: false
          description: 营业日起始日期 D，格式 yyyy-MM-dd
          schema: { type: string, format: date }
        - name: shop_id
          in: query
          required: false
          schema: { type: integer }
        - name: detail
          in: query
          required: false
          description: 是否返回商业级 8 维度全量日结报告（默认 false）
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 成功，body 含 code、report（包含 8 大维度结构化对象、应收摘要、实际收款合计及顶层兼容财务字段）
        '500': { description: 失败 }
  /admin/report/weekly:
    get:
      tags: [数据报表, 运营后台]
      summary: 营业周报
      description: |
        `startDate` 与 `endDate` 均为营业日起始标签且包含首尾，统计窗口为
        `[startDate settle_time, endDate+1天 settle_time)`。收银端只传日期范围；
        有效门店范围由鉴权上下文决定，总部汇总逐店应用各自 `settle_time`。
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      parameters:
        - name: startDate
          in: query
          required: true
          description: 首个营业日起始日期（含）
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          description: 最后一个营业日起始日期（含）
          schema: { type: string, format: date }
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、report
        '500': { description: 失败 }
  /admin/report/monthly:
    get:
      tags: [数据报表, 运营后台]
      summary: 营业月报
      description: |
        `year/month` 选择该自然月内的营业日起始标签集合；窗口从该月 1 日的
        `settle_time` 开始，到次月 1 日的 `settle_time` 结束（右开）。收银端只传
        `year/month`；有效门店范围由鉴权上下文决定，总部汇总逐店应用各自切日时间。
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: true
          schema: { type: integer }
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、report
        '500': { description: 失败 }

  /admin/report/repurchase/weekly:
    get:
      tags: [数据报表, 运营后台]
      summary: 周复购率
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        **周复购率 = 本周购买≥2次的用户 ÷ 本周所有购买用户**。
        - 购买口径：仅统计 **已支付订单**（`transac_status=success`），按 `order_time`（下单创建时间）落在窗口内的订单计数。
        - 窗口：由前端传入 `startDate`/`endDate`（自然周或业务周均可，后端不强制对齐周一）。
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功，body 含 code、report（buyers、repurchasedBuyers、repurchaseRate、startDate、endDate）
        '500': { description: 失败 }

  /admin/report/repurchase/monthly:
    get:
      tags: [数据报表, 运营后台]
      summary: 月复购率
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        **月复购率 = 本月购买≥2次的用户 ÷ 本月所有购买用户**。
        - 购买口径：仅统计 **已支付订单**（`transac_status=success`），按 `order_time`（下单创建时间）落在自然月内的订单计数。
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2000 }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: 成功，body 含 code、report（buyers、repurchasedBuyers、repurchaseRate、year、month）
        '500': { description: 失败 }

  /admin/report/repurchase/newCustomer:
    get:
      tags: [数据报表, 运营后台]
      summary: 新客复购率（首次购买后30天内复购）
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        **新客复购率 = 首次购买后 N 天内再次购买的用户 ÷ 当期新增用户数**（默认 N=30）。
        - 新增用户：其**首笔已支付订单**（`transac_status=success`）的 `order_time`（下单创建时间）落在 `[startDate, endDate]`。
        - 分子：上述新增用户中，存在另一笔已支付订单 `order_time` 满足 `order_time > 首购时间` 且 `order_time ≤ 首购时间 + N 天`。
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: windowDays
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
          description: 首购后观察窗口天数 N，默认 30
      responses:
        '200':
          description: 成功，body 含 code、report（newBuyers、repurchasedNewBuyers、repurchaseRate、startDate、endDate、windowDays）
        '500': { description: 失败 }

  /admin/report/dashboard:
    get:
      tags: [数据报表, 运营后台]
      summary: 运营看板汇总（复购率/注册/当天营业）
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        将以下指标合并为一次请求返回（不替换原接口，仅新增聚合接口）：
        - 复购率：周复购率、月复购率、新客复购率（规则与对应单独接口一致）
        - 注册人数：复用 UserMapper 统计口径，返回**近7天/本月/上月**注册人数
        - 当天**营业收入（实付净额）**：`todayRevenue` 与 `businessRevenueNet` 数值相同，按**当前活动营业班次 24 小时实时窗口 [D settle_time, D+1 settle_time)**、仅已支付且接单完成的订单，口径 `sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift`
        - **退款 / 优惠**：`totalRefundAmount` 为上述订单 **`refund_amount` 合计**；`totalDiscountAmount` 为 **`discount_amount` 合计**（均为正数展示）
        - **渠道实收**：`revenueByPayChannel` 为固定七类，按订单列 **`pay_amount_wechat`、`pay_amount_alipay`（结合 `payment_method` 拆分普通线上与 `wechat_qr`/`alipay_qr` 收款码）、`pay_amount_balance`、`pay_amount_cash`、`pay_amount_gift`** 分别汇总（用于混合支付与收款码拆账）
        - 当天未支付金额：按**当前活动营业班次实时窗口 [D settle_time, D+1 settle_time)**，仅未结账订单（unsettled），金额口径与待结账汇总一致：`sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift`
        - 当天订单数：按营业日口径，复用 /admin/order/todayCount 的统计方式（**含未结/已结**）；**`todayPaidOrderCount`** 仅为当前活动营业班次内 **success 已结**单数
        - **会员充值（成功）**：与活动营业班次 **`startTime`～`endTime`** 一致，按流水 **`pay_time`** 落在该区间且 **`status=success`** 汇总；**`todayMemberRechargeAmount`** 为 **`recharge_amount`** 合计（实付本金部分，不再含赠送额）；**`todayMemberRechargeTotal`** 为 **`total_amount`** 合计（入账总余额，含本金+赠送）；**`todayMemberRechargePrincipal`** / **`todayMemberRechargeGift`** 分别为 **`recharge_amount`** / **`gift_amount`** 合计；**`todayMemberRechargeSuccessCount`** 为笔数。有门店上下文（**`X-Shop-Id`** 或 **`shop_id`**）时仅统计 **`t_member_recharge.shop_id`** 等于该店的记录（与 **`GET /admin/member/recharge/list`** 默认门店过滤一致；**后台直充** `shop_id` 为 null 时**不计入**单店看板）

        默认窗口（settle_time=05:00 示例）：
        - 今日营业：实时数据严格取当前活动营业班次 24h 窗口。9.11 16:00 与 9.12 03:00 均取 `[9.11 05:00, 9.12 05:00)`；9.12 06:00 取 `[9.12 05:00, 9.13 05:00)`
        - 周复购率：本周（周一～周日）
        - 月复购率：本月
        - 新客复购率：本月 1 日～今日，windowDays 默认 30
        - 注册人数：近7天/本月/上月
      parameters:
        - name: shop_id
          in: query
          schema: { type: integer }
          description: 目标门店 ID（可选，默认优先取 X-Shop-Id）
        - name: shopId
          in: query
          schema: { type: integer }
          description: 目标门店 ID 驼峰别名（可选）
        - name: weekStartDate
          in: query
          schema: { type: string, format: date }
          description: 周复购率窗口开始日（可选，默认本周周一）
        - name: weekEndDate
          in: query
          schema: { type: string, format: date }
          description: 周复购率窗口结束日（可选，默认本周周日）
        - name: year
          in: query
          schema: { type: integer }
          description: 月复购率年份（可选，默认本年）
        - name: month
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
          description: 月复购率月份（可选，默认本月）
        - name: newCustomerStartDate
          in: query
          schema: { type: string, format: date }
          description: 新客复购率统计期开始日（可选，默认本月 1 日）
        - name: newCustomerEndDate
          in: query
          schema: { type: string, format: date }
          description: 新客复购率统计期结束日（可选，默认今日）
        - name: windowDays
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
          description: 新客复购观察窗口天数 N，默认 30
        - name: registerStartDate
          in: query
          schema: { type: string, format: date }
          description: 已废弃（保留兼容，不再生效）
        - name: registerEndDate
          in: query
          schema: { type: string, format: date }
          description: 已废弃（保留兼容，不再生效）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      weeklyRepurchase:
                        type: object
                        description: 周复购率 report（与 /admin/report/repurchase/weekly 一致）
                        properties:
                          startDate: { type: string, format: date }
                          endDate: { type: string, format: date }
                          buyers: { type: integer }
                          repurchasedBuyers: { type: integer }
                          repurchaseRate: { type: number, format: double }
                      monthlyRepurchase:
                        type: object
                        description: 月复购率 report（与 /admin/report/repurchase/monthly 一致）
                        properties:
                          year: { type: integer }
                          month: { type: integer }
                          buyers: { type: integer }
                          repurchasedBuyers: { type: integer }
                          repurchaseRate: { type: number, format: double }
                      newCustomerRepurchase:
                        type: object
                        description: 新客复购率 report（与 /admin/report/repurchase/newCustomer 一致）
                        properties:
                          startDate: { type: string, format: date }
                          endDate: { type: string, format: date }
                          windowDays: { type: integer }
                          newBuyers: { type: integer }
                          repurchasedNewBuyers: { type: integer }
                          repurchaseRate: { type: number, format: double }
                      register:
                        type: object
                        description: 注册人数（复用 UserMapper 口径）
                        properties:
                          sevenDaysRegisterCount: { type: integer, description: 近7天注册人数 }
                          thisMonthRegisterCount: { type: integer, description: 本月注册人数 }
                          lastMonthRegisterCount: { type: integer, description: 上月注册人数 }
                      businessDay:
                        type: object
                        description: 营业日统计（营业日窗口 [open_time, settle_time)，门店配置优先、默认 16:00～次日 04:00）
                        properties:
                          startTime: { type: string, format: date-time }
                          endTime: { type: string, format: date-time }
                          todayRevenue: { type: number, format: double, description: 当前营业日已结订单实付净额（营业收入），与 businessRevenueNet 相同 }
                          businessRevenueNet: { type: number, format: double, description: 实付净额，公式见接口说明 }
                          totalRefundAmount: { type: number, format: double, description: 当前营业日已结订单 refund_amount 合计 }
                          totalDiscountAmount: { type: number, format: double, description: 当前营业日已结订单 discount_amount 合计 }
                          todayPaidOrderCount: { type: integer, format: int64, description: 当前营业日已结 success 订单笔数 }
                          todayUnpaidAmount: { type: number, format: double }
                          todayUnpaidOrderCount: { type: integer, format: int64, description: 当前营业日待支付（unsettled）订单笔数，与 todayUnpaidAmount 同一查询口径 }
                          todayOrderCount: { type: integer, format: int64 }
                          todayMemberRechargeAmount: { type: number, format: double, description: 当前营业日成功充值 recharge_amount 合计（实付本金部分） }
                          todayMemberRechargeTotal: { type: number, format: double, description: 当前营业日成功充值 total_amount 合计（入账总余额，含本金+赠送） }
                          todayMemberRechargePrincipal: { type: number, format: double, description: 当前营业日成功充值 recharge_amount 合计（用户实付/本金部分） }
