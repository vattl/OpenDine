              type: object
              required: [openid, order_no]
              properties:
                openid: { type: string }
                order_no: { type: string }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /coupon/validateRule:
    post:
      tags: [优惠券]
      summary: 优惠券规则预校验（不占用券）
      description: |
        前端在下单前传入候选优惠券与订单上下文，后端按最新规则校验并返回结构化结果：
        - 是否可用（`valid`）
        - 适用金额（`eligible_amount`）
        - 优惠金额（`discount_amount`）
        - 应付金额（`payable_amount`）
        - 失败/通过原因（`reason`）
        本接口**不占用优惠券，不写 order_no，不核销**，仅用于预校验与前端展示。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponRuleValidateRequest'
            examples:
              valid_case:
                summary: 命中规则（可用）
                value:
                  openid: o_user_001
                  coupon_id: 10012
                  shop_id: 1
                  dineInOrTakeOut: 堂食
                  discount_amount: 8
                  goods_list:
                    - name: 羊肉串
                      quantity: "2"
                      total_price: 20
                    - name: 烤鸡翅
                      quantity: "1"
                      total_price: 18
              invalid_case:
                summary: 不满足门槛（不可用）
                value:
                  openid: o_user_001
                  coupon_id: 10012
                  shop_id: 1
                  dineInOrTakeOut: 堂食
                  goods_list:
                    - name: 可乐
                      quantity: "1"
                      total_price: 5
      responses:
        '200':
          description: 成功或规则不通过（均返回结构化 data，code=0/非0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CouponRuleValidateResult' }
              examples:
                pass:
                  summary: 校验通过
                  value:
                    code: 0
                    msg: 校验通过
                    data:
                      valid: true
                      coupon_id: 10012
                      coupon_template_id: 3001
                      coupon_type: full_reduction
                      eligible_amount: 38
                      total_amount: 38
                      min_amount: 30
                      discount_amount: 8
                      payable_amount: 30
                      reason: 校验通过
                reject:
                  summary: 校验不通过（门槛不足）
                  value:
                    code: 1
                    msg: 适用菜品金额未达到优惠券使用门槛（最低需消费30.0元）
                    data:
                      valid: false
                      coupon_id: 10012
                      coupon_template_id: 3001
                      coupon_type: full_reduction
                      eligible_amount: 5
                      total_amount: 5
                      min_amount: 30
                      discount_amount: 0
                      payable_amount: 5
                      reason: 适用菜品金额未达到优惠券使用门槛（最低需消费30.0元）
        '500':
          description: 系统异常

