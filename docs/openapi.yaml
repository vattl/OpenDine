openapi: 3.0.3
info:
  title: 微信小程序点餐系统 API
  description: |
    - **v1.2.338（全系统接口权限深度审计与 POS 别名及飞鹅云安全加固，WI-080）**：
      - **飞鹅云打印鉴权加固**：在 SysInterceptor 中将 /api/feieyun/ 正式纳入鉴权判定，杜绝未携带有效 JWT 越权调用打印机的高危安全漏洞。
      - **通知运维与监控端点补全**：/admin/notifications/channel-stats、/cashier/notifications/channel-stats、/admin/notifications/test-push、/cashier/notifications/test-push、/admin/notifications/cleanup 补齐权限映射。
      - **移动/桌面 POS 写操作别名补全**：补全 /api/pos/** 下快捷开单、加菜、退款、改价、打折、结账、挂单等 34 个操作别名路径的权限映射与 Flyway V055 同步。
    - **v1.2.338（移除修改订单商户 ID 接口，收口商户自动路由）**：
      - **彻底下线手动切商户接口**：完全移除 `POST /admin/order/changeId` 接口及其权限映射与审计埋点。订单商户归属完全由系统依据门店商户策略及多条件路由规则链（WI-036 / WI-030）自动仲裁判定，禁止任何人工越权篡改，保障不可变支付台账与财务结算严密一致。
    - **v1.2.337（微信订阅消息后端可控与配额台账体系，WI-079）**：
      - **订阅决策收口服务端与智能静默**：`GET /api/v1/subscribe/prompt-decision` 由后端根据配额台账智能判断是否需要弹窗（`need_prompt`），在有剩余配额或用户永久拒收时零弹窗打扰。
      - **配额台账管理与授权回传**：`POST /api/v1/subscribe/report`、`GET /api/v1/subscribe/quota`，记录 `(openid, template_id)` 维度的剩余配额与授权记录，原子并发安全。
      - **业务出餐核销与 43101 错误自愈**：KDS 划菜整单出餐完成自动联动微信取餐通知下发并核销配额，遇到微信 `43101`（配额耗尽/拒收）时触发原子归零自愈与流水审计（`t_subscribe_send_log`）。
      - **管理后台配置与审计**：提供 `/admin/subscribe/scenes`、`/admin/subscribe/scenes/{id}` 维护场景映射与模板 ID，提供 `/admin/subscribe/logs` 查询投递流水。
    - **v1.2.337（财务工作台一键直达税局门户与门店地址精准导航，WI-077）**：
      - **国家规范电子税务局权威智能匹配**：新增 `TaxBureauResolver`，覆盖国家税务总局全国统一规范电子税务局总入口及全国 36 个省级/计划单列市官方电子税务局门户。优先匹配深圳、大连、青岛、宁波、厦门等计划单列市直属局，覆盖各省与核心地级市行政区划识别，地址为空或未识别时安全回退全国总平台。
      - **发票分页与门店摘要全域透出**：`/admin/order/invoice/list`（`/admin/order/invoice/page`）发票明细增强返回 `shop_address`（门店登记地址）、`tax_bureau_name`（所属国家官方电子税务局全称）、`tax_bureau_url`（开票门户 URL）；管理员登录 `/adminLogin` 的门店摘要同步增强返回 `address`、`taxBureauName`、`taxBureauUrl`。
      - **财务工作台一键直达与资料一键复制**：静态工作台页面（`/invoice/admin.html`）提供顶部一键打开税局、行内「🏛️ 税局开票」直达、全部门店税局清单导航抽屉，以及开票弹窗中销方税局直达与「📋 一键复制开票资料」工具，助力财务白天快速录入税局完成开具。
    - **v1.2.336（KDS 划菜整单完成外卖订单自动叫骑手联动，WI-076）**：
      - **后厨出餐与骑手履约自动化联动**：KDS 厨房显示系统中，整单菜品制作与划菜出餐完成（KdsOrderStatus.ALL_DONE / 40）并提交事务后，系统自动识别订单就餐方式。对于外卖订单（dine_in_or_take_out == '外卖'），自动调用聚合配送服务（真省钱/ZSQ）叫骑手派单，实现出品与配送无缝串联。
      - **三层幂等与并发防重**：严格校验外卖配送单状态。若订单已在配送中（dispatched / delivering / completed）或发起中（pending），自动跳过呼叫，杜绝重复向配送服务商发起呼叫或产生多次计费。
      - **异常隔离与弹性保护**：外部配送平台网络超时或余额不足时，异常被内部捕获降级并记录告警日志，绝不阻断或影响 KDS 划菜出餐的核心业务流程。
    - **v1.2.335（全量接口权限审计与细粒度权限码补全，WI-072）**：
      - **全系统接口权限审计与 100% 覆盖**：完成系统全部 620 个 Controller 端点全面审计，补全全部 90+ 个遗漏接口的接口-权限映射（`ApiPermissionMapping.java`、数据库 `t_api_permission` 及 `docs/init_api_permission.sql`）。彻底消灭所有未登记权限导致的 403 `接口权限未配置` 隐患。
      - **细粒度权限分类（Fine-Grained Permissions）**：按业务模块细化权限控制颗粒度，新增并登记 `dish:manage:combo`（套餐管理）、`order:invoice:create`（发票开具）、`order:invoice:view`（发票查询）、`daily:view`（日结查看）、`reconciliation:view` / `reconciliation:operate`（对账查看/操作）、`inventory:view` / `inventory:manage`（高级库存查看/管理）、`marketing:firstorder:view` / `marketing:firstorder:manage`（营销首单活动查看/管理）、`notifications:view` / `notifications:manage`（通知规则查看/管理）、`settings:view` / `settings:manage`（系统设置查看/管理）、`report:export`（报表导出）、`log:archive` / `log:export`（日志归档/导出）等细粒度权限。
      - **向后完全兼容机制**：接口映射全面支持多权限候选语法（`coarse:perm|fine:perm`），确保已有分配粗粒度权限的角色（超级管理员、店长、收银员等）无缝承载业务能力，新角色具备按最小特权原则精细化赋权能力。
      - **公共端点规范放行**：`WebAppConfigurer.java` 显式放行 `/config/contact`、`/config/subscribe-templates`、`/config/app`、`/help/**` 等 C 端公共配置与帮助 FAQ 端点，`SysInterceptor.java` 严密收口历史 `/activity/getAllPopup` 等后台接口。
      - **数据库增量迁移**：Flyway `V049__api_permission_granularity_and_audit.sql` 自动同步 `t_permission` 字典与 `t_api_permission` 映射，并幂等回填管理角色。
    - **v1.2.323（KDS 菜品制作状态生命周期审计与出餐取餐自动通知）**：
      - **状态生命周期审计纠偏**：菜品在待传菜（`ready_serve`）期间属于在制状态（`kds_item_status=1`，`kds_status_text="待传菜"`），绝不属于已出餐；只有划菜完成（`served_quantity >= line_quantity`）进入已完成（`done`）后才确认为已出餐（`kds_item_status=2`，`kds_status_text="已完成"`）。修正 `syncTicketAggregates` 在烹饪完成时过早将 `item_status` 置为 2 的历史问题，保障 C 端与收银端状态严格一致。
      - **整单完成自动通知客户取餐**：当订单全部菜品出餐完成（`kds_order_status == ALL_DONE`）时，系统自动联动 `t_order.notice=1`（具备幂等防重保障），并通过 `/ws/menu` 广播 `meal_pickup_ready` 事件至点餐小程序、广播 `order_notice` 至收银/KDS，若顾客包含微信授权则自动下发微信取餐通知订阅消息。
    - **v1.2.322（订单与账单时间范围支持年月日纯日期及门店日结时间自动补全）**：`GET /cashier/order/today` 与 `GET /cashier/order/search`（以及后台订单 `POST /admin/order/list`、`POST /admin/takeout/order/list`）的 `startTime/endTime` 时间参数全面支持纯日期（支持 `yyyy/MM/dd`、`yyyy-MM-dd`、`yyyy.MM.dd`、`yyyyMMdd`）。当传入年月日纯日期时，后端自动依据当前门店的日结时间 `settle_time`（默认 04:00）补全时分秒，起始时间对齐 `startDate settle_time`，结束时间对齐 `(endDate + 1日) settle_time`，传同一天即完整覆盖该营业日 24 小时经营周期，同时精确保留客户端显式指定的自定义时分秒。
    - **v1.2.321（订单表当班收银员ID与账单收银员姓名工号，WI-069）**：Flyway V046 为 `t_order` 增加 `cashier_id` INT(11) DEFAULT NULL 记录当班收银员 ID。收银建单（`POST /cashier/order/quickOrder`）与结账（`POST /cashier/order/checkout`、`POST /admin/order/checkout`）全链路自动绑定当前收银员。账单与订单接口（`GET /cashier/order/today`、`GET /cashier/order/search`、`POST /admin/order/list`、`GET /admin/orderDetail/list`）在返回订单数据时结构化填充 `cashier_id`、`cashier_name`（真实姓名）、`cashier_work_no`（工号）及复合文案 `cashier_display_name`/`display_name`，确保前端收银账单中心兼顾人名与工号展示。
    - **v1.2.320（日结严格时序与历史补结，WI-067）**：门店存在日结历史后，`GET /admin/daily/pre-check`、`POST /admin/daily/settle` 与超时外卖作废统一锁定最早缺失或 `REOPENED` 营业日，禁止跨日跳结并返回 HTTP 409 `DAILY_CLOSE_OUT_OF_SEQUENCE`；预检新增当前营业日、下一待结日、待结天数和前序欠结标记。钱箱阻断与财务水位按目标营业窗口隔离。日结重开仅允许最后一个快照营业日，历史重开返回 HTTP 409 `DAILY_REOPEN_OUT_OF_SEQUENCE`；重新日结复用原快照行。
    - **v1.2.319（AI智能配餐与点餐服务落地，WI-065）**：落地深圳烧烤店智能配餐与点餐场景协议。包含真实门店菜单与菜品画像扩展（`GET /api/v1/ai/stores/{storeId}/menu-snapshot`，带防漂移 SHA-256 menu_version）、多人协同会话管理（`POST /api/v1/ai/sessions`、`PUT /api/v1/ai/sessions/{sessionId}`，带 expected_revision 乐观锁并发控制）、两阶段确定性分层规划求解器（`POST /api/v1/ai/sessions/{sessionId}/solve`，硬约束满足与多目标排序，支持对偶松弛与降级建议）、多轮补丁微调（`POST /api/v1/ai/sessions/{sessionId}/plans/{planId}/adjust`）、草稿创建与二次校价校库（`POST /api/v1/ai/drafts`）、用户确认强幂等落单（`POST /api/v1/ai/orders/submit`，出餐归属单一云端真源），以及 7 大标准远程 MCP 工具（`GET /mcp/v1/tools`、`POST /mcp/v1/tools/{toolName}`）。
    - **v1.2.318（订单写入版本前置校验第一批，WI-064）**：`POST /order/addDishes`、`POST /cashier/order/addDishes|refundDish|updatePrice|discount` 新增可选 `expectedVersion`（兼容 `expected_version`）。传入版本与当前 `t_order.revision` 不一致时返回 HTTP 409 / `error_code=ORDER_VERSION_CONFLICT` 及最新订单摘要，且不会消费审批令牌或执行写入；成功写入后订单 revision 原子递增并在响应中返回。省略版本保持旧客户端兼容，但成功写入同样推进 revision。KDS POS 加菜复用业务写入口，不重复推进订单版本。
    - **v1.2.317（高风险订单动作权限迁移，WI-063）**：收银退款/退菜、改价/赠送、优惠、反结账及运营微信退款统一接入动作级 `ALLOW|REQUIRE_APPROVAL|DENY` 决策门面；HTTP 入口权限保持兼容，业务执行分别要求 `order:operate:refund|changePrice|discount|reopen`。无 execute 权限返回 `code=40322` 与结构化审批需求；`approvalToken` 严格绑定核销，兼容现场账号密码会签发 bindingVersion=2 单次令牌并立即通过同一决策器核销。V042 从内置 cashier 移除动作执行/审批权限并为明确管理角色回填，防止单动作权限横向扩散。
    - **v1.2.316（权限三态决策与数据库映射单一权威，WI-062-AUTH）**：`POST /admin/access/evaluate` 对有无 `context` 的请求统一使用 `AccessDecisionService`，响应新增互斥三态 `outcome=ALLOW|REQUIRE_APPROVAL|DENY` 并保留旧布尔字段；首批冻结退款、改价、优惠、反结账的入口/执行/审批权限词汇，普通收银可发起精确审批但不能直接执行。`t_api_permission` 成为唯一运行时接口权限映射权威，数据库未命中时失败关闭，不再静默使用 `ApiPermissionMapping` 放行；V041 同步完整审计清单。
    - **v1.2.333（会员注册统一默认昵称与资料修改规范，WI-071）**：会员注册首次统一赋予默认昵称「老肥吃货+id号」，老用户二次登录与手机号绑定绝不覆盖已有昵称；/order/updateUser 与 /order/updateAvatar 支持修改昵称，/order/getUserInfo 补充返回 nickname。
    - **v1.2.332（套餐门店隔离与防覆盖缺陷修复，WI-070）**：为 t_combo 引入 shop_id 与复合唯一索引 uk_combo_dish_shop，实现多门店隔离保存套餐子项与可选分组；支持特定门店优先匹配与总部模板（shop_id = 0）平滑回退继承；AdminComboController 接入 AdminShopScopeGuard 拦截跨店越权保存。
    - **v1.2.315（桌台页面前后端交互协调规范落地，WI-062）**：配套 UI061 黑白极简工业风桌台概览落地。Flyway V039 为 `t_table` 增加 `area_code`（区域编码）与 `area_name`（区域名称）分区字段及复合索引。暴露 `GET /api/pos/table-areas` 区域字典接口；暴露 `PUT /api/pos/orders/{orderNo}/diners` 就餐人数动态调整接口，实现茶位费/餐具费自动补退计算与收银副屏/KDS WebSocket 实时同步；暴露 `POST /api/pos/tables/batch-clear` 批量原子清台接口，单一事务内完成桌台归位与结账订单关单，记录翻台日志；暴露 `GET /api/pos/tables/pulse` 实时经营脉搏指标接口（统一开台率、在席总额、待翻台数计算口径）。
    - **v1.2.313（门店商户多条件可编辑路由规则模块，WI-036）**：新增可视化、多维度商户分流路由规则链（`t_payment_routing_rule`，Flyway V035）。支持就餐方式（自提/打包/堂食等）、实付金额区间（`minPaidYuan`/`maxPaidYuan`）、菜品/分类明细（`goodsNameKeywords` 如三文鱼、`categoryIds`、`goodsIds`，匹配模式 `CONTAINS_ANY`/`CONTAINS_ALL`/`ONLY`）及下单时段的多维度组合判定（`ALL` 且 / `ANY` 或）。暴露 `GET/POST/PUT/DELETE /admin/payment/routing-rules`、`PUT /admin/payment/routing-rules/sort`（优先级拖拽批量重排）及 `POST /admin/payment/routing-rules/simulate`（规则试算模拟器）。路由结果前置校验 `isMerchantPayReady` 全量就绪性，损坏时平滑降级至主商户 `default`，兼具灵活性与资金安全兜底。
    - **v1.2.311（多门店多商户支付绑定加固，WI-030）**：新支付商户完全由服务端按订单门店、门店商户策略与路由规则决定，不再使用客户端 `merchantId` 作为无规则回退；JSAPI、Native、MICROPAY 及退款复用交易创建时固化的商户配置 ID/版本，并校验其仍属于订单门店或全局模板。支付成功通知强制校验 `mchid/appid`；退款成功通知仅接受已登记的 `out_refund_no`，并严格匹配门店、订单、金额、原微信 `transaction_id`、`mchid` 与商户配置版本。Flyway V033 增加退款商户绑定、回调序列号索引和全局唯一订单号约束；部署前须先清理重复 `t_order.order_no`，否则迁移按资金安全原则中止。
    - **v1.2.309（客户端版本管理安装更新包上传，WI-032）**：新增 `POST /admin/app/version/upload`（限 `admin:super`）。支持管理后台直接上传客户端安装包（`.exe`/`.apk`/`.zip` 等），服务端自动完成落盘归档、流式 SHA-256 签名计算、文件大小提取、包类型推断与公网下载直链生成；支持 HTTP 206 断点续传，放宽上传限制至 500MB。
    - **v1.2.308（收银挂单与厨房等叫业务完善与商用优化，WI-031）**：
      - **厨房 KDS 等叫/起菜安全加固**：`POST /kds/workflow/hold` 与 `/release` 增加明细订单归属门店强校验，杜绝跨门店横向越权操作；前置拦截已退菜品与已出餐完成菜品的错误等叫。
      - **前台收银挂单/取单商用闭环**：`t_order` 扩充 `hang_status/hang_time/hang_reason/hang_admin_id`（Flyway V032）。`POST /cashier/order/hang` 实现真实持久化、门店隔离与审计追踪；新增 `POST /cashier/order/unhang`（取单）与 `GET /cashier/order/hang-list`（挂单池查询）；结账与取消生命周期自动联动清除挂单标记。
    - **v1.2.307（营业日结报告新增会员多店数据隔离，WI-030）**：`GET /admin/report/daily?detail=true` 的会员维度（`report.member.newMembers`）新增多门店隔离防线。针对平台用户表 `t_user` 无直接门店外键的架构，自动按门店上下文构建与 `t_order`（下单/代付）、`t_member_recharge`（充值）和 `t_shop_member_wallet`（分店钱包）的存在性关联子查询，彻底杜绝其他门店新注册绑手机会员混入分店日报；总店保留未分配历史兼容，总部全局聚合视角透明穿透。
