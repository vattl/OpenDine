        - name: dining
          in: query
          schema:
            type: string
            enum: [all, dine_in, takeout, pack]
            default: all
        - name: view
          in: query
          schema:
            type: string
            enum: [dish, order, table]
            default: dish
        - name: extra
          in: query
          schema: { type: string, description: '如 overdue,rush,add_dish,hold' }
      responses:
        '200':
          description: '`code=0`，见 **KdsOverviewBoardResponse**'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 0 }
                  - { $ref: '#/components/schemas/KdsOverviewBoardResponse' }

