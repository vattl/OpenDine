    本系统为**多端架构**：**小程序前端**（miniprogram）、**运营后台前端**（admin_panel）与**共用后端**（server）。
    - **运营后台同样区分前后端**：运营后台前端（admin_panel）调用共用后端（server）的 B 端接口（如 /admin/*、/adminLogin）。
    - 本规范与现有后端控制器及两套前端对齐；所有接口除支付回调等特殊场景外，统一响应格式（code/msg 及业务字段）。
    - **KDS 持久化**：设备 workflows 保存数据库；收银 WebSocket 支持每5秒游标补发，客户端必须幂等处理。
    - **金额计算**：支付结算采用十进制 HALF_UP 分位舍入；整数分转换检查溢出，既有数值字段类型不变。
    - **图片限制**：头像验证 JPEG/PNG 并重编码 PNG（5 MiB/800万像素）；图片访问限制 10 MiB，缩放限制1600万像素。
    - **异常响应**：全局数据库及未分类错误返回稳定提示与 traceId，内部错误不透出。
    - **请求大小**：JSON 请求体默认上限 1048576 字节，超限返回 HTTP 413（包含分块请求）；由 app.http.max-json-bytes 配置。
    - **C 端接口**：`POST /order/getOpenid` 用微信 code 返回 `openid`、`user_token`、`expires_in`；推荐在 **`X-User-Token`** 携带该 Token，有 Token 时请求 openid 必须一致。S01 按用户要求保留：兼容开关有效期间，精确白名单允许旧版通过 openid 请求（包含余额支付）；关闭或到期后要求 Token。显式公开接口及回调除外。
    - **B 端接口**：供运营后台前端调用；需在请求头携带 **Authorization: Bearer &lt;JWT&gt;**；各接口按**权限码**控制可见与可操作，详见 **docs/权限设计.md**（角色、权限码、接口-权限映射）。
    - **数据库与 Schema 对齐**：核心数据模型以 **docs/db_diancan.sql** 为准；增量模块表以对应 `docs/db_migration_*.sql` 为权威补充。KDS authority/replication 表以 **docs/db_migration_kds_cashier_replication.sql** 与 **docs/db_migration_kds_authority_v2.sql** 为准；权限相关表见 **docs/db_diancan.sql** 与 **docs/init_api_permission.sql**。
    - **定位坐标系约定（强制）**：系统**入库、业务出参、距离计算、地图展示**统一使用 **GCJ-02**。地址、门店、预览和真省钱下单接口可通过 **`coordinate_type`**（或接口定义的对应字段）声明输入为 `gcj02`、`wgs84`、`bd09`，服务端校验坐标对并统一转换；未声明时为兼容旧客户端按 `gcj02` 处理。调用真省钱时在出站边界转换为其 `coordinateType=1` 使用的 **BD-09**，第三方轨迹返回后再转换为 GCJ-02 并计算 ETA。详见 **`components/schemas/CoordinateConvention`**。
    - **连锁多店（小程序选店）**：三端分离（小程序 / 后台 / 共用后端）任务包与协作规范见 **docs/backend_chain_store_api.md**（v2）；库表增量见 **docs/db_diancan_chain_store_patch.sql**、**docs/db_chain_store_design.md**。功能级开发总览见 **docs/functional_development_chain_store.md**。
    - **收银系统升级**：在保持已有接口与数据库不变的前提下，扩展多门店、收银机、库存成本、会员营销、外卖对接、日结对账、数据报表、操作日志等模块，见 **docs/收银系统升级-架构与接口设计.md** 与 **docs/db_diancan_cashier_ext.sql**；扩展接口路径以 /admin/shop、/admin/payment-method、/cashier/*、/admin/daily、/admin/material、/admin/report、/admin/log 等为前缀。
    - **实时推送（WebSocket `/ws/menu`）**：小程序可连接 **`wss://&lt;host&gt;/ws/menu`**（本地可用 **`ws://&lt;host&gt;/ws/menu`**）。服务端向已连接客户端下发 **UTF-8 JSON 文本帧**，统一含 **`ts`**（毫秒时间戳）。**`type` 取值**：① **`dish_catalog_changed`**（菜品库变更）——在 **`POST /admin/dish/save`**、**`POST /admin/dish/updateOnSale`**、**`POST /admin/dish/updateSaleStatus`**、**`GET /admin/dish/delete`**、**`POST /admin/dish/sort`** 成功后，以及订单侧**库存扣至 0 同步 `sold_out`（不改 `onsale`）**（`action` 多为 **`stock_sold_out`**）、**取消订单回退库存后同步 `sold_out`（不改 `onsale`）**（多为 **`stock_restored`**）时；载荷含 `action`、`dishId`、`dishName`、`onsale` 等，客户端宜 **重拉 `GET /dish/listAll`**（或当前使用的菜单接口）。② **`business_changed`**（营业开关）——在 **`POST /order/ChangeBusiness`** 成功后；含 **`business`**（boolean，`true` 表示营业中）、**`shopId`**（变更的门店，客户端宜仅匹配当前店时刷新）。③ **`auto_accept_changed`**（自动接单开关）——在 **`POST /admin/order/auto-accept`** 成功切换后；含 **`enabled`**（boolean）。④ **`takeout_dispatch_alert`**（外卖配送异常）——真省钱骑手/平台取消配送或远端配送订单不存在/已删除时触发；含 **`alertType`**（`rider_cancelled` 或 `order_missing`）、**`shopId`**、**`orderId`**、**`orderNo`**、**`message`**、**`zsqOpenOrderId`**。`order_missing` 同时写入 **`t_operation_log.action=zsq_order_missing`**，运营端应提示并允许调用重发接口。小程序需配置 **socket 合法域名**；Nginx 需转发 **`Upgrade`、`Connection`**。路径 **`/ws/**`** 不参与 B 端 JWT。
    - **真省钱远端订单删除感知**：业务追踪或定时同步确认真省钱订单不存在/已删除时，本地立即置 **`dispatch_status=dispatch_failed`**、**`zsq_dispatch_status=order_missing`**、**`zsq_phase=ORDER_MISSING`**，清除失效真省钱单号并推送 **`takeout_dispatch_alert(alertType=order_missing)`**。运营追踪响应返回 **`code=4091`**、**`canRedispatch=true`**，可调用 **`POST /admin/takeout/delivery/zsq/redispatch`** 重新创建订单并发配送。
    - **真省钱重叫骑手复用订单**：调用 **`POST /admin/takeout/delivery/zsq/redispatch`** 时，只要原 **`zsq_open_order_id`** 仍存在，就沿用原真省钱订单并重新询价/发配送，仅清空上一轮配送单号、渠道结果、取消信息和骑手快照；只有远端订单确认不存在/已删除或本地没有 openOrderId 时才重新创建真省钱订单，避免堆积异常订单。
    - **新配送轨迹初始化**：首次发配送或重新发配送进入 **`zsq_dispatch_status=pending`** 前，服务端会清空上一配送单的 `zsq_phase`、`zsq_delivery_send_status`、骑手姓名/电话/经纬度/更新时间；新订单尚未分配骑手时，追踪接口不得返回历史骑手定位。
    - **订单明细合规校验**：**`POST /order/create`**、**`POST /order/addDishes`** 在落库前对 **`goods_list` 每一行**校验：① 菜名须在 **`t_dish`** 中存在（支持菜名 trim、去空格后与库名匹配）；② 当前门店 **`onsale=true`**（已下架拒绝，存储于 **`t_dish_shop.onsale_override`**）；③ 当前门店 **`sold_out` 不为 1**（已售罄拒绝，存储于 **`t_dish_shop.sold_out`**）；④ **`unit`、`cid`、`quantity`、`total_price` 均必填**（此处的 **`quantity` 指订单行上的购买份数**，非菜品表字段）；⑤ **`total_price` 必须大于 0**（**套餐子行 `combo_component` 落库价为 0，不参与本项**）；⑥ 普通行 **`total_price`** 须与库内该菜 **`unitprice × 数量`** 一致（±0.02 元）；**套餐请求行**（传 **`combo_id`**）由服务端按 **`t_combo`** 规则算价后与 **`total_price`** 比对（±0.02 元），并展开为头行+子行；⑦ 菜品 **`unitprice`** 在库中不可为空（套餐头菜须有门店/总部价）；⑧ **有限库存**：对启用库存的菜品，本单内相同菜品（按 `t_dish.id`）**合并行数量**后校验/扣减；**`combo_header` 不参与库存扣减**，子菜 **`combo_component`** 按子菜名合并扣减。不满足时接口返回 **code 非 0**，**`msg`** 为可读错误原因。**`goods_list` 不能为空**（创建订单）。
    - **门店库存（返回字段 `stock`）与下单/取消**：可售库存使用当前门店 **`t_dish_shop.stock`**，返回给前端仍叫 **`Dish.stock`**，**不再使用 `t_dish.quantity` 参与扣减**（`quantity` 仍为历史「商品数量」字段，可与库存无关）。在上述明细校验之后，后端对**启用有限库存**的菜品按**本单内相同菜品（按 `t_dish.id`）合并行数量**再校验剩余 **`stock`**；主表与明细**写入成功后**用 **`stock ≥ 扣减数`** 条件**原子扣减 `t_dish_shop.stock`**，减少并发超卖。规则摘要：**`stock` 为 `null` 或 `&lt;0`** → 不启用有限库存（不校验、不扣减、取消时不回退）。**`stock &gt; 0` 且在售** → 参与校验与扣减。**`stock==0` 且 `onsale=true`** → 视为「未启用库存」兼容，**不参与**扣减。扣减后若 **`stock≤0`** → 同步当前门店 **`sold_out=1`**（**不**修改 **`onsale`**），并推送 **`dish_catalog_changed`**（`action≈stock_sold_out`）。**`POST /order/cancel`** 将 **`transac_status`** 从 **`unsettled`** 置为 **`cancelled`** 成功后，按订单明细**回退 `stock`**；回退后按当前门店库存同步 **`sold_out`**（如 **`stock&gt;0`** 则 **`sold_out=0`**），并推送（`action≈stock_restored`）（**不**因回退库存而修改 **`onsale`**）。**`POST /order/create`**、**`POST /order/addDishes`**、**`POST /order/cancel`** 对订单数据与库存变更处于**同一事务**，任一步失败则整段回滚。运营端若要对某道菜做限量，请在后台维护当前门店 **`stock` 为大于 0**。**已有数据库**请执行 **`docs/db_migration_dish_shop_sold_out.sql`** 增加门店售罄列。
