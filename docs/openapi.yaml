        '500':
          description: 失败

  /admin/order/checkout:
    post:
      tags: [运营后台]
      summary: 结账（更新订单结账状态）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        `transac_status=success` 时委托统一收银结算服务，在门店范围内锁定订单，并按“收敛活动 JSAPI 交易 → 写入/精确核验权威支付流水 → 更新订单、优惠券和桌台”的顺序原子提交；流水失败、已有另一笔成功资金事实或渠道/金额冲突时整体回滚。堂食并台多单时，结清其中一单后若同桌仍有未结订单，桌台保持 status=1，order_no 修复为剩余订单且 amount 为剩余合计；仅最后一单结清后进入 status=2 待清台。若订单关联了优惠券（t_user_coupon.order_no=订单号），则将该优惠券核销为已使用（status=1，use_time 置为当前时间）。
        success 时按应付净额写入各 `pay_amount_*` 渠道列：默认同 `payment_method` 文案落单一渠道；可选 **`cash_amount`**（或 `cashAmount` 等别名）为**现金实收部分（元）**，剩余净额再按 `payment_method` 主渠道入账（如微信+现金组合）。也可直接传正数 **`pay_amount_cash`** 表示现金部分（与 `cash_amount` 二选一，优先 `cash_amount`）。现金实收不得超过应付净额。
        **统一渠道**：`payment_method` 推荐传稳定 code：线上 `online_wechat`、`online_alipay`、`online_balance`、`online_combined`；线下 `offline_wechat_qr`、`offline_alipay_qr`。后端兼容旧 code/中文名并统一写入中文 `payment_method`。组合支付须传 `pay_amount_wechat/pay_amount_alipay/pay_amount_balance` 中至少两项，分合计须等于应付净额。
        **找零（收大钞）**：客人付现可大于现金实收。传 **`checkout_cash_tender`**（或 `cash_tender`/`cashTender`，客人付现，如 100）与 **`checkout_change_channel`**（或 `change_channel`，`wechat`/`cash`/`alipay`/`微信`/`现金`/`支付宝`）；也可显式传 **`checkout_change_amount`**（须与付现−现金实收一致）。例：应付 70、付现 100、找零 30 经微信——`payment_method=现金`，`checkout_cash_tender=100`，`checkout_change_channel=wechat`；落库 `pay_amount_cash=70`，`checkout_change_amount=30`。找零不计入营业额。
        成功响应含 **`payableYuan`**、规范中文 **`payment_method`**、**`payment_channel_code`**、**`payment_channel_type`**；找零时另含 **`checkoutCashTender`**、**`checkoutChangeAmount`**、**`checkoutChangeChannel`**、**`checkoutChangeChannelLabel`**。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, transac_status]
              properties:
                id: { type: integer, description: '订单主键（t_order.id）' }
                transac_status: { type: string, enum: [success, unsettled, cancelled], description: '结账状态，与 t_order 表一致' }
                pay_time: { type: string, format: date-time, description: '支付时间，结账时可传' }
                payment_method:
                  type: string
                  description: '支付渠道 code（推荐）或兼容中文名'
                  example: offline_wechat_qr
                pay_amount_wechat: { type: number, description: '组合支付时的微信部分（元）' }
                pay_amount_alipay: { type: number, description: '组合支付时的支付宝部分（元）' }
                pay_amount_balance: { type: number, description: '组合支付时的余额部分（元）' }
                cash_amount: { type: number, description: '可选，success 时现金实收部分（元），与 payment_method 主渠道拆账；不超过应付净额' }
                pay_amount_cash: { type: number, description: '可选，与 cash_amount 同义：正数时表示现金实收部分（元）；未传 cash_amount 时生效' }
                checkout_cash_tender: { type: number, description: '可选，客人付现金额（元），可大于 cash_amount/pay_amount_cash' }
                cash_tender: { type: number, description: '同 checkout_cash_tender' }
                checkout_change_amount: { type: number, description: '可选，找零金额（元）；未传时由 checkout_cash_tender − 现金实收 计算' }
                change_amount: { type: number, description: '同 checkout_change_amount' }
                checkout_change_channel: { type: string, enum: [wechat, cash, alipay], description: '找零渠道；找零>0 时必填' }
                change_channel: { type: string, description: '同 checkout_change_channel，亦支持中文：微信/现金/支付宝' }
                dineInOrTakeOut: { type: string, description: '堂食/打包，堂食时需传 table_number 以更新桌台' }
                table_number: { type: string, description: '桌号，堂食时必传' }
                force: { type: boolean, description: '是否强制结账（需要 admin:manage 权限），放行收款意向冲突并收敛所有意向' }
                approvalToken: { type: string, description: '店长审批令牌（用于普通收银员授权调用强制结账）' }
      responses:
        '200':
          description: 成功
        '403':
          description: 无权限（缺少 admin:manage 权限）
        '500':
          description: 失败

  /admin/order/force-checkout:
    post:
      tags: [运营后台]
      summary: 强制结账（需要 admin:manage 权限）
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      description: |
        强制结账专用接口，效果等价于 `POST /admin/order/checkout` 且 `force=true`。
        当订单存在其他收款会话已确认或意向冲突导致常规结账被阻断时，具备 `admin:manage` 权限的管理员可直接调用本接口强制放行，
        在结账落库成功后原子收敛该订单名下的全部收款意向（标记为 COMPLETED），记录特权安全审计日志并返回 `forced: true`。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, transac_status]
              properties:
                id: { type: integer, description: '订单主键（t_order.id）' }
                transac_status: { type: string, enum: [success, unsettled, cancelled], description: '结账状态' }
                pay_time: { type: string, format: date-time, description: '支付时间' }
                payment_method: { type: string, description: '支付渠道 code 或业务中文名' }
                pay_amount_wechat: { type: number, description: '组合支付微信部分' }
                pay_amount_alipay: { type: number, description: '组合支付支付宝部分' }
                pay_amount_balance: { type: number, description: '组合支付余额部分' }
                cash_amount: { type: number, description: '现金实收部分' }
                pay_amount_cash: { type: number, description: '现金实收部分' }
                checkout_cash_tender: { type: number, description: '客人付现金额' }
                checkout_change_amount: { type: number, description: '找零金额' }
                checkout_change_channel: { type: string, enum: [wechat, cash, alipay] }
                dineInOrTakeOut: { type: string, description: '堂食/打包' }
                table_number: { type: string, description: '桌号' }
                approvalToken: { type: string, description: '可选，店长审批令牌' }
      responses:
        '200':
          description: '强制结账成功（body 含 forced: true, payableYuan 等）'
        '403':
          description: 权限不足（缺少 admin:manage）
        '500':
          description: 失败

  /admin/order/reassignOpenidByPhone:
    post:
      tags: [运营后台]
      summary: 按手机号更换待结账订单的下单用户（openid）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        仅 `transac_status=unsettled` 的订单可调用。通过 `IUserService.getUserByPhone` 解析用户；
        用户不存在或未绑定 openid 时返回明确错误。成功时写入 `openid`，并清空 `prepay_id`、`pay_openid`。
        若订单已是该用户的 openid，返回成功且 `msg` 为「无需更换」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, phone]
              properties:
                id: { type: integer, description: '订单主键 t_order.id' }
                phone: { type: string, description: '手机号（可与 mobile 同义，归一化规则见 getUserByPhone）' }
                mobile: { type: string, description: '同 phone' }
                orderId: { type: integer, description: '同 id' }
      responses:
        '200':
          description: 成功，code=0；失败时 code 非 0
        '500':
          description: 失败

  /admin/order/refund:
    post:
      tags: [运营后台]
      summary: 微信退款（商户 API v3）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        对已支付订单发起退款：**若 `transaction_id` 以 `BAL_` 开头（余额支付占位单号）**，或为含余额分项的收银组合支付，则**不向微信发起余额部分退款**，在事务内锁定订单，按剩余本金/赠送金实际扣款分别退回会员钱包并累加本地 **`refund_amount`**。重复或并发退款不会重复入账。无 `refundAmount` 时仅退完剩余余额分项；显式金额不得超过该分项。
        收银组合支付中的现金、微信临时收款码、支付宝临时收款码均为人工确认渠道，余额分项退完后必须由收银员线下退款并完成账务核对；服务端会明确拒绝把 `CASHIER_COMBINED_*` 合成交易号发送到微信退款接口。只有真实微信线上支付单号才调用 **POST /v3/refund/domestic/refunds**。
        需在请求头携带 **Authorization: Bearer &lt;JWT&gt;**、**`X-Shop-Id`**。当前人具备 `order:operate:refund` 时直接执行；否则返回结构化 `REQUIRE_APPROVAL`。可携带严格绑定 `approvalToken`，也兼容 `authorization` 现场凭证（授权人须有 `order:operate:refund:approve`，服务端签发 v2 单次令牌并立即核销）。订单号与微信交易号查询均强制限定当前门店。
        真实微信退款必须提交 `idempotency_key`（也兼容 `idempotencyKey`），同一次业务退款的超时重试必须保持不变。服务端将请求持久化到 `t_payment_refund_request`，并通过 `t_payment_refund_guard` 对同一门店、同一订单建立唯一活动退款锁；其他窗口使用不同幂等键会以 `code=40912` 被拒绝，并将该幂等键持久化为不可再次生效的 `REJECTED` 终态。`out_refund_no` 由“订单号 + 幂等键摘要”稳定生成；即使成功回调已更新累计退款额，重复请求仍返回原退款结果，不会生成第二笔微信退款。微信明确拒绝时释放活动锁；网络结果未知时保留锁，只允许原幂等键重试。
        微信成功回调以 `out_refund_no` 在独立退款账本中加锁去重，不再把幂等标记写入订单备注；仅接受服务端已登记的退款单，并核对门店、订单、金额、原 `transaction_id`、`mchid` 和商户配置版本；退款金额、渠道列与账本状态在同一事务提交。
        `payment_method=挂账` 的订单没有支付事实，本接口返回业务 `code=409`，不会调用微信或余额退款；未回款整单应改用应收撤销接口。
        - **入参**：`orderNo`（业务订单号）与 `transaction_id`（微信支付单号，可与 `transactionId` 同义）**至少传一项**；两者都传时须指向同一笔订单。
        - **微信退款前置条件**：非余额单须 `transac_status=success` 且订单已保存微信 `transaction_id`；商户证书与订单 `merchantId` 一致。
        - **金额**：剩余可退 = 实付 − 已入账 `refund_amount`；不传 `refundAmount` 时按剩余可退全额申请；部分退传入 `refundAmount`（元）。
        - **外卖退款**：若 **`dineInOrTakeOut=外卖`** 且**已发配送**（已关联真省钱或履约进入配送中/终态），须 **`t_takeout_delivery.dispatch_status=completed`** 方可退款（全额或部分）；**不会**自动取消真省钱配送单，**不**扣除真省钱责任费。未发配送的外卖单（如仅 **`accepted`/`paid`**）可直接退款。
        - **微信退款入账**：本地 `refund_amount` 仅在 **`POST /order/refund/notify`** 退款成功回调中累加（余额单在同一次请求内直接入账）。
        - **商户与签名**：优先按订单在支付创建时固化的 **`merchant_config_id + merchant_config_version`** 解析商户历史快照，并确认配置属于订单门店或全局模板；历史订单才兼容按 `merchantId` 映射。客户端 `merchantId` 不能覆盖服务端门店策略。未配置 **`refund_notify_url`** 时默认 **`app.public-base-url` + `/order/refund/notify`**（与支付 notify 同理，须公网可达）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: orderNo 与 transaction_id 至少填一项；授权支持 approvalToken（优先）或 authorization（回退）
              properties:
                approvalToken:
                  type: string
                  description: 店长审批授权令牌（通过 /cashier/access/authorize 现场授权签发，优先原子核销；携带时不再要求 authorization）
                approval_token:
                  type: string
                  description: approvalToken 的别名
                authorization:
                  $ref: '#/components/schemas/SensitiveOperationAuthorization'
                orderNo:
                  type: string
                  description: 业务订单号（t_order.order_no），可与 transaction_id 二选一
                transaction_id:
                  type: string
                  description: 微信支付单号（t_order.transaction_id）；也可用字段名 transactionId
                transactionId:
                  type: string
                  description: 同 transaction_id
                refundAmount:
                  type: string
                  description: 可选，退款金额（元）。不传则按剩余可退全额
                reason:
                  type: string
                  description: 可选，退款原因（传给微信）
                idempotency_key:
                  type: string
                  maxLength: 64
                  description: 真实微信退款必填；同一次业务退款重试必须保持不变。余额本地退款不要求
                idempotencyKey:
                  type: string
                  maxLength: 64
                  description: 同 idempotency_key
      responses:
        '200':
          description: 成功，code=0，含 order_no、refund_status、refund_id、refund_amount 等；挂账订单返回业务 code=409；401/403 为鉴权失败
        '500':
          description: 失败

  /admin/order/manualDiscount:
    post:
      tags: [运营后台]
      summary: 手动打折/优惠（已弃用）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      deprecated: true
      description: 始终返回 code=410。请迁移到 POST /cashier/order/discount。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: integer, description: 't_order.id，与 orderNo 二选一' }
                orderNo: { type: string, description: '业务订单号' }
                discountAmount: { type: number, description: '优惠金额（元），直接设定' }
                payRate: { type: number, description: '实付倍率，如 0.9=九折' }
                wipeZero: { type: boolean, description: '是否抹零到整数元' }
                reason: { type: string, description: '优惠原因，写入 remark' }
      responses:
        '200':
          description: HTTP 200，body 中 code=410
        '500':
          description: 失败（非未结账、门店不一致、参数无效等）

  /admin/order/updateDiners:
    post:
      tags: [运营后台]
      summary: 修改订单用餐人数（代理收银端）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        管理端代理修改订单用餐人数，行为与 `/cashier/order/updateDiners` 完全一致。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number_of_diners]
              properties:
                orderNo: { type: string, description: 订单编号（与 orderId 二选一） }
                order_no: { type: string, description: 订单编号别名 }
                orderId: { type: integer, description: 订单ID（与 orderNo 二选一） }
                order_id: { type: integer, description: 订单ID别名 }
                number_of_diners: { type: integer, minimum: 1, maximum: 999, description: 就餐人数 }
                numberOfDiners: { type: integer, description: 就餐人数别名 }
                diners: { type: integer, description: 就餐人数别名 }
      responses:
        '200':
          description: 成功，返回 order_no、number_of_diners、previous_diners
        '400': { description: 参数错误 }
        '4003': { description: 已作废或已关闭订单不允许修改用餐人数 }
        '404': { description: 订单不存在或不属于当前门店 }
        '40936': { description: 该订单所属营业日已完成日结封账，禁止修改用餐人数 }
        '500': { description: 失败 }

  /admin/config/member-balance-cross-shop:
    get:
      tags: [运营后台]
      summary: 查询门店会员余额跨店使用配置
      security: [{ BearerAuth: [] }]
      description: |
        查询指定门店（由 X-Shop-Id 或 shop_id 指定）是否开启会员余额跨店使用。
        默认连锁模式返回 true，单店独立模式返回 false。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shop_id
          in: query
          required: false
          schema: { type: integer }
          description: 目标门店ID（总部账号可查任意店）
      responses:
        '200':
          description: 成功，返回 shop_id 与 enabled (boolean)
        '4003': { description: 权限不足或门店越权 }
        '500': { description: 失败 }
    put:
      tags: [运营后台]
      summary: 更新门店会员余额跨店使用配置
      security: [{ BearerAuth: [] }]
      description: |
        更新门店会员余额跨店使用模式。设为 false 为单店独立模式（本店储值仅限本店使用）；设为 true 为连锁模式（支持跨店使用与资金对账清算）。
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, description: 是否开启跨店使用 }
                shop_id: { type: integer, description: 目标门店ID（可选） }
      responses:
        '200':
          description: 成功，返回 shop_id、enabled 与 config_key
        '4003': { description: 权限不足或门店越权 }
        '500': { description: 失败 }

  /admin/report/member/cross-shop-clearing:
    get:
      tags: [运营后台]
      summary: 跨店储值消费与资金清算对账报表
      security: [{ BearerAuth: [] }]
      description: |
        查询会员跨店储值余额消费明细流水及门店间代收/代付资金清算对账汇总矩阵。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
          description: 目标门店ID
        - name: sourceShopId
          in: query
          required: false
          schema: { type: integer }
          description: 原充值门店ID
        - name: consumeShopId
          in: query
          required: false
          schema: { type: integer }
          description: 实际消费门店ID
        - name: startTime
          in: query
          required: false
          schema: { type: string }
          description: 起始时间（yyyy-MM-dd 或 yyyy-MM-dd HH:mm:ss）
        - name: endTime
          in: query
          required: false
          schema: { type: string }
          description: 结束时间（yyyy-MM-dd 或 yyyy-MM-dd HH:mm:ss）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 成功，返回 list（明细列表）、total、page、pageSize 及 clearing_matrix（代收代付清算矩阵）
        '4003': { description: 权限不足或门店越权 }
        '500': { description: 失败 }

  /admin/order/reprint-kitchen:
    post:
      tags: [运营后台]
      summary: 补打厨房小票（飞鹅）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        按订单**有效明细**（`line_status=normal` 或未设）重新生成并下发飞鹅**厨房小票**；**不修改** `order_receiving` / `order_rece`。
        与自动接单打印使用同一套 **`generateKitchenTicketContents`** 分单规则；未传 **`cid_list`** 时使用后端默认合并分类组。
        **`kds_only`** 门店自动接单会跳过飞鹅，本接口为运营**手动补打**，仍会下发打印。
        已取消订单不可补打。须 JWT + **`order:operate`**；订单须属于当前门店（**`X-Shop-Id`**）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: integer, description: 't_order.id，与 orderNo 二选一' }
                order_id: { type: integer, description: '同 orderId' }
                orderNo: { type: string, description: '业务订单号' }
                order_no: { type: string, description: '同 orderNo' }
                cid_list:
                  type: array
                  items: { type: string }
                  description: '可选；命中分类合并为一张厨房票，其余分类各打一张（与收银分单打印一致）'
      responses:
        '200':
          description: |
            成功 **code=0** 时含 **ticket_count**（应打张数）、**printed_count**、**failed_count**、**order_no**、**errors**（失败原因列表）。
            全部失败时 **code≠0**，msg 为「厨房小票补打失败」。
        '500':
          description: 失败（订单不存在、门店不一致、无有效明细等）

