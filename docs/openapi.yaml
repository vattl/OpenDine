      security: [{ BearerAuth: [] }]
      x-permission: material:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      responses:
        '200': { description: 成功，body.list }
  /admin/stock-prep/bom/save:
