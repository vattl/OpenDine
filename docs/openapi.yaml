          application/json:
            schema:
              type: object
              required: [name, legalEntity]
              properties:
                name: { type: string }
                legalEntity: { type: string, description: 经营主体（调拨禁止跨主体） }
                address: { type: string }
      responses:
        '200': { description: 成功 }
    put:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 更新仓库
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
      responses:
        '200': { description: 成功 }

  /admin/inventory/boms:
    get:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: BOM 列表
      security: [{ BearerAuth: [] }]
      x-permission: inventory:view|inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: dishId, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，items 含 versionNo/status/itemsJson }
    post:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 新建 BOM 版本
      description: version_no 自动递增；UNIQUE(shop_id,dish_id,version_no)。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dishId, items]
              properties:
                dishId: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      materialId: { type: integer }
                      qty: { type: number }
                      unit: { type: string }
                      alternates: { type: array, items: { type: integer }, description: 替代料 materialId }
                effectiveFrom: { type: string }
      responses:
        '200': { description: 成功 }
    put:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 更新 BOM
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
      responses:
        '200': { description: 成功 }

  /admin/inventory/boms/{id}/activate:
    put:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 激活 BOM 版本
      description: 同 (shop_id,dish_id) 仅一个 ACTIVE；激活时原 ACTIVE 转 HISTORY。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 成功，返回版本状态 }
        '404': { description: BOM 不存在 }

  /admin/inventory/purchases:
    get:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 采购单列表
      security: [{ BearerAuth: [] }]
      x-permission: inventory:view|inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED, RECEIVED] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功 }
    post:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 创建采购单
      description: 默认启用审核：创建即 PENDING_REVIEW。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, warehouseId, items]
              properties:
                supplierId: { type: integer }
                warehouseId: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      materialId: { type: integer }
                      qty: { type: number }
                      price: { type: number }
      responses:
        '200': { description: 成功，status=PENDING_REVIEW }
    put:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 采购单状态流转（审核/收货）
      description: action=approve|reject|receive；状态机 PENDING_REVIEW→APPROVED→RECEIVED / PENDING_REVIEW→REJECTED；非法跳转 400；每次动作写 audit_json 并记审计。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: integer }
                action: { type: string, enum: [approve, reject, receive] }
                reason: { type: string }
      responses:
        '200': { description: 成功 }
        '400': { description: 非法状态跳转 PURCHASE_INVALID_STATUS_TRANSITION }

  /admin/inventory/transfers:
    get:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 调拨单列表
      security: [{ BearerAuth: [] }]
      x-permission: inventory:view|inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: status, in: query, schema: { type: string, enum: [OUTBOUND, IN_TRANSIT, RECEIVED] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功 }
    post:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 创建调拨单
      description: |
        校验：源/目标仓经营主体一致（否则 409 TRANSFER_LEGAL_ENTITY_MISMATCH）；批次可用量充足；
        默认 FEFO（最早到期批次优先），跳过 FEFO 必须传 fefoOverrideReason（否则 400 BATCH_FEFO_OVERRIDE_REASON_REQUIRED）。
        通过后源批次扣减；同店调拨创建即 IN_TRANSIT。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromWarehouseId, toWarehouseId, items]
              properties:
                fromWarehouseId: { type: integer }
                toWarehouseId: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      batchId: { type: integer }
                      materialId: { type: integer }
                      qty: { type: number }
                      fefoOverrideReason: { type: string, description: 跳过 FEFO 时必填 }
      responses:
        '200': { description: 成功，status=IN_TRANSIT }
        '400': { description: BATCH_FEFO_OVERRIDE_REASON_REQUIRED / 批次不足 }
        '409': { description: TRANSFER_LEGAL_ENTITY_MISMATCH }

  /admin/inventory/transfers/{id}/receive:
    put:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 调拨收货
      description: 仅 IN_TRANSIT 可收货（否则 400 TRANSFER_INVALID_STATUS_TRANSITION）；目标仓生成新批次（batch_no/expiry_date 沿用源批次）。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 成功，status=RECEIVED }

  /admin/inventory/batches:
    get:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 批次列表与 FEFO 建议
      description: 返回批次 items + materials[]（每物料 available 总可用量、fefoOrder 按到期日升序的批次 id 顺序）。
      security: [{ BearerAuth: [] }]
      x-permission: inventory:view|inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: material_id, in: query, schema: { type: integer } }
        - { name: warehouse_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: '成功，body 含 items + materials[{available,fefoOrder}]' }

  /admin/reports/exports:
    post:
      tags: [系统设置, 数据报表, 运营后台]
      summary: 创建报表导出任务
      description: 异步生成 CSV 到服务端 exports 目录；完成后生成 15 分钟有效的下载令牌。daily/weekly/monthly 均在入队前校验日期格式、起止顺序和含首尾最多92天；daily 的 date 优先于 startDate，endDate 可省略。仅统计已支付且已接单（rec_order/off_order）的订单，保持 order_time 闭区间；total_amount 为 sett_amount + service_fee - discount_amount，net_amount 再扣减 refund_amount 与 pay_amount_gift，退款独立列。导出文件默认保留24小时后清理。
      security: [{ BearerAuth: [] }]
      x-permission: report:export
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType]
              properties:
                reportType: { type: string, example: daily }
                filters: { type: object }
                format: { type: string, enum: [csv], default: csv }
      responses:
        '400': { description: REPORT_RANGE_REQUIRED 缺少日期；REPORT_RANGE_INVALID 日期格式非法、倒置或超过92天（年份1000至9998）；不创建任务 }
        '200': { description: 成功，body 含 jobId、status（PENDING）；本地唤醒队列满时持久化任务仍会恢复执行 }
        '429': { description: REPORT_JOB_QUOTA_EXCEEDED，全局128或当前门店4个异步未完成任务配额已满 }
        '503': { description: REPORT_WORKER_CLOSED，任务服务正在停止 }
    get:
      tags: [系统设置, 数据报表, 运营后台]
      summary: 导出任务列表
      description: DONE 且令牌未过期时附 downloadUrl；过期 downloadUrl=null 并附 error="download link expired"。
      security: [{ BearerAuth: [] }]
      x-permission: report:view|report:export
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: jobType, in: query, schema: { type: string, enum: [REPORT_EXPORT, LOG_EXPORT, ARCHIVE_SEARCH] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, RUNNING, DONE, FAILED] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，分页结构 }

  /admin/reports/exports/{id}/download:
    get:
      tags: [系统设置, 数据报表, 运营后台]
      summary: 下载导出文件
      description: 需有效 download token（15 分钟有效期）。
      security: [{ BearerAuth: [] }]
      x-permission: report:view|report:export
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 文件流（Content-Disposition） }
        '403': { description: token 无效或已过期 }

  /admin/logs:
    get:
      tags: [系统设置, 操作日志, 运营后台]
      summary: 日志查询（在线 30 天）
      description: 仅返回近 30 天数据；内容按手机号/身份证号正则脱敏；allShops 仅总部范围可用。
      security: [{ BearerAuth: [] }]
      x-permission: log:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: type, in: query, schema: { type: string } }
        - { name: module, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: operator, in: query, schema: { type: integer } }
        - { name: shopId, in: query, schema: { type: integer } }
        - { name: allShops, in: query, schema: { type: boolean } }
        - { name: startTime, in: query, schema: { type: string } }
        - { name: endTime, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [business, security, all], default: business }, description: '日志分类：business=排除 access_denied 拒绝噪声（默认）；security=仅安全事件；all=全量' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，分页结构 }

  /admin/logs/archive-search:
    post:
      tags: [系统设置, 操作日志, 运营后台]
      summary: 归档日志检索（30 天～1 年，异步）
      description: 创建 ARCHIVE_SEARCH 任务，立即返回 jobId + status=PENDING（ARCHIVE_QUERY_PENDING 语义）；服务端异步扫描 30～365 天数据。
      security: [{ BearerAuth: [] }]
      x-permission: log:archive
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                module: { type: string }
                action: { type: string }
                operator: { type: integer }
                startTime: { type: string }
                endTime: { type: string }
      responses:
        '200': { description: 成功，body 含 jobId、status=PENDING、code 提示 ARCHIVE_QUERY_PENDING }
        '429': { description: REPORT_JOB_QUOTA_EXCEEDED，与报表导出共用全局128及单门店4个未完成任务配额 }
        '503': { description: REPORT_WORKER_CLOSED，任务服务正在停止 }

  /admin/logs/archive-search/{jobId}:
    get:
      tags: [系统设置, 操作日志, 运营后台]
      summary: 归档检索任务结果
      description: DONE 时返回命中数摘要；结果数据请至归档存储查看。
      security: [{ BearerAuth: [] }]
      x-permission: log:view|log:archive
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: jobId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 成功，body 含 jobId、status、resultSummary }
        '404': { description: 任务不存在 }

  /admin/logs/exports:
    post:
      tags: [系统设置, 操作日志, 运营后台]
      summary: 日志导出（仅超级管理员）
      description: purpose 必填；权限码 log:export 仅授予 super_admin；返回 jobId + auditNo（LOGEXP-yyyyMMdd-HHmmss-xxxx）并记审计。
      security: [{ BearerAuth: [] }]
      x-permission: log:export
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, description: 导出用途 }
                module: { type: string }
                action: { type: string }
                operator: { type: integer }
                startTime: { type: string }
                endTime: { type: string }
      responses:
        '200': { description: 成功，body 含 jobId、auditNo }
        '400': { description: purpose 必填 }
        '403': { description: 仅超级管理员 }

  /cashier/receivables/eligible-accounts:
    get:
      tags: [挂账与应收, 收银端]
      summary: 查询当前门店可用于挂账的授信账户
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters: [{ $ref: '#/components/parameters/XShopId' }]
      responses:
        '200': { description: 成功，accounts 仅包含 ACTIVE 且对当前门店可见的账户 }
  /cashier/receivables/charges:
    post:
      tags: [挂账与应收, 收银端]
      summary: 将未结订单转为应收
      description: 金额由服务端订单净应付计算；成功后订单业务完结但所有实付字段为 0，不写支付台账。
      security: [{ BearerAuth: [] }]
      x-permission: receivable:charge
      parameters: [{ $ref: '#/components/parameters/XShopId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableChargeRequest' } } }
      responses:
        '200': { description: 成功，返回 claim }
        '409': { description: 订单状态冲突、重复活动应收或幂等冲突 }
        '422': { description: 授信不足或账户不可用 }
  /cashier/receivables/claims:
    get:
      tags: [挂账与应收, 收银端]
      summary: 查询当前门店应收单
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: 成功，返回 items、total、page、pageSize }
  /cashier/receivables/claims/{id}:
    get:
      tags: [挂账与应收, 收银端]
      summary: 查询当前门店应收详情
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功，返回 claim }
        '404': { description: 应收单不存在或不属于当前门店 }
  /cashier/receivables/claims/{id}/collections:
    post:
      tags: [挂账与应收, 收银端]
      summary: 登记应收回款
      security: [{ BearerAuth: [] }]
      x-permission: receivable:collect
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableCollectionRequest' } } }
      responses:
        '200': { description: 成功，返回不可变回款 ledger }
        '409': { description: 当前应收状态不可回款或幂等冲突 }
        '422': { description: 回款超过未清余额；现金回款未指定钱箱会话 }

  /admin/receivables/accounts:
    get:
      tags: [挂账与应收, 运营后台]
      summary: 分页查询授信账户
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: status, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: 成功，返回 items、total、page、pageSize }
    post:
      tags: [挂账与应收, 运营后台]
      summary: 创建授信账户
      security: [{ BearerAuth: [] }]
      x-permission: receivable:manage
      parameters: [{ $ref: '#/components/parameters/XShopId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableAccountRequest' } } }
      responses:
        '200': { description: 创建成功，返回 account }
  /admin/receivables/accounts/{id}:
    get:
      tags: [挂账与应收, 运营后台]
      summary: 查询授信账户详情
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { description: 成功，返回 account } }
    put:
      tags: [挂账与应收, 运营后台]
      summary: 修改授信账户
      description: 授信额度不得低于当前未清余额；已关闭账户不可修改；scopeType 创建后不可变。
      security: [{ BearerAuth: [] }]
      x-permission: receivable:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableAccountRequest' } } }
      responses: { '200': { description: 修改成功，返回 account } }
    delete:
      tags: [挂账与应收, 运营后台]
      summary: 删除或注销授信账户
      description: 仅当未清余额为 0 且无未结应收时允许。若无任何历史交易则物理删除；若有已结历史交易则更新为 CLOSED 状态以保留审计流水。
      security: [{ BearerAuth: [] }]
      x-permission: receivable:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 删除或关闭成功，返回 account、deleted、closed }
        '409': { description: 账户仍有未清余额或未结应收 }
  /admin/receivables/accounts/{id}/status:
    post:
      tags: [挂账与应收, 运营后台]
      summary: 启用或暂停授信账户
      security: [{ BearerAuth: [] }]
      x-permission: receivable:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACTIVE, SUSPENDED] } } } } }
      responses: { '200': { description: 成功，返回 account } }
  /admin/receivables/accounts/{id}/close:
    post:
      tags: [挂账与应收, 运营后台]
      summary: 关闭零余额授信账户
      security: [{ BearerAuth: [] }]
      x-permission: receivable:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功，账户状态为 CLOSED }
        '409': { description: 账户仍有未清余额 }
  /admin/receivables/accounts/{id}/statement:
    get:
      tags: [挂账与应收, 运营后台]
      summary: 查询客户应收流水对账单
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses: { '200': { description: 成功，items 按流水倒序返回 } }
  /admin/receivables/claims:
    get:
      tags: [挂账与应收, 运营后台]
      summary: 分页查询应收单
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses: { '200': { description: 成功，返回 items、total、page、pageSize } }
  /admin/receivables/aging:
    get:
      tags: [挂账与应收, 运营后台]
      summary: 当前门店应收账龄分析
      security: [{ BearerAuth: [] }]
      x-permission: receivable:view
      parameters: [{ $ref: '#/components/parameters/XShopId' }]
      responses: { '200': { description: 成功，返回未到期、1-30、31-60、61-90、90+ 天余额与合计 } }
  /admin/receivables/claims/{id}/collections:
    post:
      tags: [挂账与应收, 运营后台]
      summary: 管理端登记应收回款
      security: [{ BearerAuth: [] }]
      x-permission: receivable:collect
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableCollectionRequest' } } }
      responses: { '200': { description: 成功，返回不可变回款 ledger } }
  /admin/receivables/claims/{id}/reverse:
    post:
      tags: [挂账与应收, 运营后台]
      summary: 撤销从未发生回款的应收
      security: [{ BearerAuth: [] }]
      x-permission: receivable:writeoff
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableActionRequest' } } }
      responses:
        '200': { description: 撤销成功，订单恢复未结状态 }
        '409': { description: 已有回款或状态不允许撤销 }
  /admin/receivables/claims/{id}/write-off:
    post:
      tags: [挂账与应收, 运营后台]
      summary: 核销应收剩余余额为坏账
      security: [{ BearerAuth: [] }]
      x-permission: receivable:writeoff
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReceivableActionRequest' } } }
      responses: { '200': { description: 成功，剩余余额归零并返回坏账 ledger } }

  /admin/shop/notification-config:
    get:
      tags: [门店与全局配置, 收银台专用接口]
      summary: 查询门店消息通知与出餐超时动态阈值配置
      description: 按门店查询是否开启出餐超时告警（默认开启）、出餐超时动态阈值分钟数（默认 15 分钟，合法范围 5~120 分钟）及 P0 告警重复语音提醒间隔秒数（默认 60 秒）。
      security: [{ BearerAuth: [] }]
      x-permission: shop:manage|order:config|settings:view|cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: shop_id, in: query, required: false, schema: { type: integer }, description: 门店 ID }
      responses:
        '200': { description: 成功返回门店通知与出餐超时阈值配置 }
    put:
      tags: [门店与全局配置]
      summary: 修改门店消息通知与出餐超时动态阈值配置
      description: 后台设置门店出餐超时动态阈值（prep_timeout_minutes 必须在 5~120 分钟之间，timeout_repeat_interval_seconds 必须在 15~600 秒之间）。
      security: [{ BearerAuth: [] }]
      x-permission: shop:manage|order:config|settings:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id: { type: integer, description: 门店 ID }
                prep_timeout_enabled: { type: boolean, description: 是否开启出餐超时告警 }
                prep_timeout_minutes: { type: integer, minimum: 5, maximum: 120, description: 出餐超时动态阈值（分钟，5~120） }
                timeout_repeat_interval_seconds: { type: integer, minimum: 15, maximum: 600, description: P0未确认告警重复语音提醒间隔（秒，15~600） }
      responses:
        '200': { description: 保存成功并返回最新配置 }
        '400': { description: 阈值超出合法范围 }
  /cashier/notifications/sync:
    get:
      tags: [收银台专用接口]
      summary: 收银端断线重连按游标增量拉取未读实时通知
      description: 根据本地已处理的 last_seq_id 游标增量拉取当前门店未读且未过期的实时消息（如新订单 NEW_ORDER_PAID、出餐超时 ORDER_PREP_TIMEOUT 等），返回 items 与 server_head_seq_id。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|order:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: last_seq_id, in: query, required: false, schema: { type: integer, format: int64, default: 0 }, description: 客户端本地最大 seq_id 游标 }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 }, description: 单次拉取上限 }
        - { name: shop_id, in: query, required: false, schema: { type: integer }, description: 门店 ID }
      responses:
        '200': { description: 成功返回增量消息列表与服务端最新游标 }
  /cashier/notifications/ack:
    post:
      tags: [收银台专用接口]
      summary: 收银端批量确认实时消息已读并跨终端消除告警
      description: 将指定 message_ids 标记为已读，并向同门店所有在线收银终端广播 ALERT_DISMISSED 事件，实现 1 秒内多台收银机同步消除弹窗与停止报警音。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|order:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                shop_id: { type: integer, description: 门店 ID }
                message_ids:
                  type: array
                  items: { type: string }
                  description: 待确认消除的消息唯一幂等键列表
      responses:
        '200': { description: 确认成功并广播跨终端消除事件 }
  /api/v1/notifications/sync:
    get:
      tags: [收银台专用接口, 小程序点餐接口]
      summary: 统一实时消息通道按游标增量同步未读消息（通用别名）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|order:view
      parameters:
        - { name: last_seq_id, in: query, required: false, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: shop_id, in: query, required: false, schema: { type: integer } }
        - { name: client_type, in: query, required: false, schema: { type: string, enum: [CASHIER, MINI_PROGRAM] } }
        - { name: openid, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 成功返回增量消息列表与服务端最新游标 }
  /api/v1/notifications/ack:
    post:
      tags: [收银台专用接口, 小程序点餐接口]
      summary: 统一实时消息通道批量确认消息已读（通用别名）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|order:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                shop_id: { type: integer }
                openid: { type: string }
                message_ids:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: 确认成功 }
  /user/notifications/sync:
    get:
      tags: [小程序点餐接口]
      summary: C端小程序断线重连按游标增量同步未读消息（优惠券到账、优惠券临期、取餐就绪）
      security: [{ UserToken: [] }]
      parameters:
        - { name: last_seq_id, in: query, required: false, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: shop_id, in: query, required: false, schema: { type: integer } }
        - { name: openid, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 成功返回当前用户未读增量消息与服务端最新游标 }
        '401': { description: X-User-Token 无效或已过期 }
        '403': { description: 请求 openid 与 X-User-Token 绑定身份不一致 }
  /user/notifications/ack:
    post:
      tags: [小程序点餐接口]
      summary: C端小程序批量确认消息已读
      security: [{ UserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                shop_id: { type: integer }
                openid: { type: string }
                message_ids:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: 确认成功 }
        '401': { description: X-User-Token 无效或已过期 }
        '403': { description: 请求 openid 与 X-User-Token 绑定身份不一致 }

components:
  securitySchemes:
    UserToken:
      type: apiKey
      in: header
      name: X-User-Token
      description: 'C 端用户身份 Token，由 POST /order/getOpenid 签发；不得用请求参数 openid 替代。'
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '运营后台 B 端接口需在请求头携带 Authorization: Bearer <JWT>；权限按 docs/权限设计.md 中角色-权限矩阵校验。'
    ZsqAuthorization:
      type: http
      scheme: bearer
      description: |
        真省钱平台 Authorization（`POST /api/zsq/auth/login` 返回的 **authorization** 字段，通常为 Bearer + JWT）。
        **非**运营后台 B 端 JWT；勿混用。
    XKdsDeviceToken:
      type: apiKey
      in: header
      name: X-Kds-Device-Token
      description: Cashier LAN KDS 设备令牌。
  responses:
    KdsV2UpgradeRequired:
      description: 客户端协议版本低于服务端最低版本
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: integer, enum: [4260] }
              msg: { type: string }
              data:
                type: object
                required: [required_protocol_version]
                properties:
                  required_protocol_version: { type: integer, enum: [2] }
  parameters:
    ShopIdHeader:
      $ref: '#/components/parameters/XShopId'
    ShopCodeHeader:
      $ref: '#/components/parameters/XShopCode'
    XClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      description: |
        APP 为一次业务动作生成的唯一键。`/cashier/order/quickOrder`、`/cashier/order/addDishes`、`/cashier/order/refundDish`、`/cashier/order/checkout` 按 **门店 + 键** 保留首次成功响应 24 小时；失败响应释放该键。网络超时重试必须沿用原键和完全相同的请求体，新业务动作必须换新键。同键不同请求体或跨接口复用返回 409。
    XCashierDeviceCode:
      name: X-Cashier-Device-Code
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: |
        收银本地 authority identity，不是 KDS 屏幕 device_code，也不是 JWT 的替代品。
        复制接口同时校验 JWT 门店、configured cashier authority、该 header；kds_state_changed 还校验 payload.device_code。
    XCashierAuthorityEpoch:
      name: X-Cashier-Authority-Epoch
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: KDS Delivery 主收银 fencing 代次；接管后旧 epoch 的拉取、投影读取和 ACK 均返回 409。
    XCashierLeaseToken:
      name: X-Cashier-Lease-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 512
      description: KDS Delivery 主收银短期租约令牌；不得写入日志或持久化明文到云端数据库。
    XShopId:
      name: X-Shop-Id
      in: header
      required: false
      schema:
        type: integer
        format: int32
      description: |
        连锁模式下的**当前门店 ID**（`t_shop.id`）。与 **`X-Shop-Code`**、body/query 中的 **`shop_id`/`shop_code`** 同时出现时**须指向同一营业中门店**。
        解析优先级：**`X-Shop-Id` → `X-Shop-Code` → `shop_id` → `shop_code`**（各层内部 ID 与 Code 亦须一致）。详见 **docs/backend_chain_store_api.md** §3.3。
        **运营后台**：业务接口建议携带本请求头标识当前店；**`SysInterceptor`**（**v1.2.116**）**仅**校验路径对应权限码，**不**在拦截器层返回 **4001/4003**；跨店/缺店由具体接口返回 **4003** 等。GET 的 query **`shopId`** 不参与拦截器解析（**v1.2.115**）。
    XKdsDeviceToken:
      name: X-Kds-Device-Token
      in: header
      required: true
      schema:
        type: string
      description: |
        厨显设备令牌。Cloud compatibility 位于响应 `device.device_token`；Cashier LAN 位于响应 `data.device_token`。
        login 无需 token；Cashier LAN 的 heartbeat 与 me/board/advance 等业务路由必须携带。Cloud compatibility 的 heartbeat 同样需要设备 token。
    XShopCode:
      name: X-Shop-Code
      in: header
      required: false
      schema:
        type: string
      description: |
        连锁模式下的**当前门店编码**（`t_shop.code`，须为**营业中**门店）。与 **`X-Shop-Id`**、**`shop_id`**、**`shop_code`** 的合并规则见 **`X-Shop-Id`** 说明。
    ShopIdQuery:
      name: shop_id
      in: query
      required: false
      schema:
        type: integer
        format: int32
      description: |
        门店 ID，多与 **`GET /dish/listAll`** 联用；与 **`X-Shop-Id`** / **`shop_code`** 同时出现时须一致。
    ShopCodeQuery:
      name: shop_code
      in: query
      required: false
      schema:
        type: string
      description: |
        门店编码 **`t_shop.code`**（营业中）；与 **`shop_id`** / **`X-Shop-Id`** / **`X-Shop-Code`** 同时出现时须指向同一门店。
    OrderShopScopeQuery:
      name: orderShopScope
      in: query
      required: false
      schema:
        type: string
        enum: [accessible, resolved, current]
        default: accessible
      description: |
        **订单列表/统计的门店范围**（与工具类 `AdminOrderShopScope`、一键发券 `consumeShopScope` 语义一致）。
        - **accessible**（默认）：**总部账号**（明确绑定 `super_admin`，见 `IAdminShopAccessService.isHeadquartersAdmin`）**不按 `shop_id` 过滤**，即全连锁已支付订单；**门店/区域账号**仅 **`shop_id IN (可访问门店)`**（请求属性 `allowedShopIds`）。
        - **resolved**：仅 **`shop_id =`** 当前请求解析出的门店（`X-Shop-Id` 等），与改前「只认头部门店」行为一致。
        - **current**：与 **resolved** 同义（后端兼容别名）。
        会员订单匹配条件另含 **`openid` 或 `pay_openid`** 等于该会员 openid（`transac_status=success`）。
  schemas:
    ApprovalRateLimitError:
      type: object
      required: [code, error, msg, data]
      properties:
        code: { type: integer, example: 429 }
        error: { type: string, example: ACCESS_APPROVAL_RATE_LIMITED }
        error_code: { type: string, example: ACCESS_APPROVAL_RATE_LIMITED }
        msg: { type: string, example: 请求过于频繁，请稍后重试 }
        data:
          type: object
          required: [retryAfterSeconds, rateLimitScope]
          properties:
            retryAfterSeconds: { type: integer, minimum: 1, example: 300 }
            rateLimitScope: { type: string, enum: [ONSITE_AUTHORIZE, QR_CREATE, QR_CONFIRM, CREDENTIAL_FAILURE] }
    ReceivableAccountRequest:
      type: object
      required: [scopeType, customerType, customerName, creditLimitFen, paymentTermsDays]
      properties:
        scopeType: { type: string, enum: [SHOP, MERCHANT], description: 门店专属或商户全局账户 }
        customerType: { type: string, enum: [PERSON, COMPANY] }
        customerName: { type: string, maxLength: 120 }
        contactName: { type: string, maxLength: 80 }
        contactPhone: { type: string, maxLength: 32 }
        taxNo: { type: string, maxLength: 64 }
        creditLimitFen: { type: integer, format: int64, minimum: 0 }
        paymentTermsDays: { type: integer, minimum: 0, maximum: 3650 }
        notes: { type: string, maxLength: 500 }
    ReceivableChargeRequest:
      type: object
      required: [orderNo, accountId, requestId]
      properties:
        orderNo: { type: string, maxLength: 100 }
        accountId: { type: integer, format: int64 }
        requestId: { type: string, maxLength: 128, description: 客户端生成的全局幂等键 }
        note: { type: string, maxLength: 500 }
    ReceivableCollectionRequest:
      type: object
      required: [amountFen, channel, requestId]
      properties:
        amountFen: { type: integer, format: int64, minimum: 1 }
        channel: { type: string, enum: [CASH, BANK_TRANSFER, WECHAT, ALIPAY, OTHER] }
        requestId: { type: string, maxLength: 128, description: 客户端生成的全局幂等键 }
        note: { type: string, maxLength: 500 }
        drawerSessionId: { type: integer, format: int64, description: channel=CASH 时必填 }
    ReceivableActionRequest:
      type: object
      required: [requestId, reason]
      properties:
        requestId: { type: string, maxLength: 128, description: 客户端生成的全局幂等键 }
        reason: { type: string, maxLength: 500 }
    SensitiveOperationAuthorization:
      type: object
      additionalProperties: false
      required: [account, password]
      description: 单次敏感操作的现场员工授权；不缓存、不签发可复用令牌，员工可不同于当前登录收银员。
      properties:
        account:
          type: string
          maxLength: 128
          description: 授权员工工号或管理员用户名
        password:
          type: string
          format: password
          maxLength: 512
          writeOnly: true
          description: 授权员工密码；不得写入日志或持久化
    ApiPermission:
      type: object
      description: 接口-权限映射记录（t_api_permission）
      properties:
        id:
          type: integer
          description: 主键ID
          example: 1
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, '*']
          description: 请求方法，* 表示不区分方法
          example: GET
        path_pattern:
          type: string
          description: 路径模式，支持 {id} 占位
          example: /admin/order/list
        permission_code:
          type: string
          description: 所需权限码，须存在于 t_permission
          example: order:view
        remark:
          type: string
          description: 接口备注，前端展示用
          example: 订单-列表
    PrintPreviewResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, example: 预览生成成功 }
        data:
          type: object
          properties:
            scenario: { type: string, example: ORDER }
            scenarioName: { type: string, example: 前台结账单 }
            paperSize: { type: string, example: 58mm }
            paperWidthMm: { type: integer, example: 58 }
            paperWidthChars: { type: integer, example: 32 }
            shopName: { type: string, example: 老肥油边王(松源海鲜街) }
            totalTickets: { type: integer, example: 1 }
            tickets:
              type: array
              items:
                type: object
                properties:
                  ticketIndex: { type: integer, example: 0 }
                  title: { type: string, example: 结账单 }
                  rawContent: { type: string, description: 原生带标签的打印机指令内容 }
                  plainText: { type: string, description: 排版纯文本 }
                  elements:
                    type: array
                    description: 结构化可视化节点列表
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [HEADER, TEXT, DIVIDER, TABLE_HEADER, TABLE_ROW, KEY_VALUE, QRCODE, BARCODE, CUT], example: HEADER }
                        text: { type: string }
                        align: { type: string, enum: [LEFT, CENTER, RIGHT], example: CENTER }
                        bold: { type: boolean, example: true }
                        size: { type: string, enum: [NORMAL, DOUBLE, LARGE], example: DOUBLE }
                        key: { type: string }
                        value: { type: string }
                        columns: { type: array, items: { type: string } }
                        meta: { type: object }
            rawCombinedContent: { type: string, description: 合并的原生打印内容 }
            renderedAt: { type: string, format: date-time, example: '2026-08-31T11:30:00+08:00' }

    RefundStockAction:
      type: string
      enum: [RESTORE, NO_RESTORE, OUT_OF_STOCK]
      default: RESTORE
      description: |
        退菜库存变动动作：
        - `RESTORE`（默认）：将退菜数量加回门店库存，若原为售罄且加回后 stock > 0 则自动解除售罄；
        - `NO_RESTORE`（损耗/报废）：菜品已制作或食材已损耗，不加回库存，仅退菜退款并记录损耗流水；
        - `OUT_OF_STOCK`（缺货/估清）：因后厨食材用尽而退菜，不回退库存，并将当前门店该菜品库存清零（stock=0）且强制标记售罄（sold_out=1），同时下发 WebSocket 售罄广播。

    DishStockLog:
      type: object
      description: 菜品库存变动流水日志
      properties:
        id: { type: integer, format: int64 }
        shop_id: { type: integer, description: 门店 ID }
        dish_id: { type: integer, description: 菜品 ID }
        dish_name: { type: string, description: 菜品名称 }
        order_no: { type: string, description: 关联订单号 }
        detail_id: { type: integer, description: 关联订单明细 ID }
        change_type:
          type: string
          enum: [ORDER_DEDUCT, CANCEL_ORDER, REFUND_RESTORE, REFUND_NO_RESTORE, REFUND_OUT_OF_STOCK, ADMIN_MANUAL, KDS_LACK]
          description: 变动类型
        delta: { type: integer, description: 变动数量 (+加 / -减 / 0不变) }
        stock_before: { type: integer, description: 变动前库存 }
        stock_after: { type: integer, description: 变动后库存 }
        operator_id: { type: string, description: 操作人/端 }
        remark: { type: string, description: 备注/原因 }
        created_at: { type: string, format: date-time, description: 记录时间 }

    PersonalAlipayNotifyRequest:
      type: object
      required: [channel, amount, timestamp, event_id]
      properties:
        channel:
          type: string
          example: alipay
          description: 收款渠道（如 alipay, wechat）
        amount:
          type: integer
          example: 1000
          description: 到账金额（单位：分）
        timestamp:
          type: string
          example: '1724458800000'
          description: 时间戳
        event_id:
          type: string
          example: evt_123456
          description: 客户端唯一事件 ID（幂等主键）
        raw_text:
          type: string
          example: '支付宝通知: 收到一笔 10.00 元款项'
          description: 原始通知文本
        shop_id:
          type: integer
          description: 可选关联门店 ID

    PersonalAlipayNotifyResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
          description: 是否成功处理
        duplicate:
          type: boolean
          example: true
          description: 是否为重复事件（幂等返回）

    CashierKdsAuthorityLeaseRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [ACQUIRE, RENEW]
          description: ACQUIRE 获取/接管；RENEW 续租，续租时须同时提交 leaseToken 和 authorityEpoch。
        authorityEpoch: { type: integer, format: int64, minimum: 1, nullable: true }
        leaseToken: { type: string, minLength: 32, maxLength: 512, nullable: true, writeOnly: true }
        clientVersion: { type: string, maxLength: 64, nullable: true }

    CashierKdsAuthorityLeaseResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data:
          type: object
          required: [shopId, deviceCode, authorityEpoch, leaseToken, leaseUntilMs, renewAfterMs, snapshotRequired]
          properties:
            shopId: { type: integer, minimum: 1 }
            deviceCode: { type: string, maxLength: 64 }
            authorityEpoch: { type: integer, format: int64, minimum: 1 }
            leaseToken: { type: string, minLength: 32, maxLength: 512, description: 仅在成功获取/续租响应返回 }
            leaseUntilMs: { type: integer, format: int64, minimum: 1 }
            renewAfterMs: { type: integer, format: int64, minimum: 1000, example: 10000 }
            snapshotRequired: { type: boolean, description: true 时必须完成 bootstrap 后才能消费/ACK 增量 }
            lastAckCursor: { type: integer, format: int64, minimum: 0 }
            headCursor: { type: integer, format: int64, minimum: 0 }

    CashierKdsOrderProjectionLine:
      type: object
      required: [detailId, dishId, dishName, quantity, refundedQuantity, remainingQuantity, lineStatus, lineType]
      properties:
        detailId: { type: integer, format: int64, minimum: 1, description: 云端正式 t_order_detail.id }
        dishId: { type: integer, minimum: 1 }
        dishName: { type: string, minLength: 1, maxLength: 100 }
        specification: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1, description: 原始下单数量 }
        refundedQuantity: { type: integer, minimum: 0 }
        remainingQuantity: { type: integer, minimum: 0 }
        lineStatus: { type: string, enum: [NORMAL, REFUNDED, CANCELLED] }
        lineType: { type: string, enum: [NORMAL, COMBO_HEADER, COMBO_COMPONENT] }
        clientLineId: { type: string, maxLength: 64, nullable: true }
        comboId: { type: integer, format: int64, nullable: true }
        comboInstanceId: { type: string, nullable: true }
        parentDetailId: { type: integer, format: int64, nullable: true }
        categoryId: { type: string, nullable: true, description: 原 t_order_detail.cid，供本地路由兼容 }
        workflowQueue: { type: string, nullable: true, description: 云端配置可确定时返回；为空由收银本地配置路由 }
        remark: { type: string, nullable: true }
        rushed: { type: boolean, default: false }

    CashierKdsOrderProjection:
      type: object
      required: [orderId, orderNo, shopId, projectionVersion, state, sourceChannel, fulfillmentType, createdAtMs, lines]
      properties:
        orderId: { type: integer, format: int64, minimum: 1, description: 云端正式订单 ID }
        orderNo: { type: string, minLength: 1, maxLength: 100 }
        shopId: { type: integer, minimum: 1 }
        projectionVersion: { type: integer, format: int64, minimum: 1, description: 单订单厨房投影严格单调版本 }
        state: { type: string, enum: [READY, VOIDED, CLOSED] }
        sourceChannel: { type: string, enum: [POS, CASHIER, MINI_PROGRAM, ADMIN, THIRD_PARTY, MEITUAN] }
        sourceDeviceCode: { type: string, nullable: true }
        fulfillmentType: { type: string, enum: [DINE_IN, TAKEOUT, DELIVERY] }
        tableNumber: { type: string, nullable: true }
        numberOfDiners: { type: integer, minimum: 0, nullable: true }
        orderRemark: { type: string, nullable: true }
        acceptanceStatus: { type: string, nullable: true }
        createdAtMs: { type: integer, format: int64, minimum: 1 }
        updatedAtMs: { type: integer, format: int64, minimum: 1 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CashierKdsOrderProjectionLine' }

    CashierKdsDeliveryEvent:
      type: object
      required: [eventId, cursor, shopId, eventType, orderId, projectionVersion, originChannel, occurredAtMs, projection]
      properties:
        eventId: { type: string, format: uuid, description: 全局幂等键 }
        cursor: { type: integer, format: int64, minimum: 1, description: 当前门店查询结果严格单调，但不保证连续 }
        shopId: { type: integer, minimum: 1 }
        eventType:
          type: string
          enum: [ORDER_ACCEPTED, ORDER_READY, ORDER_UPDATED, ORDER_LINE_VOIDED, ORDER_CANCELLED, ORDER_VOIDED, ORDER_RUSHED, ORDER_CLOSED, ORDER_LINE_STATUS_CHANGED]
        orderId: { type: integer, format: int64, minimum: 1 }
        projectionVersion: { type: integer, format: int64, minimum: 0, description: 订单投影事件为订单投影版本；ORDER_LINE_STATUS_CHANGED 明细状态事件固定为 0 }
        originChannel: { type: string, enum: [POS, CASHIER, MINI_PROGRAM, ADMIN, THIRD_PARTY, MEITUAN] }
        originDeviceCode: { type: string, nullable: true }
        occurredAtMs: { type: integer, format: int64, minimum: 1 }
        changedDetailIds:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
        projection:
          oneOf:
            - $ref: '#/components/schemas/CashierKdsOrderProjection'
            - $ref: '#/components/schemas/CashierKdsLineStatusProjection'
          description: 订单投影事件为订单快照；ORDER_LINE_STATUS_CHANGED 事件为明细状态增量（无完整订单快照）

    CashierKdsLineStatusProjection:
      type: object
      required: [eventType, orderId, orderNo, shopId, occurredAtMs, lines]
      properties:
        eventType: { type: string, enum: [ORDER_LINE_STATUS_CHANGED] }
        orderId: { type: integer, format: int64, minimum: 1 }
        orderNo: { type: string }
        shopId: { type: integer, minimum: 1 }
        occurredAtMs: { type: integer, format: int64, minimum: 1 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CashierKdsLineStatusDelta' }

    CashierKdsLineStatusDelta:
      type: object
      required: [detailId, itemStatus, prepQuantity, cookedQuantity, servedQuantity, rushFlag, overdueFlag, addDishFlag, archived, updatedAtMs]
      properties:
        detailId: { type: integer, format: int64, minimum: 1 }
        itemStatus: { type: integer, enum: [0, 1, 2, 3], description: 0待制作 1制作中 2已完成 3已退菜 }
        prepQuantity: { type: integer, minimum: 0, description: 配菜完成数量 }
        cookedQuantity: { type: integer, minimum: 0, description: 制作完成数量 }
        servedQuantity: { type: integer, minimum: 0, description: 传菜完成数量 }
        rushFlag: { type: integer, enum: [0, 1], description: 催菜标记 }
        overdueFlag: { type: integer, enum: [0, 1], description: 超时标记 }
        addDishFlag: { type: integer, enum: [0, 1], description: 加菜标记 }
        archived: { type: integer, enum: [0, 1], description: 工单归档（已完成/取消） }
        updatedAtMs: { type: integer, format: int64, minimum: 1, description: 工单更新时间戳，收银端做新旧裁决（本地 updated_at 更新则忽略） }
    CashierKdsBootstrapResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data:
          type: object
          required: [snapshotToken, baseCursor, complete, orders]
          properties:
            snapshotToken: { type: string, maxLength: 512 }
            baseCursor: { type: integer, format: int64, minimum: 0 }
            nextPageToken: { type: string, nullable: true, maxLength: 512 }
            complete: { type: boolean }
            orders:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/CashierKdsOrderProjection' }

    UnifiedPrintRequest:
      type: object
      properties:
        order_no:
          type: string
          description: 订单号（业务流水号，也可传 orderNo / order_sn）
        order_id:
          type: integer
          format: int64
          description: 订单主键 ID
        scenario:
          type: string
          description: 出票场景（kitchen, checkout, pre_checkout, full_order, packing, takeout, expedite, refund, shift, label, test；默认推导为 kitchen）
        is_reprint:
          type: boolean
          default: true
          description: 是否为补打单据（默认 true，自动注入【补打】标识、操作人与补打时间）
        cid_list:
          type: array
          items:
            type: string
          description: 厨房指定分类过滤列表
        shift_id:
          type: integer
          format: int64
          description: 交接班记录 ID（仅 shift 场景使用）
        device_id:
          type: integer
          format: int64
          description: 定向出票设备 ID
        template_id:
          type: integer
          format: int64
          description: 定向模板 ID
        copies:
          type: integer
          minimum: 1
          maximum: 9
          description: 覆盖出票份数
        reason:
          type: string
          description: 补打或操作原因
        custom_content:
          type: string
          description: 自定义文本内容
        idempotency_key:
          type: string
          description: 幂等防重键

    UnifiedPrintResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        msg:
          type: string
        data:
          type: object
          properties:
            order_no:
              type: string
            scenario:
              type: string
            scenario_name:
              type: string
            is_reprint:
              type: boolean
            job_count:
              type: integer
            success_count:
              type: integer
            failed_count:
              type: integer
            summary:
              type: string
            jobs:
              type: array
              items:
                type: object
                properties:
                  job_id:
                    type: integer
                    format: int64
                  device_id:
                    type: integer
                    format: int64
                  device_name:
                    type: string
                  transport:
                    type: string
                  status:
                    type: string
                  success:
                    type: boolean
                  error:
                    type: string

    CashierKdsDeliveryEventsResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data:
          type: object
          required: [currentCursor, nextCursor, minAvailableCursor, snapshotRequired, events]
          properties:
            currentCursor: { type: integer, format: int64, minimum: 0, description: 本次读取时云端 head cursor }
            nextCursor: { type: integer, format: int64, minimum: 0, description: 客户端处理完本批后下一次使用的 afterCursor }
            minAvailableCursor: { type: integer, format: int64, minimum: 0 }
            snapshotRequired: { type: boolean }
            events:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/CashierKdsDeliveryEvent' }

    CashierKdsOrderProjectionResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/CashierKdsOrderProjection' }

    CashierKdsDeliveryAckRequest:
      type: object
      required: [throughCursor]
      additionalProperties: false
      properties:
        throughCursor: { type: integer, format: int64, minimum: 0 }
        lastEventId: { type: string, format: uuid, nullable: true, description: 审计辅助；服务端仍以 throughCursor 累计确认 }
        localCommittedAtMs: { type: integer, format: int64, minimum: 1, nullable: true }

    CashierKdsDeliveryAckResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data:
          type: object
          required: [acknowledgedCursor, headCursor, duplicate]
          properties:
            acknowledgedCursor: { type: integer, format: int64, minimum: 0 }
            headCursor: { type: integer, format: int64, minimum: 0 }
            duplicate: { type: boolean }
            lag: { type: integer, format: int64, minimum: 0 }

    CashierKdsDeliveryStatusResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data:
          type: object
          required: [shopId, headCursor, acknowledgedCursor, minAvailableCursor, lag, authorityOnline]
          properties:
            shopId: { type: integer, minimum: 1 }
            headCursor: { type: integer, format: int64, minimum: 0 }
            acknowledgedCursor: { type: integer, format: int64, minimum: 0 }
            minAvailableCursor: { type: integer, format: int64, minimum: 0 }
            lag: { type: integer, format: int64, minimum: 0 }
            oldestUnackedAtMs: { type: integer, format: int64, nullable: true }
            authorityOnline: { type: boolean }
            authorityDeviceCode: { type: string, nullable: true }
            authorityEpoch: { type: integer, format: int64, nullable: true }
            leaseUntilMs: { type: integer, format: int64, nullable: true }
            snapshotRequired: { type: boolean }

    KdsReplicationEventRequest:
      type: object
      required: [event_id, event_type, aggregate_key, occurred_at_ms, payload]
      properties:
        event_id: { type: string, maxLength: 128, description: 全局幂等键 }
        event_type: { type: string, enum: [order_created, kds_advance_item, kds_state_changed] }
        aggregate_key: { type: string, pattern: '^order:[1-9][0-9]*$' }
        occurred_at_ms: { type: integer, format: int64, minimum: 1 }
        payload:
          oneOf:
            - $ref: '#/components/schemas/KdsReplicationOrderCreatedPayload'
            - $ref: '#/components/schemas/KdsReplicationAdvanceItemPayload'
            - $ref: '#/components/schemas/KdsReplicationStateChangedPayload'
            - $ref: '#/components/schemas/KdsReplicationStateChangedPatchPayload'

    KdsReplicationOrderCreatedPayload:
      type: object
      required: [local_order_id, shop_id, fulfillment_type, created_at_ms, lines]
      properties:
        local_order_id: { type: integer, format: int64, minimum: 1 }
        order_no: { type: string, description: 收银本地订单号 }
        shop_id: { type: integer, minimum: 1, description: 必须与 X-Shop-Id 一致 }
        table_number: { type: string }
        fulfillment_type: { type: string, enum: [dine_in, takeout, delivery] }
        remark: { type: string, nullable: true }
        number_of_diners: { type: integer, nullable: true }
        created_at_ms: { type: integer, format: int64, minimum: 1 }
        cloud_payload: { type: object, additionalProperties: true, description: 现有 OrderDTO 兼容字段 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [local_detail_id, dish_id, quantity]
            properties:
              local_detail_id: { type: integer, format: int64, minimum: 1, description: 收银本地明细 ID，同一订单内唯一 }
              dish_id: { type: integer, minimum: 1 }
              dish_name: { type: string }
              specification: { type: string, nullable: true }
              unit: { type: string, nullable: true }
              quantity: { type: integer, minimum: 1 }
              cloud_payload: { type: object, additionalProperties: true, description: 现有 OrderDetail 兼容字段，其中 id 不写入云端主键 }

    KdsReplicationAdvanceItemPayload:
      type: object
      required: [operation_id, detail_id, order_id, prep_remaining, cook_remaining, ready_remaining, local_revision, done_line]
      properties:
        operation_id: { type: string, maxLength: 128, description: 划菜操作幂等键 }
        id_namespace: { type: string, enum: [formal], description: 新版云端优先客户端必须传 formal；不传时按旧版本地映射 ID 处理 }
        detail_id: { type: integer, format: int64, minimum: 1, description: id_namespace=formal 时为云端正式明细 ID，否则为旧版收银本地明细 ID }
        order_id: { type: integer, format: int64, minimum: 1, description: id_namespace=formal 时为云端正式订单 ID，否则为旧版收银本地订单 ID }
        from_queue: { type: string }
        workflow_queue: { type: string }
        prep_remaining: { type: integer, minimum: 0 }
        cook_remaining: { type: integer, minimum: 0 }
        ready_remaining: { type: integer, minimum: 0 }
        remaining_quantity: { type: integer, minimum: 0 }
        row_version: { type: integer, format: int64 }
        local_revision: { type: integer, format: int64, minimum: 1 }
        done_line: { type: integer, enum: [0, 1] }

    KdsReplicationStateChangedPayload:
      type: object
      required: [order_revision, operation_type, device_code, orders, lines, dish_availability]
      properties:
        order_id: { type: integer, format: int64, minimum: 1, description: 新版云端优先客户端使用正式订单 ID }
        local_order_id: { type: integer, format: int64, minimum: 1, deprecated: true, description: 旧版 order_created 映射模式使用 }
        order_revision: { type: integer, format: int64, minimum: 1, description: aggregate 单调版本 }
        operation_type:
          type: string
          enum: [advance_item, advance_order, revoke_item, lack_item, refund_item, rush_item, rush_order, hold_item, release_item, complete_order, archive_order, archive_clear]
        device_code: { type: string, minLength: 1, maxLength: 64 }
        orders:
          type: array
          minItems: 1
          maxItems: 1
          description: 完整订单快照；每项 local_order_id 必须等于顶层 aggregate
          items: { $ref: '#/components/schemas/KdsReplicationStateOrderSnapshot' }
        lines:
          type: array
          minItems: 1
          uniqueItems: true
          description: 必须无重复且完整、排他覆盖该订单全部 detail mapping；否则不推进 order_revision。
          items: { $ref: '#/components/schemas/KdsReplicationStateLineSnapshot' }
        dish_availability:
          type: array
          items:
            type: object
            required: [dish_id, availability_revision]
            properties:
              dish_id: { type: integer, minimum: 1 }
              availability_revision: { type: integer, format: int64, minimum: 1 }
              stock: { type: integer, minimum: -1, nullable: true, description: 可售库存；-1 为「不限量」哨兵（兼容收银端直接外发本地库存值），新客户端应优先省略或置 null }
              sold_out: { type: boolean, nullable: true }

    KdsReplicationStateChangedPatchPayload:
      type: object
      description: |
        补丁式 kds_state_changed（新版收银端事件驱动格式）：仅携带变更行补丁，不再携带 orders/lines/dish_availability 全量快照。
        patches 内各行使用正式 order_id/detail_id，字段与 KdsV2LinePatch 对齐；行局部 local_revision/order_revision 语义不变。
        无 payload.device_code——发布者身份仅由 X-Cashier-Device-Code 请求头鉴权；command_id 作为操作幂等键（等价旧版 operation_id）。
      required: [operation_type, patches]
      properties:
        operation_type:
          type: string
          enum: [advance_item, advance_order, revoke_item, lack_item, refund_item, rush_item, rush_order, hold_item, release_item, complete_order, archive_order, archive_clear]
        command_id: { type: string, maxLength: 128, description: 操作幂等键，等价旧版 operation_id }
        duplicate: { type: boolean }
        event_seq: { type: integer, format: int64, minimum: 1, description: 收银端本地权威序号，云端不据此排序 }
        patches:
          type: array
          minItems: 1
          description: 变更行补丁（部分集合，不要求覆盖订单全部明细）；各行 order_id/order_revision 必须一致。未映射行（云端出生订单上的本地加菜行）可额外携带 local_detail_id 别名，云端按快照语义创建正式明细并在 ACK data.detail_mappings 回传映射
          items: { $ref: '#/components/schemas/KdsV2LinePatch' }
        queue_counts: { type: object, additionalProperties: { type: integer }, description: 收银端队列计数快照，云端忽略 }
        actor_device_code: { type: string, nullable: true, description: 操作来源设备（可能是 KDS 显示屏），不参与发布者鉴权 }

    KdsReplicationBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/KdsReplicationEventRequest' }

    KdsReplicationStateOrderSnapshot:
      allOf:
        - $ref: '#/components/schemas/KdsV2OrderSummary'
        - type: object
          properties:
            local_order_id: { type: integer, format: int64, minimum: 1, deprecated: true, description: 旧版映射别名；新版仅传继承 schema 的正式 order_id }

    KdsReplicationStateLineSnapshot:
      allOf:
        - $ref: '#/components/schemas/KdsV2LinePatch'
        - type: object
          properties:
            local_order_id: { type: integer, format: int64, minimum: 1, deprecated: true, description: 旧版 order_id 映射别名 }
            local_detail_id: { type: integer, format: int64, minimum: 1, deprecated: true, description: 旧版 detail_id 映射别名 }

    KdsReplicationBatchResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data:
          type: object
          required: [results, accepted, failed]
          properties:
            results:
              type: array
              maxItems: 50
              items:
                type: object
                required: [event_id, http_status, code, msg]
                properties:
                  event_id: { type: string, nullable: true }
                  http_status: { type: integer }
                  code:
                    type: integer
                    enum: [0, 4000, 4030, 4090, 4091, 4092, 5000]
                    description: 4092 表示同一 batch 中该 aggregate 的更早事件未成功，本项未提交给复制服务。
                  msg: { type: string }
                  data:
                    type: object
                    nullable: true
                    properties:
                      event_id: { type: string, nullable: true }
                      aggregate_key: { type: string }
                      accepted: { type: boolean }
                      duplicate: { type: boolean }
                      blocked: { type: boolean, description: true 时本项因同 aggregate 前序失败/pending 被阻断 }
                    additionalProperties: true
            accepted: { type: integer, minimum: 0, maximum: 50 }
            failed: { type: integer, minimum: 0, maximum: 50 }

    KdsReplicationDeadLetter:
      type: object
      required: [event_id, event_type, aggregate_key, status]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        aggregate_key: { type: string }
        status: { type: string, enum: [dead_letter, failed] }
        error_code: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        retry_count: { type: integer, minimum: 0 }
        dead_lettered_at: { type: string, format: date-time, nullable: true }
        resolution_action: { type: string, enum: [retry, replace, discard], nullable: true }
        replacement_event_id: { type: string, nullable: true }

    KdsReplicationDeadLetterListResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/KdsReplicationDeadLetter' }

    KdsReplicationDiscardResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data:
          type: object
          required: [event_id, discarded]
          properties:
            event_id: { type: string }
            discarded: { type: boolean, enum: [true] }

    KdsAuthorityConfigSnapshotResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data: { $ref: '#/components/schemas/KdsAuthorityConfigSnapshot' }

    KdsAuthorityConfigSnapshot:
      type: object
      required: [version, shop_id, catalog, routing, workflow, sla, fixed_order]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        shop_id: { type: integer, minimum: 1 }
        catalog:
          type: array
          description: 上架菜品，严格按后端 sorting、dish_id 排序
          items: { type: object, additionalProperties: true }
        routing:
          type: array
          items: { type: object, required: [dish_id, screen_tag], properties: { dish_id: { type: integer }, screen_tag: { type: string } } }
        workflow: { type: object, additionalProperties: true }
        sla: { type: object, additionalProperties: true }
        fixed_order:
          type: array
          description: 与 catalog 同序的 dish_id；客户端不得自行重排
          items: { type: integer }
        cashier_authority:
          type: object
          nullable: true
          description: |
            唯一允许作为本店 KDS LAN 权威源启动的收银设备。收银端必须比较本机 device_code；
            不一致时禁止启动权威 LAN 服务，只可作为非权威终端运行。
          required: [cashier_device_code, enforcement]
          properties:
            cashier_device_code: { type: string, maxLength: 64 }
            enforcement: { type: string, enum: [primary_only] }

    KdsReplicationResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, nullable: true }
        data:
          type: object
          required: [event_id, accepted, duplicate]
          properties:
            event_id: { type: string }
            accepted: { type: boolean }
            duplicate: { type: boolean }
            ignored_old_revision: { type: boolean }
            cloud_order_id: { type: integer }
            cloud_order_no: { type: string }
            cloud_detail_id: { type: integer }
            local_revision: { type: integer, format: int64 }
            detail_mappings:
              type: array
              items:
                type: object
                properties:
                  local_detail_id: { type: integer, format: int64 }
                  cloud_detail_id: { type: integer }

    # 统一响应码约定：code=0 成功，非 0 失败；msg 为提示；业务数据通过 put 注入
    CoordinateConvention:
      type: object
      description: |
        **定位坐标系约定（强制，全端适用）**

        | 项目 | 约定 |
        |------|------|
        | 标准坐标系 | **GCJ-02**（高德地图 / 国测局火星坐标） |
        | 输入声明 | `coordinate_type`: `gcj02`（默认）、`wgs84`、`bd09` |
        | 百度来源处理 | 声明 `bd09`，由服务端 **BD-09 → GCJ-02** 后保存 |
        | 小程序 | 高德定位 SDK，或 `wx.getLocation` 且 **`type: gcj02`** |
        | 运营后台 | 高德选点声明 `gcj02`；OSM/Nominatim 选点声明 `wgs84` |
        | 外卖 | **`t_user_address`**、**`t_takeout_delivery.lng/lat`** 及距离计算统一为 GCJ-02 |
        | 第三方 | 真省钱下单出站转换为 `coordinateType=1` 的 BD-09；轨迹入站转换回 GCJ-02 并重新计算 ETA |

        未按约定提交可能导致：配送费距离偏差、真省钱 50 米店址校验失败、地图标点偏移等。
      properties: {}

    ApiResponse:
      type: object
      properties:
        code: { type: integer, description: '0 成功，非 0 失败' }
        msg: { type: string }
      required: [code]

    # ---------- 数据分析 GET /admin/analytics/*（字段中文说明供前端展示）----------
    AnalyticsOccupancyAssumption:
      type: object
      description: 上座率估算假设（与 derived 中 seat_occupancy_rate 配套展示）
      properties:
        seats_per_table: { type: integer, description: 假设每桌餐位数，默认 4 }
        meals_per_day: { type: integer, description: 假设每日餐次数，默认 2（午+晚） }
        note: { type: string, description: 上座率公式说明文案 }

    AnalyticsBusinessDerived:
      type: object
      description: 派生指标（同一套 core 下，自然日与营业日仅 day_count 及依赖天数的比率不同）
      properties:
        dimension:
          type: string
          description: 维度标识；natural_calendar=自然日历，business_day=营业日（open_time 起点 / settle_time 截止，门店配置优先、默认 16:00～次日 04:00）
        avg_ticket: { type: number, description: 客单价（元），净收入 ÷ 订单数 }
        refund_rate_on_gross: { type: number, description: 退款率，退款合计 ÷ 折前流水（sett+service_fee） }
        table_count: { type: integer, description: 门店桌台总数（来自 t_table；无门店上下文时为全表） }
        day_count: { type: integer, description: 用于翻台/上座率分母的天数；自然维=日历天数，营业维=结果集中去重营业日数 }
        day_count_note: { type: string, description: 对 day_count 含义的补充说明，可直接作副标题 }
        table_turnover_per_table_per_day: { type: number, description: 翻台率代理，堂食订单数÷桌台数÷day_count }
        seat_occupancy_rate: { type: number, description: 上座率代理，堂食用餐人数÷(桌台×餐位×day_count×餐次) }
        occupancy_assumption:
          $ref: '#/components/schemas/AnalyticsOccupancyAssumption'

    AnalyticsBusinessCore:
      type: object
      description: 时间窗内已结账有效订单的汇总（与后端统计口径一致）
      properties:
        order_count: { type: integer, description: 订单笔数 }
        net_revenue: { type: number, description: 净收入（元），sett+service_fee-discount-refund }
        gross_before_discount: { type: number, description: 折前流水（元），sett+service_fee 合计 }
        discount_total: { type: number, description: 优惠金额合计（元） }
        refund_total: { type: number, description: 退款金额合计（元） }
        diner_sum_all: { type: number, description: 用餐人数合计（含堂食与打包等所有单） }
        diner_sum_dine_in: { type: number, description: 堂食订单的用餐人数合计 }
        dine_in_order_count: { type: integer, description: 堂食订单笔数（dineInOrTakeOut=堂食） }

    AnalyticsTimeSlotRow:
      type: object
      description: 分时段一行（净额与单量）
      properties:
        slot_key:
          type: string
          description: |
            时段键。墙钟分段：breakfast 早市(05–10) / lunch 午市(10–16) / dinner 晚市(16–22) / late_night 夜宵(其余)。
            营业锚点分段：bd_evening / bd_late_night / bd_breakfast / bd_lunch（固定墙钟锚点 16:00，与门店营业日窗口 [open_time, settle_time) 解耦）。
        net_revenue: { type: number, description: 该时段净收入（元） }
        order_count: { type: integer, description: 该时段订单笔数 }

    AnalyticsHourlySlotRow:
      type: object
      description: 小时级分时段一行（净额、单量与平均单笔）
      properties:
        hour_key:
          type: string
          description: |
            小时键。墙钟小时序列为 00\u201323；营业日小时序列为 bd_hour_00\u2026bd_hour_23
            （以门店 open_time 为营业日起点，默认 16:00，即 16:00\u201317:00 对应 bd_hour_00）。
        start: { type: string, description: 该桶墙钟开始时刻（HH:00） }
        end: { type: string, description: 该桶墙钟结束时刻（HH:00，不含） }
        net_revenue: { type: number, description: 该小时净收入（元） }
        order_count: { type: integer, description: 该小时订单笔数 }
        avg_ticket: { type: number, description: 平均单笔（净额/笔数，无单量为 0） }

    AnalyticsPaymentChannelRow:
      type: object
      description: 支付渠道一行
      properties:
        channel_key:
          type: string
          description: 渠道归类键；wechat 微信 / alipay 支付宝 / cash 现金 / member_balance 会员余额 / other 其他
        net_revenue: { type: number, description: 该渠道净收入（元） }
        order_count: { type: integer, description: 该渠道订单笔数 }

    AnalyticsBusinessTimeDefinition:
      type: object
      description: 各维度与分时段含义（可整块展示为说明区）
      properties:
        natural_calendar: { type: string, description: 自然日维度说明 }
        business_day: { type: string, description: 营业日标签说明（open_time 起点 / settle_time 截止，门店配置优先、默认 16:00～次日 04:00） }
        time_slots_natural_clock: { type: string, description: 墙钟分时段说明 }
        time_slots_business_anchor: { type: string, description: 营业锚点分时段说明 }
        time_slots_hourly: { type: string, description: 墙钟小时逐时说明 }
        time_slots_business_hourly: { type: string, description: 营业日小时序列说明 }

    AnalyticsBusinessCalendarBlock:
      type: object
      properties:
        derived:
          $ref: '#/components/schemas/AnalyticsBusinessDerived'

    AnalyticsBusinessData:
      type: object
      description: GET /admin/analytics/business 的 data 载荷
      properties:
        time_definition:
          $ref: '#/components/schemas/AnalyticsBusinessTimeDefinition'
        core:
          $ref: '#/components/schemas/AnalyticsBusinessCore'
        natural_calendar:
          $ref: '#/components/schemas/AnalyticsBusinessCalendarBlock'
        business_day:
          $ref: '#/components/schemas/AnalyticsBusinessCalendarBlock'
        time_slots_natural_clock:
          type: array
          description: 按墙钟时刻划分的早/午/晚/夜宵营收
          items: { $ref: '#/components/schemas/AnalyticsTimeSlotRow' }
        time_slots_business_anchor:
          type: array
          description: 固定墙钟锚点四段营收（以 16:00 为锚，与门店营业日窗口 [open_time, settle_time) 解耦）
          items: { $ref: '#/components/schemas/AnalyticsTimeSlotRow' }
        time_slots_hourly:
          type: array
          description: 墙钟小时逐时营收（00\u201323，与自然钟点四段同口径；仅返回有订单的小时桶）
          items: { $ref: '#/components/schemas/AnalyticsHourlySlotRow' }
        time_slots_business_hourly:
          type: array
          description: 营业日小时序列（以门店 open_time 为起点、默认 16:00；键 bd_hour_00\u2026bd_hour_23，与营业锚点四段同口径）
          items: { $ref: '#/components/schemas/AnalyticsHourlySlotRow' }
        payment_channels:
          type: array
          description: 支付渠道占比（金额与笔数）
          items: { $ref: '#/components/schemas/AnalyticsPaymentChannelRow' }

    AnalyticsBusinessResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AnalyticsBusinessData'

    AnalyticsTrendSeriesRow:
      type: object
      description: 趋势图一个横坐标桶
      properties:
        bucket_label: { type: string, description: 横轴标签；自然维为自然日/周/月/年，营业维为营业日标签分桶 }
        net_revenue: { type: number, description: 该桶内净收入（元） }
        order_count: { type: integer, description: 该桶内订单笔数 }

    AnalyticsTrendSeriesBlock:
      type: object
      properties:
        series:
          type: array
          description: 按 granularity 聚合后的序列，按 bucket_label 升序
          items: { $ref: '#/components/schemas/AnalyticsTrendSeriesRow' }

    AnalyticsTrendTimeDefinition:
      type: object
      properties:
        natural_calendar: { type: string, description: 自然日历分桶说明 }
        business_day: { type: string, description: 营业日标签分桶说明 }

    AnalyticsTrendData:
      type: object
      description: GET /admin/analytics/business/trend 的 data 载荷
      properties:
        granularity:
          type: string
          enum: [day, week, month, year]
          description: 聚合粒度；day 按日、week 按 ISO 周、month 按月首、year 按年
        natural_calendar:
          $ref: '#/components/schemas/AnalyticsTrendSeriesBlock'
        business_day:
          $ref: '#/components/schemas/AnalyticsTrendSeriesBlock'
        time_definition:
          $ref: '#/components/schemas/AnalyticsTrendTimeDefinition'

    AnalyticsTrendResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AnalyticsTrendData'

