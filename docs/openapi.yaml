  /kds/order/rush:
    post:
      deprecated: true
      x-kds-retired: true
      x-kds-retired-status: 410
      tags: [KDS-Client]
      summary: 订单/明细加急（催菜）
      description: |
        将指定订单（可选 **`detail_id`**）在**全店各屏**相关工单打上 **`rush_flag=1`** 并写入 **`rush_at`**，随后 WS 广播 **`dish_flags_changed`**（多屏同步）。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: integer }
                detail_id: { type: integer, description: '可选，仅催该明细' }
      responses:
        '200':
          description: 成功，body 含 updated、order_id、tickets[]（含 rush_flag 等）

  /kds/workflow/bootstrap:
    get:
      tags: [KDS-Client]
      summary: 工作流多队列冷启动 bootstrap（SW0-02）
      x-kds-profile: cloud-or-cashier-lan
      description: |
        冷启动时一次拉取多个兄弟队列 board，替代并行 N 次 **`GET /kds/workflow/board`**。
        响应 **`queues`** 为 map：键为队列名，值为与单队列 board 同结构的快照（含 **`order_cards`** / **`dish_groups`**）。
        未传 **`queues`** 时默认设备 **`visible_queues`**（不含 **`done`** 时可自行拼接）。
        详见 **`docs/backend_seamless_workflow_coordination.md`** §8。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
        - name: queues
          in: query
          schema:
            type: string
            example: pending_prep,pending_cook,ready_serve
          description: 逗号分隔队列列表
        - name: view
          in: query
          schema: { type: string, enum: [order, dish], default: order }
        - name: dining
          in: query
          schema: { type: string, enum: [all, dine_in, pack, takeout], default: all }
        - name: extra
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [fifo, overdue_first, rush_first] }
        - name: merge_rules
          in: query
          schema: { type: string }
        - name: split_pack_takeout
          in: query
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: |
            **`code=0`**；**`queues`** 多队列 board；**`visible_queues`**、**`queue_counts`** 与单 board 一致。

  /kds/workflow/board:
    get:
      tags: [KDS-Client]
      x-kds-profile: cloud-or-cashier-lan
      summary: KDS 统一工作流看板
      description: |
        统一 BoardPage 数据源，用于替代前端按抓串屏 / 烤制屏 / 出餐屏拆页面的模式。

        **设备与 Tab**：
        - 建议设备以 **`screen_tag=workflow_board`** 登录，并在 `device.workflows` 中声明负责流程（`prep` / `cook` / `serve`，可多选）。
        - 前端可见 Tab 由 `device.workflows` 决定：`prep → pending_prep`、`cook → pending_cook`、`serve → ready_serve`，并总是可展示 `done`。
        - 旧屏型设备也可兼容调用；服务端可按旧屏型推导可见队列。

        **队列映射**：
        - **`pending_prep`**：`skewer_picked=0` 且 `item_status=0`（需 `skewer_gate=1`）。
        - **`pending_cook`**：`item_status=0` 且 `skewer_picked=1`。
        - **`ready_serve`**：`item_status=2` 且 `archived=0`。
        - **`done`**：`archived=1`；仅含**当前营业日**（门店 **open_time** 起点，默认 **16:00**；**v1.2.147** 引入）内归档工单（与 **`/admin/order/todayCount`** 一致）。

        **统一返回**：三队列的 **`dish_groups[]`** 均含 **`lines[]`**（台号、订单号、加急、超时、加菜、等叫等）；**特殊标签以菜品/明细为准**（如只催「油边」则仅该菜 **`rush_flag=1`**，同单其它菜为 0）。**`view=order`** 时 **`order_cards[].items[]`** 带行级标签（订单卡本身不含整单级催/超/等/加标）。搜索 **`keyword`** 命中菜名、桌号、订单号。

        **合并规则（美团模式，v1.2.127）**：
        - **默认（不传 `merge_rules`）**：读取门店 **`t_kds_shop_config`**：**`merge_same_dish=1`** 时同烤制屏内跨订单/跨桌合并（菜名+规格+口味）；**`pack_inline_merge=1`** 时堂食与打包内嵌同一行（**`dining_breakdown_text`** 如「堂10｜打包5」）；**`combo_merge=0`** 时套餐菜独立成行。配置对 **全部队列** 生效。
        - **`merge_rules=none`**：临时按明细一行（一桌一行），覆盖门店配置。
        - **`merge_rules=dish`**：临时启用跨单合并（与门店 `merge_same_dish=1` 一致）；标签打在 **`lines[]`** 上不拆组。
        - **`split_pack_takeout=1`** 或门店 **`pack_inline_merge=0`**：堂/打包/外卖拆行（晚高峰防风干）。
        - 响应含 **`merge_same_dish`**、**`pack_inline_merge`**、**`combo_merge`**、**`cross_order_merge`**；全局 **FIFO**（组内取最早 `fifo_seq`）。
        WebSocket 建议复用 **`/ws/kds`**，统一看板设备订阅 `screen_tag=workflow_board`；收到 `new_order` / `update_order` / `cancel_item` / `cancel_order` / `dish_flags_changed` 后局部处理，载荷不足时刷新本接口。当前后端不发送 `board_changed`。

        **性能配合（v1.2.139）**：响应**始终**含 **`queue_counts`**（`pending_prep`/`pending_cook`/`ready_serve`/`done`，计数与当前 `dining`/`extra`/`keyword` 一致，供 Tab 角标）；**`view=dish`** 时附带精简 **`order_cards`**（`order_id`/`order_no`/`remark` 等，避免二次 HTTP 拉备注）；可选 **`stats`** 合并今日统计（同 **`GET /kds/stats/today`**）。详见 **`docs/backend_performance_coordination.md`**。

        **订单维度（v1.2.140 / v1.2.152）**：**`view=order`** 时筛选决定订单是否出现在列表，**`order_cards[].items[]`** 须为该单**全量菜品**（含其它 **`workflow_queue`** 行，供跨流程删除线展示）；每行 **`workflow_queue`** 为真实流程态；**`quantity`**=该行所在流程的 remaining；**`dining`/`extra`/`keyword`** 仅过滤订单、不裁剪单内 items。详见 **`docs/backend_order_full_order_pool_coordination.md`**。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
        - name: queue
          in: query
          required: true
          schema: { $ref: '#/components/schemas/KdsBoardQueue' }
          description: 当前 Tab 队列。
        - name: view
          in: query
          schema: { $ref: '#/components/schemas/KdsBoardView' }
        - name: dining
          in: query
          schema: { $ref: '#/components/schemas/KdsDiningFilter' }
        - name: extra
          in: query
          schema:
            type: string
            example: overdue,rush,add_dish,hold
          description: 逗号分隔的标签筛选。
        - name: keyword
          in: query
          schema: { type: string }
          description: 菜品名 / 桌号 / 流水号关键词。
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/KdsWorkflowSort' }
          description: 保留兼容；未传时服务端按 **fifo**（`fifo_seq` 升序）排序。
        - name: merge_rules
          in: query
          schema:
            type: string
            example: dish,dining
          description: |
            可选合并规则，逗号分隔：`dish`、`dining`、`tags`（可组合）；`none`/`fifo`/`明细` 表示不合并。
            未传时按门店 **`merge_same_dish`**；`none` 强制不合并。
        - name: split_pack_takeout
          in: query
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
            example: '1'
          description: |
            打包外卖单独拆行开关。`1`/`true` 时打包、外卖菜品单独成行；堂食（含加菜轮次）同菜名+规格+口味可合并。
            与 `merge_rules=dining` 全量按就餐拆分互斥时优先本开关语义（仅拆打包/外卖）。
      responses:
        '200':
          description: '`code=0`，业务字段见 **KdsWorkflowBoardResponse**'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 0 }
                  - { $ref: '#/components/schemas/KdsWorkflowBoardResponse' }
        '401': { description: 缺少或无效 X-Kds-Device-Token }
        '403': { description: 当前设备 workflows 不允许访问该 queue }

  /kds/workflow/archived-history:
    get:
      tags: [KDS-Client]
      summary: 归档工单完成时刻追溯
      description: |
        按 **`archived_at`** 倒序分页查询 **`archived=1`** 工单，返回各阶段完成时刻与 **`completed_wait_seconds`**，供离线对账与历史追溯（**v1.2.144**）。
        默认仅返回**当前营业日**（门店 **open_time** 起点，默认 **16:00**；**v1.2.147** 引入）内归档记录；指定 **`order_id`** / **`detail_id`** 时仍可在窗内按 id 过滤。
        下一页将响应中的 **`next_before`** 作为 **`before`** 参数传入（毫秒时间戳或 ISO date-time）。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          schema: { type: string, description: 分页游标，仅返回 archived_at 早于此时刻的记录 }
        - name: detail_id
          in: query
          schema: { type: integer, description: 可选，按明细 id 过滤 }
        - name: order_id
          in: query
          schema: { type: integer, description: 可选，按订单 id 过滤 }
      responses:
        '200':
          description: '`code=0`，见 **KdsArchivedHistoryResponse**'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 0 }
                  - { $ref: '#/components/schemas/KdsArchivedHistoryResponse' }
        '401': { description: 缺少或无效 X-Kds-Device-Token }

  /kds/workflow/advance:
    post:
      deprecated: true
      x-kds-retired: true
      x-kds-retired-status: 410
      tags: [KDS-Client]
      summary: KDS 统一工作流单品推进
      description: |
        按当前队列将单个菜品推进到下一环节（支持数量化）：
        - `from_queue=pending_prep`：配菜 `quantity` 串（默认 1），累加 **`prep_quantity`**，未满则仍留待配菜，满则进入待制作。
        - `from_queue=pending_cook`：制作 `quantity` 串，累加 **`cooked_quantity`**，进入待传菜池。
        - `from_queue=ready_serve`：传菜确认，累加 **`served_quantity`**；传完后进入 `done`。

        `detail_id` 为 **`t_order_detail.id`**。传 **`detail_ids`**（按工单 `created_at` FIFO）可在合并菜品组上一次配 N 串。
        各队列均可传 **`quantity`**（默认 1）。
        成功后服务端应返回推进后的队列、剩余数量与更新工单，并通过 WebSocket 推送相关屏。
        整单全部传菜完成时 **`t_kds_order.kds_order_status`** 更新为 **40**（整单制作完成）。仅当门店 **`auto_off_order_on_kds_done=1`** 时联动 **`order_receiving=off_order`**（见 **v1.2.136**）。
        **`from_queue=ready_serve`** 且门店 **`serve_print_enabled=1`** 时按本次传菜数量打印飞鹅传菜单，**每条订单明细一张**（见 **v1.2.134**、**v1.2.137**）。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsWorkflowAdvanceRequest' }
            examples:
              cook:
                summary: 待制作推进到待传菜
                value:
                  detail_id: 123
                  from_queue: pending_cook
              serve:
                summary: 待传菜传 2 份
                value:
                  detail_id: 123
                  from_queue: ready_serve
                  quantity: 2
      responses:
        '200':
          description: '`code=0`，业务字段见 **KdsWorkflowAdvanceResponse**'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      code: { type: integer, example: 0 }
                  - { $ref: '#/components/schemas/KdsWorkflowAdvanceResponse' }
        '400': { description: 参数错误、队列不匹配或传菜数量超出剩余量 }
        '401': { description: 缺少或无效 X-Kds-Device-Token }
        '403': { description: 当前设备 workflows 无权推进该队列 }

  /kds/workflow/advance-item:
    post:
      deprecated: true
      x-kds-retired: true
      x-kds-retired-status: 410
      tags: [KDS-Client]
      summary: KDS 工作流单品推进（快速划菜）
      x-kds-profile: cloud-or-cashier-lan
      description: |
        **Cloud compatibility** 与 **Cashier LAN** 的幂等/冲突字段不同：
        - Cloud compatibility：`client_id`（建议 UUID）+ 可选 `row_version`；历史版本冲突可能在 HTTP 200 响应体返回 `code=5001`。
        - Cashier LAN：`operation_id`（必填、重试必须复用）+ `expected_local_revision`；重复操作返回首次 patch 并置 `duplicate=true`，版本或队列冲突返回 HTTP 409 / `code=4090`，客户端应拉权威快照而非盲重试。

        云端当前实现与 **`POST /kds/workflow/advance`** 使用同一同步推进逻辑。
        单条返回 **`KdsWorkflowAdvanceResponse`**；合并组传 `detail_ids[]` 时按 FIFO 推进并返回 **`KdsWorkflowAdvanceFifoResponse`**。
        单条可选 **`row_version`** 乐观锁，冲突时响应体 **`code=5001`**；批量入口当前不逐条使用 `row_version`。
        可选传 **`expected_order_id`**、**`expected_table_number`**、**`expected_dish_name`** 作为前端快照上下文；后端会在事务内校验，避免旧卡片、旧桌号、旧菜名误划。
        推进成功后通过 WS `update_order` 通知其它设备。需要单条最小 HTTP patch 时优先调用 **`POST /kds/item/status/update`**。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/KdsWorkflowAdvanceRequest'
                - $ref: '#/components/schemas/KdsLanWorkflowAdvanceRequest'
      responses:
        '200':
          description: '`code=0`，快速路径见 **KdsWorkflowAdvanceFastResponse**；FIFO 批量见 **KdsWorkflowAdvanceFifoResponse**'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - type: object
                        properties:
                          code: { type: integer, example: 0 }
                      - { $ref: '#/components/schemas/KdsWorkflowAdvanceResponse' }
                  - allOf:
                      - type: object
                        properties:
                          code: { type: integer, example: 0 }
                      - { $ref: '#/components/schemas/KdsWorkflowAdvanceFifoResponse' }
                  - $ref: '#/components/schemas/KdsLanWorkflowAdvanceResponse'
        '400': { description: 参数错误、队列不匹配或传菜数量超出剩余量 }
        '401': { description: 缺少或无效 X-Kds-Device-Token }
        '403': { description: 当前设备 workflows 无权推进该队列 }
        '409':
          description: Cashier LAN 的版本/队列快照冲突（`code=4090`）；重新拉取 board/item 快照，不得当作前置 outbox 事件重试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KdsLanConflictResponse' }

  /kds/workflow/lack:
    post:
      deprecated: true
      x-kds-retired: true
      x-kds-retired-status: 410
      tags: [KDS-Client]
      summary: KDS 工作流缺货
      description: |
        待配菜/待制作队列上报缺货：回写点餐系统（退菜或减量、回退库存）、作废/收敛 KDS 工单；
        门店 **`lack_sets_sold_out=1`** 时联动菜品 **`sold_out=1`** 并推送菜单变更。
