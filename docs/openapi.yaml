    - **v1.2.200（线下收款商户路由以订单为准）**：收银模式调用 **`POST /pay/offline-collect/temp-qrcode`** 时，服务端从当前门店未结账订单的 **`t_order.merchantId`** 获取商户路由；请求体中的 `merchantId`/`merchant_id` 不能覆盖订单。订单值为 **`2`** 且 `channel=wechat` 时，二维码矩阵、跳转 token 和响应 `merchantId` 均使用商户 2 固定微信 payload。
