      x-permission: admin:manage
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      total: { type: integer, description: 记录总数, example: 252 }
                      list:
                        type: array
                        description: 接口权限映射列表，按 path_pattern 升序
                        items: { $ref: '#/components/schemas/ApiPermission' }
        '500': { description: 失败 }
    post:
      tags: [权限管理, 运营后台]
      summary: 新增或编辑接口-权限映射
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      description: |
        校验 permission_code 是否存在于 t_permission。**path_pattern 唯一**（表唯一键 `uk_path_pattern`：同一路径仅允许一条映射，不区分 method）；
        **method** 支持 GET/POST/PUT/DELETE/**`*`**（`*` 表示不区分方法）。
        v1.2.220 起新增/编辑（含改路径）前会**预检 path_pattern 唯一性**：已存在时返回可读错误
        「path_pattern 已存在映射（同一路径仅允许一条记录），如需支持多方法请将原记录的 method 改为 *」，
        并发撞键亦返回可读错误而非 500；编辑原记录时按 id 排除自身。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, description: 更新时必传 }
                method: { type: string, enum: [GET, POST, PUT, DELETE] }
                path_pattern: { type: string, description: 路径模式，如 /admin/order/list }
                permission_code: { type: string, description: 所需权限码，必须在 t_permission.permission_code 中存在 }
                remark: { type: string, description: 接口备注，前端展示用，如 订单-列表 }
      responses:
        '200': { description: 成功 }
        '500': { description: 失败 }

