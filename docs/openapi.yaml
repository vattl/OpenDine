        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCouponId]
              properties:
                userCouponId: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
        '500': { description: 失败 }

  # ---------- 运营后台：门店公告（连锁）----------
  /admin/announcement/list:
