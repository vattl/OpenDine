      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: startTime
          in: query
          required: true
          description: 统计时间窗开始（含），格式 yyyy-MM-dd HH:mm:ss
          schema: { type: string }
        - name: endTime
          in: query
          required: true
          description: 统计时间窗结束（含），格式 yyyy-MM-dd HH:mm:ss
          schema: { type: string }
      responses:
        '200':
          description: 成功；data 内含优惠券与弹窗活动列表及 notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsMarketingResponse'

  # ---------- 收银系统扩展：操作日志 ----------
  /admin/order/log/{orderId}:
    get:
      tags: [操作日志, 运营后台]
      summary: 订单操作日志（谁点的、谁改的、谁结的）
      security: [{ BearerAuth: [] }]
      x-permission: log:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、list（OrderLog[]）
        '500': { description: 失败 }
  /admin/log/operation:
    get:
      tags: [操作日志, 运营后台]
      summary: 关键操作日志（历史兼容）
      deprecated: true
      description: 历史操作日志查询接口；自 v1.2.132 起废弃，请统一迁移至 GET /admin/logs（具备近 30 天硬边界、敏感信息脱敏与归档检索支持）。
      security: [{ BearerAuth: [] }]
      x-permission: log:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: module
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: tableNumber
          in: query
          description: 匹配源桌或目标桌
          schema: { type: string }
        - name: resultStatus
          in: query
          schema: { type: string, enum: [SUCCESS, REJECTED, ROLLED_BACK] }
        - name: requestKey
          in: query
          schema: { type: string }
        - name: traceId
          in: query
          schema: { type: string }
        - name: shopId
          in: query
          description: 指定已授权门店；与 X-Shop-Id/X-Shop-Code 冲突时拒绝。总部传 0 或不传时查看全局/未归店日志。
          schema: { type: integer }
        - name: allShops
          in: query
          description: 仅总部管理员可设为 true，用于查看全部门店及全局安全审计日志。
          schema: { type: boolean, default: false }
        - name: startTime
          in: query
          schema: { type: string, format: date-time }
        - name: endTime
          in: query
          schema: { type: string, format: date-time }
        - name: pageNum
          in: query
          schema: { type: integer }
        - name: pageSize
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、list、total；含桌台操作及安全审计（module=security）记录。门店账号仅能查看授权门店，总部可用 allShops=true 查看全部。
        '500': { description: 失败 }

  # ---------- 真省钱聚合配送（/api/zsq）----------
  /api/zsq/auth/login:
    post:
      tags: [真省钱配送]
      summary: 真省钱商户/接口方登录
      description: |
        调用真省钱远端登录接口，返回 **authorization**（一般为 `Bearer eyJ...`）。
        后续需鉴权的 `/api/zsq/**` 接口在 Header 携带该值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZsqLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZsqLoginResponse'
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'
        '502':
          description: 真省钱远端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'

  /api/zsq/auth/login/config:
    post:
      tags: [真省钱配送]
      deprecated: true
      summary: 已停用的配置账号代理接口
      description: 返回 HTTP 410，不调用第三方配置账号。请使用已有管理员配送接口。
      responses:
        '410':
          description: 配置账号代理接口已停用

  /api/zsq/auth/verify:
    get:
      tags: [真省钱配送]
      summary: 校验真省钱 token 是否有效
      security: [{ ZsqAuthorization: [] }]
      responses:
        '200':
          description: 成功，data 为真省钱商户信息摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
        '502':
          description: token 无效或真省钱远端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'

  /api/zsq/orders/shops:
    get:
      tags: [真省钱配送]
      summary: 发单店铺列表
      security: [{ ZsqAuthorization: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ZsqShopAddress'
        '502':
          description: 真省钱远端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'

  /api/zsq/orders/address/tips:
    get:
      tags: [真省钱配送]
      summary: 收货地址联想（高德 input-tips）
      security: [{ ZsqAuthorization: [] }]
      parameters:
        - name: city
          in: query
          required: true
          schema: { type: string }
          description: 城市名，如「江门市」
        - name: keywords
          in: query
          required: true
          schema: { type: string }
          description: 地址关键词
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ZsqAddressTip'
        '502':
          description: 真省钱远端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'

  /api/zsq/orders/takeaway:
    post:
      tags: [真省钱配送]
      summary: 创建外卖订单（仅保存，不发配送）
      security: [{ ZsqAuthorization: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZsqCreateTakeawayOrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZsqCreateOrderResult'
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'
        '502':
          description: 真省钱远端错误（如地址解析失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'

  /api/zsq/orders/takeaway/auto:
    post:
      tags: [真省钱配送]
      deprecated: true
      summary: 已停用的配置账号代理接口
      description: 返回 HTTP 410，不调用第三方配置账号。请使用已有管理员配送接口。
      responses:
        '410':
          description: 配置账号代理接口已停用

  /api/zsq/orders/takeaway/dispatch:
    post:
      tags: [真省钱配送]
      summary: 一键下单（创建订单 + 询价 + 发配送）
      description: |
        流程：创建外卖订单 → 拉订单详情 → **`POST /delivery/order/billing`** 询价 → 选最便宜可用渠道 → **`POST /delivery/order/create`** 发配送。
        账户余额不足时真省钱返回「余额不足，请充值」。
      security: [{ ZsqAuthorization: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZsqCreateTakeawayDispatchRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZsqTakeawayDispatchResult'
        '400':
          description: 参数校验失败
        '502':
          description: 真省钱远端错误（如无可用配送渠道、余额不足）

  /api/zsq/orders/takeaway/dispatch/auto:
    post:
      tags: [真省钱配送]
      deprecated: true
      summary: 已停用的配置账号代理接口
      description: 返回 HTTP 410，不调用第三方配置账号。请使用已有管理员配送接口。
      responses:
        '410':
          description: 配置账号代理接口已停用

  /api/zsq/orders/{openOrderId}/tracking:
    get:
      tags: [真省钱配送]
      summary: 骑手实时定位与 ETA
      description: |
        合并真省钱订单详情与配送时间线，返回骑手坐标、商家/用户坐标及 ETA。
        - **platformEta**：真省钱平台文案（如 riderDistance、riderDurationText）
        - **computedEta**：基于 Haversine + **`zsq.rider-speed-kmh`** 估算的 toShopMinutes / toUserMinutes
        - **phase**：`WAITING_RIDER` | `TO_SHOP`（deliverySendStatus=30）| `TO_USER`（40）| `DELIVERED` | `CANCELLED`
      security: [{ ZsqAuthorization: [] }]
      parameters:
        - name: openOrderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 创建订单返回的 **id**（openOrderId）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ZsqApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZsqRiderTrackingResponse'
        '502':
          description: 真省钱远端错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsqApiResult'

  /api/zsq/orders/{openOrderId}/tracking/auto:
    get:
      tags: [真省钱配送]
      deprecated: true
      summary: 已停用的配置账号代理接口
      description: 返回 HTTP 410，不调用第三方配置账号。请使用已有管理员配送接口。
      parameters:
        - in: path
          name: openOrderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '410':
          description: 配置账号代理接口已停用

  /order/banners:
    get:
      tags: [认证与用户]
      summary: 获取启用的轮播图列表
      responses:
        '200':
          description: 成功，body 含 code、banners（Banner[]）
        '500':
          description: 失败

  # ---------- 运营 APP：推送与版本 ----------
  /admin/push/device/register:
    post:
      tags: [运营后台]
      summary: 注册运营 APP 推送设备
      description: 登录后按当前账号与门店绑定设备令牌；同一 deviceToken 再注册会迁移到最新账号、门店和设备信息。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken, platform, channel]
              properties:
                deviceToken: { type: string, maxLength: 512 }
                platform: { type: string, enum: [android, ios] }
                channel: { type: string, enum: [apns, fcm, huawei, xiaomi, oppo, vivo] }
                appVersion: { type: string, maxLength: 32, example: 2.0.1+202 }
                deviceModel: { type: string, maxLength: 128 }
      responses:
        '200': { description: '成功，body 为 `{code: 0, msg: 注册成功}`' }
        '400': { description: 参数或平台与推送渠道不匹配 }
        '4001': { description: 缺少登录或门店上下文 }
  /admin/push/device/unregister:
    post:
      tags: [运营后台]
      summary: 解绑运营 APP 推送设备
      description: 退出登录或设备令牌失效时调用；仅解绑当前登录账号名下的令牌，不要求门店请求头。
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken]
              properties:
                deviceToken: { type: string, maxLength: 512 }
      responses:
        '200': { description: '成功，body 为 `{code: 0, msg: 解绑成功}`' }
        '401': { description: 未登录或登录已过期 }
  /admin/push/preference:
    post:
      tags: [运营后台]
      summary: 保存运营 APP 通知偏好
      description: types 为空数组表示当前门店下关闭全部业务通知；类型名使用小写字母、数字和下划线，最多 32 项。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  maxItems: 32
                  uniqueItems: true
                  items: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
                  example: [new_order, refund, table_call]
      responses:
        '200': { description: 成功，body 含 code、msg、types }
        '400': { description: types 格式不合法 }
        '4001': { description: 缺少登录或门店上下文 }
  /admin/app/version:
    get:
      tags: [运营后台]
      summary: 查询客户端/APP版本策略与升级决断（跨平台支持）
      description: |
        查询指定平台（windows/android/ios/desktop/pos_sunmi）和渠道当前启用的版本策略。
        支持客户端上报当前版本号（current_version）或版本代码（version_code）由服务端基于语义化版本（SemVer）
        统一裁决 hasUpdate（是否升级）、upgradeType（NONE/OPTIONAL/FORCE）以及分平台适配的 installMode（silent/interactive/store_redirect）。
      security: [{ BearerAuth: [] }]
      parameters:
        - name: platform
          in: query
          required: true
          description: 客户端操作系统或终端类型（支持 android, ios, windows, desktop, pos_sunmi 等）
          schema: { type: string, enum: [android, ios, windows, desktop, pos_sunmi] }
        - name: channel
          in: query
          required: false
          description: 渠道标识（windows/desktop 默认 pos，移动端默认 mobile）
          schema: { type: string, default: mobile }
        - name: current_version
          in: query
          required: false
          description: 客户端当前语义化版本号（如 2.0.0，别名 currentVersion）
          schema: { type: string, example: '2.0.0' }
        - name: version_code
          in: query
          required: false
          description: 客户端当前内部构建版本代码（如 200，别名 versionCode）
          schema: { type: integer, example: 200 }
        - name: shop_id
          in: query
          required: false
          description: 终端所属门店 ID（用于灰度版本准入判定，别名 shopId，也可通过 X-Shop-Id 标头传递）
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      platform: { type: string, example: windows }
                      channel: { type: string, example: pos }
                      latest: { type: string, example: 2.1.0 }
                      versionCode: { type: integer, example: 210 }
                      minSupported: { type: string, example: 2.0.0 }
                      forceUpdate: { type: boolean, example: false }
                      hasUpdate: { type: boolean, example: true }
                      upgradeType: { type: string, enum: [NONE, OPTIONAL, FORCE], example: OPTIONAL }
                      installMode: { type: string, enum: [silent, interactive, store_redirect], example: silent }
                      packageType: { type: string, enum: [full, wgt, diff, exe, msi, apk], example: full }
                      fileSize: { type: integer, nullable: true, example: 52428800 }
                      sha256: { type: string, nullable: true, example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 }
                      releaseNotes: { type: string, nullable: true, example: 优化收银界面性能 }
                      downloadUrl: { type: string, nullable: true, example: https://download.example.com/pos-2.1.0.exe }
        '400': { description: platform 或 channel 参数不合法 }
        '404': { description: 当前平台和渠道尚未发布版本策略 }
  /admin/app/versions:
    get:
      tags: [运营后台]
      summary: 获取全平台客户端版本策略列表（仅限超管）
      description: 仅限拥有 admin:super 权限的操作员调用。返回数据库中所有终端（Windows、Android、iOS 等）及渠道的版本策略配置。
      security: [{ BearerAuth: [] }]
      x-permission: admin:super
      responses:
        '200': { description: 成功，body 含 code=0 及 data 列表 }
        '403': { description: 无权限：admin:super }
  /admin/app/version/save:
    post:
      tags: [运营后台]
      summary: 发布或更新客户端版本策略（仅限超管）
      description: 仅限拥有 admin:super 权限的操作员调用。支持全量包/补丁、静默/交互/跳转安装模式、灰度名单与 SHA-256 完整性哈希。
      security: [{ BearerAuth: [] }]
      x-permission: admin:super
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, latest]
              properties:
                id: { type: integer, description: 策略ID（传参则更新，不传则按 platform+channel 幂等写入） }
                platform: { type: string, enum: [windows, android, ios, desktop, pos_sunmi] }
                channel: { type: string, default: pos }
                latest: { type: string, example: '2.1.0' }
                version_code: { type: integer, example: 20100 }
                min_supported: { type: string, example: '2.0.0' }
                force_update: { type: integer, enum: [0, 1] }
                package_type: { type: string, enum: [full, patch] }
                install_mode: { type: string, enum: [silent, interactive, store_redirect] }
                file_size: { type: integer }
                sha256: { type: string, maxLength: 64 }
                gray_shop_ids: { type: string, example: '1,2' }
                release_notes: { type: string }
                download_url: { type: string }
                enabled: { type: integer, enum: [0, 1] }
      responses:
        '200': { description: 保存成功 }
        '400': { description: 参数不合法或版本号非 SemVer 格式 }
        '403': { description: 无权限：admin:super }
  /admin/app/version/toggle-enabled:
    post:
      tags: [运营后台]
      summary: 启用/停用特定平台版本策略（仅限超管）
      security: [{ BearerAuth: [] }]
      x-permission: admin:super
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
        - name: enabled
          in: query
          required: true
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200': { description: 状态更新成功 }
        '403': { description: 无权限：admin:super }
        '404': { description: 策略不存在 }
  /admin/app/version/{id}:
    delete:
      tags: [运营后台]
      summary: 删除客户端版本策略（仅限超管）
      security: [{ BearerAuth: [] }]
      x-permission: admin:super
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 删除成功 }
        '403': { description: 无权限：admin:super }
  /admin/app/version/upload:
    post:
      tags: [运营后台]
      summary: 上传客户端安装更新包并自动计算签名与元数据（仅限超管）
      description: |
        仅限拥有 admin:super 权限的操作员调用。
        支持从管理端直接上传 Windows (.exe/.msi)、Android (.apk)、macOS (.dmg/.pkg)、Linux (.deb/.rpm/.appimage) 及 Uni-app (.wgt) 安装更新包（单文件上限 500MB）。
        服务端自动完成安全落盘归档（按平台/日期组织目录）、流式计算 SHA-256 哈希签名、提取字节大小、推导包类型，并生成标准公网下载直链；外链静态资源服务原生支持 HTTP 206 断点续传。
      security: [{ BearerAuth: [] }]
      x-permission: admin:super
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 安装包二进制文件（单文件最大 500MB）
                platform:
                  type: string
                  description: 客户端操作系统或终端类型（如 windows, android, ios, desktop, pos_sunmi 等）
                  example: windows
                channel:
                  type: string
                  description: 发行渠道标识（如 pos, mobile）
                  example: pos
      responses:
        '200':
          description: 安装包上传成功，返回完整元数据与下载直链
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: 安装包上传成功 }
                  data:
                    type: object
                    properties:
                      fileName: { type: string, example: pos-desktop-2.1.0.exe }
                      storedFileName: { type: string, example: windows/20261019/pos-desktop-2.1.0_a1b2c3d4.exe }
                      downloadUrl: { type: string, example: https://server.domain.com/admin/app/packages/windows/20261019/pos-desktop-2.1.0_a1b2c3d4.exe }
                      sha256: { type: string, example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b }
                      fileSize: { type: integer, example: 52428800 }
                      packageType: { type: string, example: exe }
                      platform: { type: string, example: windows }
                      channel: { type: string, example: pos }
        '400': { description: 上传文件为空或文件后缀名不在安全白名单内 }
        '403': { description: 无权限：admin:super }
        '500': { description: 服务端文件转存或哈希计算异常 }

  /admin/app/version/verify-url:
    post:
      tags: [运营后台]
      summary: 校验安装包下载直链连通性与远端 SHA-256（仅限超管）
      description: 供管理端与收银端在发布前探测安装包 URL 是否可在公网真实下载，验证是否被 Nginx 拦截为 HTML 假响应，以及实际 SHA-256 是否匹配。
      security: [{ BearerAuth: [] }]
      x-permission: admin:super
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [downloadUrl]
              properties:
                downloadUrl:
                  type: string
                  description: 待检测的下载直链 URL
                  example: https://www.laofei.com.cn/admin/app/packages/windows/Cashier-2.1.0.exe
                expectedSha256:
                  type: string
                  description: 期望匹配的 SHA-256 哈希值
                  example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      statusCode: { type: integer, example: 200 }
                      contentType: { type: string, example: application/octet-stream }
                      fileSize: { type: integer, example: 52428800 }
                      isHtmlFallback: { type: boolean, example: false }
                      actualSha256: { type: string, example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b }
                      hashMatched: { type: boolean, example: true }
                      warning: { type: string }
        '400': { description: 参数不合法 }
        '403': { description: 无权限：admin:super }

  /admin/app/packages/{path}:
    get:
      tags: [运营后台]
      summary: 客户端安装更新包直接下载通道（公开免签）
      description: 支持客户端断点续传（HTTP 206）与多物理目录自动寻址，强制输出二进制 Content-Type 与文件名。
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: 安装包相对路径
      responses:
        '200':
          description: 二进制安装包文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: HTTP 206 Partial Content 断点续传部分内容
        '404':
          description: 文件未找到
  # ==================== 系统设置（v1.2.132 新增） ====================

  /admin/settings/overview:
    get:
      tags: [系统设置, 运营后台]
      summary: 设置导航概览
      description: 返回各模块所需权限、当前管理员可见性、来源（HEADQUARTERS/SHOP/SYSTEM）、摘要、告警数；不含支付敏感状态。
      security: [{ BearerAuth: [] }]
      x-permission: settings:view|settings:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200':
          description: '成功，body 含 code、shopId、modules[]（module/permission/permitted/source/summary/alerts）'
        '4001': { description: 缺少门店上下文 }

  /admin/settings/store:
    get:
      tags: [系统设置, 运营后台]
      summary: 门店设置详情
      description: 基础资料（t_shop 主数据）+ 营业时段 + 营业日 + 生效来源/版本。三级合并：门店覆盖 > 总部默认 > 系统内置。
      security: [{ BearerAuth: [] }]
      x-permission: settings:view|settings:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200':
          description: |
            成功，body 含 code、module、source、version、updatedAt(ISO8601)、updatedBy、
            basic{shopId,name,code,address,phone,openTime,closeTime,status,sort,latitude,longitude,remark,coordinateType,orderingOpen,orderingReview,regionId,wechatQrConfigured,alipayQrConfigured,wechatQrImageUrl,alipayQrImageUrl,offlineCollectWechatImagePath,offlineCollectAlipayImagePath,offlineCollectWechatPayload,offlineCollectAlipayPayload}、businessHours[]、businessDays[]
    put:
      tags: [系统设置, 运营后台]
      summary: 保存门店设置（门店覆盖）
      description: 接受可覆盖字段 businessHours/businessDays 以及门店基础资料 basic 节点（或顶层店名/电话/地址等字段）；携带 version 乐观锁；首次覆盖时 version 传当前生效版本。写操作记审计。
      security: [{ BearerAuth: [] }]
      x-permission: settings:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: 调用方所见的生效版本 }
                basic:
                  type: object
                  description: 门店基础资料（同步更新 t_shop 主数据）
                  properties:
                    name: { type: string, description: 门店名称 }
                    code: { type: string, description: 门店编码 }
                    phone: { type: string, description: 联系电话 }
                    address: { type: string, description: 门店详细地址 }
                    remark: { type: string, description: 门店公告/备注 }
                    openTime: { type: string, example: '09:00', description: 营业开始时间 }
                    closeTime: { type: string, example: '22:00', description: 营业结束时间 }
                    status: { type: integer, description: 营业状态 1=营业 0=打烊 }
                    sort: { type: integer, description: 门店排序 }
                    orderingOpen: { type: integer, description: C端点餐开关 1=开启 0=关闭 }
                    orderingReview: { type: integer, description: C端评价开关 1=开启 0=关闭 }
                    regionId: { type: integer, description: 所属区域 ID }
                    latitude: { type: number, description: 纬度 (GCJ-02) }
                    longitude: { type: number, description: 经度 (GCJ-02) }
                    coordinateType: { type: string, example: 'gcj02' }
                    offlineCollectWechatImagePath: { type: string, description: 线下微信收款码图片路径 }
                    offlineCollectAlipayImagePath: { type: string, description: 线下支付宝收款码图片路径 }
                    offlineCollectWechatPayload: { type: string, description: 微信收款跳转载荷 }
                    offlineCollectAlipayPayload: { type: string, description: 支付宝收款跳转载荷 }
                businessHours:
                  type: array
                  items:
                    type: object
                    properties:
                      days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0=周日 }
                      open: { type: string, pattern: '^\d{2}:\d{2}$', example: '09:00' }
                      close: { type: string, example: '21:00' }
                      enabled: { type: boolean }
                businessDays:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
      responses:
        '200': { description: 成功，返回新版本配置（同 GET） }
        '400': { description: 校验失败（SETTINGS_VALIDATION_FAILED / SETTINGS_NO_OVERRIDABLE_FIELDS / SETTINGS_VERSION_REQUIRED） }
        '409': { description: 版本冲突 SETTINGS_VERSION_CONFLICT，data 含最新版本摘要 }

  /admin/settings/store/override:
    delete:
      tags: [系统设置, 运营后台]
      summary: 恢复总部继承
      description: 删除门店覆盖行，恢复总部/系统默认；需二次确认 + 覆盖行版本；返回生效的总部配置。写操作记审计。
      security: [{ BearerAuth: [] }]
      x-permission: settings:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: module, in: query, schema: { type: string, default: store } }
        - { name: version, in: query, schema: { type: integer }, description: 覆盖行当前版本 }
        - { name: confirm, in: query, required: true, schema: { type: boolean }, description: 必须为 true }
      responses:
        '200': { description: 成功，返回生效配置（同 GET /admin/settings/store）；覆盖行不存在时幂等返回当前生效配置 }
        '400': { description: SETTINGS_CONFIRM_REQUIRED }
        '409': { description: SETTINGS_VERSION_CONFLICT，data 含最新版本摘要 }

  /admin/printing/devices:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印设备列表
      description: connection 中密钥/序列号脱敏（key→****、sn 只回尾 4 位）。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: transport, in: query, schema: { type: string, enum: [LAN, USB, BLUETOOTH, CLOUD] } }
        - { name: status, in: query, schema: { type: string, enum: [ONLINE, OFFLINE, UNKNOWN] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，body 含 code、page、pageSize、total、items }
    post:
      tags: [系统设置, 运营后台]
      summary: 保存打印设备（新建）
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, transport]
              properties:
                name: { type: string, description: 设备名称（门店下唯一） }
                transport: { type: string, enum: [LAN, USB, BLUETOOTH, CLOUD], description: 连接方式 }
                brand: { type: string, description: 品牌/型号 }
                vendor: { type: string, description: 厂商（飞鹅云/易联云/佳博等） }
                sn: { type: string, description: 序列号（云打印必填且唯一） }
                user: { type: string, description: 云打印账号 }
                ukey: { type: string, description: 云打印密钥 }
                apiUrl: { type: string, description: 云打印网关 }
                ip: { type: string, description: 局域网 IP（LAN 模式必填） }
                port: { type: integer, default: 9100 }
                paperSize: { type: string, enum: [80mm, 58mm, 76mm], default: 80mm }
                copies: { type: integer, minimum: 1, maximum: 9, default: 1 }
                autoCut: { type: boolean, default: true }
                beeper: { type: boolean, default: true }
                enabled: { type: boolean, default: true }
                isDefault: { type: boolean, default: false }
                ticketTypes:
                  type: array
                  items:
                    type: string
                    pattern: '^[a-zA-Z][a-zA-Z0-9_-]{0,31}$'
                  description: 承接票据类型数组。内置十一类为 KITCHEN/FULL_ORDER/PRE_CHECKOUT/CHECKOUT/EXPEDITE/TAKEOUT/PACKING/SHIFT/REFUND/LABEL/TEST；也可填写合法自定义机器码，服务端统一归一化。
                connection: { type: object, description: 兼容嵌套连接参数（ip/port/sn/key/ticketTypes 等），回读时脱敏 }
      responses:
        '200': { description: 成功，返回 device（含 version=1） }
        '400': { description: 参数校验失败或 SN 冲突 }

  /admin/printing/devices/{id}:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印设备详情
      description: 获取单个设备全量信息，包含平铺便利字段（sn/ip/port/ukey/apiUrl/ticketTypes 等）及脱敏后的 connection 对象。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 成功，返回设备对象（含 device 与 data 双包裹） }
        '404': { description: 设备不存在或非本店 }
    put:
      tags: [系统设置, 运营后台]
      summary: 更新打印设备
      description: 更新打印设备配置，支持平铺连接参数更新与掩码密钥保留；version 乐观锁控制。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: 当前已知版本号（乐观锁） }
                name: { type: string }
                transport: { type: string, enum: [LAN, USB, BLUETOOTH, CLOUD] }
                brand: { type: string }
                vendor: { type: string }
                status: { type: string, enum: [ONLINE, OFFLINE, UNKNOWN] }
                connection: { type: object }
                sn: { type: string }
                user: { type: string }
                ukey: { type: string, description: 开发者密钥（传入掩码或空保留原密文） }
                apiUrl: { type: string }
                ip: { type: string }
                port: { type: integer }
                paperSize: { type: string, enum: [80mm, 58mm, 76mm] }
                copies: { type: integer }
                autoCut: { type: boolean }
                beeper: { type: boolean }
                enabled: { type: boolean }
                isDefault: { type: boolean }
                ticketTypes:
                  type: array
                  items:
                    type: string
                    pattern: '^[a-zA-Z][a-zA-Z0-9_-]{0,31}$'
                  description: 承接票据类型数组（十一类内置场景或合法自定义机器码）
      responses:
        '200': { description: 成功，version+1 }
        '400': { description: 参数校验失败或 SN 冲突 (PRINT_DEVICE_DUPLICATE_SN) }
        '404': { description: 设备不存在或非本店 }
        '409': { description: PRINTING_VERSION_CONFLICT，data 含最新摘要 }
    delete:
      tags: [系统设置, 运营后台]
      summary: 删除打印设备
      description: 删除设备，若该设备正被生效中的出票规则引用，则返回 400 与 PRINT_DEVICE_IN_USE_BY_RULE 阻断删除。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 删除成功 }
        '400': { description: 引用冲突 (PRINT_DEVICE_IN_USE_BY_RULE)，data 含引用场景列表 }
        '404': { description: 设备不存在或非本店 }

  /admin/printing/devices/{id}/status:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印设备实时状态探活
      description: |
        实时检测打印设备在线与硬件状态（缺纸/开盖），探活结果自动同步更新至数据库 `t_printing_device.status`。
        - **CLOUD 模式**：直连飞鹅云开放平台 `Open_queryPrinterStatus`，解析原生状态码及硬件状态：
          - `0` / 包含 `离线`：`online=false`, `status=OFFLINE`, `paperStatus=UNKNOWN`, `coverStatus=UNKNOWN`
          - `1` / 包含 `正常`：`online=true`, `status=ONLINE`, `paperStatus=NORMAL`, `coverStatus=CLOSED`
          - `2` / 包含 `不正常`/`异常`：`online=true`, `status=ERROR`, 并识别 `OUT_OF_PAPER`（缺纸）与 `OPEN`（开盖）
        - **LAN/USB 模式**：基于最近心跳与系统连通性检测。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功，返回在线与纸仓/机盖状态，并包含 ISO 格式探活时间戳
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  deviceId: { type: integer, example: 1 }
                  online: { type: boolean, example: true }
                  status:
                    type: string
                    enum: [ONLINE, OFFLINE, ERROR, UNKNOWN]
                    description: 综合状态（ONLINE 在线工作正常 / OFFLINE 离线 / ERROR 缺纸或故障）
                    example: ONLINE
                  paperStatus:
                    type: string
                    enum: [NORMAL, OUT_OF_PAPER, UNKNOWN, ERROR]
                    description: 纸仓状态（NORMAL 正常 / OUT_OF_PAPER 缺纸 / UNKNOWN 未知）
                    example: NORMAL
                  coverStatus:
                    type: string
                    enum: [CLOSED, OPEN, UNKNOWN, ERROR]
                    description: 上盖状态（CLOSED 闭合正常 / OPEN 开盖 / UNKNOWN 未知）
                    example: CLOSED
                  lastPingTime:
                    type: string
                    format: date-time
                    description: 本次探活完成时间（ISO-8601）
                    example: '2026-08-31T01:10:00+08:00'
        '404': { description: 设备不存在或非本店 }

  /admin/printing/devices/{id}/clear-queue:
    post:
      tags: [系统设置, 运营后台]
      summary: 清空云打印机待打印队列
      description: 远程向飞鹅开放平台下发清空待打印队列指令（Open_delPrinterSqs）。仅支持 CLOUD 模式云打印机。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 清空队列成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  deviceId: { type: integer }
                  sn: { type: string }
                  success: { type: boolean, example: true }
                  message: { type: string, example: 待打印队列已清空 }
        '400': { description: 设备非 CLOUD 模式 (PRINTING_CLEAR_QUEUE_UNSUPPORTED) 或 SN 缺失 }
        '404': { description: 设备不存在或非本店 }
        '500': { description: 飞鹅云平台请求失败 (PRINTING_CLEAR_QUEUE_FAILED) }

  /admin/printing/preview:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印小票实时预览 (GET)
      description: 快速生成小票预览，支持传入 scenario、orderId/orderNo、deviceId、paperSize(58mm/80mm)、isAddDishes。未提供订单时自动使用标准 Mock 示例数据。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: scenario, in: query, schema: { type: string, default: ORDER, enum: [ORDER, FULL_ORDER, CHECKOUT, PRE_CHECKOUT, KITCHEN, EXPEDITE, SERVE, TAKEOUT, PACKING, SHIFT, REFUND, LABEL, TEST] } }
        - { name: orderId, in: query, schema: { type: integer, format: int64 } }
        - { name: orderNo, in: query, schema: { type: string } }
        - { name: deviceId, in: query, schema: { type: integer, format: int64 } }
        - { name: paperSize, in: query, schema: { type: string, default: 58mm, enum: [58mm, 80mm] } }
        - { name: isAddDishes, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 预览生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintPreviewResponse'
    post:
      tags: [系统设置, 运营后台]
      summary: 打印小票实时预览 (POST)
      description: 组装打印数据并返回原生打印指令(rawContent)、排版纯文本(plainText)以及结构化 AST 元素树(elements)，前端可直接解析用于模拟热敏小票预览。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario: { type: string, default: ORDER, description: 场景代码 (ORDER/KITCHEN/SERVE/SHIFT/REFUND/LABEL/TEST) }
                orderId: { type: integer, description: 真实订单 ID }
                orderNo: { type: string, description: 真实订单号 }
                deviceId: { type: integer, description: 打印设备 ID }
                paperSize: { type: string, default: 58mm, enum: [58mm, 80mm] }
                isAddDishes: { type: boolean, default: false, description: 是否加菜单模式 }
                cidFilter: { type: array, items: { type: string }, description: 后厨分类过滤 ID 列表 }
                detailId: { type: integer, description: 菜品明细行 ID }
                serveQty: { type: integer, default: 1, description: 传菜划单数量 }
                shiftId: { type: integer, description: 班次 ID }
                testType: { type: string, default: STANDARD_RECEIPT, description: 测试单类型 }
                customContent: { type: string, description: 自定义覆盖内容 }
                refundInfo: { type: object, description: 退款明细参数 }
                statistics: { type: object, description: 交接班统计参数 }
                templateDsl: { type: object, description: 设计器临时 DSL（未保存预览用；传入则不依赖规则与模板库，与真实打印共用同一组装内核） }
                templateJson: { type: string, description: 设计器临时 DSL 的 JSON 字符串形式 }
                templateId: { type: integer, format: int64, description: 已保存模板 ID 快捷引用 }
      responses:
        '200':
          description: 预览生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintPreviewResponse'
        '404': { description: 打印规则/设备/模板不存在或非本店 (PRINTING_PREVIEW_TARGET_NOT_FOUND) }
        '409': { description: 订单无真实可打印明细或渲染失败 (PRINTING_PREVIEW_ORDER_DETAILS_REQUIRED / PRINTING_PREVIEW_RENDER_FAILED) }
        '500': { description: 打印调度服务未就绪 (PRINTING_DISPATCHER_UNAVAILABLE) }

  /admin/printing/preview/exact:
    post:
      tags: [系统设置, 运营后台]
      summary: 打印小票精确预览
      description: 不发送也不记录打印任务；只用真实业务数据，并按当前场景全部生效打印规则及设备逐一渲染。普通 /preview 的样例回退和人工上下文覆盖不适用于此接口。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { type: string, description: 十一类内置场景或自定义场景码（新增 PACKING 打包单） }
                orderId: { type: integer, format: int64, description: 真实订单 ID；非 SHIFT 场景必填（也可传 orderNo） }
                orderNo: { type: string, description: 真实订单号 }
                shiftId: { type: integer, format: int64, description: SHIFT 场景必填 }
                ruleId: { type: integer, format: int64, description: 目标打印规则 ID }
                deviceId: { type: integer, format: int64, description: 目标打印设备 ID }
                detailId: { type: integer, format: int64 }
                serveQty: { type: integer, minimum: 1 }
                cidFilter: { type: array, items: { type: string } }
                isAddDishes: { type: boolean, default: false }
      responses:
        '200': { description: 精确预览生成成功 }
        '400': { description: 缺少真实订单/班次、非法 detailId/serveQty，或传入样例/人工覆盖字段 }
        '403': { description: 订单不属于当前门店 }
        '404': { description: 模板、业务数据、规则或设备不存在 }
        '409': { description: 无真实退款数据或精确渲染失败 }

  /admin/printing/dispatch:
    post:
      tags: [系统设置, 运营后台]
      summary: 统一出票与补打调度
      description: |
        统一出票与补打入口。支持全场景出票（厨房、结账单、整单、交接班等），
        只需传入订单号即可自动识别并补打对应小票，自动填充菜品明细与补打防篡改水印。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedPrintRequest'
      responses:
        '200':
          description: 出票调度结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedPrintResponse'
        '400': { description: 请求参数错误或订单未结账禁止打印结账单（code=ORDER_NOT_CHECKED_OUT） }
        '403': { description: 跨店订单拒绝（code=SHOP_SCOPE_MISMATCH） }
        '404': { description: 订单或设备不存在（code=ORDER_NOT_FOUND） }
        '500': { description: 打印服务未就绪 }

  /admin/printing/rules:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印规则列表
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200': { description: 成功，body 含 code、items、version（全店规则整体版本） }
    put:
      tags: [系统设置, 运营后台]
      summary: 整体保存打印规则
      description: 事务内整组替换本店规则；version 为读取时的整体版本。每条规则引用的模板必须属于当前门店或系统模板；规则场景决定出票去向，模板场景仅标识版式用途，二者可独立组合。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, rules]
              properties:
                version: { type: integer }
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      scenario: { type: string, example: checkout, description: 十一类标准小写场景码（含 packing）或合法自定义机器码；order/serve 等别名会被服务端归一化。 }
                      deviceId: { type: integer }
                      templateCode: { type: string }
                      copies: { type: integer, minimum: 1, maximum: 9 }
                      enabled: { type: boolean }
      responses:
        '200': { description: 成功 }
        '400': { description: 参数非法，或模板不存在/不属于当前门店（PRINTING_RULE_TEMPLATE_NOT_FOUND） }
        '409': { description: PRINTING_VERSION_CONFLICT }

  /admin/printing/devices/{id}/test:
    post:
      tags: [系统设置, 运营后台]
      summary: 打印测试
      description: CLOUD 设备由服务端经飞鹅服务真实打印；LAN/USB/蓝牙生成 PENDING_DEVICE 任务由端侧执行。不提供远程重启打印服务能力。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                testType: { type: string, example: STANDARD_RECEIPT, description: 测试单类型（STANDARD_RECEIPT/KITCHEN_TICKET/CUTTER_TEST/order/kitchen/refund/shift） }
                customContent: { type: string, description: 自定义测试打印文本内容 }
      responses:
        '200': { description: 成功，body 含 code、jobId、status、executor（CLOUD/DEVICE）、error }
        '404': { description: 设备不存在或非本店 }

  /admin/printing/jobs:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印任务记录
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: status, in: query, schema: { type: string } }
        - { name: deviceId, in: query, schema: { type: integer } }
        - { name: startTime, in: query, schema: { type: string, example: '2026-08-01 00:00:00' } }
        - { name: endTime, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: 成功，body 含 code、page、pageSize、total、items；每项 jobType 为标准小写场景码（kitchen/full_order/pre_checkout/checkout/expedite/takeout/packing/shift/refund/label/test 或合法自定义码），并提供 scenarioName、customScenario；历史别名会额外以 legacyJobType 返回；若任务带业务溯源（KDS 划菜等），额外返回 bizType（如 kds_serve）与 bizId（如 t_order_detail.id）。 }

  /admin/printing/jobs/{id}/reprint:
    post:
      tags: [系统设置, 运营后台]
      summary: 打印任务补打/重发
      description: 针对指定打印任务重新下发打印指令。若设备为 CLOUD 则直发云打印机，若为端侧设备则重置为 PENDING_DEVICE。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功，body 含 jobId、status、msg、data }
        '400': { description: 失败或任务不存在 }

  /admin/printing/templates/meta:
    get:
      tags: [系统设置, 运营后台]
      summary: 获取小票模板设计器元数据与参数绑定字典
      description: |
        为前端可视化设计器提供 11 大标准化出票场景（厨房/前台整单/预结单/结账单/催菜单/外卖单/打包单/交接班/退款单/标签杯贴/测试单）、
        支持的 Block 区块类型、以及各场景开放的动态参数绑定变量字典（含变量占位符、中文说明、类型与实时预览示例）。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      responses:
        '200':
          description: 成功返回模板元数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  scenarios:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: FULL_ORDER }
                        name: { type: string, example: 前台整单小票 }
                        description: { type: string }
                        allowedBlocks: { type: array, items: { type: string } }
                        variables:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string, example: 门店名称 }
                              key: { type: string, example: '{shopName}' }
                              desc: { type: string }
                              type: { type: string, example: STRING }
                              preview: { type: string, example: 老肥油边王 }
                  blockTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, example: HEADER }
                        name: { type: string, example: 头部区 }
                        desc: { type: string }
                        supportedProperties: { type: array, items: { type: string } }
                  paperSizes:
                    type: array
                    items: { type: string }
                    example: [58mm, 80mm, 76mm]

  /admin/printing/templates:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印排版模板列表
      description: 获取当前门店可用模板列表（包含系统预置模板与门店自定义模板，支持 scenario 与 paperSize 筛选）。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: scenario, in: query, schema: { type: string, enum: [KITCHEN, FULL_ORDER, PRE_CHECKOUT, CHECKOUT, EXPEDITE, TAKEOUT, PACKING, SHIFT, REFUND, LABEL, TEST, ORDER, SERVE] } }
        - { name: paperSize, in: query, schema: { type: string, enum: [58mm, 80mm, 76mm] } }
      responses:
        '200':
          description: 成功返回模板列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  shopId: { type: integer }
                  templates: { type: array, items: { type: object } }
    post:
      tags: [系统设置, 运营后台]
      summary: 新建自定义打印模板
      description: 前端可视化设计器保存排版 JSON DSL 配置到后端。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateName, scenario]
              properties:
                templateName: { type: string, example: 招牌结账小票 }
                templateCode: { type: string, example: tpl_order_custom }
                scenario: { type: string, example: CHECKOUT, description: 十一类内置场景码（含 PACKING）或合法自定义机器码（小写字母开头，允许数字/中划线/下划线）；内置别名会归一化为标准码。 }
                paperSize: { type: string, example: 58mm }
                isDefault: { type: boolean, default: false }
                templateJson: { type: string, description: JSON DSL 字符串 }
                templateDsl: { type: object, description: JSON DSL 对象 }
      responses:
        '200': { description: 成功，返回新模板详情与 version=1 }
        '400': { description: 参数非法 }
        '409': { description: 模板编码冲突 PRINTING_TEMPLATE_DUPLICATE_CODE }

  /admin/printing/templates/{id}:
    get:
      tags: [系统设置, 运营后台]
      summary: 打印模板详情
      description: 获取单个模板排版 JSON DSL 配置（用于前端设计器回显）。
      security: [{ BearerAuth: [] }]
      x-permission: printing:view|printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功返回模板详情 }
        '404': { description: 模板不存在 PRINTING_TEMPLATE_NOT_FOUND }
    put:
      tags: [系统设置, 运营后台]
      summary: 更新自定义打印模板
      description: 更新模板名称、场景、纸张规格和排版 JSON DSL 配置等；支持 version 乐观锁（冲突返回 409 PRINTING_VERSION_CONFLICT）。系统内置模板不可直接修改。传入 scenario 时按内置别名归一化为标准场景码；默认模板切换场景后仍保持新场景的唯一默认模板。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateName: { type: string }
                scenario: { type: string, description: 十一类内置场景码（含 PACKING）或合法自定义机器码；内置别名会归一化为标准码。 }
                paperSize: { type: string }
                isDefault: { type: boolean }
                templateJson: { type: string }
                templateDsl: { type: object }
                version: { type: integer }
      responses:
        '200': { description: 成功，version+1 }
        '403': { description: 系统内置模板只读 SYSTEM_TEMPLATE_READONLY }
        '404': { description: 模板不存在 }
        '409': { description: 版本冲突 PRINTING_VERSION_CONFLICT }
    delete:
      tags: [系统设置, 运营后台]
      summary: 删除自定义打印模板
      description: 删除门店自定义模板。系统内置模板禁止删除；正在被 t_printing_rule 引用的模板拦截删除并返回 400 PRINT_TEMPLATE_IN_USE_BY_RULE。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功 }
        '400': { description: 被出票规则引用中 PRINT_TEMPLATE_IN_USE_BY_RULE }
        '403': { description: 系统内置模板禁止删除 SYSTEM_TEMPLATE_READONLY }
        '404': { description: 模板不存在 }

  /admin/printing/templates/{id}/set-default:
    post:
      tags: [系统设置, 运营后台]
      summary: 设为场景默认模板
      description: 将指定模板设为对应 scenario 的默认模板。
      security: [{ BearerAuth: [] }]
      x-permission: printing:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 成功设为默认模板 }
        '404': { description: 模板不存在 }

  /admin/payment/channels/{code}/impact:
    post:
      tags: [系统设置, 支付方式, 运营后台]
      summary: 支付停用影响判定
      description: 统计该渠道未完成交易数 + 受影响入口；不暴露商户号与密钥信息。渠道列表与启停见既有 GET/PUT /admin/payment/capabilities。
      security: [{ BearerAuth: [] }]
      x-permission: payment:view|payment:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: code, in: path, required: true, schema: { type: string, enum: [cash, online_wechat, online_alipay, online_balance, online_combined, offline_wechat_qr, offline_alipay_qr] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetStatus]
              properties:
                targetStatus: { type: string, enum: [enabled, disabled] }
      responses:
        '200': { description: '成功，body 含 channelCode、targetStatus、pendingTxCount、affectedEntries[]、blocking' }
        '400': { description: 参数非法 }
        '404': { description: PAYMENT_CHANNEL_UNKNOWN }

  /admin/payment/channels/{code}/test:
    post:
      tags: [系统设置, 支付方式, 运营后台]
      summary: 支付测试交易（幂等）
      description: |
        idempotencyKey 必填；同键重复请求返回首次记录（duplicate=true）。
        说明：既有支付链路依赖 C 端 openid，本接口执行渠道就绪校验并留痕（online_wechat/alipay 校验商户配置齐备性；线下渠道标记 OFFLINE_NO_MONEY_MOVEMENT 无资金动作）。
      security: [{ BearerAuth: [] }]
      x-permission: payment:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotencyKey]
              properties:
                amount: { type: number, example: 0.01 }
                terminal: { type: string }
                idempotencyKey: { type: string, maxLength: 64 }
      responses:
        '200': { description: 成功，body 含 paymentId、status、chargeStatus、refundStatus、duplicate }
        '400': { description: PAYMENT_IDEMPOTENCY_KEY_REQUIRED / 参数非法 }
        '404': { description: PAYMENT_CHANNEL_UNKNOWN }

  /admin/notifications/rules:
    get:
      tags: [系统设置, 运营后台]
      summary: 通知规则列表
      description: recipients 中手机号脱敏（138****1234）。
      security: [{ BearerAuth: [] }]
      x-permission: notifications:view|notifications:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: eventType, in: query, schema: { type: string, enum: [order_new, order_refund, order_cancel, stock_low, shift_close, device_offline, payment_failed, custom] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: '成功，分页结构；items 含 adminId/shopId（ID）与 adminName/shopName（名称）' }
    post:
      tags: [系统设置, 运营后台]
      summary: 创建通知规则
      security: [{ BearerAuth: [] }]
      x-permission: notifications:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, eventType]
              properties:
                name: { type: string }
                eventType: { type: string }
                channels: { type: array, items: { type: string, enum: [app, sms, printer, webhook] } }
                recipients: { type: array, items: { type: object } }
                timeWindow: { type: object, description: '{"start":"08:00","end":"22:00","days":[1,2,3]}' }
                frequencyControl: { type: object, description: '{"minIntervalMinutes":5,"dailyCap":50}' }
                enabled: { type: boolean, default: true }
      responses:
        '200': { description: 成功，version=1 }
        '400': { description: 校验失败 }

  /admin/notifications/rules/{id}:
    put:
      tags: [系统设置, 运营后台]
      summary: 更新通知规则
      security: [{ BearerAuth: [] }]
      x-permission: notifications:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
      responses:
        '200': { description: 成功，version+1 }
        '404': { description: 规则不存在 }
        '409': { description: NOTIFICATIONS_VERSION_CONFLICT }
    delete:
      tags: [系统设置, 运营后台]
      summary: 删除通知规则
      description: 需 confirm=true + version；删除/停用均记审计。
      security: [{ BearerAuth: [] }]
      x-permission: notifications:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: version, in: query, required: true, schema: { type: integer } }
        - { name: confirm, in: query, required: true, schema: { type: boolean } }
      responses:
        '200': { description: 成功 }
        '400': { description: NOTIFICATIONS_CONFIRM_REQUIRED }
        '409': { description: NOTIFICATIONS_VERSION_CONFLICT }

  /admin/notifications/rules/{id}/test:
    post:
      tags: [系统设置, 运营后台]
      summary: 通知试发
      description: 生成试发记录（title 前缀 [试发]），响应接收人脱敏。
      security: [{ BearerAuth: [] }]
      x-permission: notifications:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
