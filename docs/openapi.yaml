      responses:
        '200': { description: 成功 }
    delete:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 删除供应商
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: 成功 }

  /admin/inventory/warehouses:
    get:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 仓库列表
      security: [{ BearerAuth: [] }]
      x-permission: inventory:view|inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功 }
    post:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 新增仓库
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
