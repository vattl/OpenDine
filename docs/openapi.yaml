      responses:
        '200': { description: '成功，body 含 deliveryId、status、deliveries[]' }
        '404': { description: 规则不存在 }

  /admin/notifications/deliveries:
    get:
      tags: [系统设置, 运营后台]
      summary: 通知发送记录
      description: 仅在线返回近 30 天记录；超出窗口返回 400 NOTIFICATIONS_ARCHIVED_ONLY，提示走归档检索。
      security: [{ BearerAuth: [] }]
      x-permission: notifications:view|notifications:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: ruleId, in: query, schema: { type: integer } }
        - { name: channel, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENT, FAILED] } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，分页结构 + onlineWindowDays }
        '400': { description: NOTIFICATIONS_ARCHIVED_ONLY }

  /admin/marketing/first-order/campaigns:
    get:
      tags: [系统设置, 会员营销, 运营后台]
      summary: 首单活动列表
      security: [{ BearerAuth: [] }]
      x-permission: marketing:firstorder:view|marketing:firstorder:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, PAUSED, EXPIRED] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: '成功，items 含 stats{redemptions,restorations}' }
    post:
      tags: [系统设置, 会员营销, 运营后台]
      summary: 创建首单活动
      description: 同店时间窗重叠的 ACTIVE 活动不可叠加，冲突返回 409 FIRST_ORDER_RULE_CONFLICT（data.conflicts 列冲突活动）。
      security: [{ BearerAuth: [] }]
      x-permission: marketing:firstorder:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, campaignType, startTime, endTime]
              properties:
                name: { type: string }
                campaignType: { type: string, enum: [DISCOUNT, GIFT, FREEBIE] }
                thresholdAmount: { type: number, default: 0 }
                discountValue: { type: number, default: 0 }
                discountDesc: { type: string }
                startTime: { type: string, example: '2026-08-01 00:00:00' }
                endTime: { type: string, example: '2026-12-31 23:59:59' }
                status: { type: string, enum: [DRAFT, ACTIVE], default: DRAFT }
      responses:
        '200': { description: 成功，version=1 }
        '400': { description: 校验失败 }
        '409': { description: FIRST_ORDER_RULE_CONFLICT（时间窗重叠） }

  /admin/marketing/first-order/campaigns/{id}:
    put:
      tags: [系统设置, 会员营销, 运营后台]
      summary: 更新首单活动
      security: [{ BearerAuth: [] }]
      x-permission: marketing:firstorder:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
      responses:
        '200': { description: 成功，version+1 }
        '404': { description: 活动不存在 }
        '409': { description: FIRST_ORDER_CAMPAIGN_VERSION_CONFLICT / FIRST_ORDER_RULE_CONFLICT }

  /admin/marketing/first-order/eligibility/evaluate:
    post:
      tags: [系统设置, 会员营销, 运营后台]
      summary: 首单资格判定
      description: |
        规则：店内有生效 ACTIVE 活动、客户无 USED 核销记录（RESTORED=已恢复资格）、无历史已完成订单（transac_status=success，按 openid/手机号匹配）、订单金额达门槛。
        取消/全额退款后资格恢复（由退菜服务钩子自动将核销记录置 RESTORED），部分退款不恢复。
      security: [{ BearerAuth: [] }]
      x-permission: marketing:firstorder:view|marketing:firstorder:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, description: openid 或会员手机号 }
                shopId: { type: integer, description: 省略时用 X-Shop-Id }
                orderAmount: { type: number }
      responses:
        '200': { description: '成功，body 含 eligible、reason、conflicts[]、campaign' }
        '400': { description: customerId 必填 }

  /admin/marketing/first-order/redemptions:
    get:
      tags: [系统设置, 会员营销, 运营后台]
      summary: 首单核销记录
      description: RESTORED 行含 restoredReason（cancel/full_refund/manual）与 restoredAt。
      security: [{ BearerAuth: [] }]
      x-permission: marketing:firstorder:view|marketing:firstorder:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: campaignId, in: query, schema: { type: integer } }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: orderNo, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，分页结构 }

  /admin/access/employees:
    get:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 员工列表（角色 + 门店授权）
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: '成功，items 含 adminId/userName/roles[]/shops[]' }
    post:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 员工授权（覆盖式分配角色与多店）
      description: 敏感操作需 confirm=true；替换该管理员的全部角色与门店授权；记审计。
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminId, confirm]
              properties:
                adminId: { type: integer }
                roleIds: { type: array, items: { type: integer } }
                shopIds: { type: array, items: { type: integer } }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200': { description: 成功 }
        '400': { description: ACCESS_CONFIRM_REQUIRED / 参数非法 }
        '404': { description: 管理员不存在 }

  /admin/access/employees/{adminId}:
    put:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 更新员工授权
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: adminId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                roleIds: { type: array, items: { type: integer } }
                shopIds: { type: array, items: { type: integer } }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200': { description: 成功 }
        '400': { description: ACCESS_CONFIRM_REQUIRED }
    delete:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 删除员工账号
      description: 仅具备 access:manage 或 admin:manage 权限可访问。操作不可逆，级联清理角色与门店绑定；不允许删除当前登录账号；需显式传 confirm=true。
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: adminId, in: path, required: true, schema: { type: integer }, description: '员工 ID' }
        - { name: confirm, in: query, required: false, schema: { type: boolean, default: false }, description: '二次确认标记（必须传 true）' }
      responses:
        '200': { description: '成功，员工已删除' }
        '400': { description: 'ACCESS_CONFIRM_REQUIRED / 不能删除当前登录账号' }
        '404': { description: '员工不存在' }
        '409': { description: 'ACCESS_EMPLOYEE_HAS_RECORDS / 员工存在历史业务记录（订单/当班/日志/审批）禁止删除' }

  /admin/access/employees/{adminId}/status:
    put:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 变更员工账号状态
      description: 仅具备 access:manage 权限可访问。支持 ACTIVE(启用), DISABLED(停用), RESIGNED(离职)。停用或离职会立即吊销该员工的所有活跃令牌与会话。
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: adminId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED, RESIGNED], description: '账号状态' }
      responses:
        '200': { description: '成功，返回更新后状态与版本号；若 updateById 影响 0 行但回查 DB 已是目标状态，视为幂等成功' }
        '400': { description: '参数非法 / 不能修改当前正在登录的账号状态' }
        '404': { description: '员工不存在' }
        '500': { description: '更新未生效（error=ACCESS_STATUS_UPDATE_FAILED）：数据库未变更，不再静默返回成功' }

  /admin/access/employees/{adminId}/force-logout:
    post:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 强制下线员工
      description: 立即将员工的 force_logout_at 更新为当前时间并递增 tokenVersion，使得此前签发的所有 JWT 令牌立即失效。
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: adminId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '已成功强制下线' }
        '404': { description: '员工不存在' }

  /admin/access/employees/{adminId}/effective-permissions:
    get:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 查询员工最终有效权限
      description: 聚合计算员工角色权限与显式覆盖规则（ALLOW/DENY），支持按门店上下文解析。
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      parameters:
        - { name: adminId, in: path, required: true, schema: { type: integer } }
        - { name: shopId, in: query, schema: { type: integer } }
      responses:
        '200': { description: '成功，返回 adminId/userName/roles/permissions/overrides' }
        '404': { description: '员工不存在' }

  /admin/access/conflicts/check:
    post:
