                type: string
                format: binary
        '500': { description: 失败（兑换码不存在、门店无权限、微信接口异常） }

  /admin/coupon/user-coupon/list:
    get:
      tags: [运营后台]
      summary: 用户持券明细分页
      description: |
        有门店上下文时仅展示「券模板属于当前店可见范围」的持券记录（与 **`GET /admin/coupon/list`** 过滤一致）。
        查询参数：`couponId`、`openid`、`status`（0/1/2）、`orderNo`（模糊）、`getTimeStart`/`getTimeEnd`（领取时间）、`page`/`pageSize`（默认 1/20，pageSize≤200）。
      security: [{ BearerAuth: [] }]
      x-permission: coupon:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: couponId
          in: query
          schema: { type: integer, format: int64 }
        - name: openid
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1, 2] }
        - name: orderNo
          in: query
          schema: { type: string }
        - name: getTimeStart
          in: query
          schema: { type: string }
        - name: getTimeEnd
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 成功，body 含 code、list（UserCouponDTO[]）、total、page、pageSize
        '500': { description: 失败 }

  /admin/coupon/user-coupon/grant:
    post:
      tags: [运营后台]
      summary: 定向发券（单用户）
      security: [{ BearerAuth: [] }]
      x-permission: coupon:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [couponId]
              properties:
                couponId: { type: integer, format: int64 }
                openid: { type: string, description: '与 phone 二选一' }
                phone: { type: string, description: '与 openid 二选一，须已绑定用户' }
      responses:
        '200':
          description: 成功
        '500': { description: 失败 }

  /admin/coupon/user-coupon/batch-grant-excel:
    post:
      tags: [运营后台]
      summary: Excel 上传 openid 批量发券
      security: [{ BearerAuth: [] }]
      x-permission: coupon:manage
      description: |
        上传 `.xlsx` / `.xls`，后端读取第一个工作表中表头名为 **`openid`** 的列；格式与 `docs/query_order_openid_by_time_range.sql` 导出的结果一致即可。
        服务端会去重 openid，并复用 `receiveCoupon(openid, couponId)` 发券，保证库存、`granted_count`、用户券有效期等规则与单用户发券一致。
        若优惠券为有限库存，发券前会校验库存是否覆盖去重后的 openid 数量。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [couponId, file]
              properties:
                couponId:
                  type: integer
                  format: int64
                  description: 优惠券 ID（须属于当前头部门店）
                file:
                  type: string
                  format: binary
                  description: Excel 文件，第一张表需包含 openid 表头
      responses:
        '200':
          description: 成功，body 含 couponId、fileName、readCount、duplicateCount、targetOpenidCount、grantedCount
        '500': { description: 失败（文件格式错误、未找到 openid 列、库存不足、发券失败等） }

  /admin/coupon/user-coupon/void:
    post:
      tags: [运营后台]
      summary: 作废用户券（仅未使用）
      security: [{ BearerAuth: [] }]
      x-permission: coupon:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCouponId]
              properties:
                userCouponId: { type: integer, format: int64, description: 't_user_coupon.id' }
      responses:
        '200':
          description: 成功
        '500': { description: 失败 }

  /admin/coupon/user-coupon/unbind:
    post:
      tags: [运营后台]
