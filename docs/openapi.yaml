          description: 成功，body 含 code、combo（Combo 或 null）、definition（ComboMenuDefinition 或 null）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      combo: { $ref: '#/components/schemas/Combo' }
                      definition: { $ref: '#/components/schemas/ComboMenuDefinition' }
        '500':
          description: 失败（如 dishId 为空）

  /admin/combo/save:
