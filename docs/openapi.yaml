  /admin/report/compare:
    get:
      tags: [数据报表, 运营后台]
      summary: 同比/环比（按自然日 order_time）
      description: |
        **`type=yearOnYear`**：`current` 为 **`date`** 当天已结订单金额合计，`previous` 为**去年同日**；**`type=monthOnMonth`**：`current` 为 **`date`** 当天，`previous` 为**上月同日**（由 `LocalDate` 推算，如 3-31 对上月无同日则落到上月最后一天）。
        金额口径与改前一致：`sett_amount + service_fee - discount_amount`（仅 success 单，且受 **`X-Shop-Id`** / **`shop_id`** 门店范围约束）。**`date`** 须为 **`yyyy-MM-dd`**。
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [yearOnYear, monthOnMonth] }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: shop_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、current、previous、rate
        '500': { description: 失败 }

  # ---------- 商户订单数据（按 merchantId 与 24小时营业日）----------
  /admin/merchant/orders:
    get:
      tags: [商户数据, 数据报表, 运营后台]
      summary: 按 merchantId 查询营业日订单列表
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        按商户标识（merchantId）查询指定营业日（24小时窗口）内的订单列表。
        - **商户号（merchant_id）**：默认 "1"（自营收银订单）。
        - **营业日时间窗口**：以门店 settle_time（默认 05:00）为起始点，顺延 24 小时至次日 settle_time（右开区间 [businessDay settle_time, (businessDay + 1) settle_time)）。
          例如 settle_time=05:00 时，2026-09-11 营业日对应的查询窗口为 [2026-09-11 05:00:00, 2026-09-12 05:00:00)。
        - **当前营业日推算**：未传 date 时，根据请求时刻自动推算：当前时间在今日 settle_time 之前算作昨日营业日，否则为今日营业日。
        - **金额统计**：total_revenue 基于全量命中订单按 OrderNetRevenue（净实付，扣减退款）计算，不受分页截断影响。
      parameters:
        - name: merchant_id
          in: query
          required: false
          schema: { type: string, default: '1' }
          description: 商户号/标识，默认 "1"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 营业日（yyyy-MM-dd），不传默认当前营业日
        - name: transac_status
          in: query
          required: false
          schema: { type: string, enum: [success, unsettled, cancelled], default: success }
          description: 订单结算状态过滤，默认 success
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 分页页码（1-based），默认 1
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 200, minimum: 1, maximum: 500 }
          description: 每页条数，默认 200，最大 500
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  merchant_id: { type: string, example: '1' }
                  business_day: { type: string, example: '2026-09-11' }
                  window_start: { type: string, example: '2026-09-11 05:00:00' }
                  window_end: { type: string, example: '2026-09-12 05:00:00' }
                  transac_status_filter: { type: string, example: 'success' }
                  total_count: { type: integer, example: 35 }
                  total_revenue: { type: number, format: double, example: 1280.50 }
                  page: { type: integer, example: 1 }
                  page_size: { type: integer, example: 200 }
                  total_pages: { type: integer, example: 1 }
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '500':
          description: 失败（如日期格式错误等）

  /admin/merchant/orders/summary:
    get:
      tags: [商户数据, 数据报表, 运营后台]
      summary: 按 merchantId 查询营业日订单汇总统计
      security: [{ BearerAuth: [] }]
      x-permission: report:view
      description: |
        按商户标识（merchantId）聚合指定营业日（24小时窗口）内的订单数据，包括订单总数、实收净额、优惠金额、退款金额、各支付渠道占比及就餐类型分布。适合看板或概览卡片使用。
      parameters:
        - name: merchant_id
          in: query
          required: false
          schema: { type: string, default: '1' }
          description: 商户号/标识，默认 "1"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 营业日（yyyy-MM-dd），不传默认当前营业日
        - name: transac_status
          in: query
          required: false
          schema: { type: string, enum: [success, unsettled, cancelled], default: success }
          description: 订单结算状态过滤，默认 success
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  merchant_id: { type: string, example: '1' }
                  business_day: { type: string, example: '2026-09-11' }
                  window_start: { type: string, example: '2026-09-11 05:00:00' }
                  window_end: { type: string, example: '2026-09-12 05:00:00' }
                  transac_status_filter: { type: string, example: 'success' }
                  order_count: { type: integer, example: 35 }
                  total_revenue: { type: number, format: double, example: 1280.50 }
                  total_discount: { type: number, format: double, example: 50.00 }
                  total_refund: { type: number, format: double, example: 0.00 }
                  by_channel:
                    type: object
                    additionalProperties: { type: number, format: double }
                    example:
                      微信支付: 800.00
                      现金: 480.50
                  by_dining_type:
                    type: object
                    additionalProperties: { type: integer }
                    example:
                      堂食: 25
                      打包: 10
        '500':
          description: 失败

  # ---------- 数据分析（营业 / 菜品 / 顾客 / 会员 / 营销）----------
  /admin/analytics/business:
    get:
      tags: [数据分析, 运营后台]
      summary: 营业数据汇总（核心指标、分时段、支付渠道）
      description: |
        响应 `data` 结构见 Schema **AnalyticsBusinessData**；其中 **core** 为整窗汇总，**natural_calendar** / **business_day** 为自然日与营业日两套派生比率，
        **time_slots_*** 为两套分时段营收，**payment_channels** 为支付渠道占比。字段中文含义均以各 Schema 的 `description` 为准，便于前端表头与图例。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: startTime
          in: query
          required: false
          description: 统计时间窗开始（含），按订单 `order_time` 过滤，格式 yyyy-MM-dd HH:mm:ss；可选；不传时默认取最近已完成结算日 settle_time（门店配置优先，回退 close_time / 04:00）为结束、向前推 12 小时为开始；传入则以传入为准
          schema: { type: string, example: '2026-05-01 00:00:00' }
        - name: endTime
          in: query
          required: false
          description: 统计时间窗结束（含），格式 yyyy-MM-dd HH:mm:ss；可选；不传时默认取最近已完成结算日 settle_time（门店配置优先，回退 close_time / 04:00）为结束、向前推 12 小时为开始；传入则以传入为准
          schema: { type: string, example: '2026-05-07 23:59:59' }
      responses:
        '200':
          description: 成功；业务字段在 data 内，各键含义见 Schema「中文 description」
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsBusinessResponse'
        '400': { description: 参数错误 }
  /admin/analytics/business/trend:
    get:
      tags: [数据分析, 运营后台]
      summary: 营业趋势（按日/周/月/年桶）
      description: 响应见 **AnalyticsTrendData**；**natural_calendar.series** 与 **business_day.series** 分别为自然历与营业日（open_time 起点 / settle_time 截止，门店配置优先、默认 16:00～次日 04:00）标签下的趋势点数组，点内字段见 **AnalyticsTrendSeriesRow**。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: startTime
          in: query
          required: false
          description: 统计时间窗开始（含），格式 yyyy-MM-dd HH:mm:ss；可选；不传时默认取最近已完成结算日 settle_time（门店配置优先，回退 close_time / 04:00）为结束、向前推 12 小时为开始；传入则以传入为准
          schema: { type: string }
        - name: endTime
          in: query
          required: false
          description: 统计时间窗结束（含），格式 yyyy-MM-dd HH:mm:ss；可选；不传时默认取最近已完成结算日 settle_time（门店配置优先，回退 close_time / 04:00）为结束、向前推 12 小时为开始；传入则以传入为准
          schema: { type: string }
        - name: granularity
          in: query
          description: 横轴聚合粒度；day 自然日或营业日按日，week ISO 周，month 月首，year 年
          schema: { type: string, enum: [day, week, month, year], default: day }
      responses:
        '200':
          description: 成功；data 内含自然日与营业日两套趋势序列
