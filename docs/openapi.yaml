    - **v1.2.213（退款回调验签/解密迁移至 DB 商户配置解析）**：
      `POST /refund/notify`（微信退款结果回调）此前按 yml 旧配置（`weixin.pubSerial`/`apiV3Key`）验签解密，商户密钥迁移到 `t_payment_merchant_config` 后旧配置为空，导致回调到达即「公钥序列号不匹配」返回 FAIL、微信重试后放弃，`refund_amount` 永不回写。本次将退款回调与支付回调对齐：按 `Wechatpay-Serial` 头在 DB 商户配置中匹配平台公钥验签（`WechatMerchantKeyStore#resolveNotifyContext`），并遍历该序列号命中的全部候选 APIv3 密钥解密（`WechatPayV3Crypto#decryptAesGcm`）；验签失败/解密失败返回 FAIL（微信重试），成功后按既有口径调用 `WechatRefundSettlementService#settle` 回写 `refund_amount`。无接口参数变更。
        - **v1.2.212（微信退款可靠性加固：回调地址强制校验 + 退款查询补偿入账）**：
      ① **未配置退款回调禁止发起微信退款**：微信退款（`/admin/order/refund` 的微信分支）发起时若商户配置 `refund_notify_url`（含默认模板回退后仍为空）缺失，服务端**拒绝发起**并返回错误（此前仅 warn 照常发起，导致微信永不回调、`refund_amount` 永久不回写），并释放退款幂等键；商户需先在支付商户配置中设置退款回调地址。
      ② **退款查询补偿定时任务**：新增 `WechatRefundQueryScheduler`（默认每 5 分钟，可配 `wx.refund-query-ms`）扫描退款台账 `t_payment_refund_request` 中状态为 `REQUESTED` 的退款申请，调用微信「查询退款单」接口（`GET /v3/refund/domestic/refunds/{out_refund_no}`）核对实际结果：`SUCCESS` → 复用回调入账逻辑（台账幂等 + 订单行锁 + 剩余可退截断 + 渠道列扣减）补写 `t_order.refund_amount` 并标记台账 SUCCESS；`CLOSED`/`ABNORMAL` → 台账标记 FAILED 并释放幂等键（允许重新发起）；`PROCESSING` 等中间态 → 保持 REQUESTED 下轮再查。
      ③ **回调与补偿共用同一入账服务**：微信退款回调 `/order/refund/notify` 的入账逻辑统一收敛至新 `WechatRefundSettlementService`（以台账 `beginCallback`/`markSuccess` 为幂等基准，同一退款单在回调与补偿并发/重复场景下只入账一次）；回调丢失或通知延迟时由补偿任务兜底补写。
        - **v1.2.211（收银端人工退款现金/组合订单）**：新增 **`POST /cashier/order/refund`**，供收银端对**已支付**的现金/组合支付订单做线下人工退款：服务端锁定订单并按「实付（sett+service−discount）− 已退 refund_amount」校验剩余可退额，按实退金额累加 **`t_order.refund_amount`**、扣减现金渠道列 **`pay_amount_cash`**（现金列已清零时拒绝，防止误扣微信/余额列）并追加 remark「【人工退款·现金】」；可选 **`refundAmount`**（元，默认退「现金列剩余 ∩ 剩余可退」全部）、**`reason`**。纯微信/纯余额订单分别走 `/admin/order/refund`（微信退款回调 `/order/refund/notify` 到账入账）与余额本地退款；组合支付订单现金部分由本接口人工入账，微信部分仍须人工在商户平台退款后由回调入账。
