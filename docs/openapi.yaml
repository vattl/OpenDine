tags:
  - name: AI智能配餐
    description: 深圳烧烤店 AI 智能配餐与点餐会话、规划约束求解、草稿二次校价与确认落单
  - name: MCP服务
    description: 智能点餐标准化远程 Model Context Protocol 工具服务
  - name: 认证与用户
    description: C 端，小程序前端
  - name: 桌台与营业
    description: C 端，小程序前端
  - name: 门店（小程序）
    description: C 端公开接口，无需 B 端 JWT；连锁选店（GET /shop/list）
  - name: 菜品与菜单
    description: C 端，小程序前端；**GET /dish/listAll** 仅按 **`onsale=true`** 过滤（见 `info.description`）
  - name: 套餐（小程序）
    description: |
      C 端结构化套餐只读接口（**无需 B 端 JWT**）。选规格页优先 **`GET /combo/detail`**；金额试算 **`POST /combo/calcPrice`**；提交订单仍用 **订单** 分组的 **`POST /order/create`** / **`addDishes`**。
      运营维护套餐定义见 **运营后台** 分组 **`/admin/combo/*`**。
  - name: 订单
    description: |
      C 端 + B 端（部分接口如 /order/delete 供运营后台前端）。
      **库存与售罄**：`POST /order/create`、`/order/addDishes` 会校验并扣减当前门店 **`t_dish_shop.stock`**，且拒绝当前门店 **`sold_out=1`**（规则见 `info.description`）；`POST /order/cancel` 回退 **`stock`** 并按库存同步当前门店 **`sold_out`**（**不**改 **`onsale`**）。菜单接口 **`GET /dish/listAll`** 仅按 **`onsale`** 过滤；**`sold_out=1`** 的菜品仍可能出现在列表中，下单时会被拒绝。返回的 **`Dish.stock`** 供展示剩余份数；**`Dish.quantity`** 不为可售库存。建议连接 **`/ws/menu`** 并在 **`dish_catalog_changed`** 时刷新菜单（含卖光同步售罄、取消回退库存后同步售罄）。
  - name: 支付与回调
    description: C 端 + 微信回调
  - name: 活动与弹窗
    description: C 端 + B 端（活动 CRUD 供运营后台前端）
  - name: 优惠券
    description: C 端，小程序前端
  - name: 邀请
    description: C 端，小程序前端
  - name: 地址管理
    description: C 端，可选
  - name: KDS-Client
    description: 厨显设备端；按操作的 `x-kds-profile` 区分 Cloud compatibility 与 Cashier LAN，均不使用 B 端 JWT
  - name: 帮助与客服
    description: C 端，可选
  - name: 公告
    description: C 端门店公告列表；连锁按 shop_id / X-Shop-Id；库表 t_announcement
  - name: 积分中心
    description: C 端，可选
  - name: 系统配置
    description: C 端，可选
  - name: 排队取号
    description: C 端，排队配置与取号状态
  - name: 停车优惠与车辆绑定
    description: C 端，小程序前端
  - name: 运营后台
    description: B 端，供运营后台前端（admin_panel）调用；需 Authorization Bearer JWT；各接口需对应权限码（见 x-permission），详见 docs/权限设计.md
  - name: 收银机端
    description: |
      收银机/POS 端；开台、点餐、结账、挂单、打印、日结等；Bearer JWT。
      多渠道 KDS Delivery 使用主收银短租约、持久游标补拉与 SQLite Inbox，WebSocket 只作唤醒。
  - name: 门店管理
    description: 多门店、营业时间；B 端
  - name: 支付方式
    description: 支付方式配置；B 端
  - name: 库存与成本
    description: 原材料、入库出库、库存预警、成本核算；B 端
  - name: 会员营销
    description: 会员充值、消费记录、画像；B 端
  - name: 用户统计
    description: 按注册时间（t_user.time）查询近 7 天、上月、本月、自定义时间段用户；B 端，需 user:view
  - name: 外卖对接
    description: 美团/饿了么接单、状态回传、对账；B 端
  - name: 日结与对账
    description: 收银员交班、门店日结、营业收入、支付渠道对账；B 端
  - name: 数据报表
    description: 营业日报/周报/月报、销量榜、收银员业绩、门店利润、同比环比；B 端
  - name: 操作日志
    description: 订单日志、关键操作审计；B 端
  - name: 实时推送
    description: |
      WebSocket 等非 REST。
      - **/ws/menu**：C 端 dish_catalog_changed / business_changed / takeout_dispatch_changed 等。
      - **/ws/kds**：厨显专用，详见下方 **KDS WebSocket** 与 **KDS-Client** 标签；连接示例 `wss://host/ws/kds?shop_id=1&screen_tag=meat_grill&token=<device_token>`。
  - name: 真省钱配送
    description: |
      真省钱聚合跑腿对接（`com.lanf.integration`）。代理调用 zsq.wlhulian.com/api，对外统一 REST。
      需真省钱 **Authorization**（`POST /api/zsq/auth/login` 返回）；**非**运营后台 B 端 JWT。
      配置见 **`application.yml`** 的 **`zsq.*`**（`api-base`、`username`、`password`、`rider-speed-kmh` 等）。
      详细流程见 **docs/真省钱配送后端开发文档.md**。
  - name: KDS-Admin
    description: |
      ## KDS 是什么

      **厨房显示系统（Kitchen Display System）**：把点餐系统的订单明细，按**岗位分屏**推到厨房平板/安卓屏上，厨师通过**划菜**更新制作进度；与飞鹅**热敏打印**可并行或替代。

      - **不修改** `t_order` / `t_order_detail` 表结构；厨显数据在扩展表（迁移 **`docs/db_migration_kds.sql`**）。
      - **运营后台（admin_panel）** 使用本标签下 **`/admin/kds/*`** 做配置；**厨显 App（uni-app/安卓）** 使用 **KDS-Client** 下 **`/kds/*`** + **`/ws/kds`**。运营配置步骤见 **`docs/kds_admin_setup_guide.md`**。

      ## 门店模式 `kds_mode`（`POST /admin/kds/config/save`）

      | 值 | 含义 | 前端影响 |
      |----|------|----------|
      | `print_only` | 默认，仅飞鹅打印 | 无厨显工单；可不开发厨显端 |
      | `kds_only` | 仅厨显 | 下单后不打厨房小票；必须接 WS + 列表 |
      | `both` | 打印 + 厨显 | 与现网打印并存 |

      ## 启用流程（运营后台，建议顺序）

      1. 执行库表迁移 **`docs/db_migration_kds.sql`**、权限 **`patch_kds_api_permission.sql`**（或 `init_api_permission.sql` 内 KDS 段）。
      2. **`POST /admin/kds/station/init-five`** — 一键创建五屏档口（已存在则跳过）。
      3. **`POST /admin/kds/station/category/bind`** — 分类 `cid` 绑到档口（兜底路由）。
      4. **`POST /admin/kds/dish-screen/bind`** — 菜品绑 `screen_tag`（**优先于**分类）。
      5. **`POST /admin/kds/config/save`** — 设 `kds_mode` 为 `kds_only` 或 `both`。
      6. **`POST /admin/kds/device/bind`**（可选）— 预绑设备；厨显端亦可直接 **`POST /kds/device/login`** 自助绑定。
      7. 故障补数据：**`POST /admin/kds/ticket/repush`**，`body: { "order_id": <t_order.id> }`。

      所有本组接口：**`Authorization: Bearer <JWT>`** + **`X-Shop-Id`**（当前门店），权限码 **`kds:config`**。

      ## 五屏 `screen_tag`（与 PRD 一致）

      | screen_tag | 名称 | 是否生成 `t_kds_ticket` | 厨显 UI |
      |------------|------|-------------------------|---------|
      | `skewer_aggregate` | 抓串汇总 | 否 | 全店待做菜品聚合，`/kds/skewer/*` |
      | `meat_grill` | 荤菜烤制 | 是 | 订单卡片队列 + 划菜 |
      | `veg_grill` | 素菜烤制 | 是 | 同上 |
      | `seafood_special` | 海鲜特色 | 是 | 同上 |
      | `expedition` | 总出餐核对 | 否（列表筛 done） | 待出餐核对屏 |

      ## 与订单埋点（无需 Admin 调）

      下单 / 加菜 / 打包支付成功 / 退菜 / 取消订单时，后端 **`KdsOrderHook`** 自动维护工单（仅 `kds_only|both`）。运营 **`POST /admin/order/list`** 每条订单可带非表字段 **`kds_order_status`**（10/20/30/40/90），见 **`Order`** schema。

      更细产品说明：**docs/kds_module_functional_requirements.md**、**docs/kds_module_development_plan.md**。
  - name: KDS-Client
    description: |
      ## 适用端

      **厨显平板 / 安卓屏 App**（非小程序、非 admin_panel）。所有 **`/kds/*`**（除 login）**不要**带 B 端 JWT；使用设备令牌 **`X-Kds-Device-Token`**。

      ## 收银局域网权威架构（v1.2.159）

      门店离线模式以**收银端 SQLite** 为唯一订单与厨房事实源。KDS 不持久化订单业务库，
      只调用收银端局域网 `/kds/*` 与 `/ws/kds`；收银端在本地事务提交后写 cloud outbox，
      再异步调用云端 `POST /admin/kds/replication/events`。云端失败不得回滚本地订单或划菜结果。

      ## 统一工作流前端调用链

      ```text
      1. **Cloud compatibility** 可用 `shop_id + device_code` 调 login；**Cashier LAN** 仅首次配对或 token 失效时用一次性 `pairing_code` 调 login。已有 LAN token 的冷启动先调 `GET /kds/device/me`，严禁为自动登录保存/复用 pairing_code
      2. 保存 device_token/shop_id/screen_tag/workflows，记录 syncStartMs = Date.now()
      3. 连接 /ws/kds?shop_id=&screen_tag=workflow_board&token=，连接期间先缓存事件
      4. GET /kds/workflow/bootstrap?queues=...&view=order 拉取权威多队列快照
      5. GET /kds/sync/changes?since=syncStartMs 检查启动窗口内变更；有变更则重拉受影响队列
      6. 应用连接期间缓存的 WS；按 detail_id/ticket_id 覆盖，无法判定新旧时重拉当前队列
      7. 单条划菜：POST /kds/item/status/update，立即应用 HTTP patch
      8. 合并组：POST /kds/workflow/advance-item，传 detail_ids[] + quantity
      9. 收到 update_order/new_order/cancel_item/... 后局部更新；字段不足时 debounce 重拉 board
      10. code=5001：丢弃乐观更新并 GET /kds/order/item/list 或 workflow/board 校准
      11. 断线重连：先连 WS，再 changes(since=lastSyncMs)，最后重拉受影响队列
      12. 定时 POST /kds/device/heartbeat；WS 发文本 ping 收 pong

      ## KDS 运行 profile（禁止假定完全兼容）

      | Profile | LAN 明确支持的 HTTP 路由 |
      |---|---|
      | Cloud compatibility | 本文件现有云端 `/kds/*` 实现；login 可按门店/设备码复用绑定 |
      | Cashier LAN | `POST /kds/device/login`、`GET /kds/device/me`、`POST /kds/device/heartbeat`、`GET /kds/health`、`GET /dish/listAll`、`GET /kds/workflow/board`、`GET /kds/workflow/bootstrap`、`GET /kds/order/item/list`、`GET /kds/sync/changes`、`POST /kds/workflow/advance-item` |

      LAN 服务是门店订单/KDS 的本地权威源；未列入上表的旧 `/kds/*` 路由仅属于 Cloud compatibility，客户端不得只因路径相同就认定 LAN 已实现。
      ```

      **状态归并原则**：HTTP 写响应负责即时反馈，WS 负责通知其它设备，`bootstrap` / `board` / `order/item/list` 是最终权威快照。当前 WS 没有全局事件序号，前端不得只依赖 WS 重建完整状态。

      ## 鉴权

      | 项 | 说明 |
      |----|------|
      | Header | **`X-Kds-Device-Token`**：login/bind 返回的 `device.device_token` |
      | 白名单 | login 无需 token。Cloud compatibility 与 Cashier LAN 的 heartbeat 均**必须**带设备 token。`GET /kds/device/me` 必须带 token |
      | JWT | **`/kds/**` 已从 B 端 JWT 拦截器排除**；误带 Bearer 不影响，但以设备 token 为准 |
      | 屏隔离 | token 绑定 `screen_tag`；**不可**用荤烤 token 查素烤队列（403） |

      ## 状态机（必记）

      **单品** `item_status`（`t_kds_ticket`，划菜接口 `status`）：

      | 值 | 含义 | UI 建议 |
      |----|------|---------|
      | 0 | 待做 | 主队列 |
      | 1 | 制作中 | 进行中 |
      | 2 | 完成 | 移出待做；总出餐屏可见 |
      | 3 | 作废 | 退菜/缺货/取消，移出队列 |

      **整单** `kds_order_status`（`t_kds_order`，运营列表只读）：

      | 值 | 含义 |
      |----|------|
      | 10 | 待制作 |
      | 20 | 制作中 |
      | 30 | 部分完成 |
      | 40 | 全部完成（厨显） |
      | 90 | 已取消（`transac_status=cancelled`）；结账不影响厨显 |

      整单达到 **40** 表示后厨全部传菜完成；默认**不**改 **`order_receiving`**。门店可在 **`POST /admin/kds/config/save`** 设 **`auto_off_order_on_kds_done=1`** 自动清台（**`off_order`**），厨显仍显示 **40**（见 **v1.2.136**）。

      **`GET /kds/order/list` 的 `status` 查询参数**：传 **0/1/2** 过滤单品状态；**不要**传字符串 `pending`。总出餐屏 `expedition` 默认看待出餐（done）。

      ## WebSocket `/ws/kds`

      - **URL**：`ws://host/ws/kds` 或 `wss://host/ws/kds`
      - **Query（必填/建议）**：`shop_id`、`screen_tag`、`token`（= device_token）
      - **帧格式**：UTF-8 JSON 文本
      - **心跳**：客户端发纯文本 `ping`，服务端回复 `{"type":"pong"}`
      - **下行信封**：

      ```json
      {
        "type": "new_order",
        "shop_id": 1,
        "screen_tag": "meat_grill",
        "payload": {
          "order_id": 9625,
          "order_no": "ORD...",
          "table_number": "8",
          "remark": "少辣",
          "kds_order_status": 10,
          "items": [
            { "detail_id": 12001, "name": "油边王", "quantity": "2", "unit": "串", "remark": "多烤一会", "selectedSpicy": "微辣" }
          ]
        }
      }
      ```

      **`payload.remark`** 为整单备注（`t_order.remark`）；**`payload.items[].remark`** 为菜品备注（`t_order_detail.remark`）。
      **`update_order`** 单条事件在顶层用 **`detail_remark`** 表示菜品备注，避免与整单 **`remark`** 冲突。
      高频变更载荷可优先读 **`payload.operation`**（与 **`type`** 配合）。当前后端实际推送类型为 `new_order`、`update_order`、`cancel_item`、`cancel_order`、`order_status_changed`、`dish_flags_changed`、`config_changed`、`pong`；**当前不发送 `board_changed`**。

      | operation（payload） | 含义 |
      |----------------------|------|
      | `new_order` | 首单进厨显 |
      | `add_dish` | 加菜（另可收 **`dish_flags_changed`**） |
      | `advance` | 工作流划菜 / 配菜推进 |
      | `item_status` | 烤制屏 **`POST /kds/item/status`** 划菜 |
      | `revoke` | 工作流撤销划菜 |
      | `serve` | 出餐屏传菜 |
      | `rush` / `overdue` / `hold` / `release` | 催菜 / 超时 / 等叫 / 起菜 |
      | `refund` / `lack` / `cancel_item` / `cancel_order` | 退菜 / 缺货 / 明细作废 / 整单取消 |

      | type | 何时推送 | 前端动作 |
      |------|----------|----------|
      | `new_order` | 新工单进本屏 | 插入列表；读 **`operation`**（`new_order`/`add_dish`） |
      | `update_order` | 划菜/状态变更 | 局部更新；读 **`operation`** |
      | `dish_flags_changed` | 催/超/加/等叫 | 局部更新行标记 |
      | `cancel_item` | 退菜/缺货 void | 移除明细；字段不足时重拉当前队列 |
      | `cancel_order` | 整单取消 | 移除整单 |
      | `order_status_changed` | 整单聚合状态变化 | 更新角标（可选） |
      | `config_changed` | 门店 KDS 配置变更 | 重拉 settings/bootstrap |

      烤制屏 `new_order`/`update_order` 会**同步广播**到 `skewer_aggregate` 抓串屏。

      ## 离线

      - 旧 `item_status` 流可将操作存入本地队列并调用 `POST /kds/sync/all`；每项 `client_id` 必须**全系统唯一**，建议 UUID（当前去重主键未包含门店/设备）。
      - 统一数量工作流的 prep/cook/serve 暂不支持可靠离线回放；离线时建议禁用划菜，或仅保存“待确认意图”，重连校准后由用户确认再提交。
      - `GET /kds/sync/changes` 只返回变更工单摘要，不保证包含 board 所需的数量、订单、桌号和菜名；收到非空 changes 后应重拉受影响队列。

      ## 屏型与接口对照

      | 屏 | 主接口 |
      |----|--------|
      | 荤/素/海鲜烤 | `order/list`、`item/status`、`order/rush`、`order/finish-all` |
      | 抓串 | `skewer/summary`、`skewer/picked` |
      | 总出餐 | `order/list`（`screen_tag=expedition`） |

      Postman 示例：**docs/postman-kds.json**；本地脚本：**server/scripts/kds_local_run.ps1**。
  - name: 系统设置
    description: |
      门店系统设置域（B 端管理面板，2026-08 新增）：设置导航/门店设置继承与覆盖、打印设备与规则、支付渠道运营、通知规则、首单活动、员工与角色权限、库存（供应商/仓库/BOM/采购/调拨/批次 FEFO）、报表导出任务、日志查询与归档导出。

      契约要点（backend_coordination_system_settings.md §1）：
      - 统一 `Authorization: Bearer <JWT>` + `X-Shop-Id`；配置响应含 `source`(HEADQUARTERS/SHOP/SYSTEM)、`version`、`updatedAt`、`updatedBy`；
      - 写接口携带 `version` 乐观锁，冲突返回 **HTTP 409** + body `{code, error, msg, data}`（data 为最新版本摘要）；
      - 列表统一 `page/pageSize/total/items`；时间 ISO 8601 带时区；敏感字段（密钥/结算/接收人手机号）按权限脱敏；
      - 稳定错误码：`SETTINGS_VERSION_CONFLICT`、`SETTINGS_CONFIRM_REQUIRED`、`PRINTING_VERSION_CONFLICT`、`NOTIFICATIONS_VERSION_CONFLICT`、`FIRST_ORDER_RULE_CONFLICT`、`ACCESS_CONFIRM_REQUIRED`、`ROLE_IN_USE`、`ACCESS_ROLE_VERSION_CONFLICT`、`TRANSFER_LEGAL_ENTITY_MISMATCH`、`BATCH_FEFO_OVERRIDE_REASON_REQUIRED`、`PAYMENT_IDEMPOTENCY_KEY_REQUIRED`、`PAYMENT_CHANNEL_UNKNOWN`、`ARCHIVE_QUERY_PENDING`。

paths:
  /api/v1/subscribe/prompt-decision:
    get:
      tags:
        - 微信订阅消息
      summary: 获取微信订阅弹窗智能决策
      description: 服务端根据用户的剩余额度台账与拒收状态智能裁决是否需要唤起微信授权弹窗
      parameters:
        - name: scene
          in: query
          required: true
          schema:
            type: string
          description: 业务场景编码，如 MEAL_PICKUP_READY
        - name: openid
          in: query
          required: true
          schema:
            type: string
          description: 微信用户 openid
        - name: shop_id
          in: query
          required: false
          schema:
            type: integer
          description: 门店 ID
      responses:
        '200':
          description: 决策结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      scene:
                        type: string
                        example: MEAL_PICKUP_READY
                      need_prompt:
                        type: boolean
                        example: true
                      remain_quota:
                        type: integer
                        example: 0
                      template_ids:
                        type: array
                        items:
                          type: string
                      page_path:
                        type: string
                        example: pages/order/detail
                      reason:
                        type: string

  /api/v1/subscribe/report:
    post:
      tags:
        - 微信订阅消息
      summary: 微信订阅消息授权结果回传上报
