        label: { type: string, description: '类目展示名' }
        value: { type: string, description: '类目值/编码' }
        count: { type: integer, description: '该类目下菜品数量' }
        sele_quantity: { type: integer }
        cid: { type: string, description: '类目唯一标识，与 t_order_detail.cid 关联' }
        sorting: { type: integer, description: '排序值，越小越靠前' }
        dishList: { type: array, items: { $ref: '#/components/schemas/Dish' }, description: '该类目下菜品列表' }

    Dish:
      type: object
      description: 菜品实体，对应 t_dish（见 db_diancan.sql）；门店上下文下 **`stock`** / **`sold_out`** 返回字段分别来自 **`t_dish_shop.stock`** / **`t_dish_shop.sold_out`**（字段名保持不变）；**`name`** / **`image`** / **`unit`** / **`specification`** / **`typeId`** / **`sorting`** / **`serving_duration_minutes`** 在门店上下文下分别来自 **`t_dish_shop` 覆盖列**（`name_override` / `image_override` / `unit_override` / `specification_override` / `type_id_override` / `sorting_override` / `serving_duration_override`，NULL 时回退 `t_dish` 原值，见迁移 `docs/db_migration_dish_shop_full_overrides.sql`）
      properties:
        id: { type: integer, description: '菜品主键' }
        name: { type: string, description: '菜品名称' }
        image: { type: string, description: '菜品图片 URL' }
        typeId: { type: integer, description: '分类 id，对应 t_category.id' }
        monthlysale: { type: integer, description: '月销量' }
        sorting: { type: integer, description: '排序值' }
        unitprice: { type: number, description: '单价' }
        unit: { type: string, description: '单位，如份、瓶' }
        quantity: { type: integer, description: '历史字段「商品数量」，**不参与**可售库存扣减；可忽略或由运营自用' }
        stock:
          type: integer
          description: |
            可售库存份数；门店上下文下来自 **`t_dish_shop.stock`**，返回字段名仍为 **`stock`**。**`null` 或 &lt;0**：不按库存管理（不限量）。**&gt;0**：有限库存，下单/加菜成功后会扣减；**扣至 0 时同步当前门店 `sold_out=1`**（**不**自动改 **`onsale`**）。**=0 且 `onsale=true`**：未启用库存（兼容），不按库存扣减。**=0 且 `onsale=false`**：可能为后台下架或历史数据；取消未支付订单回退 **`stock`** 后按库存同步当前门店 **`sold_out`**（**不**自动改 **`onsale`**）。前端列表宜展示「剩余份数」或「售罄」以配合本字段。
        time: { type: string, description: '上架时间' }
        onsale:
          type: boolean
          description: |
            **true** 上架、**false** 下架。门店上下文下来自 **`t_dish_shop.onsale_override`**，返回字段名仍为 **`onsale`**。下架菜品不可下单。**`onsale` 仅由后台 `POST /admin/dish/updateOnSale`（及新建菜默认上架等）维护**；库存扣减/回退**不会**自动修改 **`onsale`**（见顶层「库存与下单/取消」）。
        sold_out:
          type: integer
          enum: [0, 1]
          description: |
            **0** 未售罄、**1** 已售罄（默认 0）。门店上下文下来自 **`t_dish_shop.sold_out`**，返回字段名仍为 **`sold_out`**。**`GET /dish/listAll`** 不按本字段过滤（仅 **`onsale=true`**），前端可据此展示「售罄」等态。下单校验要求当前门店 **`sold_out` 不为 1`**。后台可通过 **`POST /admin/dish/save`** 或 **`POST /admin/dish/updateSaleStatus`** 写入；服务端在扣减/回退库存及 **`POST /admin/dish/updateOnSale`** 上架时会按门店 **`stock`** 同步本字段。
        specification: { type: string, description: '规格 JSON，如 {"辣度":["微辣","中辣"]}；门店上下文下为 t_dish_shop.specification_override（NULL 回退 t_dish.specification）' }
        serving_duration_minutes:
          type: integer
          minimum: 1
          default: 10
          description: '预计出餐时长（分钟）。新增未传默认 10；KDS 单品待做超时优先使用该值，历史明细无法关联菜品时回退门店 sla_minutes。'
        comboDefinition:
          $ref: '#/components/schemas/ComboMenuDefinition'
          description: |
            非表字段。**GET /dish/listAll** 对启用套餐头菜附带（结构同定义表，子项主要为 componentDishId）。选规格页请 **GET /combo/detail**。

    ActivityPopup:
      type: object
      description: 活动弹窗，对应 t_activity_popup（见 db_diancan.sql）
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        popup_image: { type: string }
        image_url: { type: string }
        target_user: { type: string, description: 'new/member/all' }
        start_time: { type: string }
        end_time: { type: string }
        is_enabled: { type: integer, description: '1-启用 0-禁用' }
        max_show_count: { type: integer }
        type:
          type: string
          enum: [home_top, home_bottom, page_top, page_hor, page_activity]
          description: '与 t_activity_popup 表 type enum 一致'
        sorting: { type: integer }
        created_at: { type: string }
        apply_shop_ids:
          type: string
          nullable: true
          description: '适用门店 JSON 数组字符串，如 "[1,5,3]"；NULL/空/[]=全部门店可见'

    Coupon:
      type: object
      description: 优惠券主表，对应 t_coupon（见 db_diancan.sql）
      properties:
        id: { type: integer, format: int64 }
        coupon_name: { type: string }
        coupon_type: { type: string, description: 'full_reduction/discount/direct_reduction' }
        apply_dining_type: { type: string, description: 'all/dine_in/take_out' }
        apply_dish_ids:
          type: string
          description: |
            适用菜品ID数组（JSON 字符串），为空/NULL 表示不限菜品；非空则下单使用优惠券时要求**订单内菜品至少命中**该白名单。
            示例：`[1,2,3]`
        apply_shop_ids:
          type: string
          description: |
            适用门店 ID 数组（JSON 字符串），为空/NULL 表示全部门店；非空则仅在**当前门店命中白名单**时可用券。
            示例：`[1,2]`。库表见 **`docs/db_diancan_chain_store_patch.sql`**。
            **B 端**：列表/详情/编辑/删除按当前解析门店与上述白名单过滤（**4003** 不属于当前店可见范围）。**`POST /admin/coupon/add`** 若未传本字段，服务端默认写入**仅当前门店**的 JSON 数组。
        discount_value: { type: number }
        min_amount: { type: number }
        start_time: { type: string }
        end_time: { type: string }
        status: { type: integer, description: '0-未启用 1-可用 2-已下架' }
        stock: { type: integer, description: '-1 无限库存' }
        granted_count:
          type: integer
          description: |
            已累计发放张数（每成功写入一条 `t_user_coupon` +1）。新建券默认为 0；历史库见 **`docs/db_migration_coupon_granted_count.sql`**。
        description: { type: string }
        validity_time: { type: integer, format: int64, description: '有效期（小时）' }

    UserCouponDTO:
      type: object
      description: 用户优惠券，对应 t_user_coupon 与 t_coupon 关联（见 db_diancan.sql）
      properties:
        id: { type: integer, format: int64 }
        user_openid: { type: string }
        coupon_id: { type: integer, format: int64 }
        get_time: { type: string }
        use_time: { type: string }
        order_no: { type: string }
        status: { type: integer, description: '0-未使用 1-已使用 2-已失效' }
        expire_time: { type: string }
        coupon_name: { type: string }
        discount_value: { type: number }
        min_amount: { type: number }
        coupon_type: { type: string }
        start_time: { type: string }
        end_time: { type: string }
        description: { type: string }
        apply_dining_type: { type: string }
        apply_dish_ids:
          type: string
          description: |
            适用菜品ID数组（JSON 字符串），来自 t_coupon.apply_dish_ids。为空/NULL 表示不限菜品。
            下单使用优惠券时会校验订单内菜品是否全部命中该白名单。

    CouponRuleValidateRequest:
      type: object
      description: 优惠券规则预校验请求（仅校验，不占用券）
      required: [openid, coupon_id]
      properties:
        openid: { type: string, description: '用户 openid' }
        coupon_id: { type: integer, format: int64, description: '用户券记录 ID（t_user_coupon.id）' }
        shop_id: { type: integer, description: '连锁门店 ID（t_shop.id，可选）' }
        dineInOrTakeOut: { type: string, description: '堂食/打包（可选）' }
        discount_amount: { type: number, description: '前端计算的优惠金额（可选；传入则与后端规则结果比对）' }
        goods_list:
          type: array
          description: 订单明细（至少传 name、total_price）
          items: { $ref: '#/components/schemas/OrderDetail' }

    CouponRuleValidateResult:
      type: object
      description: 优惠券规则预校验结果
      properties:
        valid: { type: boolean, description: '是否满足当前券规则' }
        coupon_id: { type: integer, format: int64, description: '用户券记录 ID（t_user_coupon.id）' }
        coupon_template_id: { type: integer, format: int64, description: '券模板 ID（t_coupon.id）' }
        coupon_type: { type: string, description: '券类型：full_reduction/discount/direct_reduction' }
        eligible_amount: { type: number, description: '参与规则计算的金额（命中白名单菜品金额）' }
        total_amount: { type: number, description: '订单原价（明细小计合计）' }
        min_amount: { type: number, description: '门槛金额' }
        discount_amount: { type: number, description: '按规则计算得到的优惠金额' }
        payable_amount: { type: number, description: '计算后的应付金额（total_amount-discount_amount）' }
        reason: { type: string, description: '通过/失败原因说明' }

    CategorySalesDTO:
      type: object
      description: 分类销售额统计项，对应 OrderMapper.statisticsCategorySales 查询结果
      properties:
        cid: { type: integer, format: int64, description: '分类 id（t_order_detail.cid）' }
        category_name: { type: string, description: '分类名称（来自 t_category.value）' }
        total_sales: { type: string, description: '该分类在该时间范围内的销售总额（来自 SUM(od.total_price)）' }

    DishSalesDTO:
      type: object
      description: 按菜品销售额统计项，对应 OrderMapper.statisticsDishSales 查询结果
      properties:
        dish_name: { type: string, description: '菜品名称（t_order_detail.name）' }
        total_sales: { type: string, description: '该菜品在时间范围内的销售总额（SUM(total_price)）' }
        total_quantity: { type: integer, format: int64, description: '该菜品在时间范围内的销售总数量（SUM(quantity)）' }

    # ---------- 分页与扩展（体验优化）----------
    PageResult:
      type: object
