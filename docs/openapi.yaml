    - **v1.2.196（收款会话释放与最新金额确认）**：新增 **`POST /pay/offline-collect/cancel`**。收银端关闭尚未确认到账的二维码或切换支付渠道时，按当前门店、订单、`session_id` 与渠道仅取消调用方拥有的 `PENDING` 占用；其他收银可重新出码。重复出码以最后一次 **`POST /pay/offline-collect/temp-qrcode`** 写入的 `amount_fen` 为准；确认接口不再让客户端残留的旧金额阻断最新收款，响应返回实际确认的 `amountFen`。`CONFIRMED` 记录不允许关闭取消。
