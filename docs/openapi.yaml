                  terminal_id: { type: string }
                  drawer_code: { type: string }
                  state: { type: string }
                  operator_id: { type: integer }
                  operator_name: { type: string }
                  terminal_name: { type: string }
                  drawer_name: { type: string }
                  duration_seconds: { type: integer, format: int64 }
                  opened_at: { type: string }
                  closed_at: { type: string }
                  business_day: { type: string }
                  opening_float: { type: number }
                  cash_sales: { type: number }
                  cash_refunds: { type: number }
                  cash_in: { type: number }
                  cash_out: { type: number }
                  cash_drop: { type: number }
                  expected_cash: { type: number }
                  counted_cash: { type: number }
                  variance: { type: number }
                  variance_reason_code: { type: string }
                  variance_note: { type: string }
                  approved_by: { type: integer }
                  channels:
