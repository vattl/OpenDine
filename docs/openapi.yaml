          in: query
          required: true
          schema:
            type: integer
        - name: channel
          in: query
          required: false
          schema:
            type: string
            default: wechat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
          description: OK
  /admin/payment/routing-rules/simulate:
    post:
      tags:
        - 支付配置
      summary: 模拟试算订单商户分流路由决策
      parameters:
        - name: shopId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  default: wechat
                paidYuan:
                  type: number
                diningType:
                  type: string
                goodsItems:
                  type: array
                  items:
                    type: object
                    properties:
                      goodsId:
                        type: integer
                      goodsName:
                        type: string
                      categoryId:
                        type: integer
                      price:
                        type: number
                      quantity:
                        type: integer
      responses:
        '200':
          description: OK
  /api/v1/kds/orders/canonical:
    get:
      tags:
        - KDS
      summary: 获取规范化 KDS 订单快照
      description: 为管理后台及统计分析提供的当天权威快照接口
      parameters:
        - name: after_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        \'200\':
          description: OK
  # ---------- 认证与用户 ----------
  /order/getOpenid:
    post:
      tags: [认证与用户]
      summary: 通过 code 获取 openid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOpenidRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOpenidResponse'
        '500':
          description: 失败（code 非 0，msg 为错误信息）

  /order/getUserInfo:
    post:
      tags: [认证与用户]
      summary: 根据 openid 获取用户信息（含可用优惠券数量）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUserInfoRequest'
      responses:
        '200':
          description: 成功，body 含 code、data（User）、couponCount（可用优惠券数量，未使用 status=0）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserInfoResponse'
        '500':
          description: 失败

  /order/updateUser:
    post:
      tags: [认证与用户]
      summary: 更新用户信息（昵称、手机、生日等；生日仅可设置一次不可再改）
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 成功，body 含 code、msg、data（nickname/avatar/phone/points/birthday）
        '500':
          description: 失败

  /order/updateAvatar:
    post:
      tags: [认证与用户]
      summary: 上传头像（multipart/form-data）
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                openid: { type: string, description: '用户 openid' }
                avatar: { type: string, format: binary, description: '头像文件（multipart 上传）' }
                phone: { type: string, description: '手机号' }
                nickname: { type: string, description: '昵称' }
      responses:
        '200':
          description: 成功，body 含 code、data（nickname/avatar/phone/points）
        '500':
          description: 失败

  /order/getOfficialPhoneNumber:
    post:
      tags: [认证与用户]
      summary: 通过微信 code 获取手机号并更新用户
      description: |
        若手机号已存在于 `t_user`，后端会沿用该手机号对应的已有用户资料，仅将其 `openid` 替换为当前传入的 `openid`，并迁移订单、优惠券、地址等 openid 关联数据，避免同一手机号产生两份用户资料。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: '微信 getPhoneNumber 返回的 code' }
                openid: { type: string, description: '用户 openid，用于更新对应用户手机号' }
                invite_code: { type: string, description: '邀请码，可选' }
      responses:
        '200':
          description: 成功，body 含 code、data（phoneNumber/purePhoneNumber/countryCode/updateSuccess/mergedExistingUser）
        '500':
          description: 失败

  # ---------- 桌台与营业 ----------
  /order/table_verify:
    get:
      tags: [桌台与营业]
      summary: 校验桌号是否存在
      parameters:
        - name: number
          in: query
          required: true
          schema: { type: string }
          description: 桌台号（如 A01、1）
        - name: shop_id
          in: query
          required: false
          schema: { type: integer, format: int32 }
          description: |
            可选。传入且为正整数时**优先**作为门店 ID，在该门店下校验桌号是否存在（高于 `X-Shop-Id` / `X-Shop-Code` 等解析结果）。
            不传时仍按连锁门店解析规则（请求头等），缺失默认门店 1。
      responses:
        '200':
          description: code=0 台号存在，非 0 台号不存在
        '500':
          description: 失败

  /order/table_status:
    get:
      tags: [桌台与营业]
      summary: 获取桌台状态
      parameters:
        - name: number
          in: query
          required: true
          schema: { type: string }
          description: 桌台号
      responses:
        '200':
          description: 成功，body 含 code、status（0/1/2 等）
        '500':
          description: 失败

  /order/Business:
    post:
      tags: [桌台与营业]
      summary: 获取当前门店营业接单与评价开关
      description: |
        按请求头 **`X-Shop-Id`**（或与 C 端其它接口一致的门店解析规则，缺省门店 **1**）读取 **`t_shop.ordering_open`**、**`t_shop.ordering_review`**。
        库表增量见 **`docs/db_migration_shop_ordering_flags.sql`**。
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200':
          description: 成功，body 含 code、business、isReview、shopId
        '500':
          description: 失败

  /order/ChangeBusiness:
    post:
      tags: [桌台与营业]
      summary: 切换当前门店营业接单开关（开/关）
      description: |
        按 **`X-Shop-Id`** 更新 **`t_shop.ordering_open`**（**`1`** 营业 / **`0`** 休息）。**营业时**（`bus=1`）服务端会自动处理该店待接单订单（堂食未结即接单打印，打包/外卖已支付即接单打印）。**成功后会向 `/ws/menu` 已连接客户端推送** `type=business_changed`，字段 **`business`**、**`shopId`**。

        **v1.2.219 起与收银端 `POST /cashier/shop/business` 共用同一核心逻辑**（`OrderController#changeBusinessCore`），并接入强制班次/日结流程：
        - **开门**：门店 **`shift_required=1`** 且无进行中班次（`t_shift.end_time IS NULL`）→ **`code=4001`**「未开班不得营业」；
        - **关门**：门店 **`shift_required=1`** 存在进行中班次、或 **`settle_required=1`** 当日营业日未日结 → **`code=4000`**「无法打烊…」；
        - **逃生**：body 带 **`force="1"`** 且当前用户具备 **`admin:manage`** 时跳过校验，并写安全审计日志（`open_forced`/`close_forced`）。
        推荐收银端改用 **`POST /cashier/shop/business`**；本接口保留兼容旧客户端。
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bus]
              properties:
                bus:
                  type: string
                  description: '传 `"1"` 表示营业（business=true），其它值表示休息（business=false）'
                force:
                  type: string
                  description: 'v1.2.219 起支持：传 `"1"` 强制跳过未开班/未交班/未日结校验（需 admin:manage 权限）'
      responses:
        '200':
          description: 成功，body 含 code、business、shopId
        '4000':
          description: '关门被拦截：存在进行中班次未交班 / 当日营业日未日结（force 逃生能力仍可用）'
        '4001':
          description: '开门被拦截：未开班不得营业（force 逃生能力仍可用）'
        '500':
          description: 失败（如参数缺失、数据访问失败）

  /order/calculateFinishTime:
    post:
      tags: [桌台与营业]
      summary: 预估出餐时间
      description: |
        根据当前未完成订单数量与堂食/打包类型，计算本单预估完成时间。
        逻辑：未完成订单数+1 作为新单序号；堂食首单基础 29 分钟，打包首单 35.5 分钟；按并行数（未完成≥10 时为 4 单/组否则 2 单/组）计算组数，得出完成分钟数，返回区间为 [floor(分钟), floor(分钟)+5]，如 "25-30分钟"。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dineInOrTakeOut: { type: string, description: '堂食或打包，用于区分首单基础时间（堂食 29 分钟，打包 35.5 分钟）' }
      responses:
        '200':
          description: 成功，body 含 code(0)、makeTime（预估区间字符串，如 "25-30分钟"）
        '500':
          description: 失败

  # ---------- 门店（小程序 C 端）----------
  /shop/list:
    get:
      tags: [门店（小程序）]
      summary: 营业门店列表（C 端公开）
      description: |
        供小程序**选店页**使用，**无需** `Authorization`。默认仅返回 **`t_shop.status=1`**（营业中）门店，按 **`id`** 升序。
        返回 **`Shop.latitude/longitude`** 为 **GCJ-02（高德）** 坐标（见 **`CoordinateConvention`**）。
        与 **`GET /admin/shop/list`** 区别：本接口不暴露 JWT、不要求 `shop:manage`，且默认只返回营业门店。
        库表执行 **`docs/db_diancan_chain_store_patch.sql`** 后若有 **`sort_order`** 列，实现可改为按 **`sort_order`、`id`** 排序（与网关缓存策略协调）。
      responses:
        '200':
          description: 成功，body 含 code(0)、list（Shop[]）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string }
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/Shop' }
        '500':
          description: 失败（code 非 0）

  # ---------- 菜品与菜单 ----------
  /ws/menu:
    get:
      tags: [实时推送]
      summary: 菜品菜单变更推送（WebSocket 端点）
      description: |
        **本条目仅作文档说明：请使用 WebSocket 协议连接，勿当作普通 HTTP GET 拉取 JSON body。**

        - **URL**：`wss://{host}/ws/menu`（与上方 `servers` 的 host 一致；本地示例 `ws://localhost/ws/menu`）。
        - **时机**：菜品变更见上述 admin 接口；**营业状态**见 **`POST /order/ChangeBusiness`**（营业时自动处理待接单订单）。
        - **消息体**（JSON）：`type` 为 `dish_catalog_changed` | `business_changed` | `auto_accept_changed`（已废弃） | `takeout_dispatch_alert`，字段见顶层 `info.description`「实时推送」。
        - **客户端**：微信小程序使用 `wx.connectSocket`；需在小程序后台配置 **socket 合法域名**。
      responses:
        '101':
          description: Switching Protocols，WebSocket 握手成功；之后服务端可能多次下发 UTF-8 文本帧（JSON）
        '400':
          description: 非 WebSocket 升级请求时可能失败

  /dish/listAll:
    get:
      tags: [菜品与菜单]
      summary: 获取所有分类及菜品列表
      description: |
        **仅返回过滤后 `dishList` 非空的分类**（某分类下若无上架菜则整项不出现）。每个分类下的 **`dishList`** 仅含上架菜品：**`onsale=true`**。**`sold_out`** 不在本接口过滤；若需展示「已售罄」态，可结合响应中的 **`sold_out`** / **`stock`** 由前端处理；**下单**仍受 **`sold_out`≠1** 等规则约束（见「订单明细合规校验」）。已下架（**`onsale=false`**）的菜品不会出现于本接口响应中（运营全量维护请用 **`GET /admin/dish/list`**）。
        建议在收到 **`/ws/menu`** 推送的 `dish_catalog_changed` 后重新调用本接口以刷新点餐页。
        **连锁**：可携带 **`X-Shop-Id`** / **`X-Shop-Code`** 或 query **`shop_id`** / **`shop_code`**（见 parameters）；解析与一致性规则见 **`components.parameters`** 说明；门店覆盖价/库存见 **`t_dish_shop`**。
        **结构化套餐（列表简要）**：绑定且启用的套餐头菜可附带 **`comboDefinition`**（见 **ComboMenuDefinition**），适合菜单列表角标/预展示。**进入选规格页请调 `GET /combo/detail`**（含子菜名称、门店价、售罄态，与下单口径一致）。
        **库表**：**`sold_out`** 见 **`docs/db_migration_dish_sold_out.sql`**；套餐见 **`docs/db_migration_combo_meal.sql`**。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - $ref: '#/components/parameters/ShopIdQuery'
        - $ref: '#/components/parameters/ShopCodeQuery'
      responses:
        '200':
          description: 成功，body 含 code、allDish（Category[]，每项含 dishList）
        '500':
          description: 失败

  # ---------- 套餐（小程序 / C 端） ----------
  /combo/detail:
    get:
      tags: [套餐（小程序）]
      summary: 套餐详情（选规格页）
      description: |
        **小程序专用**（免签 B 端 JWT）。按套餐头 **`dishId`**（**`t_dish.id`**）返回启用中的套餐结构及子菜展示信息（已套当前门店 **`t_dish_shop`** 价/上下架/售罄）。
        未配置或停用时 **`configured: false`** 且 **`message`** 提示。
        **勿与运营接口混淆**：本接口返回 **`header` / `fixedItems` / `groups`**；运营 **`GET /admin/combo/getByDishId`** 返回 **`combo` + `definition`**（仅 id/加价，无子菜展示）。
      parameters:
        - name: dishId
          in: query
          required: true
          schema: { type: integer }
          description: 套餐头菜品 t_dish.id
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
          description: 可选，目标门店ID；缺省时由请求头 X-Shop-Id 解析；优先匹配门店专属套餐，未匹配时回退总部通用模板 (shop_id = 0)
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'（菜单项 id）
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - $ref: '#/components/parameters/ShopIdQuery'
        - $ref: '#/components/parameters/ShopCodeQuery'
      responses:
        '200':
          description: 成功，body 含 code 及 ComboCustomerDetail（字段平铺在 data 或顶层，见 ComboCustomerDetail schema）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - $ref: '#/components/schemas/ComboCustomerDetail'
        '500':
          description: 失败（如套餐已下架）

  /combo/calcPrice:
    post:
      tags: [套餐（小程序）]
      summary: 试算套餐金额
      description: |
        **小程序专用**。按 **`comboId`**、**`quantity`**（套餐份数）、**`combo_selections`** 与当前门店计算 **`total_price`**（元），规则与 **`POST /order/create`** 套餐行校验一致（±0.02 元容差在下单时比对）。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComboCalcPriceRequest'
      responses:
        '200':
          description: 成功，body 含 code、total_price、comboId、quantity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      total_price: { type: number, description: '应付金额（元）' }
                      comboId: { type: integer, format: int64 }
                      quantity: { type: integer }
        '500':
          description: 失败（选项不合法、套餐停用等）

  # ---------- 外卖（小程序） ----------
  /order/takeout/config:
    get:
      tags: [外卖]
      summary: 门店外卖配置
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: shop_id
          in: query
          schema: { type: integer }
          description: 可选，缺省与请求头门店解析一致
      responses:
        '200':
          description: 成功，body.config 为 ShopTakeoutConfig（enabled=1 表示开启）

  /order/takeout/preview:
    post:
      tags: [外卖]
      summary: 预览起送与配送费（按门店与收货地址距离阶梯计费）
      description: |
        门店与收货点距离：**优先高德路径规划路网距离**（须配置 **`amap.web-key`**，默认驾车；见 **v1.2.86**）；否则或失败回退 **Haversine 直线距离**。
        服务端计算前统一为 **GCJ-02（高德）**；直接传 **`lng`/`lat`** 时可用
        **`coordinate_type`** 声明 `gcj02`（默认）、`wgs84` 或 `bd09`。
        使用 **`address_id`** 时读取已规范化的地址坐标。
        成功响应含 **`distance_km`**、**`distance_method`**（`route` | `straight_line`）。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id: { type: integer }
                openid: { type: string, description: '与 address_id 联用校验地址归属' }
                address_id: { type: integer, format: int64, description: '收货地址 id；与 openid 二选一可传 lng+lat' }
                lng: { type: number, description: '收货经度（无 address_id 时）' }
                lat: { type: number, description: '收货纬度（无 address_id 时）' }
                coordinate_type: { type: string, enum: [gcj02, wgs84, bd09], default: gcj02 }
                goods_subtotal: { type: number }
                goods_list: { type: array, items: { type: object } }
      responses:
        '200':
          description: 成功，含 packaging_fee、sett_amount_preview、delivery_fee、distance_km、distance_method、free_delivery、deliverable、meet_min_order 等

  /order/takeout/create:
    post:
      tags: [外卖]
      summary: 创建外卖订单（写 t_order + t_takeout_delivery）
      security: [{ UserToken: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      description: |
        请求体在 **OrderCreateRequest** 同级字段基础上增加 **address_id**（或 addressId）；**dineInOrTakeOut** 会强制为 **外卖**。
        须满足门店 **enabled**、起送价；**sett_amount** 后端写入「商品小计+打包费+配送费」并设置 **delivery_fee**，再复用 **`POST /order/create`** 流程。
        身份只取请求头 **`X-User-Token`**；请求体中的 `openid`、`code`、`wx_code` 不参与身份判定。Token 过期时先调用 **`POST /order/getOpenid`** 换取新 Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, goods_list]
              properties:
                address_id: { type: integer }
                openid: { type: string, description: '兼容字段；服务端以 X-User-Token 身份为准' }
                shop_id: { type: integer }
                goods_list: { type: array }
      responses:
        '200':
          description: 成功，与 create 一致并多 packaging_fee、delivery_fee、address_full、takeout_delivery_id

  /order/takeout/address/list:
    get:
      tags: [外卖]
      summary: 收货地址列表
      parameters:
        - name: openid
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功，body.list

  /order/takeout/address/save:
    post:
      tags: [外卖]
      summary: 新增或修改收货地址
      description: |
        服务端入库统一为 **GCJ-02（高德）**。请求体通过 **`coordinate_type`** 声明来源：
        `gcj02`（默认）、`wgs84` 或 `bd09`；后两者由服务端转换为 GCJ-02。
        `lng`/`lat` 必须同时提供且范围有效。小程序仍应优先使用 `wx.getLocation({type:'gcj02'})`
        或地图 POI 选点，避免将“当前定位”误当成“收货地址”。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lng: { type: number, description: 经度，坐标系由 coordinate_type 指定 }
                lat: { type: number, description: 纬度，坐标系由 coordinate_type 指定 }
                coordinate_type: { type: string, enum: [gcj02, wgs84, bd09], default: gcj02 }
      responses:
        '200':
          description: 成功

  /order/takeout/address/delete:
    post:
      tags: [外卖]
      summary: 删除收货地址
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                openid: { type: string }
      responses:
        '200':
          description: 成功

  /order/takeout/address/setDefault:
    post:
      tags: [外卖]
      summary: 设为默认地址
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 成功

  /order/takeout/order/list:
    post:
      tags: [外卖]
      summary: 我的外卖订单分页
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [openid]
      responses:
        '200':
          description: 成功

  /order/takeout/order/detail:
    get:
      tags: [外卖]
      summary: 外卖单详情（订单+配送扩展）
      parameters:
        - name: openid
          in: query
          required: true
          schema: { type: string }
        - name: order_no
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功

  /order/takeout/order/tracking:
    get:
      tags: [外卖]
      summary: 骑手实时定位与 ETA（真省钱）
      description: |
        须为本用户外卖单且已向真省钱发配送（**`t_takeout_delivery.zsq_open_order_id`** 非空）。
        从真省钱拉取最新追踪和订单操作日志并回写 **`t_takeout_delivery`**；仅接收 **`openOrderId` 与当前配送单一致**的日志，防止串单。服务端以最新“配送下单”日志为当前配送批次边界，只用当前批次解析 **`effectiveState`**、`phase`、`trajectoryState` 和骑手定位；旧批次日志仍原样保留在 `orderLogs`，但不参与最终状态。前端必须优先使用 **`tracking.effectiveState`**，不得从 `deliveryTimeline`/`orderLogs` 的数组顺序、全局最大 `sortNum` 或任意取消记录自行判断。坐标统一转换为 GCJ-02。若远端订单不存在/已删除，返回 **`code=4091`**、**`requiresMerchantRedispatch=true`**，提示由商家重新发起配送。
      parameters:
        - name: openid
          in: query
          required: true
          schema: { type: string }
        - name: order_no
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功时 body 含 code、tracking；远端订单不存在/已删除时 code=4091
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  tracking:
                    $ref: '#/components/schemas/ZsqRiderTrackingResponse'
        '500':
          description: 失败（未发配送、非本人订单等）

  # ---------- 外卖（运营端） ----------
  /admin/takeout/config:
    get:
      tags: [运营后台, 外卖]
      summary: 读取当前门店外卖配置
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      responses:
        '200':
          description: 成功

  /admin/takeout/config/save:
    post:
      tags: [运营后台, 外卖]
      summary: 保存当前门店外卖配置
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 成功

  /admin/takeout/delivery/list:
    post:
      tags: [运营后台, 外卖]
      summary: 配送扩展分页列表
      description: |
        配送扩展记录分页列表。
        支持自定义时间筛选（`startTime`/`start_time` 与 `endTime`/`end_time`），未传时默认获取当前营业日数据（基于门店 `settle_time`，`[D settle_time, D+1 settle_time)`）。
        记录中包含实际配送费字段 `actual_delivery_fee`（对应 `zsq_actual_fee`）。
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pageNum:
                  type: integer
                  description: 页码（默认 1）
                  default: 1
                pageSize:
                  type: integer
                  description: 每页条数（默认 20，最大 100）
                  default: 20
                dispatch_status:
                  type: string
                  description: 配送履约状态过滤（可选，all 或不传表示全部）
                startTime:
                  type: string
                  description: 起始时间（可选，格式 yyyy-MM-dd HH:mm:ss 或 yyyy-MM-dd）
                start_time:
                  type: string
                  description: 起始时间别名
                endTime:
                  type: string
                  description: 截止时间（可选，格式 yyyy-MM-dd HH:mm:ss 或 yyyy-MM-dd）
                end_time:
                  type: string
                  description: 截止时间别名
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: success }
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/TakeoutDelivery'
                  total: { type: integer, example: 42 }
                  pageNum: { type: integer, example: 1 }
                  pageSize: { type: integer, example: 20 }
                  startTime: { type: string, example: '2026-10-07 04:00:00' }
                  endTime: { type: string, example: '2026-10-08 04:00:00' }
        '400':
          description: 参数错误（未指定门店或 endTime 早于 startTime）

  /admin/takeout/delivery/detail:
    get:
      tags: [运营后台, 外卖]
      summary: 配送单详情（订单+扩展）
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      parameters:
        - name: orderId
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 成功

  /admin/takeout/delivery/tracking:
    get:
      tags: [运营后台, 外卖]
      summary: 骑手实时定位与 ETA（真省钱）
      security: [{ BearerAuth: [] }]
      x-permission: order:view
      description: |
        按 **`t_order.id`** 查询；须为外卖单且已向真省钱发配送。正常追踪要求 **`t_takeout_delivery.zsq_open_order_id`** 非空；已识别为 **`order_missing`** 时即使失效单号已清除，仍持续返回可重发提示。
        从真省钱拉取最新追踪及 **`GET /api/open/order/log/{openOrderId}?id={openOrderId}`** 订单操作日志，将骑手、商家、用户及时间线中的 BD-09 坐标统一转换为 **GCJ-02**；仅在追踪数据变化时回写 **`t_takeout_delivery`**。仅保留日志内 **`openOrderId` 与请求单号一致**的记录，并以最新“配送下单”为当前配送批次边界。**`effectiveState`**、`phase`、`trajectoryState` 和骑手定位只从当前批次解析；旧批次取消记录保留在原始日志中但不参与最终状态。`deliveryTimeline` 是各运力渠道的历史结果，不能用全局最大 `sortNum` 或其中任意 `sendStatus=60` 判断整单已取消。响应与 C 端 **`GET /order/takeout/order/tracking`** 一致，含 **`tracking`**（含 **`coordinateType=gcj02`**、**`effectiveState`**、**`trajectoryState`**、**`dispatchStatus`**、**`zsqDispatchStatus`**、**`orderLogs`**）、**`order`**、**`delivery`**。
        若确认真省钱订单不存在/已删除，立即将本地配送置为 **`order_missing`** 并清除失效单号，返回 **`code=4091`**、**`canRedispatch=true`**、**`redispatchUrl`**、**`missingOpenOrderId`**、**`order`**、**`delivery`**。
        须 JWT + **`order:view`**；建议携带 **`X-Shop-Id`**，订单须属于当前门店。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderId
          in: query
          required: true
          schema: { type: integer, description: 't_order.id' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string }
                  tracking:
                    $ref: '#/components/schemas/ZsqRiderTrackingResponse'
                  order:
                    $ref: '#/components/schemas/Order'
                  delivery:
                    $ref: '#/components/schemas/TakeoutDelivery'
                  canRedispatch: { type: boolean, description: '远端订单删除时为 true' }
                  redispatchUrl: { type: string, example: '/admin/takeout/delivery/zsq/redispatch' }
                  missingOpenOrderId: { type: integer, format: int64 }
        '500':
          description: 失败（非外卖、未发配送、门店不一致等）

  /admin/takeout/delivery/status:
    post:
      tags: [运营后台, 外卖]
      summary: 更新配送履约状态
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        **`dispatch_status`**：`accepted` / `delivering` / `completed` / `cancelled` 等。
        置 **`cancelled`** 时：本地立即写入 **`dispatch_status`**、**`zsq_dispatch_status`**、**`zsq_phase=CANCELLED`**（v1.2.57 / v1.2.89）；若已关联真省钱，后端调用 **`POST /api/open/order/cancel`**，请求体为 **`{"id": zsq_open_order_id}`**；远端返回 **`code=200`、`data=null`** 即为成功。远端失败不阻断本地取消态。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [orderId, dispatch_status]
              properties:
                orderId: { type: integer }
                dispatch_status:
                  type: string
                  enum: [accepted, delivering, completed, cancelled]
      responses:
        '200':
          description: |
            成功。body 含 **`order`**、**`delivery`**。
            取消时 **`delivery.dispatch_status`**、**`delivery.zsq_dispatch_status`** 均为 **`cancelled`**，
            **`delivery.zsq_phase`** 为 **`CANCELLED`**；**`order.takeout_dispatch_status`** 同步为 **`cancelled`**。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  order:
                    $ref: '#/components/schemas/Order'
                  delivery:
                    $ref: '#/components/schemas/TakeoutDelivery'
        '500':
          description: 失败（订单不存在、非外卖、门店不一致等）

  /admin/takeout/delivery/zsq/dispatch:
    post:
      tags: [运营后台, 外卖]
      summary: 向真省钱发起配送（手动，唯一发单入口）
      description: |
        **外卖叫骑手的唯一入口**（v1.2.87 起不再接单自动发配送）。真省钱账号由服务端 **application.yml** 配置。
        首次：创建真省钱 open 订单并发配送。
        若已存在 **`zsq_open_order_id`** 且 **`zsq_dispatch_status=failed`**（常见原因：真省钱账户余额不足），则**仅对原 open 订单询价+发配送**，无需在本系统或真省钱再下一笔新外卖单；充值后再次调用本接口即可。
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer, description: 't_order.id' }
      responses:
        '200':
          description: 成功，body.delivery 为更新后的 TakeoutDelivery
        '500':
          description: 失败（未启用 ZSQ、余额不足等）

  /admin/takeout/delivery/zsq/redispatch:
    post:
      tags: [运营后台, 外卖]
      summary: 真省钱配送重发（配送异常/已取消/已完成后）
      description: |
        适用于 **`zsq_dispatch_status`** 为 **`failed`**、**`rider_cancelled`**、**`cancelled`**、**`order_missing`**、**`completed`**，或本地 **`dispatch_status`** 为 **`cancelled`** / **`completed`** 的场景（含配送完成后再次配送）。
        重发前服务端会保留仍有效的 **`zsq_open_order_id`** 和真省钱业务订单号，只清空上一轮配送单号、渠道结果、取消锁及骑手快照，然后在原订单上重新询价并叫骑手；只有远端订单已不存在/删除或本地没有 openOrderId 时才重新创建真省钱订单。若当前仍为 `pending` / `dispatched` / `delivering`，接口拒绝重复叫骑手。成功后将 **`dispatch_status`** 置为 **`accepted`**。
        若仅调用首次发配送接口 **`/admin/takeout/delivery/zsq/dispatch`** 且本地仍为 cancelled，将返回错误提示改用本接口。
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /admin/takeout/delivery/zsq/sync:
    post:
      tags: [运营后台, 外卖]
      summary: 从真省钱同步骑手定位与履约状态
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer }
      responses:
        '200':
          description: 成功，body.delivery 含最新 dispatch_status / zsq_* 字段
        '500':
          description: 失败

  # ---------- 订单 ----------
  /order/create:
    post:
      tags: [订单]
      summary: 创建订单
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      description: |
        提交新订单。请求体为 OrderCreateRequest，必填字段与可选字段说明如下：
        - **order_no**：订单号，唯一
        - **table_number**：桌台号（打包可为空或占位）
        - **number_of_diners**：用餐人数
        - **sett_amount**：商品原价+打包费，后端据此计算服务费（整单×5%）
        - **transac_status**：success 已结账 / unsettled 未结账 / cancelled 已取消，新建一般为 unsettled
        - **dineInOrTakeOut**：堂食、打包 或 **外卖**（外卖推荐使用 **`POST /order/takeout/create`**）
        - **orderNumber**：订单序号，用于出餐时间预估
        - **openid**：用户 openid
        - **goods_list**：订单明细数组（见 **OrderDetail**）。**普通菜**：**total_price &gt; 0** 且等于 **unitprice×数量**（±0.02 元）。**套餐**：每份传一行，**`combo_id`**（**`t_combo.id`**）+ **`combo_selections`**（组 key → 子菜 **dish id** 数组）+ **`quantity`**（套餐份数）+ **`total_price`**（服务端算价校验）；可选 **`line_type: combo`**。落库展开为 **`combo_header` + `combo_component`**。详见顶层「订单明细合规校验」与 **v1.2.37**。
        - **库存**：对启用有限库存的菜品，本单**多行同名菜数量会合并**后再校验；订单与明细落库成功后扣减当前门店 **`t_dish_shop.stock`**，不足则整单失败（事务回滚）。卖光会同步当前门店 **`sold_out`** 并可能收到 **`/ws/menu`** 的 **`dish_catalog_changed`**，见顶层「库存与下单/取消」。
        可选：discount_amount、service_fee（可忽略）、order_receiving、remark、merchantId、coupon_id（未使用传 0 或不传）、**`shop_id`** / **`shop_code`**（连锁：与 **`X-Shop-Id`** / **`X-Shop-Code`** 同时出现时须一致；落库 **`t_order.shop_id`**）。
        当传入 `coupon_id` 时，创建订单会复用 **`POST /coupon/validateRule`** 的同一套规则进行验券，确保前后端与下单链路口径一致。
         服务端统一写入 **`t_order.order_channel`**（下单渠道：**mini_program** C端小程序 / **cashier** 收银台 / **takeout** 小程序外卖 / **ai** AI 助手，按请求上下文判定）与 **`t_order.order_admin_id`**（下单管理员 ID，B 端 JWT 解析；C 端/AI 为 null）。**客户端传入的 order_channel/order_admin_id 不生效**（服务端强制覆盖），见 D010。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功，body 含 code、order_no、id
        '500':
          description: |
            失败（code 非 0，msg 为原因）。除重复下单、桌台占用、优惠券无效外，还可能因 **goods_list 合规校验**失败，例如：菜品不存在、已下架、**已售罄（sold_out=1）**、缺 unit/cid、数量非法、**total_price≤0**、**金额与单价×数量不符**、订单明细为空等；或 **库存不足**（有限库存菜品剩余数量小于本单合并需求量，或并发下扣减失败）。

  /order/addDishes:
    post:
      tags: [订单]
      summary: 加菜
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      description: |
        本次 **`goods_list`** 中每一行均执行与 **`POST /order/create`** 相同的 **明细合规校验**（含 **套餐展开**、上架、未售罄、单价×数量或套餐算价、unit/cid 等），并做 **合并后的有限库存** 校验（套餐按子菜扣减，见顶层 **v1.2.37**）。**goods_list 不可为空**。
        仅对**本次提交的 `goods_list`** 按菜品合并数量后扣减当前门店 **`t_dish_shop.stock`**（依据**当前库内剩余量**，与历史已下单行无关）；新明细落库成功后再扣减，**失败整段事务回滚**。卖光当前门店 **`sold_out=1`**（**不**自动改 **`onsale`**）、**`/ws/menu`** 推送 **`dish_catalog_changed`**（`action` 多为 **`stock_sold_out`**）与 **`POST /order/create`** 一致。
        与 **`POST /order/create`** 一致，服务端按请求上下文写入 **`t_order.order_channel`** 与 **`t_order.order_admin_id`**（收银加菜记录操作员；C 端/AI 为 null），客户端传值不生效，见 D010。
        **权限控制**：支持订单归属用户（openid 相同），以及处于未结账状态（`transac_status=unsettled`）的堂食订单同桌同伴（提供同门店相同 `table_number`）进行加菜。非本人且非同桌未结账堂食订单返回 `403`。
        **订单时间**：成功加菜不得修改订单主表 `order_time`；该字段始终保留订单首次创建时间。新增菜品的批次时间由明细/KDS 批次字段表达，不得用整单 `order_time` 代替。
        **并发控制**：可传 `expectedVersion`（兼容 `expected_version`）。版本过期返回 HTTP 409 / `ORDER_VERSION_CONFLICT`；成功响应返回递增后的 `revision`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderAddDishesRequest'
      responses:
        '200':
          description: 成功，body 含 code、id、order_no、detail_ids、detail_mappings、revision
        '409':
          description: expectedVersion 与当前订单 revision 不一致；data 返回最新订单摘要，客户端应刷新后由用户重试
        '500':
          description: 失败（订单不存在、已结账、打包单不支持加菜、加菜明细为空、**goods_list 合规校验**失败、**库存不足** 等，msg 说明原因）

  /order/get:
    get:
      tags: [订单]
      summary: 按桌号与交易状态查询订单
      description: |
        按桌号查询指定交易状态的堂食订单。
        **权限控制**：支持归属用户本人查询，以及处于未结账状态（`transac_status=unsettled`）的堂食订单同桌同伴查询当前桌台订单明细。已结账/已取消等历史订单仅限归属用户本人查看（非本人返回 `403`）。
      parameters:
        - name: table_number
          in: query
          required: true
          schema: { type: string }
          description: 桌台号，与 t_order.table_number 一致
        - name: transac_status
          in: query
          required: true
          schema: { type: string, enum: [success, unsettled, cancelled] }
          description: 交易状态，success 已结账 / unsettled 未结账 / cancelled 已取消
      responses:
        '200':
          description: 成功，body 含 code、menu（Order，外卖时含 takeout_delivery_id/delivery_fee/takeout_dispatch_status）、goods_list（OrderDetail[]，每项额外含 dish_id，无法匹配时为 null；**KDS 启用门店**另含 **kds_item_status** 0待制作/1制作中/2已完成/3已退菜、**kds_status_text** 中文文案、**kds_served_quantity** 已传菜数量，无厨显工单为 null，见 D011）
        '500':
          description: 未找到相关订单等

  /order/getOrder:
    get:
      tags: [订单]
      summary: 按订单号查询订单
      description: |
        按订单号查询订单及明细。
        **权限控制**：支持订单归属用户本人查询，以及同门店处于未结账状态（`transac_status=unsettled`）的堂食订单同伴（或历史加菜参与者）查询。非本人且非同桌未结账订单返回 `403`。
      parameters:
        - name: order_no
          in: query
          required: true
          schema: { type: string }
          description: 订单号，与 t_order.order_no 一致
      responses:
        '200':
          description: 成功，body 含 code、menu（Order）、goods_list（OrderDetail[]，**KDS 启用门店**另含 kds_item_status/kds_status_text/kds_served_quantity，无厨显工单为 null，见 D011）；**外卖**时 menu 含 takeout_* 摘要，且 **delivery** 为 `TakeoutDelivery`（含 address_full、receiver_*、delivery_fee、dispatch_status 等，无扩展行时为 null）；非外卖 **delivery** 为 null
        '500':
          description: 未找到相关订单等

  /order/history:
    post:
      tags: [订单]
      summary: 用户历史订单列表（支持分页与状态筛选）
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string, description: '用户 openid' }
                shop_id: { type: integer, description: '连锁可选；仅返回该门店订单（`t_order.shop_id` 过滤）' }
                shop_code: { type: string, description: '连锁可选；`t_shop.code`，与 shop_id/请求头须一致' }
                page: { type: integer, description: '页码，从 1 开始，不传则返回全部或默认第一页' }
                pageSize: { type: integer, description: 每页条数，默认 10～20 }
                status: { type: string, description: '筛选：unsettled/success/cancelled 或 all，与 t_order.transac_status enum 一致，不传默认 all' }
      responses:
        '200':
          description: 成功，body 含 code、hasHistory、orderCount 或 total、orders（每项含 orderDetails，**KDS 启用门店**的明细另含 kds_item_status/kds_status_text/kds_served_quantity，无厨显工单为 null，见 D011；及外卖时 takeout_delivery_id、delivery_fee、takeout_dispatch_status）
        '500':
          description: 失败

  /order/cancel:
    post:
      tags: [订单]
      summary: 取消订单（前端已调用，后端需保证实现与传参一致）
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      description: |
        **点餐单**：将 **未支付** 订单（**`transac_status=unsettled`**）更新为 **`cancelled`**，同时将接单状态 **`order_receiving`** 置为 **`cancelled`**（两字段与 t_order 表 enum 一致；存量库需执行 `docs/db_migration_order_receiving_cancelled.sql`）。**已支付（success）不可取消**。若该单为**外卖**且已关联真省钱（**`t_takeout_delivery.zsq_open_order_id`**），取消前**尽力**调用真省钱取消（失败不阻断本地取消）。取消 **成功落库后**，按订单明细 **回退** 当前门店 **`t_dish_shop.stock`**（规则见顶层「库存与下单/取消」）；回退后同步 **`sold_out`** 并可能推送 **`dish_catalog_changed`**。**状态更新与库存回退在同一事务中**。
        **会员微信充值**：若 **`t_order` 无匹配 `order_no`**，且 **`order_no` + `openid`** 对应 **`t_member_recharge`** 为 **`pending` 微信流水**，则将该流水置为 **`cancelled`**（不涉及库存）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no, openid]
              properties:
                order_no: { type: string, description: '点餐订单号，或待支付的微信充值商户单号（RCH）' }
                openid: { type: string, description: '用户 openid，用于校验归属' }
                shop_id: { type: integer, description: '连锁可选；若传则须与订单归属门店一致' }
                shop_code: { type: string, description: '连锁可选；与 shop_id/请求头须一致' }
      responses:
        '200':
          description: 成功，body code=0；对应订单已变为 cancelled，库存已按规则回退（若有）
        '500':
          description: |
            失败（code 非 0）。常见原因：订单号/openid 为空、订单不存在或 openid 不匹配、**已支付订单不可取消**、订单当前非 **unsettled**（如已 cancelled）、事务内库存回退异常等，msg 说明原因。

  /order/notice:
    post:
      tags: [订单]
      summary: 取餐通知
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_no: { type: string, description: '订单号' }
                notice: { type: integer, description: '取餐通知标识，如 1 表示已通知' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  /order/printContent:
    get:
      tags: [订单]
      summary: 获取订单打印内容并下发打印（已弃用）
      deprecated: true
      description: 始终返回 code=410。请迁移到 GET /cashier/order/printContent。
      parameters:
        - name: orderId
          in: query
          required: true
          schema: { type: integer, description: '订单主键 t_order.id' }
        - name: type
          in: query
          required: false
          schema: { type: boolean, default: true, description: 'true=加菜单格式（当前实现固定为该格式）' }
      responses:
        '200':
          description: HTTP 200，body 中 code=410
        '500':
          description: 失败（订单不存在或无明细）

  /order/autoAcceptAndPrint:
    post:
      tags: [订单]
      summary: 自动接单并打印（对外接口）
      description: 将订单置为已接单（order_receiving=rec_order），仅打印未接单的菜品（order_rece 为空或 mis_order），打印后将对应明细的 order_rece 更新为 rec_order。厨房小票与前台小票一并下发；打印参数按订单 `shop_id` 自动匹配门店配置。
      parameters:
        - name: orderId
          in: query
          required: true
          schema: { type: integer, description: '订单主键 t_order.id' }
      responses:
        '200':
          description: 成功，msg 为「接单并打印成功」
        '500':
          description: 失败（订单不存在或接单/打印异常）

  /order/table-info/{tableNumber}:
    get:
      tags: [订单]
      summary: 根据台号获取订单相关信息
      description: |
        C 端顾客扫码或按台号查询桌台及当前订单概要。
        并台多订单场景下优先匹配当前登录用户（openid）在该桌的未结账订单（transac_status = 'unsettled'）；
        若当前用户在该桌无未结账单，但该桌存在未结账堂食订单，支持同桌同伴获取当前桌台未结账订单信息；
        若均无未结账单，则匹配当前用户历史最近订单；
        仅当该桌无未结账订单且存在其他顾客历史订单、当前用户在该桌无任何订单时返回 403 权限拒绝。
      security: [{ UserToken: [] }]
      parameters:
        - name: tableNumber
          in: path
          required: true
          schema: { type: string }
          description: 桌台号
      responses:
        '200':
          description: 成功，body 含 tableStatus、tableNumber、checkoutStatus、orderReceiving、amount、orderTime、orderNo、remark、DineInOrTakeOut、orderNumber
        '401':
          description: 缺少或无效的 X-User-Token
        '403':
          description: 当前用户不拥有该桌订单
        '500':
          description: 失败

  /order/delete/{id}:
    delete:
      tags: [订单]
      summary: 强制删除订单（仅超级管理员）
      security: [{ BearerAuth: [] }]
      x-permission: order:delete
      x-required-role: super_admin
      description: |
        删除 **`t_order`** 及关联订单明细；**外卖**单会同步删除 **`t_takeout_delivery`**。
        该操作不受订单、支付或配送状态限制，包括配送中、已完成、异常单及真省钱已发单状态。
        当前登录账号必须明确绑定 **`super_admin`**。
        授权采用 **审批令牌优先、现场账号密码兜底**：
        - 携带 **`approvalToken`**（由 `POST /cashier/access/authorize` 或扫码授权签发，120 秒有效、单次消费）时，
          服务端按门店、操作者、权限（`order:delete`）与订单号强绑定核销，核销失败返回业务码 **40321**；
        - 未携带令牌时，请求体必须提供现场授权员工账号密码（`authorization`），授权员工同时具备 **`super_admin`**、
          **`order:delete`** 与订单所属门店范围；现场账号密码授权不签发或复用授权令牌。
        当前登录账号与现场授权员工可以是不同账号。每次删除均重新验证。成功删除后写入操作审计日志
        （`module=order`、`action=force_delete`）。无需传 **`X-Shop-Id`**，超级管理员可按订单主键跨门店删除。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: 订单主键 t_order.id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalToken:
                  type: string
                  maxLength: 128
                  description: POS 权限中心店长现场授权签发的短期单次审批令牌（120 秒有效），与 authorization 二选一
                terminalId:
                  type: string
                  maxLength: 64
                  description: 发起删除操作的收银机/终端标识；若 Header 未携带 X-Terminal-Id 则以该字段兜底
                amount:
                  type: number
                  description: 待删除账单/订单金额（可选；核销时自适应对齐订单当前净营业额，避免非调账销毁操作失配）
                authorization:
                  $ref: '#/components/schemas/SensitiveOperationAuthorization'
                  description: 现场授权员工账号密码；未携带 approvalToken 时必填
      responses:
        '200':
          description: 请求已处理；成功时 body.code=0，非 super_admin 时 body.code=403，审批令牌无效时 body.code=40321，订单不存在或删除失败时 body.code=500
        '401':
          description: 管理员 JWT 缺失、无效或已过期；或未携带 approvalToken 且请求体缺少有效 authorization 账号密码
        '403':
          description: 当前会话或现场授权员工不是超级管理员，或授权员工缺少 order:delete/门店范围
        '500':
          description: 未捕获的服务端错误

  /order/ai/chatSuggest:
    post:
      tags: [订单, 智能点餐]
      summary: 自然语言点餐建议
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      description: |
        用户输入自然语言描述（人数、口味、预算等），AI 基于用户画像、历史会话、在售菜单与工具调用能力生成点餐建议。
        该接口为智能点餐唯一入口，支持按 openid 隔离多轮会话上下文。
        **连锁**：可传 **`X-Shop-Id`** / **`X-Shop-Code`** 或 body 内 **`shop_id`** / **`shop_code`**（同时出现时须一致）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid, prompt]
              properties:
                prompt:
                  type: string
                  description: 用户自然语言描述，如「3 个人，想吃不太辣的烤串，预算 200 元以内」
                openid:
                  type: string
                  description: 用户 openid（必填），用于隔离多轮会话与个性化推荐
                table_number:
                  type: string
                  description: 当前桌号（可选）；为空时可先对话推荐，堂食在最终下单时需先扫码获取台号与 scan_token
                shop_id:
                  type: integer
                  description: 当前门店 ID（连锁可选），与请求头/shop_code 择一或同时传（宜一致）
                shop_code:
                  type: string
                  description: 当前门店编码 t_shop.code（连锁可选），与 shop_id/请求头须一致
                reset:
                  type: boolean
                  description: 是否重置该 openid 的历史会话（true 清空后重新开始）
      responses:
        '200':
          description: 成功，body 含 code、plan（AI 点餐方案与说明）
        '500':
          description: 失败（AI 调用失败或解析异常）

  /order/ai/tools:
    get:
      tags: [订单, 智能点餐]
      summary: 获取 AI 工具定义列表
      description: |
        返回智能点餐场景下可供大模型调用的工具定义（与 DashScope/OpenAI function calling 格式一致）。
        前端/中台在请求通义千问前可先 GET 此接口，将返回的 tools 数组传入大模型请求体，模型即可按此生成 tool_calls，
        再通过 POST /order/ai/tools/execute 执行。
      responses:
        '200':
          description: 成功，body 含 code、tools（工具定义数组）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                  tools:
                    type: array
                    description: 与 DashScope 兼容的 function 工具列表
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: function
                        function:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 工具名，如 get_table_status/recommend_dishes/create_order/query_order/cancel_order
                            description:
                              type: string
                            parameters:
                              type: object
                              description: JSON Schema 格式参数定义

  /order/ai/tools/execute:
    post:
      tags: [订单, 智能点餐]
      summary: AI 工具调用执行入口
      description: |
        供大模型代理/中台调用，用于执行大模型返回的 tool_calls 指令。
        请求体中传入 tool_calls 数组（每项包含 name 与 arguments），后端按名称分发到内部函数：
        - get_table_status: 调用 /order/table_status，查看桌号状态。
        - create_order: 调用内部下单流程（等价于 /order/create）。
        - cancel_order: 调用取消订单逻辑（等价于 /order/cancel，仅允许未支付订单）。
        - query_order: 按订单号查询订单及明细。
        - recommend_dishes: 在工具执行链路中返回推荐说明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_calls]
              properties:
                tool_calls:
                  type: array
                  items:
                    type: object
                    required: [name, arguments]
                    properties:
                      name:
                        type: string
                        description: 工具名称，如 get_table_status/create_order/cancel_order/query_order/recommend_dishes/table_scan_verify
                      arguments:
                        type: object
                        description: 传给该工具的参数对象，具体字段由各工具约定
      responses:
        '200':
          description: 成功，body 含 code、results（按顺序对应每个 tool_call 的执行结果）
        '500':
          description: 失败（tool_calls 格式错误或内部异常）

  # ---------- 支付与回调 ----------
  /order/getPrepayId:
    post:
      tags: [支付与回调]
      summary: 获取微信支付 prepay_id 及调起支付参数
      security: [{ UserToken: [] }]
      description: |
        根据 **`orderNo`** 等向微信下单并返回 prepay_id 及调起支付所需参数（payParams）。支付身份只取 **`X-User-Token`**，请求体 `openid` 仅为兼容字段且不能覆盖 Token 身份。
        **结算规则（点餐单）**：**已使用优惠券**时（**`t_order.discount_amount` 已含券后优惠**，或本次请求经券校验产生券后减免），**不叠加**夜间九折，实付按券后计算；**未用券**时，须同时满足 **`GET /config/wechat-prepay-ninefold`**：**`enabled=true`**、下单时刻在 **`timeStart`～`timeEnd`**（**`zoneId`**）、券后应付 ≥ **`minBaseYuan`**、订单 **`dineInOrTakeOut`** 落在 **`eligibleDiningTypes`** 内，才按 **`payRate`** 叠九折（实付 = 券后 × payRate）。九折成功会回写 **`t_order.discount_amount`**。**夜间九折仅可通过本接口（微信支付）享受**；**`POST /order/payByBalance`** 按订单原价扣款且**不支持任何优惠**（见该接口说明）。**用券时不可用余额支付**。
        **会员微信充值**：若 **`t_order` 无此 `orderNo`**，则按 **`t_member_recharge`**（**`channel=wechat`**、**`status=pending`**）匹配 **`order_no`**，**`openid` 须与流水一致**，金额取 **`recharge_amount`**，**不调券/九折**，与 **`t_order` 无关**。
        **支付尝试一致性（点餐单）**：服务端持久化 `outTradeNo + amountFen + openid + merchantConfigVersion`。同条件且未过期的支付尝试直接复用；订单金额、付款用户或商户发生变化时，必须先查微信权威状态并关闭旧 `NOTPAY` 交易后才创建新交易。旧交易为 `SUCCESS`、`CREATING`、`UNKNOWN` 或查询/关单不确定时拒绝重复下单。退菜、数量、改价、优惠和加菜也会先执行同一查单/关单闸门，防止旧 payParams 按旧金额继续支付。
        - **正常成功**：body 含 code(0)、prepay_id、payParams（timeStamp、nonceStr、package、signType、paySign），以及可选 paymentAttemptId、outTradeNo、amountFen、expiresAt、reused；前端用 payParams 调 wx.requestPayment。
        - **不确定状态**：返回 code=50331；客户端必须刷新订单并稍后重试，禁止继续使用缓存 payParams 或重复调起支付。
        **小程序支付开关**：须满足 **`clients.miniProgram.enabled=true`**。微信支付另须 **`clients.miniProgram.effectiveChannels.wechat=true`**（**服务端内部口径**，D017 后 C 端响应不再返回该字段，前端可按 `clients.miniProgram.channelStates.wechat.available` 预判）；未配完整商户参数返回 **40203**，关闭小程序端总开关返回 **40201**，仅关闭小程序微信渠道返回 **40202**。收银端开关不参与本接口判断。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, openid]
              properties:
                orderNo: { type: string, description: 点餐订单号，或会员微信充值的商户单号（RCH 前缀，见 t_member_recharge.order_no） }
                openid: { type: string, description: 用户 openid }
                takeOut: { type: string, description: '堂食/打包，用于商户选择' }
                totalAmount: { type: string, deprecated: true, description: '兼容字段，服务端忽略；应付金额只按服务端订单计算' }
                coupon_id: { type: string, description: '优惠券 ID，未使用可传空' }
                discount_amount: { type: string, description: '优惠金额（元），未使用可传空' }
      responses:
        '200':
          description: |
            成功。两种情况：
            - 正常：body 含 code、prepay_id、payParams（timeStamp/nonceStr/package/signType/paySign），以及可选 paymentAttemptId/outTradeNo/amountFen/expiresAt/reused。
            - 状态冲突或不确定：body 使用业务 code（如 40931/40934/50331）；客户端应丢弃缓存 payParams、刷新订单后再决定是否重试。
        '500':
          description: 失败（订单号和 openid 不能为空、订单不存在、已支付、订单状态异常、金额/优惠券格式错误、支付失败等）

  /order/recharge:
    post:
      tags: [支付与回调]
      summary: C 端会员微信账户充值（仅 t_member_recharge + 预支付）
      security: [{ UserToken: [] }]
      description: |
        为已注册用户（按 **`openid`** 查 **`t_user`**）写入 **`t_member_recharge`**（**`channel=wechat`**、**`status=pending`**），**不落 `t_order`**；商户单号前缀 **`RCH`**，与餐饮 **`ORD`** 独立。再调用微信 JSAPI 统一下单。
        **成功响应**与 **`POST /order/getPrepayId`** 对齐：含 **`code`(0)、`prepay_id`、`payParams`**。另在成功时返回 **`orderNo`**（与流水表 **`order_no`** 一致，供 **`getPrepayId` / `cancel`** 使用）。
        **换单重入**：返回 **`newOrderNo`、`orderId`（流水 id）、`message`**；前端须用 **`newOrderNo`** 调 **`POST /order/getPrepayId`** 续拉 **`payParams`**；**勿**重复 **`/order/recharge`**。
        **支付成功**：回调 **`POST /order/pay/notify`** 将 **微信实付金额 + 请求中约定的赠送金额（`gift_amount` 等）** 合计累加 **`t_user.balance`**，流水置 **`success`**；微信侧仍仅收取 **`amount/totalAmount`** 对应金额。不执行点餐 **`runPostPaymentSuccessSideEffects`**。用户可查 **`POST /order/rechargeHistory`**。
        **赠送金额（后端强校验）**：可选 **`gift_amount`**、**`giftAmount`** 或 **`gift`**（字符串数字，元）。**不传或传 0**：不要求命中活动档，本金须为 **50～10000** 元。**传大于 0**：本金必须与下表完全一致，且赠送必须与下表完全一致，否则返回错误：
        | 本金（元） | 赠送（元） |
        |---|---|
        | 200 | 10 |
        | 500 | 50 |
        | 1000 | 120 |
        | 5000 | 750 |
        | 10000 | 2000 |
        写入 **`t_member_recharge.gift_amount`**；成功拉起支付时若赠送&gt;0，响应含 **`giftAmount`**、**`expectedCreditTotal`**（实付+赠送预告）。
        **连锁门店**：可选 **`shop_id` / `shop_code`**（及请求头 **`X-Shop-Id` / `X-Shop-Code`**），写入流水 **`shop_id`**。未传门店时优先全店模板商户；若仅配置了门店级商户，后端自动回退到已启用 **default** 商户所在门店（与统一下单一致）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string, description: 用户 openid（须在系统中已注册） }
                amount: { type: string, description: 充值本金（元），与 totalAmount 二选一；50～10000；含赠送时须为活动档 200/500/1000/5000/10000 }
                totalAmount: { type: string, description: 与 amount 等价，二选一 }
                gift_amount:
                  type: string
                  description: 可选，赠送（元）；0 或不传表示不要赠送；大于 0 时须与本金匹配固定档（200→10、500→50、1000→120、5000→750、10000→2000）
                giftAmount: { type: string, description: 可选，同 gift_amount }
                gift: { type: string, description: 可选，同 gift_amount }
                takeOut: { type: string, description: 可选，与 getPrepayId 一致，用于商户侧展示/分类 }
                shop_id: { type: string, description: 可选，连锁选店 }
                shop_code: { type: string, description: 可选，连锁选店编码 }
      responses:
        '200':
          description: |
            与 getPrepayId 相同两类成功体；充值成功下单时额外含 **orderNo**；若传了赠送金额则含 **giftAmount**、**expectedCreditTotal**（实付+赠送，便于前端展示）。
        '500':
          description: 失败（openid 为空、用户未注册、金额缺失或超范围、微信下单失败等）

  /order/rechargeHistory:
    post:
      tags: [支付与回调]
      summary: 当前用户会员充值流水（本金、赠送、渠道）
      description: |
        按 **`openid`** 分页查询 **`t_member_recharge`**：含微信 JSAPI 充值（**`channel=wechat`**）与后台人工充值（**`channel=admin`**）。
        字段 **`recharge_amount`** 为本金（微信实付对应），**`gift_amount`** 为赠送（**`POST /order/recharge`** 可传 **`gift_amount`**，支付成功后与实付一并入账；后台 **`POST /admin/member/recharge`** 亦可带赠送），**`total_amount`** 为流水合计（本金+赠送）。
        **`status`**：`pending`（已下单未支付）、`success`、`cancelled`；默认 **`success`**，传 **`all`** 可查全部状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string }
                page: { type: integer, description: 默认 1 }
                pageSize: { type: integer, description: 默认 20，最大 100 }
                status: { type: string, description: 'success（默认）| pending | cancelled | all' }
      responses:
        '200':
          description: 成功时 body 含 code(0)、total、page、pageSize、list（MemberRecharge 字段）
        '500':
          description: 失败

  /order/payByBalance:
    post:
      tags: [支付与回调]
      summary: 使用用户账户余额（t_user.balance）全额支付未结账订单
      security: [{ UserToken: [] }]
      description: |
        **余额支付不支持任何优惠**：按订单原价（**`sett_amount + service_fee`**）扣减 **`t_user.balance`**；夜间九折、运营手动优惠、已预写 **`discount_amount`** 等一律取消，**`discount_amount` 置 0**。**禁止使用优惠券**：若请求携带 **`coupon_id`**，或 **`t_user_coupon`** 已绑定本 **`order_no`**，接口返回错误。
        成功时 **`t_order.payment_method`** 为 **`余额支付`**，**`transaction_id`** 为占位 **`BAL_` + 订单号**（非微信单号）。**用户归属校验按 `order_channel` 区分**：**收银台下单**（`order_channel=cashier`，openid 为 `cashier_system` 占位）**放开**，可由任意已登录 C 端用户余额代付；**小程序/外卖/AI 下单**仅限绑定 **`openid`** 的用户本人支付，非本人返回 **`订单不一致，请咨询服务员`**（不暴露订单归属）。
        **`POST /admin/order/refund`**（或等价退款入口）对余额单走**本地退回余额**，不调用微信退款接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, openid]
              properties:
                orderNo: { type: string }
                openid: { type: string }
                coupon_id: { type: string, description: 不可用；携带则报错（本接口不支持券） }
      responses:
        '200':
          description: 成功时 body 含 code(0)、paidYuan、payment_method；已支付时 code(0) 且 alreadyPaid=true

  /order/refund/notify:
    post:
      tags: [支付与回调]
      summary: 微信退款结果通知（由微信服务器调用）
      description: |
        与支付回调相同为 **V3 加密通知**：验签、`resource` AEAD_AES_256_GCM 解密（APIv3 密钥与 `Wechatpay-Serial` 对应商户）。
        - **业务处理**：仅当 `event_type=REFUND.SUCCESS` 且解密后 **`refund_status=SUCCESS`** 时处理。`out_refund_no` 必须已由退款接口登记，且通知中的退款金额、原微信 `transaction_id`、`mchid` 必须与退款申请完全一致；申请绑定的门店、订单、商户配置 ID/版本也必须与订单一致。任何未知退款单或绑定差异均返回 `FAIL`，不会猜测订单或跨店入账。校验通过后按 `amount.refund`（分）累加订单 `refund_amount`（元）并追加备注；订单 **`transac_status` 保持 success**，是否全额退款以 `refund_amount` 与实付比较为准。
        - **邀请首单返现**：若该订单曾写入 `t_invite_record.first_order_no`，则在入账后锁定邀请记录，按剩余实付重算邀请人应得整数元返现并差额调整余额；**全额退款（剩余实付为 0）**时收回已发返现并清空 `first_order_no` / `first_order_reward_amount`，保留 `first_order_reward_time` 使被邀请人不再具备首单返现资格。邀请人赠送金暂时不足时，不阻断微信退款成功回调，而是把待追回金额持久化到 `t_invite_reward_clawback`，由事务型定时任务幂等重试；债务未结清前始终保留可审计记录。
        - **幂等**：仅使用已登记的解密报文 `out_refund_no` 作为退款键；在退款申请行和订单行锁内检查并写入状态，跨重启、多实例和重复通知均不会重复累计退款。`refund_id` 或通知 `id` 不再作为未知退款的订单匹配回退。
        - `REFUND.ABNORMAL`、`REFUND.CLOSED` 等仅记录日志并返回 SUCCESS，不更新订单金额。
        - 回调 URL 由退款 API 的 `notify_url` 传入（运营端 **`t_payment_merchant_config.refund_notify_url`** 或默认 **`app.public-base-url` + `/order/refund/notify`**），与支付回调 URL 不同。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 微信 V3 退款通知（id、event_type、resource_type、resource 等，resource 内为密文）
      responses:
        '200':
          description: 应答体 JSON `{"code":"SUCCESS","message":"OK"}` 或 `FAIL`
        '500':
          description: 异常

  /order/queryByOutTradeNo/{outTradeNo}:
    get:
      tags: [支付与回调]
      summary: 根据商户订单号查询微信支付订单
      parameters:
        - name: outTradeNo
          in: path
          required: true
          schema: { type: string }
          description: 微信商户订单号（可带 _时间戳 后缀）；解析后主单号 **ORD** 开头为点餐 **t_order**，**RCH** 开头为充值流水
        - name: merchantId
          in: query
          schema: { type: string }
          description: 商户 ID，多店时可选
      responses:
        '200':
          description: 成功，body 含 code、orderInfo
        '500':
          description: 失败

  /order/pay/notify:
    post:
      tags: [支付与回调]
      summary: 微信支付回调（由微信服务器调用，非小程序直调）
      description: |
        - **支付成功**（event_type=TRANSACTION.SUCCESS）：解密后解析 **`out_trade_no`** 得到主单号（去 `_时间戳` 后缀）。**`RCH` 前缀**走会员充值入账（**`t_member_recharge` + `t_user.balance`**）；**`ORD` 前缀**（及其他非 RCH）先按支付尝试精确校验金额、门店、商户配置 ID/版本、付款人、交易号以及必填的 `mchid/appid`。绑定配置必须属于订单门店（或显式全局模板），否则返回 `FAIL`。校验通过后在同一数据库事务内先将微信成功资金事实写入/校验 **`t_payment_ledger`**（`request_id=WECHAT_{transaction_id}`、`provider_transaction_id=transaction_id`），最后更新 **`t_order`** 状态、实收分项及桌台。流水写入失败、已存在不同成功支付或订单更新失败时事务整体回滚并返回 `FAIL`，由微信重试；消费反积分等后置动作只在权威流水和订单均成功后执行。优惠券在订单创建成功时已写入 `status=1`，相同 `transaction_id` 回调为精确幂等确认。
        - **支付失败/关单**（event_type=TRANSACTION.FAIL 或 TRANSACTION.CLOSED）：仅对**非 RCH**主单号尝试回退用户优惠券（order_no、use_time 清空，status=0）；充值单无券关联。
        报文为微信 V3 支付通知（含 id、event_type、resource_type、resource 等），resource 为加密资源，需用 APIv3 密钥解密后取 out_trade_no、trade_state 等。
        **验签与密钥**：请求头 **`Wechatpay-Serial`** 通过索引与当前/历史商户配置的 **`platform_pub_key_id`** 精确匹配；平台公钥 PEM 从 **`platform_pub_key_ref`**（DB 优先，缺省 yml **`pubSerial-path`**）加载；**APIv3** 从 DB 加密字段或 yml 合并，多候选时依次尝试解密。序列号仅用于缩小验签候选，最终归属仍由订单固化的商户配置及回调 `mchid/appid` 决定。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 微信 V3 支付通知报文（id、event_type、resource_type、resource 等）
      responses:
        '200':
          description: 返回 JSON 如 {"code":"SUCCESS","message":"OK"} 或 {"code":"FAIL","message":"..."}
        '500':
          description: 异常

  # ---------- 订阅消息 ----------
  /order/sendSubscribe:
    post:
      tags: [支付与回调]
      summary: 订阅消息兼容接口（临时固定成功）
      description: 小程序仍使用旧模板 ID 期间，后端暂不向微信发送消息，固定返回成功。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid, templateId, order_no, data]
              properties:
                openid: { type: string }
                templateId: { type: string }
                order_no: { type: string }
                data: { type: object }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败

  # ---------- 活动与弹窗 ----------
  /activity/popupList:
    post:
      tags: [活动与弹窗]
      summary: 获取活动弹窗列表（按当前门店 + 全部门店活动）
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openid: { type: string, description: '用户 openid' }
                type: { type: string, description: '如 page_activity，默认 page_activity' }
                shop_id: { type: integer, description: '门店 ID，可与请求头合并解析' }
                shop_code: { type: string, description: '门店编码 t_shop.code' }
      responses:
        '200':
          description: 成功，body 含 code、hasActivity、activity（ActivityPopup[]）
        '500':
          description: 失败

  # ---------- 优惠券 ----------
  /coupon/getAvailable:
    post:
      tags: [优惠券]
      summary: 可领取优惠券列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string, description: '用户 openid' }
      responses:
        '200':
          description: 成功，body 含 code、data（CouponDTO 列表或 R 泛型）
        '500':
          description: 失败（如 R.fail）

  /coupon/receive:
    post:
      tags: [优惠券]
      summary: 领取优惠券
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid, coupon_id]
              properties:
                openid: { type: string, description: '用户 openid' }
                coupon_id: { type: integer, format: int64, description: '优惠券主键 t_coupon.id' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败（库存、重复领取等）

  /coupon/redeem:
    get:
      tags: [优惠券]
      summary: 通过兑换码领取优惠券
      description: 兑换码为随机生成且一次性使用，领取成功后立即失效（不可再次兑换）。
      parameters:
        - name: openid
          in: query
          required: false
          schema: { type: string, description: '用户 openid（与 phone 二选一）' }
        - name: phone
          in: query
          required: false
          schema: { type: string, description: '用户手机号（与 openid 二选一）' }
        - name: redeem_code
          in: query
          required: true
          schema: { type: string, description: '兑换码' }
      responses:
        '200':
          description: 成功，body.data 返回领取成功后的优惠券展示信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      couponName: { type: string, description: 优惠券名称，空时为 "-" }
                      validUntil: { type: string, description: 有效期（yyyy-MM-dd），空时为 "-" }
                      typeLabel: { type: string, description: 类型展示文案，当前固定为“优惠券” }
                      discountText: { type: string, description: 折扣展示文案，如“8折”/“减10元” }
                      ruleText: { type: string, description: 规则文案，空时为“暂无规则说明” }
                      coupon_name: { type: string, description: 兼容字段，同 couponName }
                      valid_until: { type: string, description: 兼容字段，同 validUntil }
                      type_label: { type: string, description: 兼容字段，同 typeLabel }
                      discount_text: { type: string, description: 兼容字段，同 discountText }
                      rule_text: { type: string, description: 兼容字段，同 ruleText }
              examples:
                ok:
                  value:
                    code: 0
                    msg: success
                    data:
                      couponName: 满50减10
                      validUntil: 2026-05-31
                      typeLabel: 优惠券
                      discountText: 减10元
                      ruleText: 满50可用，不与其他优惠同享
                      coupon_name: 满50减10
                      valid_until: 2026-05-31
                      type_label: 优惠券
                      discount_text: 减10元
                      rule_text: 满50可用，不与其他优惠同享
        '500':
          description: 失败（兑换码无效、库存不足、参数错误等；同一用户可对同一券模板持有多条用户券）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 1 }
                  msg: { type: string, description: 失败原因文案 }
              examples:
                missing_identity:
                  summary: openid/phone 均未传
                  value:
                    code: 1
                    msg: openid和phone不能同时为空
                missing_redeem_code:
                  summary: 未传兑换码
                  value:
                    code: 1
                    msg: redeem_code不能为空
                phone_not_bound:
                  summary: 手机号未绑定用户
                  value:
                    code: 1
                    msg: 手机号未绑定用户
                invalid_code:
                  summary: 兑换码不存在
                  value:
                    code: 1
                    msg: 兑换码无效
                consumed_code:
                  summary: 兑换码已被使用
                  value:
                    code: 1
                    msg: 兑换码已失效
                out_of_stock:
                  summary: 优惠券库存不足
                  value:
                    code: 1
                    msg: 优惠券已抢完

  /coupon/availableCount:
    post:
      tags: [优惠券]
      summary: 获取用户可用优惠券数量（未使用且未过期）
      description: |
        统计「当前可用」用户券：status=0；（用户券 expire_time 为 null 或晚于当前时间）；
        且关联的优惠券模板存在，且在模板 start_time / end_time 有效期内。
        连锁门店下仅统计 apply_shop_ids（JSON 数组）包含请求头 `X-Shop-Id` 的优惠券。
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string, description: '用户 openid' }
      responses:
        '200':
          description: 成功，body 含 code、count（数量，满足可用条件且可选门店范围）
        '500':
          description: 失败

  /coupon/getUserCoupons:
    post:
      tags: [优惠券]
      summary: 用户优惠券列表（按状态）
      description: |
        全局接口，不按门店过滤。
        当 status=`usable` 时，与可用数量接口一致：排除用户券已过期、模板不存在或不在模板有效期内的记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid, status]
              properties:
                openid: { type: string, description: '用户 openid' }
                status: { type: string, description: 'usable 未使用 / used 已使用 / expired 已失效' }
      responses:
        '200':
          description: 成功，body 含 code、data（UserCouponDTO 列表）
        '500':
          description: 失败

  /coupon/getUserAvailableCoupons:
    post:
      tags: [优惠券]
      summary: 用户当前门店可用优惠券列表
      description: |
        等价于「usable」未使用集合再过滤：**剔除已过期**（用户券 `expire_time`、模板 `end_time` 已过的记录）；**未到模板生效时间（`start_time`）的券仍会返回**，便于展示「待生效」；
        仅保留 **apply_shop_ids** 包含请求头 **`X-Shop-Id`** 的券（空/未配置则不适用当前门店）；下单核销前请以 **`/coupon/validateRule`** 判断是否已到生效时间。
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid: { type: string, description: '用户 openid' }
      responses:
        '200':
          description: 成功，body 含 code、data（UserCouponDTO 列表）
        '500':
          description: 失败

  /coupon/getTemplate:
    post:
