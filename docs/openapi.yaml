          type: array
          items: { $ref: '#/components/schemas/KdsGrillProductSlot' }
        cooking:
          type: array
          items: { $ref: '#/components/schemas/KdsGrillCookingItem' }
        cooking_groups:
          type: array
          description: 制作中按菜品合并（右栏展示）
          items: { $ref: '#/components/schemas/KdsGrillCookingGroup' }

    KdsGrillStartCookingResponse:
      allOf:
        - { $ref: '#/components/schemas/KdsGrillBoardResponse' }
        - type: object
          properties:
            dish_name: { type: string }
            updated: { type: integer, description: 本次划为制作中的工单条数 }
