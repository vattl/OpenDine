  /kds/device/login:
    post:
      tags: [KDS-Client]
      summary: 厨显设备登录/一次性云端配对
      x-kds-profile: cloud-or-cashier-lan
      description: |
        云端直连与 Cashier LAN 代理使用同一云端控制器和相同鉴权语义。LAN 代理必须完整转发原始 body 与 `X-Kds-Device-Token`，不得用本地设备表替代云端鉴权。
        设备必须先由管理端绑定。换发 Token 时必须携带当前有效 `X-Kds-Device-Token`，或在 body 携带由云端为该设备签发的一次性 `pairing_code`。未知、跨店或禁用设备一律拒绝，配对码不可复用。
        若代理携带 `X-Shop-Id`，它必须与请求/既有设备的云端绑定门店一致，否则由云端返回 403。

        LAN 冷启动已有 token 时应先调用 `GET /kds/device/me`，只有 token 无效/解绑时才回到配对页；不得持久化 pairing_code 用于自动重登。
        重构后的统一看板建议传 **`screen_tag=workflow_board`**，并通过 **`workflows`** 多选当前工作区负责流程：
        - `["prep"]` 仅配菜，首页显示待配菜 / 已完成。
        - `["cook"]` 仅制作，首页显示待制作 / 已完成。
        - `["serve"]` 仅传菜，首页显示待传菜 / 已完成。
        - `["prep","cook","serve"]` 管理/总览模式，显示完整流程。
        无需 B 端 JWT。绑定成功后：
        1. 持久化 `device_token`、`screen_tag`、`shop_id`
        2. 前端持久化响应 **`device.workflows`** 并在下次启动再次传入。当前服务端仅做进程内会话缓存，重启后会按 `screen_tag` 推导默认 workflows
        3. 连接 WebSocket **`/ws/kds?shop_id=&screen_tag=&token=`**
        4. 后续 REST 头 **`X-Kds-Device-Token`**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KdsCloudDeviceLoginRequest'
            examples:
              workflow_board:
                summary: 统一工作流看板
                value:
                  shop_id: 1
                  device_code: KDS-WORK-01
                  screen_tag: workflow_board
                  device_name: 后厨综合屏
                  workflows: [prep, cook, serve]
                  screenTags: [meat_grill, veg_grill, seafood_special]
              legacy_grill:
                summary: 旧烤制屏兼容登录
                value:
                  shop_id: 1
                  device_code: KDS-MEAT-01
                  screen_tag: meat_grill
                  device_name: 荤烤1号屏
      responses:
        '200':
          description: |
            `code=0`。`device` 为 **KdsDevice**，**务必保存 `device_token`**。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KdsCloudDeviceResponse'
                  - $ref: '#/components/schemas/KdsLanDeviceResponse'
              example:
                code: 0
                device:
                  id: 2
                  shop_id: 1
                  screen_tag: workflow_board
                  device_code: KDS-WORK-01
                  device_name: 后厨综合屏
                  workflows: [prep, cook, serve]
                  device_token: fc19caa1b3794f4a92e0c5bc23805343
        '400':
          description: 参数错误（缺 shop_id、无效 screen_tag 等）

  /kds/device/me:
    get:
      tags: [KDS-Client]
      summary: 查询当前令牌绑定的设备
      x-kds-profile: cloud-or-cashier-lan
      description: |
        携带 **`X-Kds-Device-Token`**，返回该令牌在服务端登记的设备行（**`device`**）。
        用于 App 冷启动、页面刷新前核对 **`screen_tag` / `shop_id`**，避免本地缓存屏型与 token 不一致。
        `device.workflows` 当前可能来自进程内缓存；服务重启后会按 `screen_tag` 推导，不能替代前端持久化。统一看板启动时应再次调用 login 并传本地 workflows。
        D026：统一看板设备同时回显 **`screen_tags`**（可见烤制岗）；未配置返回空数组（前端按三岗全选）。
        **不会**刷新 token；换屏须 **`POST /kds/device/login`**。
        令牌无效或设备已禁用时返回 **401**。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
      responses:
        '200':
          description: '`code=0`，`device` 为 **KdsDevice**（含 `device_token`、`screen_tag`）'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KdsCloudDeviceResponse'
                  - $ref: '#/components/schemas/KdsLanDeviceResponse'
        '401':
          description: 缺少或无效设备令牌


  /kds/device/heartbeat:
    post:
      tags: [KDS-Client]
      summary: 厨显设备心跳
      x-kds-profile: cloud-or-cashier-lan
      description: |
        Cloud compatibility 与 Cashier LAN 均必须携带 `X-Kds-Device-Token`，以 token 绑定设备为准。Cloud 不通过 body 的 device_code 选择设备。
        LAN 响应 `data` 返回 `server_time_ms`，可选返回 `config_version`；心跳不得修改订单或 KDS 业务状态。
        亦可在 WebSocket 连接建立时由服务端自动记心跳。
      security: [{ XKdsDeviceToken: [] }]
      parameters:
        - name: X-Kds-Device-Token
          in: header
          required: true
          schema: { type: string }
          description: 两种运行模式均必传。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_code: { type: string }
                deviceCode: { type: string }
      responses:
        '200':
          description: '`code=0`；LAN data 含 server_time_ms，可选 config_version'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KdsHeartbeatResponse' }
        '401': { description: 'LAN 缺少或无效令牌；Cloud 当前返回 HTTP 200、业务 code=401' }

