  /cashier/kds/delivery/ack:
    post:
      tags: [收银机端]
      summary: 累计确认已事务落地的投递 cursor
      description: |
        `throughCursor` 只能在本地 SQLite 事务提交后上报。
        ACK 仅用于接管 fencing、lag 监控和保留期判断，不代表厨房设备已经显示，也不会立即删除事件。
        重复上报相同或更小 cursor 幂等成功；禁止跳过未落地事件。
      x-implementation-status: implemented
      x-since-version: 1.2.189
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
        - $ref: '#/components/parameters/XCashierAuthorityEpoch'
        - $ref: '#/components/parameters/XCashierLeaseToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashierKdsDeliveryAckRequest' }
      responses:
        '200':
          description: ACK 成功或幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierKdsDeliveryAckResponse' }
        '409': { description: epoch/lease 失效、cursor 超过当前 head 或违反累计顺序 }

