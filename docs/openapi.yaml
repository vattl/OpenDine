    - **v1.2.210（菜品出餐时长与 KDS 单品超时）**：**Dish** 增加正整数分钟字段 **`serving_duration_minutes`**，新增菜品未传时默认 **10**；**`POST /admin/dish/save`** 支持编辑保存，**`GET /dish/listAll`**、**`POST /admin/dish/list`**、**`POST /admin/dish/hqTemplateList`** 返回该字段。KDS 待做工单优先按关联菜品时长判超时，历史明细无法关联菜品时回退门店 **`sla_minutes`**；KDS 明细响应同时返回实际采用的 **`serving_duration_minutes`**。迁移见 **`docs/db_migration_dish_serving_duration_minutes.sql`**。
