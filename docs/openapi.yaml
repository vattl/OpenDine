              required: [id, targetIndex]
              properties:
                id: { type: integer, description: 被拖拽的类目ID }
                targetIndex: { type: integer, description: '拖拽后的目标位置（1-based 显示位置；传 0 等价于移到首位，越界自动收敛到首/末位）' }
