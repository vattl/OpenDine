    - **v1.2.289（日结预检提示可作废打包外卖单与一键全部作废，WI-014）**：`GET /admin/daily/pre-check` 新增可选参数 `minutes`（默认 30），在响应顶层及阻断项 `OPEN_ORDERS` 中增加结构化字段 `voidable_stale_pack_takeout` / `voidable_pack_takeout` 汇总超时未支付打包外卖单笔数与金额；新增专用端点 `POST /admin/daily/void-stale-takeout-orders`（权限 `daily:settle|order:operate`），支持批量将超时打包/外卖单置为 `cancelled`，联动回退菜品库存、取消外卖配送单、通知 KDS 厨显作废工单、取消未支付收款意向并记录特权安全审计日志。
