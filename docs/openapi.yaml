    - **v1.2.264（不可变支付台账与商业级收银分账闭环）**：
      收银结算 `POST /cashier/order/checkout` 与反结账 `POST /cashier/order/unCheckout` 全面接入不可变支付台账 `t_payment_ledger`。结账支持传入 `request_id`（幂等防重）、`terminal_id`、`drawer_session_id`、`employee_shift_id`、`operator_id`、`business_day`；强制数学恒等式校验 $\sum \text{channels} = \text{OrderNetRevenue.netRevenueFen(order)}$，不匹配事务整体回滚。反结账通过对历史支付台账生成负向 `REVERSAL` 冲正记录实现全链路审计，杜绝物理删除。
