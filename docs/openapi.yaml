      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes]
              properties:
                permissionCodes: { type: array, items: { type: string } }
      responses:
        '200': { description: '成功，返回 conflicts 冲突列表' }

  /admin/access/policies:
    get:
      tags: [系统设置, 权限策略, 运营后台]
      summary: 权限策略列表
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      parameters:
        - { name: permissionCode, in: query, schema: { type: string } }
      responses:
        '200': { description: '成功，返回 items 策略列表' }
    post:
