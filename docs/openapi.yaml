                sortOrder: { type: integer, default: 100 }
                permissionIds:
                  type: array
                  description: 绑定权限码 ID 列表（覆盖式）；不传保持现状，传空数组清空绑定
                  items: { type: integer }
      responses:
        '200': { description: 成功，version=1 }
        '409': { description: ACCESS_ROLE_CODE_DUPLICATE }

  /admin/access/roles/{id}:
    put:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 更新角色
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: 乐观锁版本号，不匹配返回 409 }
                roleName: { type: string }
                remark: { type: string }
                sortOrder: { type: integer }
                permissionIds:
                  type: array
                  description: 绑定权限码 ID 列表（覆盖式）；不传保持现状，传空数组清空绑定
                  items: { type: integer }
      responses:
        '200': { description: 成功，version+1 }
        '409': { description: ACCESS_ROLE_VERSION_CONFLICT }
    delete:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 删除角色
      description: 被管理员引用时禁止删除（409 ROLE_IN_USE + data.adminCount）；需 confirm=true；未被引用时连带删除其权限绑定。
      security: [{ BearerAuth: [] }]
      x-permission: access:manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: confirm, in: query, required: true, schema: { type: boolean } }
      responses:
        '200': { description: 成功 }
        '400': { description: ACCESS_CONFIRM_REQUIRED }
        '409': { description: ROLE_IN_USE }

  /admin/access/evaluate:
    post:
      tags: [系统设置, 权限管理, 运营后台]
      summary: 权限与策略决策解释
      description: >-
        评估管理员在指定门店是否拥有某权限码，支持金额、折扣率等动态上下文决策与单次审批 Token 探测。
        outcome 是权威决策结果：ALLOW 可继续，REQUIRE_APPROVAL 应进入现场/扫码审批，DENY 必须停止；
        allow 与 approvalRequired 仅为兼容字段。退款、改价、优惠、反结账等登记动作允许仅持有 cashier:operate 的收银员获得
        REQUIRE_APPROVAL，但只有动作执行权限或严格绑定且一次性核销成功的审批令牌才能得到 ALLOW。
      security: [{ BearerAuth: [] }]
      x-permission: access:view|access:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, permission]
              properties:
                userId: { type: integer }
                shopId: { type: integer }
                permission: { type: string, example: 'order:operate:refund' }
                context:
                  type: object
                  properties:
                    amount: { type: number }
                    discountRate: { type: number }
                    resourceType: { type: string }
                    resourceId: { type: string }
                    approvalToken: { type: string }
      responses:
        '200': { description: '成功，body data 含 outcome（ALLOW/REQUIRE_APPROVAL/DENY）、allow、permissionGranted、shopInScope、policyPassed、approvalRequired、reasonCode、explanation、approval、matchedRoles[]、matchedPolicies[]' }
        '400': { description: 参数非法 }
        '404': { description: 管理员不存在 }

  /admin/inventory/suppliers:
    get:
