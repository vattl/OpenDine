        '500': { description: 失败 }

  /admin/report/stockPrepForecast/latest:
    get:
      tags: [数据报表, 运营后台]
      summary: 读取最近一次落库的备货预测
      description: 返回当前门店（`X-Shop-Id`）下最新一条 `t_stock_prep_forecast_run` 及明细；无记录时 code 非 0。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      responses:
        '200': { description: 成功，body.forecast 含 runId、days 等 }
        '500': { description: 失败 }

  /admin/report/stockPrepForecast/run/{runId}:
    get:
      tags: [数据报表, 运营后台]
      summary: 按批次 ID 读取落库的备货预测
      description: |
        `runId` 对应 `t_stock_prep_forecast_run.id`。若请求带门店上下文且批次 `shop_id` 与当前店不一致，返回错误。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: runId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功 }
        '500': { description: 失败 }

  /admin/report/stockPrepForecast/run/{runId}/validate:
    post:
      tags: [数据报表, 运营后台]
      summary: 校验预测批次（写回实际销量与日汇总）
      description: |
        对 **`stat_date` ≤ 昨天** 的预测日：从订单汇总各菜 `actual_quantity`、当日成功单数、全店明细销量；并关联 **`t_daily_stat`**（同店、同日）写入 `t_stock_prep_forecast_day`。
        需先执行 **`docs/db_migration_stock_prep_forecast_validation.sql`**。
        **`force=false`** 时跳过已有 `day_validated_at` 的日期；**`force=true`** 时覆盖重算。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: runId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { description: 成功，body.result 含 updatedDays、updatedDishRows 等 }
        '500': { description: 失败 }

  /admin/report/stockPrepForecast/trainingRows:
    get:
      tags: [数据报表, 运营后台]
      summary: 导出 ML 训练样本（扁平行）
      description: |
        返回 `data.rows[]`：每行含日级特征（节假日、天气系数、日结金额、实际单量等）与菜品级 **`label_actual_quantity`**（需先调用 validate 写入）。
        字段名稳定，便于离线拼接多 `run_id` 做大数据训练。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: runId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功，body.data 含 rows、rowCount }
        '500': { description: 失败 }

  /admin/report/stockPrepForecast:
    get:
      tags: [数据报表, 运营后台]
      summary: 未来几天菜品备货预测（可落库）
      description: |
        基于历史订单明细（与 `statisticsDishSales` 相同成功单口径），按「星期几」计算各菜品日均销量基线，再乘以节假日系数与 Open-Meteo 天气启发式系数。
        **仅预测当前已上架菜品**（`onsale=true`；连锁门店按 `t_dish_shop` 的 `ifnull(onsale_override, onsale)`），历史已下架商品不参与排序与预测；响应含 **`onsaleDishCount`**。
        **法定节假日与调休补班**：以 `classpath:holidays/cn-public-holidays.json` 为准（已内置国务院公布的 **2025、2026** 放假与补班日），可通过 `stock-prep-forecast.holiday-calendar-path` 指向自定义文件；`extra-holiday-dates` 可与文件中的休息日叠加。
        **`persist=true`**：写入 `t_stock_prep_forecast_run` / `_day` / `_dish`，响应中返回 **`runId`**。执行前请先跑迁移 **`docs/db_migration_stock_prep_forecast.sql`**；对账与训练字段另见 **`docs/db_migration_stock_prep_forecast_validation.sql`**。
        **门店**：依赖 **`X-Shop-Id`** 解析出的 `shop_id`；无经纬度时跳过天气、系数为 1。
      security: [{ BearerAuth: [] }]
      x-permission: statistics:view
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: historyDays
          in: query
          schema: { type: integer, minimum: 7, default: 56 }
          description: 回溯自然日数
        - name: forecastDays
          in: query
          schema: { type: integer, minimum: 1, maximum: 16, default: 7 }
          description: 预测天数（受 Open-Meteo 免费接口 forecast 上限影响，服务端最多取 16）
        - name: persist
          in: query
          schema: { type: boolean, default: false }
          description: 为 true 时将本次预测结果写入数据库
      responses:
        '200':
          description: 成功，body.forecast 含 days[]、modelNotes；落库时另含 runId、persisted
        '500': { description: 失败 }

  /admin/stock-prep/bom/list:
    get:
