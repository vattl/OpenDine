        out_time: { type: string }
        amount: { type: number }
        order_no: { type: string, description: '当前关联订单号，结账/清台后为空' }
        area_code: { type: string, description: '区域编码，如 hall/box/patio' }
        area_name: { type: string, description: '区域名称，如 大厅散座/特色包厢/露天外摆' }

    # ---------- 收银系统扩展 Schemas（见 db_diancan_cashier_ext.sql）----------
    Shop:
      type: object
      description: |
        门店，对应 t_shop（连锁扩展字段见 db_diancan_chain_store_patch.sql）。
        **`latitude`/`longitude`** 须为 **GCJ-02（高德）** 坐标（见 **`CoordinateConvention`**）。
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        address: { type: string }
        latitude: { type: number, description: '纬度（GCJ-02 高德；补丁列，可能为 null）' }
        longitude: { type: number, description: '经度（GCJ-02 高德；补丁列）' }
        contact_phone: { type: string }
        open_time: { type: string, description: 'time' }
        close_time: { type: string, description: 'time' }
        settle_time: { type: string, description: '每日结算截止时间(HH:mm)，营业日统计窗口=[open_time,次日settle_time)；为空回退close_time，默认04:00' }
        status: { type: integer, description: '0-停用 1-营业' }
        sort_order: { type: integer, description: '列表排序（补丁列）' }
        remark: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    ShopInput:
      type: object
      description: 门店坐标入库统一为 GCJ-02；通过 coordinate_type 声明输入来源，服务端负责转换。
      properties:
        id: { type: integer, description: '更新时传' }
        name: { type: string }
        code: { type: string }
        address: { type: string }
        latitude: { type: number, description: '纬度；坐标系由 coordinate_type 指定' }
        longitude: { type: number, description: '经度；坐标系由 coordinate_type 指定' }
        coordinate_type: { type: string, enum: [gcj02, wgs84, bd09], default: gcj02 }
        contact_phone: { type: string }
        open_time: { type: string }
        close_time: { type: string }
        settle_time: { type: string, description: '每日结算截止时间(HH:mm)，更新门店时可传' }
        status: { type: integer }
        sort_order: { type: integer }
        remark: { type: string }
    PaymentMerchantEditForm:
      type: object
      description: 支付商户 B 端编辑表单（GET edit-form / GET merchants/{id} / PUT save 响应）
      properties:
        id: { type: integer, format: int64, nullable: true }
        exists: { type: boolean, description: false 表示空白新建模板 }
        editable: { type: boolean }
        shopId: { type: integer }
        channel: { type: string }
        merchantKey: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        credentialVersion: { type: integer, minimum: 1 }
        appId: { type: string }
        mchId: { type: string }
        notifyUrl: { type: string }
        refundNotifyUrl: { type: string }
        notifyUrlSuggestions:
          type: object
          additionalProperties: { type: string }
        hasApiV3Key: { type: boolean }
        apiV3Key: { type: string, description: 已配置时为 ******，提交 save 时不改 }
        hasApiV2Key: { type: boolean }
        apiV2Key: { type: string, description: 已配置时为 ******，提交 save 时不改 }
        hasPrivateKey: { type: boolean }
        privateKeyRef: { type: string }
        hasClientCertP12: { type: boolean }
        clientCertP12Ref: { type: string, description: 服务器 P12/PFX 客户端证书路径；非 classpath 路径会脱敏 }
        platformPubKeyId: { type: string }
        platformPubKeyRef: { type: string }
        serialNo: { type: string }
        payReady:
          type: boolean
          description: default 微信商户是否满足小程序微信支付启用前置条件
        missingFields:
          type: array
          description: 未满足的字段名；可能含 enabled/appId/mchId/notifyUrl/apiV3Key/serialNo/platformPubKeyId/platformPubKeyRef/privateKeyRef
          items: { type: string }
        capabilities:
          type: object
          description: 新增或更新成功后返回的最新门店支付能力；查询编辑表单时可不返回
          additionalProperties: true
        routingRuleJson: { type: string }
        sortOrder: { type: integer }
        remark: { type: string }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PaymentMerchantConfigUpsert:
      type: object
      description: 支付商户配置写入（对应 t_payment_merchant_config）；密钥字段传 ****** 表示不修改；可带 id
      properties:
        id: { type: integer, format: int64, description: 有则按 id 更新（save 接口） }
        channel: { type: string, enum: [wechat, alipay] }
        merchantKey: { type: string, description: '商户实例键；支持任意业务键，default/small_amount 与 merchantId 1/2 兼容' }
        enabled: { type: boolean }
        appId: { type: string }
        mchId: { type: string }
        notifyUrl: { type: string }
        refundNotifyUrl: { type: string }
        apiV3Key:
          type: string
          minLength: 32
          maxLength: 32
          description: 微信 APIv3 密钥（必须 32 位；明文提交，服务端加密存储；****** 表示不修改）
        apiV2Key:
          type: string
          minLength: 32
          maxLength: 32
          description: 微信 APIv2 密钥（付款码接口 HMAC-SHA256；明文提交，服务端加密存储；****** 表示不修改）
        serialNo: { type: string, description: 商户 API 证书序列号（40 位十六进制，对应 weixin.serial_no） }
        platformPubKeyId:
          type: string
          maxLength: 128
          description: |
            微信支付**平台公钥 ID**（HTTP 头 Wechatpay-Serial 取值，如 PUB_KEY_ID_xxx；
            与 application.yml 的 weixin.pubSerial 相同）。
        platformPubKeyRef:
          type: string
          maxLength: 512
          description: |
            微信平台公钥 PEM 或 **classpath:pub_key.pem**（验签用；DB 优先，缺省回退 yml 的 pubSerial-path）。
            可内联 -----BEGIN PUBLIC KEY-----；传 ****** 表示不修改。
        privateKeyRef:
          type: string
          maxLength: 512
          description: |
            商户私钥**服务器文件路径引用**，如 `classpath:apiclient_key.pem` 或上传接口返回的本地文件路径。
            不要传完整 PEM 内容；完整 PEM 请先调用 **`POST /admin/payment/private-key/upload`** 或
            **`POST /admin/payment/merchants/{id}/private-key/upload`**，由后端保存文件后再写入返回路径。
        clientCertP12Ref:
          type: string
          maxLength: 512
          description: 微信付款码撤销接口使用的服务器 `.p12`/`.pfx` 客户端证书路径；证书文件不得提交到仓库，默认以商户号作为口令。
        routingRuleJson:
          type: string
          description: 'JSON；amount_and_dining 支持 minPaidYuan/maxPaidYuan/diningTypes/targetMerchantKey/defaultMerchantKey，按 sortOrder 首个匹配'
        sortOrder: { type: integer }
        remark: { type: string }
    Payment:
      type: object
      description: 支付记录，对应 t_payment
      properties:
        id: { type: integer, format: int64 }
        order_no: { type: string }
        payment_method: { type: string }
        amount: { type: number }
        transaction_id: { type: string }
        pay_time: { type: string }
        operator_id: { type: integer }
        shop_id: { type: integer }
    Material:
      type: object
      description: 原材料，对应 t_material；**shop_id** 见 **docs/db_migration_material_payment_log_shop_id.sql**
      properties:
        id: { type: integer }
        shop_id: { type: integer, description: 门店ID，列表与库存按店隔离 }
        name: { type: string }
        unit: { type: string }
        stock: { type: number }
        alert_threshold: { type: number }
        created_at: { type: string }
        updated_at: { type: string }
    MaterialInput:
      type: object
      properties:
        id: { type: integer }
        shop_id:
          type: integer
          description: 新建/更新时服务端按当前门店写入，客户端可不传
        name: { type: string }
        unit: { type: string }
        alert_threshold: { type: number }
    StockInInput:
      type: object
      description: 入库请求体；**shop_id** 由服务端写入 **t_stock_in**，与当前解析门店一致
      required: [material_id, quantity]
      properties:
        material_id: { type: integer }
        quantity: { type: number }
        price: { type: number }
        total_amount: { type: number }
        remark: { type: string }
    StockOutInput:
      type: object
      description: 出库请求体；**shop_id** 由服务端写入 **t_stock_out**
      required: [material_id, quantity]
      properties:
        material_id: { type: integer }
        quantity: { type: number }
        reason: { type: string, enum: [consume, transfer, waste] }
        remark: { type: string }
    DailyStat:
      type: object
      description: 日结对账，对应 t_daily_stat
      properties:
        id: { type: integer, format: int64 }
        stat_date: { type: string, format: date }
        shop_id: { type: integer }
        total_amount: { type: number }
        discount_amount: { type: number }
        refund_amount: { type: number }
        material_cost: { type: number }
        settled_at: { type: string }
        operator_id: { type: integer }
    OrderLog:
      type: object
      description: 订单操作日志，对应 t_order_log
      properties:
        id: { type: integer, format: int64 }
        order_no: { type: string }
        action: { type: string }
        operator_type: { type: string }
        operator_id: { type: string }
        remark: { type: string }
        created_at: { type: string }
    Shift:
      type: object
      description: 收银员班次，对应 t_shift
      properties:
        id: { type: integer, format: int64 }
        admin_id: { type: integer }
        shop_id: { type: integer }
        start_time: { type: string }
        end_time: { type: string }
        start_cash: { type: number }
        end_cash: { type: number }
        order_count: { type: integer }
        total_amount: { type: number }
    OperationLog:
      type: object
      description: 关键操作日志，对应 t_operation_log；**shop_id** 见 **docs/db_migration_material_payment_log_shop_id.sql**
      properties:
        id: { type: integer, format: int64 }
        shop_id: { type: integer, nullable: true, description: 门店隔离；列表仅返回当前店 }
        module: { type: string }
        action: { type: string }
        target_id: { type: string }
        admin_id: { type: integer }
        ip: { type: string }
        created_at: { type: string }

    # ---------- 真省钱配送 /api/zsq ----------
    ZsqApiResult:
      type: object
      description: 真省钱模块统一响应（code=200 成功；业务失败 HTTP 502，code 为真省钱错误码）
      properties:
        code: { type: integer, description: '200 成功；400 参数错误；502 真省钱远端错误' }
        message: { type: string, description: 提示文案 }
        data: { description: 业务数据，失败时可能为 null }
      required: [code, message]

    ZsqLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: 手机号 }
        password: { type: string, description: 密码（短信登录时可空） }
        role:
          type: string
          enum: [merchant, partner]
          default: merchant
          description: merchant=商户(type=2)；partner=接口方(type=1)
        loginMode:
          type: string
          enum: [password, sms]
          default: password
        smsCode: { type: string, description: 短信验证码，loginMode=sms 时必填 }

    ZsqLoginResponse:
      type: object
      properties:
        authorization:
          type: string
          description: 完整 Authorization 字符串，后续请求 Header 原样携带
        role: { type: string, description: merchant | partner }

    ZsqShopAddress:
      type: object
      description: |
        发单店铺（真省钱 GET /open/order/address）。**`shopLng`/`shopLat`** 为真省钱侧坐标（通常为 **BD-09**）；
        与本系统 **`t_shop`**（**GCJ-02**）比对时由服务端 **BD-09→GCJ-02** 换算（见 **v1.2.56**）。调用方写入本系统的坐标仍须 GCJ-02。
      properties:
        id: { type: integer, format: int64, description: 发单店铺 ID → fromAddressId }
        shopName: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        shopAddress: { type: string }
        cityName: { type: string }
        shopLng: { type: string, description: '真省钱经度（多为 BD-09，非本系统入库格式）' }
        shopLat: { type: string, description: '真省钱纬度（多为 BD-09，非本系统入库格式）' }
        isDefault: { type: integer, description: '1=默认店铺' }
        industryType: { type: integer, description: 行业类型 → goodType }

    ZsqAddressTip:
      type: object
      description: 高德地址联想结果
      properties:
        name: { type: string }
        address: { type: string }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        uid: { type: string }
        location:
          type: object
          properties:
            lat: { type: string }
            lng: { type: string }

    ZsqCreateTakeawayOrderRequest:
      type: object
      required: [receiverName, receiverPhone, receiverAddress, receiverDetail, cityName]
      properties:
        fromAddressId:
          type: integer
          format: int64
          description: 发单店铺 ID；配置后优先于 fromAddressShopName
        fromAddressShopName:
          type: string
          description: 本系统门店中文名，与真省钱发单店铺 shopName 匹配（无 fromAddressId 时）；外卖接单发配送时由 t_shop.name 自动填入
        fromAddressLatitude:
          type: number
          format: double
          description: 本系统门店纬度（GCJ-02 高德）；与 fromAddressLongitude 一并用于 50 米内定位校验（t_shop.latitude）
        fromAddressLongitude:
          type: number
          format: double
          description: 本系统门店经度（GCJ-02 高德）；与 fromAddressLatitude 一并用于 50 米内定位校验（t_shop.longitude）
        fromAddressCoordinateType:
          type: string
          enum: [gcj02, wgs84, bd09]
          default: gcj02
        receiverName: { type: string, description: 收货人 }
        receiverPhone:
          type: string
          pattern: '^1\d{10}$'
          description: 收货手机号
        extension: { type: string, description: 分机号；下单时格式为 手机号_分机 }
        receiverAddress: { type: string, description: 地址关键词（用于 input-tips） }
        receiverDetail: { type: string, description: 门牌号/详细地址 }
        cityName: { type: string, default: 江门市 }
        receiverLatitude: { type: number, description: 收货纬度；坐标系由 receiverCoordinateType 指定 }
        receiverLongitude: { type: number, description: 收货经度；坐标系由 receiverCoordinateType 指定 }
        receiverCoordinateType: { type: string, enum: [gcj02, wgs84, bd09], default: gcj02 }
        productName: { type: string, default: 到店查看 }
        productAmount: { type: string, default: '50', description: 商品金额（元，字符串） }
        productCount: { type: integer, default: 1 }
        weight: { type: integer, default: 3, description: 重量 kg }
        remark: { type: string, default: '' }
        expectTime:
          type: string
          description: 预约时间 yyyy-MM-dd HH:mm:ss；空=立即送达

    ZsqCreateOrderResult:
      type: object
      description: 创建外卖订单成功响应
      properties:
        shopNumber: { type: string }
        id: { type: integer, format: int64, description: openOrderId，追踪/发配送用 }
        orderId: { type: string, description: 业务订单号（对外展示推荐） }

    ZsqDispatchOptionsRequest:
      type: object
      description: 一键发配送可选参数
      properties:
        callOrderType:
          type: string
          default: '1'
          description: '1=同时叫单（默认），2=依次叫单'
        channelCount:
          type: integer
          default: 1
          description: 自动选择的配送渠道数（按价格从低到高）；默认读 zsq.auto-dispatch-channel-count
        deliveryCode:
          type: integer
          description: 指定配送渠道；空则自动选最便宜可用渠道

    ZsqCreateTakeawayDispatchRequest:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/ZsqCreateTakeawayOrderRequest'
        dispatch:
          $ref: '#/components/schemas/ZsqDispatchOptionsRequest'

    ZsqDeliveryBillingChannel:
      type: object
      description: 配送询价渠道项
      properties:
        status: { type: integer, description: '1=可用' }
        errorMsg: { type: string }
        deliveryCode: { type: integer }
        deliveryType: { type: integer }
        deliveryChannelName: { type: string }
        estimateMoney: { type: string, description: 预估运费（元） }
        distance: { type: string }
        isSupportInsurance: { type: integer }

    ZsqTakeawayDispatchResult:
      type: object
      description: 一键下单结果
      properties:
        order:
          $ref: '#/components/schemas/ZsqCreateOrderResult'
        dispatch:
          type: object
          additionalProperties: true
          description: 真省钱 POST /delivery/order/create 响应 data（含 parentOrderNo 等）
        quotedChannels:
          type: array
          items:
            $ref: '#/components/schemas/ZsqDeliveryBillingChannel'
        selectedDeliveryCodes:
          type: array
          items: { type: integer }
          description: 实际发起的配送渠道 deliveryCode 列表

    ZsqRiderPoint:
      type: object
      properties:
        name: { type: string, description: 骑手姓名 }
        phone: { type: string, description: 骑手手机 }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        locationLogId: { type: integer, format: int64, nullable: true, description: 当前坐标来源的订单轨迹 ID }
        locationUpdatedAt: { type: string, nullable: true, description: 当前坐标来源的订单轨迹时间 }

    ZsqTrajectoryState:
      type: object
      description: 从当前配送批次订单轨迹独立提取的核心状态；各字段取自身最新记录，避免不同状态语义及旧批次取消记录互相覆盖
      properties:
        callbackStatus: { type: string, nullable: true, description: 最新“回传状态” }
        orderStatus: { type: string, nullable: true, description: 最新“订单状态”的目标状态，如异常单 }
        previousOrderStatus: { type: string, nullable: true, description: 最新订单状态变更前的状态 }
        deliveryStatus: { type: string, nullable: true, description: 最新“配送状态” }
        cancelReason: { type: string, nullable: true, description: 最新取消原因 }
        latestStatusLogId: { type: integer, format: int64, nullable: true, description: 最新核心状态轨迹 ID }
        statusUpdatedAt: { type: string, nullable: true, description: 最新核心状态轨迹时间 }

    ZsqEffectiveState:
      type: object
      description: 后端解析出的当前配送批次权威状态；前端最终状态展示以本对象为准
      properties:
        sendStatus: { type: integer, nullable: true, description: '20=待接单，30=取货中，80=骑士到店，40=配送中，50=已完成，60=已取消' }
        statusDesc: { type: string, nullable: true, description: 当前批次有效状态文案 }
        phase:
          type: string
          enum: [WAITING_RIDER, TO_SHOP, TO_USER, DELIVERED, CANCELLED, ORDER_MISSING, UNKNOWN]
        source: { type: string, enum: [ORDER_LOG, ORDER_DETAIL], description: 最终状态来源 }
        effectiveLogId: { type: integer, format: int64, nullable: true, description: source=ORDER_LOG 时采用的状态日志 ID }
        parentOrderNo: { type: string, nullable: true, description: 当前配送批次母单号 }
        thirdPartyOrderNo: { type: string, nullable: true, description: 当前运力三方配送单号 }
        updatedAt: { type: string, nullable: true, description: 当前有效状态更新时间 }

    ZsqLocationPoint:
      type: object
      properties:
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        address: { type: string }
        addressDetail: { type: string }

    ZsqPlatformEta:
      type: object
      description: 真省钱平台 ETA 文案
      properties:
        distanceText: { type: string, description: 如「634米」 }
        durationText: { type: string, description: 如「3分钟」 }
        description: { type: string }

    ZsqComputedEta:
      type: object
      description: 基于经纬度 + zsq.rider-speed-kmh 估算
      properties:
        riderToShopKm: { type: number, description: 骑手距商家公里数 }
        riderToUserKm: { type: number, description: 骑手距用户公里数 }
        toShopMinutes: { type: integer, description: 骑手距商家预计分钟（phase=TO_SHOP 时前端优先展示） }
        toUserMinutes: { type: integer, description: 骑手距用户预计分钟（phase=TO_USER 时前端优先展示） }
        speedKmh: { type: number, description: 估算速度，来自配置 zsq.rider-speed-kmh }

    ZsqRiderTrackingResponse:
      type: object
      description: 骑手追踪与 ETA，供前端展示距商家/距用户还有多久
      properties:
        openOrderId: { type: integer, format: int64 }
        orderId: { type: string }
        deliverySendStatus:
          type: integer
          description: '真省钱最新配送日志状态：20=待接单，30=取货中，80=骑士到店，40=配送中，50=已完成，60=已取消'
        deliverySendStatusDesc: { type: string }
        phase:
          type: string
          enum: [WAITING_RIDER, TO_SHOP, TO_USER, DELIVERED, CANCELLED, ORDER_MISSING, UNKNOWN]
        coordinateType:
          type: string
          description: 业务侧 tracking 接口固定为 gcj02；底层真省钱接口按第三方 coordinateType 返回 bd09、gcj02、wgs84，无法识别时为 zsq_raw
        rider:
          $ref: '#/components/schemas/ZsqRiderPoint'
        shop:
          $ref: '#/components/schemas/ZsqLocationPoint'
        user:
          $ref: '#/components/schemas/ZsqLocationPoint'
        platformEta:
          $ref: '#/components/schemas/ZsqPlatformEta'
        computedEta:
          $ref: '#/components/schemas/ZsqComputedEta'
        deliveryTimeline:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 真省钱 GET /open/order/delivery/status/new/{openOrderId} 各渠道历史时间线；仅供展示，不是聚合最终状态，禁止按数组首项、全局最大 sortNum 或任意 sendStatus=60 推断整单状态
        orderLogs:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 真省钱 GET /open/order/log/{openOrderId}?id={openOrderId} 原始操作/轨迹日志；仅返回 openOrderId 与请求一致的记录。包含历史配送批次，前端不得自行据此推断最终状态
        effectiveState:
          $ref: '#/components/schemas/ZsqEffectiveState'
        trajectoryState:
          $ref: '#/components/schemas/ZsqTrajectoryState'
        dispatchStatus:
          type: string
          description: 本系统 t_takeout_delivery.dispatch_status（如 cancelled、delivering）
        zsqDispatchStatus:
          type: string
          description: 真省钱 zsq_dispatch_status（如 cancelled、dispatched、rider_cancelled）
        actualFee:
          type: number
          description: 真省钱实际跑腿费用（元），来自 shopActualCost/discountLastMoney
        deliverySupplierName:
          type: string
          description: 真省钱实际配送运力渠道（如京东特惠、美团等），来自 deliverySupplierName

    KdsItemStatus:
      type: integer
      enum: [0, 1, 2, 3]
      description: |
        单品工单状态（`t_kds_ticket.item_status`），**`POST /kds/item/status`** 的 `status` 字段。
        `0` 待做、`1` 制作中、`2` 完成、`3` 作废（退菜/缺货/取消）。

    KdsOrderStatus:
      type: integer
      enum: [10, 20, 30, 40, 90]
      description: |
        整单厨显状态（`t_kds_order.kds_order_status`），由服务端按工单聚合。
        `10` 待制作、`20` 制作中、`30` 部分完成、`40` 全部完成（后厨传菜完毕）、`90` 已关闭（仅 `transac_status=cancelled`；结账不影响，见 **v1.2.138**）。

    KdsScreenTag:
      type: string
      enum: [skewer_aggregate, meat_grill, veg_grill, seafood_special, expedition, boss_overview, workflow_board]
      description: |
        PRD 岗位标识（五屏 + 收银总览 + 统一工作流看板）。与设备 login 时 `screen_tag`、列表/划菜参数一致。
        `skewer_aggregate`/`expedition` 不生成烤制工单，使用专用 API；`boss_overview` 只读总览，用 **`GET /kds/overview/board`**。
        `workflow_board` 为重构后的统一看板设备，登录时配合 `workflows` 多选，使用 **`/kds/workflow/*`**。

    KdsGrillScreenTag:
      type: string
      enum: [meat_grill, veg_grill, seafood_special]
      description: 烤制三岗（D026 设备可见岗）。统一看板设备可按岗分流，工单仍按三岗路由创建，展示层按设备过滤。

    KdsGrillScreenTagList:
      type: array
      uniqueItems: true
      items: { $ref: '#/components/schemas/KdsGrillScreenTag' }
      description: 同 screenTags（snake_case）。

    KdsWorkflow:
      type: string
      enum: [prep, cook, serve]
      description: |
        统一工作流能力枚举。`prep` 配菜、`cook` 制作、`serve` 传菜。
        设备登录时可多选；前端据此决定 BoardPage 可见 Tab。

    KdsBoardQueue:
      type: string
      enum: [pending_prep, pending_cook, ready_serve, done]
      description: |
        统一看板队列。第一版后端可兼容映射旧字段：
        `pending_prep` = `skewer_picked=0`；`pending_cook` = `item_status=0 && skewer_picked=1`；
        `ready_serve` = `item_status=2 && archived=0`；`done` = `archived=1`。

    KdsBoardView:
      type: string
      enum: [dish, order]
      default: dish
      description: 统一看板视图：dish 菜品维度；order 订单维度。

    KdsDiningFilter:
      type: string
      enum: [all, dine_in, pack, takeout]
      default: all
      description: 就餐方式筛选；pack 对应打包，takeout 对应外卖。

    KdsWorkflowExtraFilter:
      type: string
      enum: [overdue, rush, add_dish, hold]
      description: 统一看板标签筛选：超时/催菜/加菜/等叫。

    KdsWorkflowSort:
      type: string
      enum: [order_time, overdue_first, rush_first]
      default: order_time
      description: 统一看板排序：下单时间、超时优先、催菜优先。

    KdsStation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        shop_id: { type: integer }
        name: { type: string }
        code: { type: string }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        sort: { type: integer }
        enabled: { type: integer, description: '0/1' }

    KdsStationInput:
      allOf:
        - $ref: '#/components/schemas/KdsStation'

    KdsStationCategoryBindRequest:
      type: object
      required: [stationId]
      properties:
        stationId: { type: integer, format: int64 }
        cidList:
          type: array
          items: { type: string }
          description: t_category 主键 cid

    KdsDishScreenBindRequest:
      type: object
      required: [screenTag, dishIds]
      properties:
        screenTag: { $ref: '#/components/schemas/KdsScreenTag' }
        dishIds:
          type: array
          items: { type: integer }

    KdsSettings:
      type: object
      properties:
        shop_id: { type: integer }
        sla_minutes: { type: integer, default: 10, description: 超时分钟 }
        cashier_write_back_enabled: { type: boolean, default: true, description: true 时划菜回写收银旧字段 order_rece/order_receiving }
        serve_print_enabled: { type: boolean, default: true, description: true 时 ready_serve 划单后打印传菜单 }
        cross_order_merge: { type: boolean, default: true, description: true 时不同订单相同菜进入同一合并组 }
        add_dish_timeout_independent: { type: boolean, default: true, description: true 时加菜超时按 add_dish_time 独立计算 }
        combo_independent: { type: boolean, default: false, description: true 时套餐独立显示，不与普通单品合并 }
        dine_pack_inline: { type: boolean, default: true, description: true 时堂食/打包/外卖内嵌同卡展示，并返回 dining_breakdown_text }
        sync_legacy_rece: { type: integer, enum: [0, 1], description: cashier_write_back_enabled 的后端原始字段 }
        merge_same_dish: { type: integer, enum: [0, 1], description: cross_order_merge 的后端原始字段 }
        combo_merge: { type: integer, enum: [0, 1], description: combo_independent 的反向后端字段 }
        pack_inline_merge: { type: integer, enum: [0, 1], description: dine_pack_inline 的后端原始字段 }

    KdsShopConfig:
      type: object
      properties:
        shop_id: { type: integer }
        kds_mode:
          type: string
          enum: [print_only, kds_only, both]
          description: |
            `print_only` 仅飞鹅（默认）；`kds_only` 仅厨显且跳过飞鹅厨房/前台打印；
            `both` 打印与厨显并行。未启用厨显时 C 端下单无工单。
        sync_legacy_rece: { type: integer, description: '1=划菜时回写 t_order_detail.order_rece，兼容老收银' }
        auto_off_order_on_kds_done:
          type: integer
          default: 0
          description: |
            `1`=厨显整单完成（`kds_order_status=40`）时自动将 `t_order.order_receiving` 置为 `off_order`（清台）；
            `0`（默认）不联动。清台**不**将厨显升格为 90（见 **v1.2.136**）。
        serve_print_enabled:
          type: integer
          default: 1
          description: |
            `1`（默认）待传菜划单后打印飞鹅传菜单（每条明细一张）；`0` 关闭（见 **v1.2.137**）。
        auto_push_on_create: { type: integer, description: '1=下单/加菜/支付成功时自动生成工单' }
        skewer_gate:
          type: integer
          default: 1
          description: |
            `1`（默认）先抓串再分流烤制屏：新单仅推抓串屏，烤制屏待做需 `skewer_picked=1`；
            `0` 下单直推烤制屏（旧行为）。
        prep_enabled:
          type: integer
          nullable: true
          description: |
            `1` 启用待配菜环节（`pending_prep`）；`0` 关闭待配菜，小程序下单成功后直接进入待制作（`pending_cook`）。
            未配置（`null`）时与 `skewer_gate` 一致（`skewer_gate=0` 等价于关闭配菜）。见 **v1.2.157**。
        default_screen_tag: { $ref: '#/components/schemas/KdsScreenTag', description: 菜品/分类均未绑屏时的兜底烤制屏 }
        sla_minutes: { type: integer, default: 10, description: 待做超时标红（分钟） }
        archive_hours: { type: integer, default: 2, description: 已完成工单多少小时后归档隐藏 }
        lack_sets_sold_out: { type: integer, description: '1=POST /kds/item/lack 时联动门店菜品 sold_out' }
        merge_same_dish:
          type: integer
          default: 1
          description: '1=合并相同菜品（同屏跨订单汇总）；0=按明细一行'
        pack_inline_merge:
          type: integer
          default: 1
          description: '1=堂食与打包内嵌同一行；0=按堂/打包/外卖拆行'
        combo_merge:
          type: integer
          default: 1
          description: '1=套餐子菜与散点同菜合并；0=套餐独立成行'
        add_dish_timeout_independent:
          type: integer
          default: 1
          description: '1=加菜超时按加菜明细自身时间计算；0=跟随订单首单时间'
        cashier_write_back_enabled:
          type: boolean
          description: KDS 本机设置别名；true 等价于 sync_legacy_rece=1
        cross_order_merge:
          type: boolean
          description: KDS 本机设置别名；true 等价于 merge_same_dish=1
        combo_independent:
          type: boolean
          description: KDS 本机设置别名；true 等价于 combo_merge=0
        dine_pack_inline:
          type: boolean
          description: KDS 本机设置别名；true 等价于 pack_inline_merge=1

    KdsShopConfigInput:
      allOf:
        - $ref: '#/components/schemas/KdsShopConfig'

    KdsDevice:
      type: object
      properties:
        id: { type: integer, format: int64 }
        shop_id: { type: integer }
        station_id: { type: integer, format: int64, nullable: true }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        device_code: { type: string }
        device_name: { type: string, nullable: true }
        device_token: { type: string, description: 厨显鉴权令牌，绑定后返回 }
        workflows_json:
          type: string
          nullable: true
          description: |
            持久化工作流多选（`prep,cook,serve` 逗号分隔）；登录 **`workflows[]`** 写入，**`GET /device/me`** 冷启动回显。
            响应 **`workflows`** 数组由本列解析，非表字段。
        workflows:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflow' }
          description: |
            统一工作流看板能力。`screen_tag=workflow_board` 时返回登录选择的流程（如 `["prep","cook","serve"]`）。
            旧屏型可为空或由服务端按屏型推导。
        screen_tags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/KdsGrillScreenTag' }
          description: |
            D026：设备可见烤制岗回显（`t_kds_device_screen`）。`screen_tag=workflow_board` 登录/绑定时
            可配置；未配置返回空数组（前端按三岗全选渲染）。
        last_heartbeat_at: { type: string, format: date-time, nullable: true }
        enabled: { type: integer }

    KdsDeviceBindRequest:
      type: object
      description: |
        设备绑定/登录请求体。支持 **camelCase** 与 **snake_case**（如 `deviceCode` / `device_code`）。
        login 时 **`shop_id`** 必填（snake）或 body 内 `shopId`。
      properties:
        shop_id: { type: integer, description: '门店 t_shop.id；login 必填' }
        shopId: { type: integer }
        deviceCode: { type: string, description: '设备唯一编码，同店可复用' }
        device_code: { type: string }
        deviceName: { type: string }
        device_name: { type: string }
        screenTag: { $ref: '#/components/schemas/KdsScreenTag' }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        workflows:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflow' }
          description: |
            仅 `screen_tag=workflow_board` 时建议传。多选工作流，例如 `["prep","cook","serve"]`；
            不传时服务端可按屏型兼容推导，前端仍应以响应 `device.workflows` 为准。
        screenTags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/KdsGrillScreenTag' }
          description: |
            D026：统一看板设备可见烤制岗，`screen_tag=workflow_board` 时生效，取烤制三岗子集
            （如 `["meat_grill","veg_grill"]`）。不传/空/全非法 → 删除配置，默认三岗全选（兼容旧设备）。
        screen_tags: { $ref: '#/components/schemas/KdsGrillScreenTagList' }
        deviceToken: { type: string, description: '可选：显式指定/同步外部签发的 device_token，保持局域网与外网一致' }
        device_token: { type: string, description: '同 deviceToken' }

    KdsCloudDeviceLoginRequest:
      allOf:
        - $ref: '#/components/schemas/KdsDeviceBindRequest'
        - type: object
          properties:
            pairing_code:
              type: string
              pattern: '^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$'
              description: 云端短时一次性配对票据；仅在当前 Token 无效或首次领取 Token 时提交。
          anyOf:
            - required: [shop_id, device_code, screen_tag]
            - required: [shopId, deviceCode, screenTag]
      description: 云端权威登录。设备必须预绑定；有效当前 Token 或一次性 pairing_code 可轮换 Token。

    KdsLanDevicePairRequest:
      type: object
      required: [pairing_code, device_code, screen_tag]
      description: |
        Cashier LAN 首次配对。pairing_code 必须短时有效且只消费一次；不得落盘或用于冷启动自动重登。
        shop_id 即使由兼容客户端附带，也不构成授权，最终门店完全取决于配对码所属收银服务。
      properties:
        pairing_code: { type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$', writeOnly: true }
        shop_id: { type: integer, description: 兼容客户端可附带；Cashier LAN 忽略该值并以 pairing_code 所属门店为准 }
        shopId: { type: integer, description: 同 shop_id；不构成授权 }
        device_code: { type: string, minLength: 1, maxLength: 64 }
        device_name: { type: string, maxLength: 100 }
        screen_tag: { type: string, enum: [workflow_board] }
        workflows:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/KdsWorkflow' }
        screenTags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/KdsGrillScreenTag' }
          description: D026：统一看板设备可见烤制岗（烤制三岗子集）；空/全非法 → 默认三岗全选。
        screen_tags: { $ref: '#/components/schemas/KdsGrillScreenTagList' }

    KdsCloudDeviceResponse:
      type: object
      required: [code, device]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, nullable: true }
        device: { $ref: '#/components/schemas/KdsDevice' }
        protocol_version: { type: integer, example: 2, description: 协议版本号（固定为2） }

    KdsLanDeviceResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, example: ok }
        data: { $ref: '#/components/schemas/KdsDevice' }

    KdsHeartbeatResponse:
      type: object
      required: [code]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, nullable: true }
        data:
          type: object
          properties:
            server_time_ms: { type: integer, format: int64 }
            config_version: { type: integer, format: int64, nullable: true }

    KdsLanHealthResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, example: ok }
        data:
          type: object
          required: [service, shop_id, server_time_ms, schema_version, catalog_version]
          properties:
            service: { type: string, enum: [cashier-lan-kds] }
            shop_id: { type: integer }
            server_time_ms: { type: integer, format: int64 }
            schema_version: { type: integer }
            catalog_version: { type: integer, format: int64 }

    KdsV2CommandType:
      type: string
      enum: [advance_item, advance_order, revoke_item, lack_item, refund_item, rush_item, rush_order, hold_item, release_item, complete_order, archive_order, archive_clear]

    KdsV2CommandRequest:
      type: object
      required: [command_id, type, target]
      properties:
        command_id: { type: string, minLength: 1, maxLength: 128 }
        type: { $ref: '#/components/schemas/KdsV2CommandType' }
        target:
          type: object
          properties:
            order_id: { type: integer, format: int64, minimum: 1 }
            detail_id: { type: integer, format: int64, minimum: 1 }
            detail_ids: { type: array, uniqueItems: true, items: { type: integer, format: int64, minimum: 1 } }
            from_queue:
              type: string
              enum: [pending_prep, pending_cook, ready_serve, done]
              description: 当前队列；revoke_item 支持 done 回撤到 ready_serve，因此 5 秒快捷撤回结束后仍可手动回撤已完成菜品。
        quantity: { type: integer, minimum: 1 }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        payload:
          type: object
          properties:
            remark: { type: string, maxLength: 500 }
            set_sold_out: { type: boolean }

    KdsV2LinePatch:
      type: object
      description: |
        LAN v2 bootstrap、changes、WebSocket event envelope 与 command response 共用的完整行快照。
        `detail_id` / `order_id` 是 LAN 主键；`local_*` 仅允许出现在 cloud `kds_state_changed` 别名层。
        三个 remaining 均为累计未完成量。令 `visible=max(0,line_quantity-refunded_quantity)`：
        待配菜=`prep_remaining`，待制作=`max(0,cook_remaining-prep_remaining)`，
        待传菜=`max(0,ready_remaining-cook_remaining)`，已完成=`max(0,visible-ready_remaining)`。
      required:
        [detail_id, order_id, dish_id, dish_name, line_quantity, refunded_quantity,
         prep_remaining, cook_remaining, ready_remaining, local_revision, order_revision,
         fulfillment_bucket, table_number, order_no, specification, unit, remark,
         created_at_ms, held, rushed, lacked, removed]
      properties:
        detail_id: { type: integer, format: int64, minimum: 1 }
        order_id: { type: integer, format: int64, minimum: 1 }
        dish_id: { type: integer, minimum: 1 }
        dish_name: { type: string, minLength: 1 }
        line_quantity: { type: integer, minimum: 1 }
        refunded_quantity: { type: integer, minimum: 0 }
        local_revision: { type: integer, format: int64, minimum: 1 }
        order_revision: { type: integer, format: int64, minimum: 1 }
        workflow_queue: { type: string }
        prep_remaining: { type: integer, minimum: 0 }
        cook_remaining: { type: integer, minimum: 0 }
        ready_remaining: { type: integer, minimum: 0 }
        fulfillment_bucket:
          type: string
          enum: [dine_in, takeout, pickup, pack, delivery]
          description: canonical 输出值；历史输入别名 takeaway/self_pickup 必须在服务边界归一为 takeout/pickup，不得作为 LAN v2 输出。
        table_number: { type: string, nullable: true }
        order_no: { type: string, minLength: 1 }
        specification: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        created_at_ms: { type: integer, format: int64, minimum: 1 }
        held: { type: boolean }
        rushed: { type: boolean }
        lacked: { type: boolean }
        removed: { type: boolean }

    KdsV2OrderSummary:
      type: object
      required: [order_id, order_revision]
      properties:
        order_id: { type: integer, format: int64, minimum: 1 }
        order_revision: { type: integer, format: int64, minimum: 1 }
        status: { type: string }
        table_number: { type: string, nullable: true }
      additionalProperties: true

    KdsV2QueueCounts:
      type: object
      additionalProperties: { type: integer, minimum: 0 }

    KdsV2BootstrapCatalogItem:
      type: object
      description: |
        收银权威配置给出的固定菜品顺序。canonical 字段为 dish_name/sequence；
        name/sorting/id 仅为旧 Cashier LAN 输出别名，服务边界应归一后再交给 KDS reducer。
      required: [dish_id, unit]
      allOf:
        - anyOf:
            - required: [dish_name]
            - required: [name]
        - anyOf:
            - required: [sequence]
            - required: [sorting]
      properties:
        dish_id: { type: integer, minimum: 1 }
        dish_name: { type: string, minLength: 1 }
        unit: { type: string }
        sequence: { type: integer, minimum: 0 }
        id: { type: integer, minimum: 1, deprecated: true }
        name: { type: string, minLength: 1, deprecated: true }
        sorting: { type: integer, minimum: 0, deprecated: true }
        stock: { type: integer, nullable: true }
        onsale: { type: boolean }
        sold_out: { type: boolean }

    KdsV2BootstrapPermissions:
      type: object
      required: [visible_queues, allowed_commands]
      properties:
        visible_queues:
          type: array
          uniqueItems: true
          items: { type: string, enum: [pending_prep, pending_cook, ready_serve, done] }
        allowed_commands:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [advance_item, advance_order, revoke_item, lack_item, refund_item, rush_item, rush_order, hold_item, release_item, complete_order, archive_order, archive_clear]

    KdsV2BootstrapDevice:
      type: object
      description: 当前 token 对应的设备身份；workflows 是设备绑定权限，permissions 是本次快照计算后的有效权限。
      required: [shop_id, device_code, screen_tag, workflows, enabled, permissions]
      properties:
        shop_id: { type: integer, minimum: 1 }
        device_code: { type: string, minLength: 1, maxLength: 64 }
        device_name: { type: string, maxLength: 100 }
        screen_tag: { type: string, enum: [workflow_board] }
        workflows:
          type: array
          uniqueItems: true
          items: { type: string, enum: [prep, cook, serve] }
        enabled: { type: boolean }
        paired_at_ms: { type: integer, format: int64, minimum: 1 }
        last_heartbeat_at_ms: { type: integer, format: int64, minimum: 1 }
        permissions: { $ref: '#/components/schemas/KdsV2BootstrapPermissions' }

    KdsV2BootstrapConfig:
      allOf:
        - $ref: '#/components/schemas/KdsV2BootstrapPermissions'
        - type: object
          description: 影响 reducer/展示的权威配置；未知的 additive 配置键必须被客户端忽略。
          properties:
            sla_minutes: { type: integer, minimum: 1 }
            archive_hours: { type: integer, minimum: 1 }
            fixed_order: { type: array, items: { type: integer, minimum: 1 } }
          additionalProperties: true

    KdsV2BootstrapData:
      type: object
      required: [protocol_version, event_seq, shop_id, device, permissions, queues, queue_counts, fixed_catalog, config, stats, config_version]
      properties:
        protocol_version: { type: integer, enum: [2] }
        event_seq:
          type: integer
          format: int64
          minimum: 0
          description: 快照事务读取到的当前权威序号；changes.after_seq 必须从该值开始。
        shop_id: { type: integer, minimum: 1 }
        device: { $ref: '#/components/schemas/KdsV2BootstrapDevice' }
        permissions: { $ref: '#/components/schemas/KdsV2BootstrapPermissions' }
        queues:
          type: object
          required: [pending_prep, pending_cook, ready_serve, done]
          properties:
            pending_prep: { type: array, items: { $ref: '#/components/schemas/KdsV2LinePatch' } }
            pending_cook: { type: array, items: { $ref: '#/components/schemas/KdsV2LinePatch' } }
            ready_serve: { type: array, items: { $ref: '#/components/schemas/KdsV2LinePatch' } }
            done: { type: array, items: { $ref: '#/components/schemas/KdsV2LinePatch' } }
          additionalProperties: false
        queue_counts: { $ref: '#/components/schemas/KdsV2QueueCounts' }
        fixed_catalog:
          type: array
          items: { $ref: '#/components/schemas/KdsV2BootstrapCatalogItem' }
        config: { $ref: '#/components/schemas/KdsV2BootstrapConfig' }
        stats:
          type: object
          description: 当前营业日 KDS 统计快照；指标仅 additive 演进。
          additionalProperties: true
        config_version: { type: integer, format: int64, minimum: 0 }

    KdsV2BootstrapResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/KdsV2BootstrapData' }

    KdsV2EventEnvelope:
      type: object
      required: [protocol_version, event_seq, event_id, type, shop_id, occurred_at_ms, patches, queue_counts, config_version]
      properties:
        protocol_version: { type: integer, enum: [2] }
        event_seq: { type: integer, format: int64, minimum: 1 }
        event_id: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string }
        shop_id: { type: integer, minimum: 1 }
        occurred_at_ms: { type: integer, format: int64, minimum: 1 }
        patches: { type: array, items: { $ref: '#/components/schemas/KdsV2LinePatch' } }
        queue_counts: { $ref: '#/components/schemas/KdsV2QueueCounts' }
        config_version: { type: integer, format: int64, minimum: 1 }
        order_summary: { $ref: '#/components/schemas/KdsV2OrderSummary' }

    KdsV2EventEnvelopeResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data: { $ref: '#/components/schemas/KdsV2EventEnvelope' }

    KdsV2CommandResponseData:
      type: object
      required: [command_id, duplicate, event_seq, patches, queue_counts]
      properties:
        command_id: { type: string }
        duplicate: { type: boolean }
        event_seq: { type: integer, format: int64, minimum: 1 }
        patches: { type: array, items: { $ref: '#/components/schemas/KdsV2LinePatch' } }
        queue_counts: { $ref: '#/components/schemas/KdsV2QueueCounts' }
        order_summary: { $ref: '#/components/schemas/KdsV2OrderSummary' }

    KdsV2CommandResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data: { $ref: '#/components/schemas/KdsV2CommandResponseData' }

    KdsV2ChangesResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [0] }
        data:
          type: object
          required: [protocol_version, event_seq, snapshot_required, events]
          properties:
            protocol_version: { type: integer, enum: [2] }
            event_seq:
              type: integer
              format: int64
              minimum: 0
              description: 本次响应对应的当前权威序号；成功合并 events 后作为下一次 after_seq。
            latest_event_seq:
              type: integer
              format: int64
              minimum: 0
              deprecated: true
              description: Cashier LAN 过渡 alias；服务端迁移期可与 event_seq 双写，客户端不得优先于 canonical event_seq。
            snapshot_required: { type: boolean }
            events:
              type: array
              items: { $ref: '#/components/schemas/KdsV2EventEnvelope' }

    KdsOrderCardItem:
      type: object
      description: 厨显订单卡片内一条明细（对应一张工单）
      properties:
        ticket_id: { type: integer, format: int64, description: t_kds_ticket.id }
        detail_id: { type: integer, description: t_order_detail.id，划菜时传此 id }
        item_status: { $ref: '#/components/schemas/KdsItemStatus' }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        name: { type: string, description: 菜名 }
        quantity: { type: number }
        unit: { type: string }
        remark: { type: string }
        selectedSpicy: { type: string }
        wait_seconds: { type: integer, description: 等待秒数（从工单创建起） }
        serving_duration_minutes: { type: integer, minimum: 1, description: 实际用于本明细 KDS 超时判断的分钟数 }
        overdue_flag: { type: boolean, description: 待做且超过菜品 serving_duration_minutes 则为 true；无法关联菜品时回退门店 sla_minutes }

    KdsOrderCard:
      type: object
      description: GET /kds/order/list 返回的 orders[] 元素
      properties:
        order_id: { type: integer }
        order_no: { type: string }
        table_number: { type: string, nullable: true }
        dineInOrTakeOut: { type: string }
        order_time: { type: string, format: date-time }
        remark: { type: string, nullable: true }
        orderNumber: { type: integer, nullable: true, description: 取餐号等 }
        rush_flag: { type: integer, enum: [0, 1], description: '1 表示本单有催菜' }
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsOrderCardItem' }

    KdsOverviewBoardResponse:
      type: object
      description: GET /kds/overview/board 与 GET /kds/expedition/board 业务字段（与 code 同级平铺于 R）
      properties:
        screen_tag: { type: string, enum: [boss_overview, expedition] }
        queue: { type: string, enum: [pending, cooking, ready_serve, done] }
        dining: { type: string, enum: [all, dine_in, takeout, pack] }
        view: { type: string, enum: [dish, order, table] }
        extra:
          type: array
          items: { type: string }
        summary:
          type: object
          properties:
            ticket_count: { type: integer }
            order_count: { type: integer }
            dish_quantity: { type: integer }
            rush_count: { type: integer }
            overdue_count: { type: integer }
        dish_groups:
          type: array
          items: { $ref: '#/components/schemas/KdsOverviewDishGroup' }
        order_cards:
          type: array
          items: { $ref: '#/components/schemas/KdsOverviewOrderCard' }

    KdsOverviewDishGroup:
      type: object
      properties:
        dish_name: { type: string }
        spec_norm: { type: string, description: 规格规范化键 }
        taste_norm: { type: string, description: 口味规范化键 }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        quantity: { type: integer, description: '待传菜队列下为 remaining_quantity 合计' }
        pending_quantity: { type: integer, description: 合并组内待制作(0)份数 }
        cooking_quantity: { type: integer, description: 合并组内制作中(1)份数 }
        served_quantity: { type: integer, description: 已传菜确认数量合计（ready_serve） }
        remaining_quantity: { type: integer, description: 待传剩余量合计（ready_serve） }
        serve_clickable: { type: integer, enum: [0, 1], description: '出餐屏待传菜是否可点卡传菜' }
        unit: { type: string, nullable: true }
        rush_flag: { type: integer, enum: [0, 1] }
        overdue_flag: { type: boolean }
        ticket_count: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/KdsOverviewLine' }

    KdsOverviewOrderCard:
      type: object
      properties:
        order_id: { type: integer }
        order_no: { type: string }
        table_number: { type: string, nullable: true }
        dineInOrTakeOut: { type: string }
        orderNumber: { type: integer, nullable: true }
        remark: { type: string, nullable: true }
        order_time: { type: string, nullable: true }
        rush_flag: { type: integer, enum: [0, 1] }
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsOverviewLine' }

    KdsOverviewLine:
      type: object
      properties:
        ticket_id: { type: integer, format: int64 }
        detail_id: { type: integer }
        dish_id: { type: integer, nullable: true, description: 't_dish.id，由 t_order_detail.dish_id 透出；固定顺序占位槽位依赖此字段，历史未回填数据可能为 null' }
        order_id: { type: integer }
        order_no: { type: string }
        table_number: { type: string, nullable: true }
        dineInOrTakeOut: { type: string, nullable: true }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        item_status: { $ref: '#/components/schemas/KdsItemStatus' }
        item_status_label: { type: string, description: '待制作/制作中/已完成/已退菜' }
        archived: { type: integer }
        skewer_picked: { type: integer, description: '0 未抓串 1 已抓串' }
        name: { type: string }
        quantity: { type: integer, description: '当前队列展示量（待配/待制/待传剩余）' }
        line_quantity: { type: integer, description: 明细行总份数 }
        prep_quantity: { type: integer, description: 已配菜数量 }
        cooked_quantity: { type: integer, description: 已制作完成数量 }
        served_quantity: { type: integer, description: 已传菜确认数量 }
        prep_remaining: { type: integer, description: 待配菜剩余量 }
        cook_remaining: { type: integer, description: 待制作剩余量 }
        remaining_quantity: { type: integer, description: 待传剩余量 }
        done_at:
          type: integer
          format: int64
          nullable: true
          description: 烤制/制作完成时刻毫秒时间戳（workflow 制作完成时刻，分批传菜排序依据）
        cooked_at:
          type: integer
          format: int64
          nullable: true
          description: workflow 制作全部完成时刻毫秒时间戳，与 done_at 同源
        prep_completed_at:
          type: integer
          format: int64
          nullable: true
          description: 配菜 Tab 全部划完时刻毫秒时间戳
        served_at:
          type: integer
          format: int64
          nullable: true
          description: 传菜 Tab 全部划完时刻毫秒时间戳
        archived_at:
          type: integer
          format: int64
          nullable: true
          description: 进入 queue=done 归档 Tab 时刻毫秒时间戳
        queue_completed_at:
          type: integer
          format: int64
          nullable: true
          description: 当前 Tab 队列划完时刻毫秒时间戳
        completed_wait_seconds:
          type: integer
          description: 完成时冻结等待秒数（完成时刻 − fifo_seq/created_at）；done_line=1 或 queue=done 时 wait_seconds 与之相同且不再递增
        unit: { type: string, nullable: true }
        wait_seconds: { type: integer, description: 未完成行随时间递增；已完成行等于 completed_wait_seconds }
        serving_duration_minutes: { type: integer, minimum: 1, description: 实际用于本明细 KDS 超时判断的分钟数 }
        overdue_flag: { type: boolean }
        rush_flag: { type: integer, enum: [0, 1], description: '本明细是否催菜（按 detail_id 落库，同单其它菜不受影响）' }
        add_dish_flag: { type: integer, enum: [0, 1], description: '本明细是否为订单加菜新增行（addDishes 落库明细；非整单下单轮次）' }
        hold_flag: { type: integer, enum: [0, 1], description: '本明细是否等叫未送厨' }
        workflow_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        spec_norm: { type: string, description: 规格规范化键（份量/大小等，不含口味） }
        taste_norm: { type: string, description: 口味规范化键（辣度/甜度/温度等） }
        fifo_seq: { type: integer, format: int64, description: 入当前队列时刻（毫秒） }
        order_time: { type: integer, format: int64, nullable: true, description: 订单首单下单时刻毫秒时间戳 }
        add_dish_time: { type: integer, format: int64, nullable: true, description: 加菜明细进入 KDS 的时刻；add_dish_flag=1 时返回，用于加菜独立超时计算 }
        merge_group_key: { type: string, description: 所属展示分组键 }
        order_round: { type: integer, description: '下单轮次，首单为 1，加菜递增；用于订单维度 #1/#2 分组' }
        combo_flag: { type: integer, enum: [0, 1], description: '套餐相关行' }
        pack_flag: { type: integer, enum: [0, 1], description: '打包订单' }
        takeout_flag: { type: integer, enum: [0, 1], description: '外卖订单' }
        dining_breakdown:
          type: object
          additionalProperties: { type: integer }
          description: 当前队列按就餐方式份数，key 为 dine_in/pack/takeout
          example: { dine_in: 10, pack: 5, takeout: 0 }
        dining_breakdown_text:
          type: string
          description: 就餐方式展示文案，如「堂10｜打包5」
          example: 堂10｜打包5
        flow_batches:
          type: array
          description: 流转批次明细（美团 FCFS 核销单元）
          items: { $ref: '#/components/schemas/KdsFlowBatchItem' }

    KdsFlowBatchItem:
      type: object
      properties:
        batch_id: { type: integer, format: int64 }
        quantity: { type: integer }
        queue_status: { type: string, enum: [pending_prep, pending_cook, ready_serve, done, void] }
        dining_channel: { type: string, enum: [dine_in, pack, takeout], nullable: true }
        order_time: { type: integer, format: int64, nullable: true, description: 批次下单时刻毫秒时间戳 }
        prep_at: { type: integer, format: int64, nullable: true, description: 批次进入待制作池时刻毫秒时间戳 }
        cooked_at: { type: integer, format: int64, nullable: true, description: 批次制作完成时刻毫秒时间戳 }
        served_at: { type: integer, format: int64, nullable: true, description: 批次传菜完成时刻毫秒时间戳 }

    KdsWorkflowBoardWsPayload:
      type: object
      description: |
        历史 `board_changed` 设计载荷。当前后端未发送该事件，工作流实际通过 `update_order` 通知；
        前端不能依赖 `line` 一定存在，应以 `workflow/board` 或 `order/item/list` 校准。
      properties:
        detail_id: { type: integer }
        order_id: { type: integer }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        to_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        workflow_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        line: { $ref: '#/components/schemas/KdsWorkflowLine' }
        prep_remaining: { type: integer }
        cook_remaining: { type: integer }
        serve_remaining: { type: integer }
        completed_wait_seconds: { type: integer, description: line 不可用时顶层回退字段 }
        queue_completed_at: { type: string, format: date-time, nullable: true }

    KdsWorkflowBoardResponse:
      type: object
      description: GET /kds/workflow/board 返回字段（与 code 同级平铺于 R）
      properties:
        screen_tag:
          type: string
          enum: [workflow_board]
          description: 统一工作流看板固定为 workflow_board；旧屏兼容调用时也建议返回 workflow_board。
        workflows:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflow' }
          description: 当前设备可操作流程；前端据此生成可见 Tab。
        visible_queues:
          type: array
          items: { $ref: '#/components/schemas/KdsBoardQueue' }
          description: 服务端建议展示的队列，通常由 workflows 推导并附加 done。
        queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        view: { $ref: '#/components/schemas/KdsBoardView' }
        dining: { $ref: '#/components/schemas/KdsDiningFilter' }
        sort: { $ref: '#/components/schemas/KdsWorkflowSort' }
        extra:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowExtraFilter' }
        keyword: { type: string, nullable: true }
        summary: { $ref: '#/components/schemas/KdsWorkflowSummary' }
        merge_rules:
          type: array
          items: { type: string, enum: [dish, dining, tags] }
          description: 当前生效的合并规则；空数组表示按明细 FIFO 不合并。
        split_pack_takeout:
          type: integer
          enum: [0, 1]
          description: 打包外卖单独拆行开关是否开启（1=开启）。
        cross_order_merge:
          type: boolean
          description: 当前是否跨订单合并（true=美团同屏汇总）。
        settings:
          type: object
          description: KDS 本机/门店设置快照，含 sla_minutes、cashier_write_back_enabled、serve_print_enabled、cross_order_merge、add_dish_timeout_independent、combo_independent、dine_pack_inline。
        sla_minutes:
          type: integer
          description: 超时分钟，来自 t_kds_shop_config.sla_minutes。
        cashier_write_back_enabled:
          type: boolean
          description: true 时划菜回写收银旧字段（sync_legacy_rece=1）。
        serve_print_enabled:
          type: boolean
          description: true 时 ready_serve 划单后打印传菜单。
        add_dish_timeout_independent:
          type: boolean
          description: true 时加菜超时按明细 add_dish_time/ticket.created_at 计算。
        combo_independent:
          type: boolean
          description: true 时套餐独立显示（combo_merge=0）。
        dine_pack_inline:
          type: boolean
          description: true 时堂食/打包/外卖可内嵌合并并返回 dining_breakdown_text。
        merge_same_dish:
          type: integer
          enum: [0, 1]
          description: 门店配置，见 KdsShopConfig.merge_same_dish
        pack_inline_merge:
          type: integer
          enum: [0, 1]
          description: 门店配置，见 KdsShopConfig.pack_inline_merge
        combo_merge:
          type: integer
          enum: [0, 1]
          description: 门店配置，见 KdsShopConfig.combo_merge
        skewer_gate:
          type: integer
          enum: [0, 1]
          description: 抓串闸门，见 KdsShopConfig.skewer_gate
        prep_enabled:
          type: integer
          enum: [0, 1]
          description: 是否启用待配菜环节；0 时新单直进待制作（**v1.2.157**）
        queue_counts:
          type: object
          additionalProperties: { type: integer }
          description: |
            各队列可见份数（与当前 `dining`/`extra`/`keyword` 筛选一致），供非当前 Tab 角标；键为 `pending_prep`/`pending_cook`/`ready_serve`/`done`。
          example: { pending_prep: 8, pending_cook: 24, ready_serve: 16, done: 77 }
        extra_counts:
          type: object
          additionalProperties: { type: integer }
          description: 标签筛选红点，key 为 overdue/rush/add_dish/hold。
          example: { overdue: 5, rush: 3, add_dish: 2, hold: 1 }
        dining_counts:
          type: object
          additionalProperties: { type: integer }
          description: 就餐方式红点，key 为 dine_in/pack/takeout。
          example: { dine_in: 18, pack: 3, takeout: 2 }
        dish_groups:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowDishGroup' }
        order_cards:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowOrderCard' }
          description: |
            `view=order` 时为整单卡列表；**`view=dish`** 时返回精简卡（`order_id`/`order_no`/`remark`/`table_number` 等），供备注展示，无需再请求 `view=order`。
        stats:
          type: object
          additionalProperties: true
          description: |
            可选合并的今日 KDS 统计（与 **`GET /kds/stats/today`** 的 `stats` 结构一致），减少单独 stats 请求（**v1.2.139**）。

    KdsWorkflowSummary:
      type: object
      properties:
        dish_quantity: { type: integer, description: 当前筛选结果菜品份数合计 }
        order_count: { type: integer, description: 当前筛选结果订单数 }
        ticket_count: { type: integer, description: 当前筛选结果工单/明细数 }
        rush_count: { type: integer }
        overdue_count: { type: integer }
        add_dish_count: { type: integer }
        hold_count: { type: integer }
        pending_prep_count: { type: integer }
        pending_cook_count: { type: integer }
        ready_serve_count: { type: integer }
        done_count: { type: integer }
        dine_in_count: { type: integer }
        pack_count: { type: integer }
        takeout_count: { type: integer }

    KdsWorkflowDishGroup:
      type: object
      description: 菜品维度卡片；同名菜按当前队列合并，lines 保留明细用于点击、展示桌号和标签。
      properties:
        dish_name: { type: string }
        spec_norm: { type: string, description: 规格规范化键（如份量/大小；合并 dish 时参与比对） }
        taste_norm: { type: string, description: 口味规范化键（如辣度/甜度；合并 dish 时参与比对） }
        merge_group_key: { type: string, description: 展示分组键（含 FIFO 批次） }
        fifo_seq: { type: integer, format: int64, description: 组内最早入当前队列时刻（毫秒），用于 FIFO 排序 }
        workflow_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        quantity: { type: integer, description: 当前队列展示数量；ready_serve 为 remaining_quantity 合计 }
        line_quantity: { type: integer, description: 原始明细总份数合计 }
        served_quantity: { type: integer, description: 已传数量合计 }
        remaining_quantity: { type: integer, description: 未传/待处理数量合计 }
        unit: { type: string, nullable: true }
        order_count: { type: integer }
        ticket_count: { type: integer }
        clickable: { type: integer, enum: [0, 1], description: 是否可点击推进；done 队列通常为 0 }
        rush_flag: { type: integer, enum: [0, 1], description: '本展示组（同菜合并批次）是否有催菜；仅反映组内菜品' }
        overdue_flag: { type: boolean, description: 本展示组是否有超时菜品 }
        add_dish_flag: { type: integer, enum: [0, 1], description: 本展示组是否含订单加菜新增明细 }
        hold_flag: { type: integer, enum: [0, 1], description: 本展示组是否有等叫明细 }
        combo_flag: { type: integer, enum: [0, 1] }
        pack_flag: { type: integer, enum: [0, 1] }
        takeout_flag: { type: integer, enum: [0, 1] }
        dining_breakdown:
          type: object
          additionalProperties: { type: integer }
          description: 组内当前队列按就餐方式份数合计
        dining_breakdown_text:
          type: string
          description: 组内就餐方式展示文案
        first_order_time:
          type: integer
          format: int64
          nullable: true
          description: 组内最早下单时刻毫秒时间戳
        max_wait_seconds: { type: integer }
        table_numbers:
          type: string
          description: 组内去重排序后的桌号，逗号分隔；前端可拼接为 18+23+34（**v1.2.155**）
        lines:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowLine' }

    KdsWorkflowOrderCard:
      type: object
      description: |
        订单维度卡片（**view=order**）；筛选决定订单是否出现，**items[] 须为该单全量明细**（含 done_line=1 已划行）。
        特殊标签请读 items[] 行级 rush_flag 等，不在订单卡上整单聚合。
      properties:
        order_id: { type: integer }
        order_no: { type: string }
        table_number: { type: string, nullable: true }
        dineInOrTakeOut: { type: string, nullable: true }
        orderNumber: { type: integer, nullable: true }
        order_time:
          type: integer
          format: int64
          nullable: true
          description: 下单时刻毫秒时间戳（GMT+8 墙钟对应 instant）
        remark: { type: string, nullable: true }
        total_quantity: { type: integer, description: 明细 line_quantity 之和 }
        remaining_quantity: { type: integer, description: 当前 Tab 待推进份数之和（行级 quantity 汇总） }
        served_quantity: { type: integer, description: 已传数量（行级 served_quantity 汇总） }
        pack_flag: { type: integer, enum: [0, 1] }
        takeout_flag: { type: integer, enum: [0, 1] }
        workflow_queues:
          type: array
          items: { $ref: '#/components/schemas/KdsBoardQueue' }
          description: 该订单当前命中的队列集合。
        rounds:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowOrderRound' }
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowLine' }

    KdsWorkflowOrderRound:
      type: object
      description: 订单内按下单轮次分组，用于显示 #1、#2。
      properties:
        order_round: { type: integer }
        label: { type: string, example: '#1' }
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowLine' }

    KdsWorkflowLine:
      allOf:
        - $ref: '#/components/schemas/KdsOverviewLine'
        - type: object
          properties:
            done_line:
              type: integer
              enum: [0, 1]
              description: |
                本 Tab 队列视角是否已全部划完（1=已划完，前端置底+删除线；行仍保留在 items[]）。
                pending_prep：`prep_remaining=0` 且 `prep_quantity=line_quantity`；
                pending_cook：`cook_remaining=0` 且 `cooked_quantity=line_quantity`；
                ready_serve：`remaining_quantity=0` 且 `served_quantity=line_quantity`。
            next_queue:
              $ref: '#/components/schemas/KdsBoardQueue'
              description: 点击推进成功后的目标队列；done_line=1 时可不返回。
            action_label:
              type: string
              description: 当前队列操作文案，如 配菜完成、制作完成、传菜。
            row_version:
              type: integer
              format: int64
              nullable: true
              description: 当前实现仅部分响应返回；值为工单 updated_at 毫秒代理版本。board 行可能为空，前端不得假定独立自增版本列存在。

    KdsWorkflowAdvanceRequest:
      type: object
      required: [detail_id, from_queue]
      properties:
        detail_id: { type: integer, description: t_order_detail.id }
        item_id: { type: integer, description: 兼容别名，同 detail_id }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        quantity:
          type: integer
          minimum: 1
          description: 本步推进份数；pending_prep/pending_cook/ready_serve 均有效，默认 1。
        detail_ids:
          type: array
          items: { type: integer }
          description: 合并菜品组 FIFO 推进时传多条 detail_id（按下单时间排序分配 quantity）。
        client_id:
          type: string
          description: 可选幂等 ID，离线队列重试时建议传。
        row_version:
          type: integer
          format: int64
          description: 可选；工单 updated_at 毫秒代理版本，冲突时响应体 code=5001。
        expected_order_id:
          type: integer
          description: 前端当前卡片所属订单 ID；不匹配时返回 code=5001。
        expected_table_number:
          type: string
          description: 前端当前卡片桌号；不匹配时返回 code=5001。
        expected_dish_name:
          type: string
          description: 前端当前卡片菜名；不匹配时返回 code=5001。
        rowVersion:
          type: integer
          description: 同 row_version
        version:
          type: integer
          description: 同 row_version

    KdsLanWorkflowAdvanceRequest:
      type: object
      required: [detail_id, from_queue, quantity]
      allOf:
        - anyOf:
            - required: [operation_id]
            - required: [client_id]
        - anyOf:
            - required: [expected_local_revision]
            - required: [row_version]
      description: |
        Cashier LAN 原子划菜请求。新实现推荐 `operation_id + expected_local_revision`；为兼容现有 KDS App，
        同时接受 `client_id` 作为 operation_id 别名、`row_version` 作为 expected_local_revision 别名。
        网络重试必须复用同一幂等 ID。由于兼容字段与 Cloud 请求重叠，路径 requestBody 使用 `anyOf`；
        运行时语义由当前连接的 endpoint authority（Cloud 或 Cashier LAN）决定，而不是由字段形状猜测。
      properties:
        operation_id: { type: string, minLength: 1, maxLength: 128, description: LAN 幂等键，建议 UUID }
        client_id: { type: string, minLength: 1, maxLength: 128, description: operation_id 兼容别名；现有 KDS App 使用 }
        detail_id: { type: integer, format: int64, minimum: 1, description: 收银 SQLite 本地明细 ID }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        quantity: { type: integer, minimum: 1 }
        expected_local_revision: { type: integer, format: int64, minimum: 0 }
        row_version: { type: integer, format: int64, minimum: 0, description: expected_local_revision 兼容别名；现有 KDS App 使用 }

    KdsLanWorkflowAdvanceResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, nullable: true }
        data:
          type: object
          required: [operation_id, duplicate, patch]
          properties:
            operation_id: { type: string }
            duplicate: { type: boolean }
            patch:
              allOf:
                - $ref: '#/components/schemas/KdsWorkflowAdvancePatch'
                - type: object
                  required: [detail_id, workflow_queue, prep_remaining, cook_remaining, ready_remaining, remaining_quantity, done_line, local_revision, row_version]
                  properties:
                    ready_remaining: { type: integer, minimum: 0 }
                    local_revision: { type: integer, format: int64, minimum: 1 }

    KdsLanConflictResponse:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer, enum: [4090] }
        msg: { type: string }
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: 可选最新 revision/队列提示；完整状态仍以 board/item 快照为准。

    KdsWorkflowAdvancePatch:
      type: object
      description: 快速划菜 HTTP 局部更新载荷；WS 仅作变更通知，完整状态以 board/item 快照校准
      properties:
        ticket_id: { type: integer }
        detail_id: { type: integer }
        order_id: { type: integer }
        row_version: { type: integer, format: int64, nullable: true, description: updated_at 毫秒代理版本 }
        prep_quantity: { type: integer }
        cooked_quantity: { type: integer }
        served_quantity: { type: integer }
        prep_remaining: { type: integer }
        cook_remaining: { type: integer }
        serve_remaining: { type: integer }
        remaining_quantity: { type: integer, description: 目标队列 Tab 剩余量（与 board 行一致） }
        workflow_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        archived: { type: integer }
        item_status: { type: integer }
        done_line: { type: integer, enum: [0, 1], description: 目标 workflow_queue 视角是否已全部划完（**v1.2.153** 跨队列 handoff 按目标队列计算，如配菜→制作时 done_line=0 且 cook_remaining>0） }
        quantity: { type: integer, description: 目标 workflow_queue Tab 展示数量（与 board 行 quantity 一致） }
        queue_completed_at: { type: string, format: date-time }
        completed_wait_seconds: { type: integer }
        line_quantity: { type: integer }

    KdsWorkflowAdvanceFastResponse:
      type: object
      description: 快速划菜 HTTP 响应（**v1.2.145**）
      properties:
        detail_id: { type: integer }
        order_id: { type: integer }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        to_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        requested_quantity: { type: integer }
        advanced_quantity: { type: integer }
        remaining_quantity: { type: integer }
        workflow_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        ticket_id: { type: integer }
        row_version: { type: integer }
        fast: { type: integer, enum: [1], description: 固定 1，表示快速路径 }
        patch: { $ref: '#/components/schemas/KdsWorkflowAdvancePatch' }

    KdsWorkflowAdvanceFifoResponse:
      type: object
      description: 合并组 FIFO 批量推进响应（仍同步返回各 item）
      properties:
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        to_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        requested_quantity: { type: integer }
        advanced_quantity: { type: integer }
        updated: { type: integer, description: 成功推进的明细数 }
        skipped: { type: integer, description: 跳过的明细数 }
        skipped_details:
          type: array
          items:
            type: object
            properties:
              detail_id: { type: integer }
              reason: { type: string }
        remaining_request: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowAdvanceResponse' }

    KdsWorkflowLackRequest:
      type: object
      required: [detail_id, from_queue]
      properties:
        detail_id: { type: integer }
        from_queue: { type: string, enum: [pending_prep, pending_cook] }
        quantity: { type: integer, minimum: 1, description: 缺货份数，默认整行 }
        remark: { type: string }

    KdsWorkflowRefundRequest:
      type: object
      required: [detail_id, from_queue]
      properties:
        detail_id: { type: integer }
        from_queue: { type: string, enum: [pending_prep, pending_cook] }
        quantity: { type: integer, minimum: 1, description: 退菜份数，默认整行 }
        remark: { type: string }

    KdsWorkflowRevokeRequest:
      type: object
      required: [detail_id, from_queue]
      properties:
        detail_id: { type: integer }
        from_queue: { type: string, enum: [pending_cook, ready_serve] }
        quantity: { type: integer, minimum: 1, description: 撤销份数，默认 1 }

    KdsWorkflowHoldRequest:
      type: object
      required: [detail_id]
      properties:
        detail_id: { type: integer }

    KdsWorkflowAdvanceOrderRequest:
      type: object
      required: [order_id, from_queue]
      properties:
        order_id: { type: integer, description: t_order.id }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        client_id:
          type: string
          description: 可选幂等 ID，离线队列重试时建议传。

    KdsWorkflowAdvanceResponse:
      type: object
      properties:
        detail_id: { type: integer }
        order_id: { type: integer }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        to_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        requested_quantity: { type: integer }
        advanced_quantity: { type: integer }
        remaining_quantity: { type: integer }
        workflow_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        ticket:
          type: object
          additionalProperties: true
          description: 更新后的 t_kds_ticket 快照；字段以实现返回为准。
        line: { $ref: '#/components/schemas/KdsWorkflowLine' }

    KdsWorkflowAdvanceOrderResponse:
      type: object
      properties:
        order_id: { type: integer }
        from_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        to_queue: { $ref: '#/components/schemas/KdsBoardQueue' }
        updated: { type: integer, description: 成功推进明细/工单数 }
        advanced_quantity: { type: integer, description: 成功推进份数 }
        skipped: { type: integer, description: 跳过明细数（已完成、已退菜、队列不匹配等） }
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsWorkflowLine' }

    KdsExpeditionServeRequest:
      type: object
      required: [dish_name, quantity]
      properties:
