      responses:
        '200':
          description: OK
  /mcp/v1/tables:
    get:
      tags:
        - MCP服务
      summary: MCP获取门店桌台列表及实时占用状态
      description: 获取试点门店（shop_id=3）全部桌台数据，支持按空闲/就餐中/待清台状态与区域过滤，返回可下桌空闲桌号列表
      parameters:
        - name: shop_id
          in: query
          required: false
          schema: { type: integer, example: 3 }
          description: 门店ID（固定为3）
        - name: status
          in: query
          required: false
          schema: { type: integer, example: 0 }
          description: 状态过滤：0 空闲可入座(可下桌), 1 就餐中, 2 待清台
        - name: area_code
          in: query
          required: false
          schema: { type: string, example: hall }
          description: 区域编码过滤：hall(大厅散座), box(特色包厢), patio(露天外摆)
      responses:
        '200':
          description: 成功返回桌台列表与统计信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: SUCCESS }
                      shop_id: { type: integer, example: 3 }
                      total_tables: { type: integer, example: 12 }
                      idle_count: { type: integer, example: 8 }
                      dining_count: { type: integer, example: 3 }
                      pending_clear_count: { type: integer, example: 1 }
                      available_tables:
                        type: array
                        items: { type: string }
                        example: ["01", "02", "03"]
                      tables:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            table_number: { type: string, example: "01" }
                            area_code: { type: string, example: "hall" }
                            area_name: { type: string, example: "大厅散座" }
                            status: { type: integer, example: 0 }
                            status_desc: { type: string, example: "空闲可入座" }
                            is_available: { type: boolean, example: true }
                            order_no: { type: string }
                            amount: { type: number, example: 0.0 }
