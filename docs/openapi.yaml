    # ---------- 门店公告 ----------
    Announcement:
      type: object
      description: 门店公告，对应 t_announcement
      properties:
        id: { type: integer, format: int64 }
        shop_id:
          type: integer
          nullable: true
          description: 为空表示全部门店可见；非空为仅该门店
        title: { type: string }
        content: { type: string, description: 正文，纯文本或 HTML 由前端约定 }
        status: { type: integer, enum: [0, 1], description: '1 启用 0 停用' }
        sort_order: { type: integer }
        start_time: { type: string, format: date-time, nullable: true }
        end_time: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnnouncementInput:
      type: object
      description: |
        新建公告请求体（B 端）。**推荐使用 camelCase**（`sortOrder`、`shopId`、`startTime`、`endTime`）；亦兼容 **snake_case**（`sort_order`、`shop_id`、`start_time`、`end_time`）。
        时间字段为**字符串**（非 JSON date 对象），例如 `yyyy-MM-dd HH:mm:ss`、`yyyy-MM-dd` 或 ISO-8601（含 `Z`）；不传或空表示不限制该端。
        门店上下文下 **`shopId` 以服务端当前店为准**；总部无门店上下文时可传 **`shopId`**，`null` 表示全部门店公告。
      required: [title, content]
      properties:
        id: { type: integer, format: int64, description: 仅 POST /admin/announcement/update 必填 }
        title: { type: string }
        content: { type: string }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, description: 兼容 sort_order }
        sort_order: { type: integer }
        startTime: { type: string, description: 兼容 start_time }
        start_time: { type: string }
        endTime: { type: string, description: 兼容 end_time }
        end_time: { type: string }
        shopId: { type: integer, nullable: true, description: 兼容 shop_id }
        shop_id:
          type: integer
          nullable: true

    # ---------- 帮助与客服（可选）----------
    HelpItem:
      type: object
      properties:
        id: { type: integer }
        category: { type: string }
        title: { type: string }
