        target_screens:
          type: array
          items: { $ref: '#/components/schemas/KdsScreenTag' }
          description: 抓齐后将分流到的烤制屏

    KdsStatsToday:
      type: object
      properties:
        shop_id: { type: integer }
        order_count: { type: integer, description: 今日有工单的订单数（去重 order_id） }
        ticket_count: { type: integer, description: 今日工单总数 }
        pending_count: { type: integer }
        cooking_count: { type: integer }
        done_count: { type: integer }
        void_count: { type: integer }
        completed_timing_count:
          type: integer
          description: 今日工单中 completed_wait_seconds 有效样本数
        avg_completed_wait_seconds:
          type: integer
          nullable: true
          description: 今日 completed_wait_seconds 平均值（秒）；无样本时为 null
        max_completed_wait_seconds:
          type: integer
          nullable: true
          description: 今日 completed_wait_seconds 最大值（秒）；无样本时为 null

    KdsArchivedHistoryItem:
      type: object
      description: 归档工单完成时刻追溯行（GET /kds/workflow/archived-history）
      properties:
        ticket_id: { type: integer, format: int64 }
        detail_id: { type: integer }
        order_id: { type: integer }
        order_no: { type: string }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        name: { type: string, nullable: true }
        line_quantity: { type: integer, nullable: true }
        archived: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
        prep_completed_at: { type: string, format: date-time, nullable: true }
        done_at: { type: string, format: date-time, nullable: true }
        cooked_at: { type: string, format: date-time, nullable: true }
        served_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        completed_wait_seconds: { type: integer, nullable: true }

    KdsArchivedHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsArchivedHistoryItem' }
        count: { type: integer }
        limit: { type: integer }
        next_before:
          type: string
          format: date-time
          nullable: true
          description: 下一页游标，作为 before 参数传入（取本页最后一条 archived_at）

    KdsWsEnvelope:
      type: object
      description: WebSocket /ws/kds 下行 JSON 信封（文本帧）
      properties:
        type:
          type: string
          enum: [new_order, update_order, cancel_item, cancel_order, order_status_changed, dish_flags_changed, config_changed, pong]
        shop_id: { type: integer }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        payload:
          type: object
          additionalProperties: true
          description: |
            业务载荷。`new_order` 含 order_id、order_no、table_number、**remark**（整单备注）、kds_order_status、**items[]**（含 detail_id、name、quantity、unit、**remark** 菜品备注、selectedSpicy）。
            `update_order`/`cancel_item` 可含 **remark**（整单）与 **detail_remark**（单条菜品）；`cancel_item` 退菜时另含 **items[]**。
            当前工作流推进通过 **`update_order`** 通知，不发送 `board_changed`，且载荷不保证包含完整 `line`。
            建议统一读 **`payload.operation`**（见 KDS 文档 **operation** 表）；退菜/缺货可含 **`removed=1`**、**`item_status=3`**、**`void_reason`**；`config_changed` 到达后重拉设置或 bootstrap。

    KdsWsOperation:
      type: string
      description: WS payload.operation 高频业务动作（**v1.2.146**）
      enum:
        - new_order
        - add_dish
        - advance
        - item_status
        - revoke
        - serve
        - rush
        - overdue
        - hold
        - release
        - refund
        - lack
        - cancel_item
        - cancel_order

    KdsItemStatusRequest:
      type: object
      required: [detail_id, status]
      properties:
        detail_id: { type: integer, description: 订单明细 id（别名 item_id） }
        item_id: { type: integer, description: 同 detail_id }
        status: { $ref: '#/components/schemas/KdsItemStatus' }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag', description: 建议传当前屏，与设备绑定一致 }

    KdsSyncAllItem:
      type: object
      required: [client_id, detail_id, status]
      properties:
        client_id: { type: string, description: 客户端生成的幂等键，重复提交跳过 }
        detail_id: { type: integer }
        status: { $ref: '#/components/schemas/KdsItemStatus' }

    KdsSyncChange:
      type: object
      description: GET /kds/sync/changes 当前实现返回的工单变更摘要；不是完整工作流行。
      properties:
        ticket_id: { type: integer, format: int64 }
        detail_id: { type: integer }
        dish_id: { type: integer, nullable: true }
        order_id: { type: integer, nullable: true }
        item_status: { $ref: '#/components/schemas/KdsItemStatus' }
        screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
        updated_at:
          type: string
          format: date-time
          description: 工单更新时间；前端使用 Date.parse 转为下一次 since 毫秒游标。
        rush_flag: { type: integer, enum: [0, 1] }
        add_dish_flag: { type: integer, enum: [0, 1] }
        overdue_flag: { type: integer, enum: [0, 1] }
        rush_at: { type: string, format: date-time, nullable: true }
        overdue_at: { type: string, format: date-time, nullable: true }

    KdsSyncAllRequest:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KdsSyncAllItem' }

    KdsSyncAllResponse:
      type: object
      properties:
        applied: { type: integer, description: 成功应用条数 }
        skipped: { type: integer, description: 幂等跳过条数 }

  /admin/order/commands:
    post:
      summary: POS 端 KDS 统一命令入口
      description: 接收 POS 端发出的 addDishes 和 refundDish 等统一命令并路由至 KDS 事务中。
      tags:
        - 运营后台-订单管理
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 命令类型，如 addDishes, refundDish
                command_id:
                  type: string
                  description: 前端生成的命令UUID
              additionalProperties: true
      responses:
        "200":
          description: 命令执行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          description: 业务参数错误


  /admin/notifications/channel-stats:
    get:
      summary: 查询门店统一实时消息通道在线连接与告警统计 (Phase 3)
      parameters:
        - name: shop_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /admin/notifications/test-push:
    post:
      summary: 触发实时通道联调测试推送 (Phase 3)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK

  /admin/notifications/cleanup:
    post:
      summary: 触发过期与已读历史通知归档清理 (Phase 3)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK

  /feishu/callback:
    post:
      tags: [飞书集成]
      summary: 飞书事件订阅回调与 URL 首次验证
      description: 接收飞书开放平台事件推送（如 im.message.receive_v1）及首次 URL 配置验证，支持明文及 AES-256-CBC 加密模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 处理成功，URL验证返回 challenge，事件推送返回 code:0
        "400":
          description: 请求体为空
        "403":
          description: Token校验未通过

  /bbq/inbox:
    get:
      tags: [烧烤AI工作流收件箱]
      summary: 本地主控轮询拉取待处理素材列表
      description: 供本地主控拉取收件箱中已下载就绪的素材列表及元数据
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
          description: 目标平台过滤（可选）
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: 访问凭证（可选，也支持 Header: X-Inbox-Token）
        - name: X-Inbox-Token
          in: header
          required: false
          schema:
            type: string
          description: 访问凭证请求头
      responses:
        "200":
          description: 成功返回待处理素材列表（code:0, data.items）
        "401":
          description: 未授权访问，Token校验失败

  /bbq/inbox/ack:
    post:
      tags: [烧烤AI工作流收件箱]
      summary: 本地主控确认已取走素材并归档
      description: 本地主控完成素材拉取落地后向服务端确认，服务端将子目录原子移动至归档目录以防重复拉取
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: 访问凭证
        - name: X-Inbox-Token
          in: header
          required: false
          schema:
            type: string
          description: 访问凭证请求头
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inbox_id]
              properties:
                inbox_id:
                  type: string
                  description: 收件箱子目录唯一标识
                status:
                  type: string
                  description: 确认状态（如 ok）
      responses:
        "200":
          description: 归档成功（code:0）
        "400":
          description: 参数缺失或非法
        "401":
          description: 未授权访问

  /bbq/inbox/{inboxId}/{filePath}:
    get:
      tags: [烧烤AI工作流收件箱]
      summary: 静态素材与元信息文件流式下载
      description: 供本地主控直接下载收件箱内的 meta.json 及 media/ 素材文件
      parameters:
        - name: inboxId
          in: path
          required: true
          schema:
            type: string
          description: 收件箱子目录唯一标识
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: 相对文件路径（如 meta.json、media/1.jpg）
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: X-Inbox-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 成功返回文件二进制流
        "401":
          description: 未授权访问
        "404":
          description: 文件不存在或非法路径
