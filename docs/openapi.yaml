    # ---------- 订单（与 t_order / t_order_detail 对齐，见 db_diancan.sql）----------
    # 结算规则：sett_amount = 商品原价+打包费（不含服务费）；service_fee = 整单金额(sett_amount)*5%，由后端按规则计算；订单原价 = sett_amount + service_fee；实付金额（净额）= sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift。所有金额字段均保留两位小数。
    Order:
      type: object
      description: 订单主表实体，对应 t_order。sett_amount 仅存商品原价+打包费；服务费 = 整单(sett_amount)*5%；订单原价 = sett_amount + service_fee；实付金额（净额） = sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift。成功结账时 pay_amount_* 五列按支付渠道拆分实付净额（单渠道仅对应列为正，其余为 0）。金额均保留两位小数。外卖配送扩展（t_takeout_delivery）通过 takeout_delivery_id、delivery_fee、takeout_dispatch_status 一并序列化在 Order 上（非 t_order 表列）。
      properties:
        id: { type: integer }
        order_no: { type: string }
        master_order_no: { type: string, nullable: true, description: '并台主单号：若该单作为从单被并入主单所属桌台，则记录主单号；非从单为 NULL' }
        table_number: { type: string }
        number_of_diners: { type: integer, description: 't_order 为 int' }
        sett_amount: { type: number, description: '商品原价+打包费（不含服务费），保留两位小数' }
        discount_amount: { type: number, description: '优惠金额，保留两位小数；实付金额（净额）= sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift' }
        service_fee: { type: number, description: '服务费，按整单(sett_amount)的 5% 由后端计算，保留两位小数；下单、加菜、删除菜品后均会重算' }
        transac_status:
          type: string
          enum: [success, unsettled, cancelled]
          description: '结账状态，与 t_order 表 enum 一致'
        order_receiving:
          type: string
          enum: [mis_order, rec_order, off_order, cancelled]
          description: '接单状态，与 t_order 表 enum 一致'
        order_time: { type: string, description: 'datetime' }
        dineInOrTakeOut: { type: string }
        orderNumber: { type: integer }
        remark: { type: string }
        openid: { type: string }
        prepay_id: { type: string }
        transaction_id: { type: string }
        pay_time: { type: string }
        payment_method: { type: string }
        pay_amount_wechat: { type: number, description: '微信支付金额(元)，与 t_order 列一致' }
        pay_amount_alipay: { type: number, description: '支付宝支付金额(元)' }
        pay_amount_balance: { type: number, description: '余额/本金渠道实付(元)；钱包支付时为本金账户扣款部分' }
        balance_pay_principal: { type: number, description: '余额支付从用户本金扣(元)；与 pay_amount_balance 一致' }
        balance_pay_gift_wallet: { type: number, description: '余额支付从用户赠送金账户扣(元)；与 pay_amount_gift（钱包部分）一致' }
        pay_amount_gift: { type: number, description: '赠送金渠道实付(元)；钱包支付时为赠送金账户扣款部分' }
        pay_amount_cash: { type: number, description: '现金支付金额(元)' }
        checkout_cash_tender: { type: number, description: '结账客人付现金额(元)，可大于 pay_amount_cash' }
        checkout_change_amount: { type: number, description: '找零金额(元)，不计入营业额' }
        checkout_change_channel: { type: string, enum: [wechat, cash, alipay], description: '找零渠道' }
        checkout_change_channel_label: { type: string, description: '找零渠道中文展示（微信/现金/支付宝）；非表字段，详情等接口返回时填充' }
        merchantId: { type: string }
        notice: { type: integer }
        pay_openid: { type: string }
        off_time: { type: string, description: '订单完成时间' }
        takeout_delivery_id: { type: integer, format: int64, description: '关联 t_takeout_delivery.id；无配送扩展或非外卖时为 null' }
        delivery_fee: { type: number, description: '配送费（元），与 t_takeout_delivery.delivery_fee 一致；无扩展时为 null' }
        takeout_dispatch_status: { type: string, description: '配送履约状态 submitted|paid|accepted|delivering|completed|cancelled|dispatch_failed；无扩展时为 null' }
        kds_order_status:
          type: integer
          description: |
            **非表字段**。KDS 厨显整单状态，来自 `t_kds_order`：`10` 待制作、`20` 制作中、`30` 部分完成、`40` 全部完成（后厨传菜完毕）、`90` 已关闭（仅取消单，见 **v1.2.138**）。结账不改变厨显。
            在 **`POST /admin/order/list`** 等列表接口由服务端批量填充；未启用 KDS 或无记录时为 `null`。
          enum: [10, 20, 30, 40, 90]
          nullable: true

    TakeoutDelivery:
      type: object
      description: |
        外卖配送扩展，对应 t_takeout_delivery；与 dineInOrTakeOut=外卖 的订单一对一。
        启用真省钱时 **`zsq_*`** 字段由桥接服务写入；迁移见 **`docs/db_migration_takeout_zsq_integration.sql`**。
      properties:
        id: { type: integer, format: int64 }
        order_id: { type: integer, description: 't_order.id' }
        order_no: { type: string }
        shop_id: { type: integer }
        user_address_id: { type: integer, format: int64, description: '下单时选用的 t_user_address.id' }
        receiver_name: { type: string }
        receiver_phone: { type: string }
        address_full: { type: string, description: '完整配送地址' }
        lng: { type: number, description: '经度（GCJ-02 高德坐标，见 CoordinateConvention）' }
        lat: { type: number, description: '纬度（GCJ-02 高德坐标，见 CoordinateConvention）' }
        delivery_fee: { type: number, description: '配送费（元）' }
        dispatch_status:
          type: string
          description: submitted|paid|accepted|delivering|completed|cancelled|dispatch_failed（骑手取消等）
        merchant_remark: { type: string }
        zsq_open_order_id: { type: integer, format: int64, description: 真省钱 openOrderId }
        zsq_order_id: { type: string, description: 真省钱业务订单号 }
        zsq_shop_number: { type: string }
        zsq_parent_order_no: { type: string }
        zsq_delivery_codes_json: { type: string }
        zsq_quote_json: { type: string }
        zsq_dispatch_json: { type: string }
        zsq_delivery_send_status: { type: integer }
        zsq_phase: { type: string, description: WAITING_RIDER|TO_SHOP|TO_USER|DELIVERED|CANCELLED|ORDER_MISSING }
        zsq_dispatch_status:
          type: string
          description: none|pending|dispatched|failed|rider_cancelled|order_missing|completed
        zsq_rider_name: { type: string }
        zsq_rider_phone: { type: string }
        zsq_rider_lat: { type: number }
        zsq_rider_lng: { type: number }
        zsq_rider_updated_at: { type: string }
        zsq_last_error: { type: string }
        zsq_dispatch_attempts: { type: integer }
        zsq_liability_fee: { type: number, description: '真省钱取消责任扣费（元）' }
        zsq_actual_fee: { type: number, description: '真省钱实际跑腿费用（元，来自 shopActualCost/discountLastMoney）' }
        zsq_delivery_supplier_name: { type: string, description: '真省钱实际配送运力渠道（如京东特惠、美团等，来自 deliverySupplierName）' }
        zsq_cancel_prompt: { type: string, description: '真省钱取消提示文案' }
        zsq_cancel_json: { type: string, description: '真省钱取消响应 JSON' }
        created_at: { type: string }
        updated_at: { type: string }
        actual_delivery_fee: { type: number, description: '实际配送费（元，语义别名，取自 zsq_actual_fee）' }

    UpdateUserRequest:
      type: object
      properties:
        openid: { type: string, description: '用户 openid，必填' }
        name: { type: string, description: '昵称' }
        nickname: { type: string, description: '昵称（别名，优先于 name）' }
        phone: { type: string, description: '手机号' }
        birthday: { type: string, description: '生日，格式如 yyyy-MM-dd；仅允许设置一次，已有值后不可再修改' }

    User:
      type: object
      description: 用户实体，对应 t_user。balance 为总余额（本金+赠送金），与小程序展示一致；principal_balance 为本金；gift_balance 为赠送金；恒等式 balance = principal_balance + gift_balance。
      properties:
        id: { type: integer }
        openid: { type: string }
        name: { type: string, description: '用户昵称，注册时默认赋予老肥吃货+id' }
        nickname: { type: string, description: '用户昵称，与 name 同步' }
        avatar: { type: string }
        phone: { type: string }
        points: { type: integer }
        balance: { type: number, description: '总余额(元)=本金+赠送金' }
        principal_balance: { type: number, description: '本金(元)' }
        gift_balance: { type: number, description: '赠送金余额(元)' }
        time: { type: string, description: '注册/更新时间' }
        user_type: { type: integer, description: '0 普通 1 会员' }
        level: { type: integer }
        invite_code: { type: string }
        birthday: { type: string, description: '生日，对应 t_user.birthday varchar(10)' }

    OrderDetail:
      type: object
      description: |
        订单明细，对应 **t_order_detail**（**quantity** 在库中为 int）。
        **普通行**（**line_type** 为空或 **normal**）：**total_price &gt; 0**，须等于 **unitprice×数量**（±0.02 元）；**name** 与 **t_dish.name** 对齐；**onsale=true** 且 **sold_out≠1**。
        **套餐请求行**（下单前，传 **combo_id**）：**line_type** 可传 **combo**；**combo_selections** 为对象，key 与 **t_combo_group.group_key** 一致，值为子菜 **t_dish.id** 数组；或与 **combo_selection_json** 二选一；**quantity** 为套餐份数；**total_price** 为整份套餐价（服务端按头菜门店价+组内加价校验）。服务端展开为 **combo_header**（本表一行，含价）+ 多行 **combo_component**（**total_price=0**，数量为子菜份数×套餐份数）。
        **库存**：**combo_header** 不扣库存；**combo_component** 与普通行一样按子菜名合并扣减 **t_dish_shop.stock**。
        查询订单详情时返回已落库的 **line_type**、**combo_id**、**combo_instance_id**、**parent_detail_id**、**combo_selection_json**（头行）；**combo_selections** 仅请求体字段，响应中不出现。
      properties:
        id: { type: integer, description: '明细主键' }
        mId: { type: integer, description: '订单主表 id，t_order.id' }
        name: { type: string, description: '菜品名称（套餐头行=套餐名，子行=子菜名）' }
        quantity: { type: string, description: '数量，t_order_detail 为 int，接口可为 string/number' }
        refunded_quantity: { type: integer, minimum: 0, description: '累计退款数量；新订单默认 0' }
        unit: { type: string, description: '单位，如份、瓶' }
        image: { type: string, description: '菜品图片 URL' }
        total_price: { type: number, description: '该明细总价；combo_header=套餐价；combo_component=0' }
        Morder_no: { type: string, description: '关联订单号' }
        Morder_num: { type: integer, description: '订单序号' }
        order_rece: { type: string, description: '该明细接单状态；退菜整行时同步为 refunded' }
        line_status:
          type: string
          enum: [normal, refunded]
          description: |
            **normal** 有效明细，参与计价/KDS/库存占用；
            **refunded** 已退菜（软删除），不参与计价与新 KDS 工单，库存已回退。
        remark: { type: string, description: '该条备注' }
        selectedSpicy: { type: string, description: '规格 JSON，如 {"辣度":"微辣"}，前端展示时解析为选项文本' }
        cid: { type: string, description: '分类 id，用于优惠券适用类目' }
        client_line_id: { type: string, maxLength: 64, description: '收银客户端行关联 ID；套餐展开后的头行和组件行沿用同一值' }
        line_type:
          type: string
          enum: [normal, combo, combo_header, combo_component]
          description: |
            **normal** 普通单品；**combo** 仅请求体表示套餐购物车行（落库后为 header/component）；
            **combo_header** 套餐头行；**combo_component** 套餐子菜行（价为 0）。
        combo_id: { type: integer, format: int64, description: 't_combo.id' }
        combo_instance_id: { type: string, description: '同一订单内同一套餐实例 UUID，头行与子行相同' }
        parent_detail_id: { type: integer, description: 'combo_component 指向 combo_header 的 t_order_detail.id' }
        combo_selection_json:
          type: string
          description: '套餐头行：用户选择快照 JSON，如 {"soup":[12],"main":[34]}'
        combo_selections:
          type: object
          additionalProperties:
            type: array
            items: { type: integer }
          description: '仅请求体；组 key → 子菜 dishId 数组。与 combo_selection_json 二选一'

    OrderCreateRequest:
      type: object
      description: 创建订单请求，字段与 t_order / t_order_detail 对齐（见 db_diancan.sql）。sett_amount 仅存商品+打包费（外卖另含 delivery_fee）；打包/外卖时后端对 sett_amount 二次校验，未含打包费则自动补入；服务费由后端按整单(sett_amount)*5%计算。
      required: [order_no, table_number, number_of_diners, sett_amount, transac_status, dineInOrTakeOut, orderNumber, openid, goods_list]
      properties:
        order_no: { type: string, description: '订单号，唯一，由前端或后端生成' }
        table_number: { type: string, description: '桌台号；打包可为空或占位' }
        number_of_diners: { type: integer, description: '用餐人数，t_order 为 int' }
        sett_amount: { type: number, description: '堂食为商品合计；打包/外卖可传已含打包费（+配送费）的总额，后端校验后不足则补打包费' }
        delivery_fee: { type: number, description: '外卖配送费（元）；/order/takeout/create 会写入，参与 sett_amount' }
        discount_amount: { type: number, description: '优惠金额，使用优惠券时由后端计算' }
        service_fee: { type: number, description: '可选、忽略；服务费由后端按整单(sett_amount)*5%统一计算' }
        transac_status:
          type: string
          enum: [success, unsettled, cancelled]
          description: '与 t_order 表 enum 一致'
        order_receiving:
          type: string
          enum: [mis_order, rec_order, off_order, cancelled]
          description: '与 t_order 表 enum 一致'
        dineInOrTakeOut: { type: string, description: '堂食 或 打包' }
        orderNumber: { type: integer, description: '订单序号，用于出餐时间预估' }
        remark: { type: string, description: '订单备注' }
        openid: { type: string, description: '用户 openid' }
        merchantId: { type: string, description: '商户 ID，多店时使用（支付/历史逻辑，不可替代 shop_id）' }
        shop_id: { type: integer, description: '门店 ID（连锁）；与请求头/shop_code 二选一或同时传，须一致；落库 t_order.shop_id' }
        shop_code: { type: string, description: '门店编码 t_shop.code（连锁）；与 shop_id/请求头须一致' }
        coupon_id: { type: integer, format: int64, description: '使用的优惠券 ID，未使用传 0 或不传' }
        goods_list:
          type: array
          description: '订单明细列表；可含普通菜或套餐请求行（combo_id、combo_selections），见 OrderDetail'
          items: { $ref: '#/components/schemas/OrderDetail' }

    OrderAddDishesRequest:
      type: object
      description: 加菜请求。sett_amount 仅存商品+打包费：整单 sett_amount = 原订单 sett_amount + 本次加菜金额；服务费由后端按新整单(sett_amount)*5%重算；实付金额（净额）= sett_amount - discount_amount + service_fee - refund_amount - pay_amount_gift。
      required: [order_no, table_number, goods_list]
      properties:
        order_no: { type: string, description: '原订单号' }
        table_number: { type: string, description: '桌台号' }
        shop_id: { type: integer, description: '连锁可选；须与原单门店一致' }
        shop_code: { type: string, description: '连锁可选；与 shop_id/请求头须一致' }
        orderNumber: { type: integer, description: '订单序号，可与原单一致' }
        sett_amount: { type: number, description: '本次加菜金额（原价）' }
        service_fee: { type: number, description: '可选、忽略；服务费由后端按整单*5%统一重算' }
        remark: { type: string, description: '加菜备注' }
        expectedVersion: { type: integer, minimum: 0, description: '客户端读取到的订单 revision；省略保持旧客户端兼容' }
        expected_version: { type: integer, minimum: 0, deprecated: true, description: 'expectedVersion 的兼容别名' }
        goods_list:
          type: array
          description: '本次加菜的明细列表；支持套餐请求行，见 OrderDetail'
          items: { $ref: '#/components/schemas/OrderDetail' }

    Combo:
      type: object
      description: 套餐定义头，对应 t_combo
      properties:
        id: { type: integer, format: int64, description: '主键' }
        dish_id: { type: integer, description: '套餐头菜品 t_dish.id' }
        shop_id: { type: integer, description: '门店ID，0表示总部通用默认模板，>0表示门店专属套餐' }
        combo_type:
          type: string
          enum: [fixed, groups]
          description: 'fixed=仅固定子项；groups=含可选组'
        status: { type: integer, enum: [0, 1], description: '1 启用 0 停用' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ComboFixedItemDef:
      type: object
      description: 套餐固定子项（菜单/保存共用结构）
      properties:
        componentDishId: { type: integer, description: '子菜 t_dish.id' }
        qtyPerCombo: { type: integer, default: 1, description: '每份套餐含该子菜份数' }
        sortOrder: { type: integer }

    ComboGroupItemDef:
      type: object
      description: 套餐组内可选项
      properties:
        componentDishId: { type: integer, description: '子菜 t_dish.id' }
