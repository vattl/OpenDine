  /kds/order/list:
    get:
      tags: [KDS-Client]
      summary: 厨显订单卡片列表（按屏）
      description: |
        **主界面数据源**。仅返回**当前设备绑定 `screen_tag`** 的队列（query 传其它屏返回 403）。
        - **烤制屏**（meat/veg/seafood）：按订单聚合卡片，每卡 `items[]` 为本屏工单。
        - **`skewer_gate=1`**（默认）：烤制屏**仅展示 `skewer_picked=1`** 的待做工单；未抓串前请用抓串屏 **`/kds/skewer/summary`** + **`picked`**。
        - **`expedition` 总出餐屏**：固定返回 **荤/素/海鲜烤制岗** 的 **`item_status=2`（已完成）** 明细（忽略 query `status` 传 0/1）；前端须展示 **完成** 态，勿按烤制屏过滤 0/1。
        - **`skewer_aggregate`**：请用 **`GET /kds/skewer/summary`**，本接口对该屏返回空列表。
        收到 WS **`new_order`/`update_order`** 后可全量刷新或局部合并。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
        - name: screen_tag
          in: query
          schema: { $ref: '#/components/schemas/KdsScreenTag' }
          description: 可选；默认取设备绑定屏
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/KdsItemStatus' }
          description: |
            **整数**过滤单品 `item_status`：`0` 待做、`1` 制作中、`2` 完成。
            不传则烤制屏返回 0/1/2 活跃态组合（实现以服务端为准）。
            **勿传** `pending` 等字符串。
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
          description: true 时包含已归档工单（默认列表隐藏 2h 前 done）
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, maximum: 50 }
      responses:
        '200':
          description: |
            `code=0`。`orders` 为 **KdsOrderCard[]**；`screen_tag` 为实际查询屏。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  screen_tag: { $ref: '#/components/schemas/KdsScreenTag' }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/KdsOrderCard' }
        '401':
          description: 缺少或无效 X-Kds-Device-Token
        '403':
          description: 查询与设备绑定不符的 screen_tag

  /kds/order/item/list:
