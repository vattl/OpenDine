  /admin/table/add:
    post:
      tags: [运营后台]
      summary: 新增桌台（生成桌码）
      description: |
        新增桌台，自动绑定当前门店（X-Shop-Id）。校验桌号非空且同店内不重复。微信小程序二维码生成具备容错能力。
      security: [{ BearerAuth: [] }]
      x-permission: table:manage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number: { type: string, description: '桌台号，如 A01、1' }
                area_code: { type: string, description: '桌台区域编码，如 hall, box, patio' }
                area_name: { type: string, description: '桌台区域名称，如 大厅散座, 特色包厢, 露天外摆' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败（桌号为空或已存在）

  /admin/table/update:
    post:
      tags: [运营后台]
      summary: 修改桌台信息
      description: |
        修改已有桌台信息（桌号、区域编码与区域名称），自动校验当前门店权限与桌号唯一性。
      security: [{ BearerAuth: [] }]
      x-permission: table:manage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, description: '桌台ID' }
                number: { type: string, description: '桌台号' }
                area_code: { type: string, description: '桌台区域编码，如 hall, box, patio' }
                area_name: { type: string, description: '桌台区域名称' }
      responses:
        '200':
          description: 成功
        '500':
          description: 失败（桌号已存在或桌台不存在）

  /admin/table/open:
    post:
      tags: [运营后台]
      summary: 开台占用桌台（已弃用）
      deprecated: true
      security: [{ BearerAuth: [] }]
      description: |
        已弃用，不再实际操作桌台。开台、并台、转台、清台统一迁移到收银端接口：
        **POST /cashier/table/open**、**POST /cashier/table/merge**、**POST /cashier/table/transfer**、**POST /cashier/table/clear**。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, description: 桌台主键，优先使用 }
                number: { type: string, description: 桌号；未传 id 时必填 }
                tableNumber: { type: string, description: 桌号别名，兼容前端命名 }
                table_number: { type: string, description: 桌号别名，兼容前端命名 }
      responses:
        '200':
          description: 固定返回 code=410，msg 提示使用 /cashier/table/open
        '500':
          description: 失败

  /admin/table/delete:
    get:
      tags: [运营后台]
      summary: 删除桌台
      description: |
        删除指定桌台。仅允许删除空闲且无就餐中订单的桌台，使用中桌台将返回 500 拦截。
      security: [{ BearerAuth: [] }]
      x-permission: table:manage
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
          description: 桌台主键 t_table.id
      responses:
        '200':
          description: 成功
        '500':
          description: 失败（桌台不存在、非当前门店或处于使用中）

  /admin/table/out:
    get:
      tags: [运营后台]
      summary: 清台（已弃用）
      security: [{ BearerAuth: [] }]
      x-permission: table:manage
      deprecated: true
      description: 始终返回 code=410。请使用 POST /cashier/table/clear，后者检查同桌全部未结账订单并记录审计。
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
          description: 桌台主键 t_table.id
      responses:
        '200':
          description: HTTP 200，body 中 code=410
        '500':
          description: 失败

  /admin/table/status:
    get:
      tags: [运营后台]
      summary: 获取桌台状态（可选按桌号或订单号筛选）
      security: [{ BearerAuth: [] }]
      x-permission: table:manage
      description: |
        传入桌号 `number` 则只返回该桌信息；传入 `orderNo` 或 `order_no` 时，先在当前门店内精确查询订单并解析其桌号。均不传时返回 t_table 全量数据，按桌号升序。
        指定桌号，或指定的目标订单为 `unsettled` 时，按 `shop_id + table_number + unsettled` 返回该桌全部未结订单；并台后的多笔订单不会被 `t_table.order_no` 单指针截断。目标订单已经结账或取消时只返回该目标订单，避免桌台复用后串入新订单。最终结账后桌台处于 status=2 时，按桌号查询仍返回指针所指的刚结账订单。
        `orderNo` 与 `order_no` 同时传入时必须相同；`number` 与订单所属桌号不一致时返回错误。
        `tableList[0].amount` 为全部 orderList 的应付合计，`orderList[].sett_amount/service_fee` 基于有效明细防御性核算，不在 GET 中写数据库：
        `total_price=0` 的赠送菜不计金额，已退菜不计金额，`combo_component` 不重复计价，应付金额最低为 0。
      parameters:
        - name: number
          in: query
          required: false
          schema: { type: string }
          description: 桌号；不传则返回全部桌台
        - name: orderNo
          in: query
          required: false
          schema: { type: string }
          description: 订单号；与 order_no 二选一，按当前门店隔离查询
        - name: order_no
          in: query
          required: false
          schema: { type: string }
          description: 订单号兼容命名；与 orderNo 同时传入时值必须一致
      responses:
        '200':
          description: 成功；传 number 或订单号时返回 orderList（每条含 goods_list）、金额审计 amountAudit/amountAudits
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  tableList:
                    type: array
                    items: { $ref: '#/components/schemas/Table' }
                  total: { type: integer }
                  orderList:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                    description: 指定桌号时返回；占用桌为全部未结订单，待清台桌为刚结账订单；每条含 goods_list
                  amountAudit:
                    type: object
                    description: 仅指定桌号且存在关联订单时返回的金额核算依据
                    properties:
                      order_no: { type: string }
                      table_number: { type: string }
                      goods_amount: { type: number, description: 订单持久化 sett_amount；不按明细二次重算 }
                      service_fee: { type: number, description: 订单持久化 service_fee }
                      discount_amount: { type: number }
                      refund_amount: { type: number }
                      gift_payment_amount: { type: number, description: 赠送金支付金额；与赠送菜不同 }
                      payable_amount: { type: number, description: 桌台当前应付金额，最低为0 }
                      gifted_line_count: { type: integer, description: total_price=0 的赠送菜行数，不含 combo_component }
                      gifted_quantity: { type: integer, description: 赠送菜数量 }
                      refunded_line_count: { type: integer }
                      calculation_source: { type: string, enum: [persisted_order_amounts] }
                  amountAudits:
                    type: array
                    description: 逐订单金额核算明细；并台多单时用于审计整桌金额组成
                    items:
                      type: object
                      additionalProperties: true
        '500':
          description: 失败

  /admin/table/qrcode:
    get:
      tags: [运营后台]
      summary: 获取桌台微信小程序码（返回 PNG 二进制图）
      security: [{ BearerAuth: [] }]
      x-permission: table:manage
      description: |
        按桌号（`number`）或桌台 ID（`id`）获取当前门店桌台的微信小程序码（菊花码）。
        若服务器已有生成好的桌码文件则直接返回；若缺失则向微信后台拉取生成并持久化更新桌台后返回。
      parameters:
        - name: number
          in: query
          schema: { type: string }
          description: 桌台编号，如 A01、1
        - name: id
          in: query
          schema: { type: integer }
          description: 桌台主键 t_table.id
      responses:
        '200':
          description: 小程序码 PNG 图片二进制
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: 缺少 number 或 id 参数
        '404':
          description: 桌台不存在
        '500':
          description: 生成或读取小程序码失败

  /admin/orderDetail/delete_menu:
    post:
      tags: [运营后台]
      summary: 退菜（未支付订单）
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        软退菜：明细 **`line_status=refunded`**（不物理删行），按 **`stock_action`** 处理 **`t_dish_shop.stock`**（默认 RESTORE 回退库存；NO_RESTORE 损耗不回退；OUT_OF_STOCK 缺货清零并置售罄），KDS void，并重算整单 **`sett_amount`**、服务费、优惠；堂食时桌台待结账金额同步更新。
        已支付订单请走退款流程。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, description: 订单明细 ID }
                stock_action:
                  $ref: '#/components/schemas/RefundStockAction'
                remark: { type: string, description: 退菜原因/备注 }
      responses:
        '200':
          description: 成功，body 含 totalAmount（sett_amount）、discount_amount、service_fee
        '500':
          description: 失败

  /admin/orderDetail/updateQuantity:
    post:
      tags: [运营后台]
      summary: 修改订单明细（菜品）数量
      security: [{ BearerAuth: [] }]
      x-permission: order:operate
      description: |
        仅未支付订单可改。按原单价重算该明细 total_price，增/减数量时对称扣减或回退 **`t_dish_shop.stock`**，并重算整单 sett_amount、服务费、优惠；堂食时桌台待结账金额同步更新。
        数量至少为 1，整行退菜请用 **`delete_menu`**。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, quantity]
              properties:
                id: { type: integer, description: 订单明细 id（OrderDetail.id） }
                quantity: { type: integer, minimum: 1, description: 新数量 }
      responses:
        '200':
          description: 成功，body 含 code、totalAmount（sett_amount）、discount_amount、service_fee
        '500':
          description: 失败（如已支付、明细不存在、数量无效等）

  # ---------- 收银系统扩展：门店管理 ----------
  /admin/shop/list:
    get:
      tags: [门店管理, 运营后台]
      summary: 门店列表
      description: |
        `keyword` 查询参数按名称或编码模糊筛选，与 **`GET /admin/me/shops`** 行为对齐。
      security: [{ BearerAuth: [] }]
      x-permission: shop:manage
      parameters:
        - name: enabled
          in: query
          schema: { type: integer, description: '0-停用 1-营业，不传查全部' }
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 按门店名称或编码模糊匹配
      responses:
        '200':
          description: 成功，body 含 code、list（Shop[]）
        '500':
          description: 失败
  /admin/shop/save:
    post:
      tags: [门店管理, 运营后台]
      summary: 新增或更新门店（历史兼容）
      deprecated: true
      description: 历史单体保存接口；自 v1.2.132 起废弃，请统一迁移至 PUT /admin/settings/store（具备 version 乐观锁与完整营业配置支持）。
      security: [{ BearerAuth: [] }]
      x-permission: shop:manage
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopInput' }
      responses:
        '200': { description: 成功 }
        '500': { description: 失败 }

  /admin/shop/offline-collect/upload:
    post:
      tags: [门店管理, 运营后台]
      summary: 上传线下微信/支付宝收款码原图
      description: |
        multipart 可选 **`wechatQr`**、**`alipayQr`**（至少传一个）；服务端 ZXing 解码为跳转串（如 **`wxp://`**、**`https://qr.alipay.com`**）写入门店字段，原图落盘到 **`offlineCollectImgsFilePath`**。
        需 JWT；门店上下文 **`X-Shop-Id`** / **`X-Shop-Code`** 或 query **`shopId`** 与现有门店接口一致。
      security: [{ BearerAuth: [] }]
      x-permission: shop:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: shopId
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                wechatQr:
                  type: string
                  format: binary
                  description: 微信个人收款码图片
                alipayQr:
                  type: string
                  format: binary
                  description: 支付宝个人收款码图片
      responses:
        '200': { description: 成功 }
        '400': { description: 解码失败或非收款码 }
        '500': { description: 失败 }

  # ---------- KDS 厨房显示（详见 tags KDS-Admin / KDS-Client 长说明） ----------
  /admin/kds/station/list:
    get:
      tags: [KDS-Admin, 运营后台]
      summary: KDS 档口/分屏列表
      description: |
        查询当前门店（**`X-Shop-Id`**）下全部档口，含五屏 `screen_tag`、排序、启用状态。
        **运营配置页**进入时调用，用于展示/编辑档口表格。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200':
          description: |
            `code=0`。`list` 为 **KdsStation[]**（按 `sort` 排序）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  list:
                    type: array
                    items: { $ref: '#/components/schemas/KdsStation' }
        '4001':
          description: 缺少 X-Shop-Id
        '403':
          description: 无 kds:config 权限

  /admin/kds/station/save:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 新增或更新 KDS 档口
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsStationInput' }
      responses:
        '200':
          description: 成功，body.station

  /admin/kds/station/delete:
    get:
      tags: [KDS-Admin, 运营后台]
      summary: 删除 KDS 档口
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功 }

  /admin/kds/station/init-five:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 一键初始化烧烤五屏档口
      description: |
        创建 **`skewer_aggregate`**、**`meat_grill`**、**`veg_grill`**、**`seafood_special`**、**`expedition`**（已存在则跳过）。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200':
          description: 成功，body.list 为 KdsStation[]

  /admin/kds/station/category/bind:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 分类 cid 绑定档口
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsStationCategoryBindRequest' }
      responses:
        '200':
          description: 成功，body.categories

  /admin/kds/station/category/list:
    get:
      tags: [KDS-Admin, 运营后台]
      summary: 档口已绑分类列表
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: stationId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 成功 }

  /admin/kds/dish-screen/bind:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 批量绑定菜品到 screen_tag
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsDishScreenBindRequest' }
      responses:
        '200': { description: 成功 }

  /admin/kds/dish-screen/list:
    get:
      tags: [KDS-Admin, 运营后台]
      summary: 菜品绑屏列表
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - name: dishId
          in: query
          schema: { type: integer }
        - name: screenTag
          in: query
          schema: { $ref: '#/components/schemas/KdsScreenTag' }
      responses:
        '200': { description: 成功 }

  /admin/kds/config/get:
    get:
      tags: [KDS-Admin, 运营后台]
      summary: 门店 KDS 配置
      description: |
        读取 **`t_kds_shop_config`**。无记录时返回默认 **`kds_mode=print_only`**（与现网仅打印一致）。
        厨显端是否收单取决于此处 **`kds_mode`** 是否为 `kds_only` / `both`。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200':
          description: '`code=0`，`config` 为 **KdsShopConfig**'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  config: { $ref: '#/components/schemas/KdsShopConfig' }

  /admin/kds/config/save:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 保存门店 KDS 配置
      description: |
        写入/更新门店配置。常用字段：
        - **`kds_mode`**：`print_only` | `kds_only` | `both`（启用厨显必改此项）
        - **`sync_legacy_rece`**：1 时划菜同步老字段 `order_rece`（收银/后台兼容）
        - **`auto_off_order_on_kds_done`**：1 时厨显整单完成（40）自动清台（`order_receiving=off_order`），默认 0
        - **`serve_print_enabled`**：1 时待传菜划单后打印传菜单（默认 1），0 关闭
        - **`sla_minutes`**：待做超时标红（默认 10）
        - **`archive_hours`**：已完成工单归档小时数（默认 2）
        - **`lack_sets_sold_out`**：1 时缺货上报联动门店菜品售罄
        - **`kds_pin`**：后厨大屏登录 6 位数字 PIN 码（默认 123456），供 KDS 极简免配对码直登
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsShopConfigInput' }
            example:
              kds_mode: both
              sync_legacy_rece: 1
              auto_push_on_create: 1
              sla_minutes: 10
              archive_hours: 2
              lack_sets_sold_out: 0
              kds_pin: "123456"
      responses:
        '200':
          description: '`code=0`，返回更新后的 `config`'

  /admin/kds/device/list:
    get:
      tags: [KDS-Admin, 运营后台]
      summary: 厨显设备列表
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      responses:
        '200': { description: 成功 }

  /admin/kds/device/proxy-login:
    post:
      deprecated: true
      tags: [KDS-Admin, 运营后台]
      summary: 已停用的旧收银代签登录入口
      description: |
        永久返回 code=410。收银生产链路必须透明转发同一 POST /kds/device/login，
        不得通过管理端接口绕过设备 Token 或一次性配对票据校验。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsDeviceBindRequest' }
      responses:
        '410': { description: 已停用；收银必须原样转发 /kds/device/login }

  /admin/kds/device/pairing-ticket:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 为预绑定 KDS 设备签发一次性云端配对码
      description: 配对码默认 5 分钟有效、只可消费一次；数据库只保存 SHA-256，不保存明文。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code: { type: string }
      responses:
        '200': { description: 返回一次性 pairing_code 与 expires_at_ms }

  /admin/kds/device/proxy-command:
    post:
      deprecated: true
      tags: [KDS-Admin, 运营后台]
      summary: (已停用) 收银端恢复转发已持久化的 KDS V2 命令
      description: |
        已停用 (HTTP 410 Gone)。收银管理员会话不得合成 KDS actor 或代为授权待决设备命令。
        收银 LAN 代理应直接携带原设备 Token 透明转发至 `/kds/v2/commands`。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_device_code, command]
              properties:
                actor_device_code: { type: string }
                command: { $ref: '#/components/schemas/KdsV2CommandRequest' }
      responses:
        '410':
          description: 接口已永久停用 (Gone)，收银端请原样转发至 /kds/v2/commands
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 410 }
                  msg: { type: string, example: "收银代理命令授权已停用；请原样转发 /kds/v2/commands" }

  /admin/kds/device/bind:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 绑定厨显设备到 screen_tag
      description: 只绑定设备元数据并返回不含凭据的管理视图；KDS Token 仅可通过受控登录接口签发。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsDeviceBindRequest' }
      responses:
        '200': { description: 成功 }

  /admin/kds/ticket/repush:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 按订单重推 KDS 工单
      description: |
        对已有 **`t_order`** 按明细重新生成工单（已存在同明细+档口则跳过）。
        用于：厨显刚启用、路由规则变更后补历史单、联调测试。
        要求门店 **`kds_mode`** 为 `kds_only` 或 `both`。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: integer, description: t_order.id }
                orderId: { type: integer, description: 同 order_id }
            example:
              order_id: 9625
      responses:
        '200':
          description: '`code=0`；失败时 `msg` 说明（如订单不存在、未启用 KDS）'

  /admin/kds/ticket/print-serve:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 手动打印/补打传菜单（出餐单）
      description: |
        向门店飞鹅云打印机发送传菜单（出餐单）打印指令。
        支持按整单 `order_id` 打印、按单条明细 `detail_id` 打印（可选 `quantity`），或批量 `lines` 打印。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: integer, description: 't_order.id，整单打印该单所有有效明细' }
                detail_id: { type: integer, description: 't_order_detail.id，单条明细打印' }
                quantity: { type: integer, description: '打印传菜份数，默认为 1' }
                lines:
                  type: array
                  description: '批量明细列表'
                  items:
                    type: object
                    required: [detail_id]
                    properties:
                      detail_id: { type: integer }
                      quantity: { type: integer, default: 1 }
            example:
              detail_id: 123
              quantity: 2
      responses:
        '200':
          description: 成功返回打印统计与明细结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      printed_count: { type: integer, example: 1 }
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            detail_id: { type: integer }
                            dish_name: { type: string }
                            quantity: { type: integer }
                            table_number: { type: string }
                            print_result: { type: string }

  /admin/kds/replication/events:
    post:
      tags: [KDS-Admin, 收银机端]
      summary: 收银本地事实异步复制到云端
      description: |
        仅由收银端 `cloud_outbox` 调用，KDS 不直接调用。支持 `order_created`、
        `kds_advance_item` 与权威完整快照 `kds_state_changed`。只有 HTTP 2xx 且 `code=0` 才表示 ACK。

        `event_id` 全局幂等；重复提交返回首个稳定映射并置 `duplicate=true`。同一
        `shop_id + aggregate_key` 串行处理。建单映射未建立时，划菜事件持久化为 pending
        并返回 409/4090。`local_revision` 只允许单调前进，旧版本成功 ACK 但不覆盖新状态。
        云端失败不得导致收银端回滚本地订单、划菜或 outbox。

        `order_created.lines[].local_detail_id` 是协调补充的必填字段，用于后续 `detail_id` 映射。
        所有请求还必须携带 `X-Cashier-Device-Code`；它必须属于 JWT 解析出的当前门店并等于该店
        `cashier_authority.cashier_device_code`。state_changed 时还必须等于 payload.device_code。
        event_id/operation_id 仅在 canonical request fingerprint 完全一致时视为重试；异载荷复用返回永久冲突。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsReplicationEventRequest' }
            examples:
              orderCreated:
                value:
                  event_id: pos-1-1784512800000-123456
                  event_type: order_created
                  aggregate_key: order:37
                  occurred_at_ms: 1784512800000
                  payload:
                    local_order_id: 37
                    order_no: L1784512800000-37
                    shop_id: 1
                    table_number: '18'
                    fulfillment_type: dine_in
                    remark: 不要辣
                    number_of_diners: 4
                    created_at_ms: 1784512800000
                    lines:
                      - local_detail_id: 81
                        dish_id: 101
                        dish_name: 油边王
                        specification: 微辣
                        unit: 份
                        quantity: 2
                        cloud_payload: {}
              advanceItem:
                value:
                  event_id: pos-1-kds-op-2
                  event_type: kds_advance_item
                  aggregate_key: order:37
                  occurred_at_ms: 1784512860000
                  payload:
                    operation_id: kds-client-id
                    detail_id: 81
                    order_id: 37
                    from_queue: pending_prep
                    workflow_queue: pending_cook
                    prep_remaining: 0
                    cook_remaining: 2
                    ready_remaining: 2
                    remaining_quantity: 2
                    row_version: 2
                    local_revision: 2
                    done_line: 0
      responses:
        '200':
          description: 已处理或幂等 ACK；duplicate=true 时仍返回第一次形成的映射
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KdsReplicationResponse' }
        '400': { description: 'code=4000，永久无效载荷；停止静默重试并报警' }
        '401': { description: 'code=4010，JWT 无效；暂停发送并重新登录' }
        '403': { description: 'code=4010 无 cashier:operate/门店越权，或 code=4030 publisher header 缺失、伪造、不匹配 authority/payload' }
        '409': { description: 'code=4090 前置映射未到，或 4091 云端业务冲突；保留事件并退避/人工处理' }
        '429': { description: 'code=4290，按 Retry-After 退避（网关限流时）' }
        '500': { description: 'code=5000，临时故障；指数退避重试' }

  /admin/kds/replication/events/batch:
    post:
      tags: [KDS-Admin, 收银机端]
      summary: 有序批量复制收银本地事实
      description: 最多 50 条，保持输入顺序逐项处理；同 aggregate 前项非成功（含 pending）时后项返回 4092 blocked，不同 aggregate 继续。HTTP 200 的 results 保留每项稳定 ACK/错误分类。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsReplicationBatchRequest' }
      responses:
        '200':
          description: 逐项结果，顺序与请求一致
          content: { application/json: { schema: { $ref: '#/components/schemas/KdsReplicationBatchResponse' } } }
        '400': { description: code=4000，events 为空或超过 50 }
        '401': { description: code=4010，JWT 无效 }
        '403': { description: code=4010 无 cashier:operate/门店越权；逐项 code=4030 表示 publisher header 与 authority/payload 不一致 }

  /admin/kds/authority/config-snapshot:
    get:
      tags: [KDS-Admin, 收银机端]
      summary: 获取收银权威 KDS 配置快照
      description: 返回稳定 version、上架菜品、routing、workflow、SLA、fixed_order 与独立 cashier_authority；该身份不来自 t_kds_device。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters: [{ $ref: '#/components/parameters/XShopId' }]
      responses:
        '200':
          description: 配置快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KdsAuthorityConfigSnapshotResponse' }
        '400': { description: code=4000，缺少门店上下文 }
        '401': { description: code=4010，JWT 无效 }
        '403': { description: code=4010，无 cashier:operate 或门店越权 }

  /admin/kds/authority/device:
    post:
      tags: [KDS-Admin]
      summary: 指定当前门店的收银 KDS 权威设备
      description: 设置当前门店独立的收银权威身份；不查询、复用或暗示 t_kds_device 厨显屏设备。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters: [{ $ref: '#/components/parameters/XShopId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cashier_device_code]
              properties: { cashier_device_code: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200': { description: 返回更新后的配置快照 }
        '400': { description: cashier_device_code 格式无效 }

  /admin/kds/replication/dead-letters:
    get:
      tags: [KDS-Admin, 收银机端]
      summary: 查询当前门店复制死信
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 按更新时间倒序的死信列表
          content: { application/json: { schema: { $ref: '#/components/schemas/KdsReplicationDeadLetterListResponse' } } }

  /admin/kds/replication/dead-letters/{eventId}/retry:
    post:
      tags: [KDS-Admin, 收银机端]
      summary: 重试死信原事件
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: eventId, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: 已应用, content: { application/json: { schema: { $ref: '#/components/schemas/KdsReplicationResponse' } } } }
        '409': { description: 前置映射仍未到 }
        '500': { description: 临时故障；retry_requested 审计已独立提交 }

  /admin/kds/replication/dead-letters/{eventId}/replace:
    post:
      tags: [KDS-Admin, 收银机端]
      summary: 用新 event_id 的修正事件替换死信
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: eventId, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KdsReplicationEventRequest' } } }
      responses:
        '200': { description: 替换事件已应用并记录审计, content: { application/json: { schema: { $ref: '#/components/schemas/KdsReplicationResponse' } } } }
        '400': { description: 修正事件无效 }

  /admin/kds/replication/dead-letters/{eventId}/discard:
    post:
      tags: [KDS-Admin, 收银机端]
      summary: 人工丢弃死信并保留审计
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: eventId, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { description: 已标记 discarded, content: { application/json: { schema: { $ref: '#/components/schemas/KdsReplicationDiscardResponse' } } } }

  /admin/kds/device/unbind:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 解绑并物理删除厨显设备
      description: |
        彻底物理删除 t_kds_device 记录，级联清理工作流 (t_kds_device_workflow)、
        可见岗配置 (t_kds_device_screen) 与配对票据 (t_kds_device_pairing_ticket)，
        并立即作废凭证及广播下线通知。支持传入 device_code 或 id。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_code: { type: string, description: "设备编码" }
                deviceCode: { type: string, description: "设备编码（驼峰）" }
                id: { type: integer, description: "设备记录主键 ID" }
                deviceId: { type: integer, description: "设备记录主键 ID" }
      responses:
        '200': { description: 成功 }

  /admin/kds/device/delete:
    post:
      tags: [KDS-Admin, 运营后台]
      summary: 物理删除厨显设备（别名路由，支持 POST/GET/DELETE）
      description: |
        功能与 /admin/kds/device/unbind 相同。彻底物理删除设备及其关联配置。
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: query, required: false, schema: { type: integer }, description: "设备记录主键 ID" }
        - { name: device_code, in: query, required: false, schema: { type: string }, description: "设备编码" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_code: { type: string, description: "设备编码" }
                deviceCode: { type: string, description: "设备编码（驼峰）" }
                id: { type: integer, description: "设备记录主键 ID" }
                deviceId: { type: integer, description: "设备记录主键 ID" }
      responses:
        '200': { description: 成功 }
    get:
      tags: [KDS-Admin, 运营后台]
      summary: 物理删除厨显设备（GET 方式）
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: query, required: false, schema: { type: integer }, description: "设备记录主键 ID" }
        - { name: device_code, in: query, required: false, schema: { type: string }, description: "设备编码" }
      responses:
        '200': { description: 成功 }
    delete:
      tags: [KDS-Admin, 运营后台]
      summary: 物理删除厨显设备（DELETE 方式）
      security: [{ BearerAuth: [] }]
      x-permission: kds:config
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - { name: id, in: query, required: false, schema: { type: integer }, description: "设备记录主键 ID" }
        - { name: device_code, in: query, required: false, schema: { type: string }, description: "设备编码" }
      responses:
        '200': { description: 成功 }

  /kds/v2/health:
    get:
      tags: [KDS-LAN-v2]
      summary: LAN v2 能力与协议探测
      x-kds-profile: cashier-lan-v2
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: protocol_version=2 与服务状态 }
        '426': { $ref: '#/components/responses/KdsV2UpgradeRequired' }

  /kds/v2/bootstrap:
    get:
      tags: [KDS-LAN-v2]
      summary: KDS V2 权威冷启动快照（双模直连：云端 / LAN）
      x-kds-profile: dual-mode-v2
      security: [{ XKdsDeviceToken: [] }]
      responses:
        '200':
          description: 权威冷启动快照；event_seq 是生成该快照时的当前序号，后续 changes 必须以此为 after_seq。
          content: { application/json: { schema: { $ref: '#/components/schemas/KdsV2BootstrapResponse' } } }
        '426': { $ref: '#/components/responses/KdsV2UpgradeRequired' }

  /kds/v2/config:
    post:
      tags: [KDS-LAN-v2]
      summary: KDS 设备端门店配置写入（已禁用）
      description: |
        KDS 设备 Token 不具备门店级配置管理权限，本端点保留用于返回稳定拒绝。
        请改用受管理员 JWT 与门店上下文保护的 POST /admin/kds/config/save。
      x-kds-profile: dual-mode-v2
      security: [{ XKdsDeviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KdsSettings' }
      responses:
        '401': { description: 设备 Token 未提供、无效、过期或设备已禁用 }
        '403': { description: '`code=4030`，KDS 设备无权修改门店级配置' }

  /kds/v2/changes:
    get:
      tags: [KDS-LAN-v2]
      summary: 按 event_seq 增量追赶（双模直连：云端 / LAN）
      description: |
        after_seq 已超出保留窗口时返回 snapshot_required=true，客户端必须重新 bootstrap。
        data.event_seq 是本次读取时的当前权威序号；`latest_event_seq` 仅为 Cashier 迁移期兼容 alias。
      x-kds-profile: dual-mode-v2
      security: [{ XKdsDeviceToken: [] }]
      parameters:
        - { name: after_seq, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: 有序 event envelopes 或 snapshot_required=true
          content: { application/json: { schema: { $ref: '#/components/schemas/KdsV2ChangesResponse' } } }
        '426': { $ref: '#/components/responses/KdsV2UpgradeRequired' }

  /kds/v2/commands:
    post:
      tags: [KDS-LAN-v2]
      summary: KDS V2 幂等工作流命令（双模直连：云端 / LAN）
      description: |
        同一门店的 command_id 使用规范请求指纹去重。确定性的 HTTP 400/409 在业务事务回滚后持久化为 REJECTED，重复请求返回首次拒绝；5xx 与网络/存储故障不固化为业务拒绝。
        `revoke_item` 可将 `done` 队列中尚未清理的已完成数量回撤至 `ready_serve`；5 秒快捷撤回结束后，客户端仍可从已完成看板发起同一命令。成功回撤会将该订单恢复为 `order_receiving=rec_order` 并清除 `off_time`，使后续 bootstrap 继续返回待传菜状态。
        命令只能操作设备 workflows 允许的队列；设备入口禁止 POS 加菜/退菜财务命令及其兼容别名。
      x-kds-profile: dual-mode-v2
      security: [{ XKdsDeviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KdsV2CommandRequest' } } }
      responses:
        '200':
          description: 稳定命令 ACK、完整 patches 与 queue_counts
          content: { application/json: { schema: { $ref: '#/components/schemas/KdsV2CommandResponse' } } }
        '400': { description: 参数或命令语义被稳定拒绝；同 command_id 同请求可重放首次 REJECTED }
        '403': { description: '`code=4030`，设备 workflow 越权或尝试执行 POS 财务命令' }
        '409': { description: expected_revision 冲突并保存稳定 REJECTED；同 command_id 同请求返回首次拒绝 }
        '426': { $ref: '#/components/responses/KdsV2UpgradeRequired' }

