      description: |
        **reconcile / 单队列快照**（**v1.2.145** / **v1.2.152** / **v1.2.155**）：返回 **`workflow_queue==queue`** 的全量行（含 **done_line=1**），供前端 **`replaceQueueLines`** 整表替换；行字段与 **`KdsWorkflowLine`** 同构（含真实 **`workflow_queue`**）。
        **`extra`/`keyword`** 与 **`GET /kds/workflow/board`** 同口径过滤（**v1.2.155**）。
        稳态划菜后优先依赖 **`advance-item` patch** 与 WS；本接口用于 5001 冲突、静默同步失败等 reconcile。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
        - name: queue
          in: query
          schema: { $ref: '#/components/schemas/KdsBoardQueue' }
          description: 工作流队列，默认 pending_prep
        - name: dining
          in: query
          schema: { type: string }
        - name: extra
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: '`code=0`，含 `queue`、`count`、`items[]`（**KdsWorkflowLine**）'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  queue: { $ref: '#/components/schemas/KdsBoardQueue' }
                  count: { type: integer }
                  items:
                    type: array
