      tags:
        - 桌台管理
      summary: 批量原子清台 (Batch Table Clearing)
      description: 批量释放桌台锁定、状态归位、关闭结账订单收单状态并写入翻台日志，拦截未结账订单桌台
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                table_ids:
                  type: array
                  items: { type: integer }
