  /pay/offline-collect/temp-qrcode:
    post:
      tags: [线下收款, 小程序]
      summary: 生成收款二维码（payload 矩阵，供对方扫一扫）
      description: |
        **仅限已登录收银端**。请求头 **`X-Shop-Id`**（或与 body **`shop_id`/`shopId`** 二选一）；**`channel`** 为 **`wechat`** 或 **`alipay`**（可放在 JSON body，缺省 **`wechat`**）。
        只读取当前门店收银端个人码独立开关：`channel=wechat` 检查 **`clients.cashier.channelStates.wechat_qr.enabled`**（内部渠道 `offline_wechat_qr`），`channel=alipay` 检查 **`clients.cashier.channelStates.alipay_qr.enabled`**（内部渠道 `offline_alipay_qr`）。两者仍共同受 **`clients.cashier.enabled`** 收银支付总开关约束。个人码开关与微信/支付宝线上商户支付开关互相独立；本接口不读取小程序端开关、旧支付总开关、已废弃的 `offline_collect_enabled/offline_collect_channels` 或微信商户证书状态。
        收银出码模式下商户路由只读取当前门店订单的 **`t_order.merchantId`**，请求体 **`merchantId`/`merchant_id`** 不能覆盖订单值。订单 **`merchantId=2`** 且 **`channel=wechat`** 时，二维码矩阵使用固定微信 **`wxp://`** payload（双商户路由），不读取门店 **`offline_collect_wechat_payload`**。不带订单字段的历史静态码读取才兼容使用请求体商户路由。
        响应 **`qrImageBase64`** 为 PNG，二维码<strong>矩阵内容</strong>为门店 **`offline_collect_wechat_payload`** / **`offline_collect_alipay_payload`**（与运营上传原图解码结果一致，如 **`wxp://…`**、**`https://qr.alipay.com/…`**），请用<strong>微信或支付宝「扫一扫」</strong>扫描；勿依赖系统浏览器打开 **`wxp://`**。
        另返回 **`jumpUrl`**（**`GET /pay/offline-collect/jump?t=`** + token）与 **`expiresInSeconds`**（约 **180**）作浏览器中转备用；中转 token 保存同一商户路由，确保跳转目标与二维码矩阵一致。
        收银端出码须提交 `order_no`、`session_id`（可选携带 `amount_fen`，未传或 `<=0` 时自动从当前门店未结账订单获取持久化净应付金额）。服务端先锁定订单并按门店、订单和渠道在 `t_cashier_collection_intent` 中事务占用；尚未确认的 `PENDING` 记录允许重复出码，新请求会接管该订单全部待确认扫码记录并刷新 5 分钟租约，旧页面随后不能确认或结账。若订单待收金额为 0 则返回 400 提示无需生成收款码。人工核对到账后必须调用 `/pay/offline-collect/confirm`；`CONFIRMED` 已确认款禁止其他收款会话覆盖，且不会因租约到期而释放。结账成功后标记为 `COMPLETED`。不带这三个字段的历史静态码读取继续兼容。
        同一订单、渠道再次出码时，本次 `amount_fen` 覆盖未确认记录中的历史金额；成功响应同步返回 `orderNo`、`sessionId`、`amountFen`，收银端应以这些最新字段更新当前收款页面。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id: { type: integer }
                shopId: { type: integer }
                channel:
                  type: string
                  enum: [wechat, alipay]
                  default: wechat
                order_no:
                  type: string
                  description: 收银端订单号；与 session_id 同时提供
                session_id:
                  type: string
                  maxLength: 64
                  description: 收银页面持久化的出码会话标识
                amount_fen:
                  type: integer
                  description: 本次人工扫码分摊金额（分）；未提供或<=0时自动取订单实际净应付金额
                merchant_id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: 兼容字段；仅历史静态码读取使用。收银出码时忽略该值，以 t_order.merchantId 为准
                merchantId:
                  oneOf:
                    - type: integer
                    - type: string
                  description: 同 merchant_id；不能覆盖收银订单中的 merchantId
      responses:
        '200':
          description: 成功；body 含 code、qrImageBase64（payload 矩阵）、jumpUrl、expiresInSeconds、channel、shopId；收银出码模式回显订单 merchantId，并另含最新 orderNo、sessionId、amountFen
        '400': { description: 参数错误或门店未配置对应渠道 }
        '409': { description: 同一订单已有其他收款会话确认到账，或确认收款参数不匹配 }
        '404': { description: 门店不存在 }
        '500': { description: 失败 }

  /pay/offline-collect/confirm:
    post:
      tags: [线下收款, 收银机端]
      summary: 确认人工扫码款已到账
      description: |
        收银员核对微信或支付宝到账后调用。服务端在同一事务内锁定订单和收款意图，严格校验 `X-Shop-Id`、订单未结账状态、`session_id` 和渠道，将状态从 `PENDING` 改为 `CONFIRMED`。
        相同会话和渠道重复确认幂等成功；已确认状态不会随临时二维码租约过期而被其他窗口接管。
        权威金额取该 `session_id` 最后一次出码保存在服务端的 `amount_fen`；请求中的 `amount_fen` 为旧客户端兼容字段，不会覆盖或否决服务端最新金额。成功响应返回实际确认的 `amountFen`。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no, session_id, channel, amount_fen]
              properties:
                order_no: { type: string }
                session_id: { type: string, maxLength: 64 }
                channel: { type: string, enum: [wechat, alipay] }
                amount_fen: { type: integer, minimum: 1 }
      responses:
        '200': { description: 成功或相同确认的幂等重放；body.amountFen 为服务端实际确认的最新出码金额 }
        '400': { description: 缺少门店上下文 }
        '409': { description: 订单、会话、渠道或收款状态不匹配 }

  /pay/offline-collect/cancel:
    post:
      tags: [线下收款, 收银机端]
      summary: 取消尚未确认的人工扫码收款会话
      description: |
        收银端关闭二维码或切换支付渠道时调用。服务端使用管理员 JWT 的门店上下文，仅将 `order_no`、`session_id`、`channel` 与当前门店完全匹配的 `PENDING` 记录置为 `CANCELLED`。重复调用幂等成功；`CONFIRMED` 与 `COMPLETED` 记录均不会被取消。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no, session_id, channel]
              properties:
                order_no: { type: string }
                session_id: { type: string, maxLength: 64 }
                channel: { type: string, enum: [wechat, alipay] }
      responses:
        '200': { description: 已释放或没有属于当前会话的 PENDING 记录；body.released 表示本次是否实际释放，body.releasePolicy 固定为 PENDING_ONLY_CURRENT_SESSION }
        '400': { description: 缺少门店上下文 }
        '409': { description: 参数无效、订单不存在、已结账或不属于当前门店 }

  /pay/offline-collect/jump:
    get:
      tags: [线下收款, 小程序]
      summary: 扫码中转（302 跳转收款）
      description: |
        查询参数 **`t`** 为短时 token。成功时优先返回 **302 Found**，响应头 **`Location`** 为门店配置的微信/支付宝跳转串（如 **`wxp://`**、**`https://qr.alipay.com/...`**），由微信内置浏览器**系统级跟随**，避免脚本 `location.replace(wxp://…)` 被拦截。
        若容器对自定义 scheme 重定向失败，则回退 **200** `text/html`：大号「点这里打开收款」链接 + 短时 `location.href` 弱跳转。
        过期或无效返回 **410** 与提示页。
      security: []
      parameters:
        - name: t
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: 成功；`Location` 为官方收款跳转串（客户端应跟随重定向）
        '200':
          description: 降级 HTML（大按钮打开收款；部分环境无 302 时使用）
          content:
            text/html:
              schema: { type: string }
        '410':
          description: token 已失效

  /api/v1/personal-alipay/notify:
    post:
      x-matching-policy: "自动结账仅匹配明确 shop_id 的唯一有效意向；多候选或未知门店保留流水待核对；禁止跨店反向匹配。有效期按到账时间判断，15秒容差。"
      tags: [线下收款, 支付回调]
      summary: 个人支付宝/微信收款监听 App 异步通知回调
      security: []
      description: |
        个人收款手机监听 App（如自动化通知监听客户端）到账回调。
        服务端通过请求头 `X-Signature`（HMAC-SHA256，密钥为 `WEBHOOK_SECRET`，payload 为 `${channel}\n${amount}\n${timestamp}\n${event_id}`）进行签名校验；
        支持根据 `event_id` 进行幂等去重（重复推送返回 `{"success": true, "duplicate": true}`）；
        入库记录 `t_personal_payment_event`，并自动匹配核销当前门店待确认的收款意向（`t_cashier_collection_intent`）。
        响应必须返回 HTTP 200 及 `{"success": true}`。
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
          description: "HMAC-SHA256 十六进制签名（payload: `${channel}\\n${amount}\\n${timestamp}\\n${event_id}`）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalAlipayNotifyRequest'
      responses:
        '200':
          description: 成功（含首次成功或重复幂等返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAlipayNotifyResponse'
        '401':
          description: 签名校验失败（bad signature）

  /api/v1/personal-alipay/ping:
    post:
      tags: [线下收款, 支付回调]
      summary: 个人收款监听 App 连通性测试接口（Ping）
      security: []
      description: 供 App 首页“测试服务器”按钮调用，验证服务端连通性。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

  # ---------- 收银系统扩展：收银机-桌台 ----------
  /cashier/table/open:
    post:
      tags: [收银机端]
      summary: 开台占用桌台
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|table:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: 客户端生成的操作幂等键；同门店、同动作、同键重复提交只回放首次结果
      description: |
        收银端统一开台入口。仅 `status=0` 且该门店该桌不存在未结账订单时允许开台；`status=2` 表示已结账待清台，必须先调用清台。
        成功、业务拒绝和事务回滚都会写桌台操作审计；成功更新与成功审计处于同一事务。
        小程序堂食创单会按门店 + 桌号检查该占用态，已开台占用的桌号不能被其他渠道直接下单。
        前端调用示例：
        ```js
        await request.post('/cashier/table/open', { tableNumber: 'A01' }, { header: { 'X-Shop-Id': currentShopId } })
        ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tableNumber]
              properties:
                tableNumber: { type: string, maxLength: 20, description: 桌号 }
                number: { type: string, description: 桌号别名 }
                table_number: { type: string, description: 桌号别名 }
                idempotencyKey: { type: string, maxLength: 128, description: 幂等键；也可通过 Idempotency-Key 请求头传入 }
      responses:
        '200': { description: body 含 code、msg、action、idempotent、requestId、traceId，成功时含 table；业务冲突时 code=409 }
        '500': { description: 失败 }
  /cashier/table/merge:
    post:
      tags: [收银机端]
      summary: 并台
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|table:operate
      description: |
        将源桌全部未结账订单原子迁移到目标桌，保留目标桌原有订单并释放源桌。源桌和目标桌必须属于当前门店且均为已开台状态。
        两张桌按固定顺序加行锁，订单迁移、源桌释放和审计写入在同一事务完成。
        并台后源桌订单将作为从单并入目标主桌（master_order_no 指向主单号），从单不允许单独买单，必须通过主桌统一结账。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sourceTableNumber, targetTableNumber]
              properties:
                sourceTableNumber: { type: string, maxLength: 20 }
                targetTableNumber: { type: string, maxLength: 20 }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        '200': { description: body 含 code、msg、action、idempotent、requestId、traceId，成功时含目标 table；业务冲突时 code=409 }
        '500': { description: 失败 }
  /cashier/table/transfer:
    post:
      tags: [收银机端]
      summary: 转台
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|table:operate
      description: 换台按门店隔离并在串行化事务内锁定订单、源桌、目标桌；同步修复两桌状态、order_no 指针和整桌未结金额，写入幂等审计。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, targetTableNumber]
              properties:
                orderNo: { type: string }
                targetTableNumber: { type: string }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        '200': { description: body 含 code、msg、action、idempotent、requestId、traceId；目标桌待清台或并发状态变化时 code=409 }
        '500': { description: 失败 }
  /cashier/table/clear:
    post:
      tags: [收银机端]
      summary: 清台
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|table:operate
      description: |
        释放当前门店桌台。服务端按 `shop_id + table_number` 锁定并检查该桌全部未结账订单，不依赖 `t_table.order_no` 单一指针；存在任意未结账订单时返回 `code=409`。
        `status=1`（占用）和 `status=2`（已结账待清台）均可清为 `status=0`；已是 `status=0` 时幂等成功。清台不强制结束 KDS 制作状态。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tableNumber]
              properties:
                tableNumber: { type: string, maxLength: 20 }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        '200': { description: body 含 code、msg、action、idempotent、requestId、traceId，成功时含 table；桌台不存在 code=404，仍有未结账订单 code=409 }
        '500': { description: 失败 }
  /cashier/table/checkout:
    post:
      tags: [收银机端]
      summary: 整桌结账（一键结清该桌全部未结订单）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate|table:operate
      description: |
        收银端按桌台批量结账。锁定并查询当前门店该桌台下的全部未结账订单（transac_status = 'unsettled'），
        按顺序调用收银结账链路完成各订单结账、积分累加、优惠券核销及小票打印。
        并台场景下的主单与从单统一在此处整桌结算（从单不支持单笔买单）。
        支持现金支付（含实收金额与找零计算）及其他线上/离线渠道。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tableNumber]
              properties:
                tableNumber: { type: string, maxLength: 20, description: 桌号 }
                paymentMethod: { type: string, description: 支付方式（默认 cash） }
                cashAmount: { type: number, description: 现金实收金额（用于现金结账找零计算） }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 整桌结账成功，body 含 tableNumber、settledOrders、totalAmount、cashAmount、changeAmount、table
        '400': { description: 实收金额不足或参数错误 }
        '404': { description: 桌台不存在 }
        '500': { description: 失败或该桌台暂无待结账订单 }
  /cashier/table/statusMap:
    get:
      tags: [收银机端]
      summary: 桌台状态图（按区域聚合）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - name: shopId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、map（桌号 -> status）或 list
        '500': { description: 失败 }

  # ---------- 收银系统扩展：收银机-点餐/结账 ----------
  /cashier/order/quickOrder:
    post:
      tags: [收银机端]
      summary: 快速点餐（收银机）
      description: |
        **`goods_list`** 支持与普通下单相同的 **套餐请求行**（**`combo_id`**、**`combo_selections`** 等），内部转发 **`POST /order/create`** 逻辑。收银端下单豁免套餐商业化运营规则限制（单单限购、单人周期限购、可用星期、可用时段、用餐方式限制及活动生效起止日期），仅保留套餐存在且未停用校验。
        `dineInOrTakeOut=堂食` 时必须传有效 `tableNumber`；`打包`（兼容 `pickup/takeout/外带`）不校验桌台是否存在，且可以不传桌号。兼容 `diningType`、`orderType`、`order_type` 类型字段及 `table_number` 桌号字段。
        打包订单按商品小计每 100 元区间收 1 元打包费：0 元不收，(0,100] 收 1 元，(100,200] 收 2 元，以此类推。`sett_amount` 为商品小计加打包费。
        堂食按门店+桌号串行并锁定桌台行；`status=2`（已结账待清台）必须先清台。新单先写 `mis_order`，事务提交后才执行接单、打印和 KDS；打印失败保留待接单并由补偿任务重试。
        普通菜按 `dish_id` 校验名称，并使用 `t_dish_shop.unitprice` 优先、`t_dish.unitprice` 兜底；未传 `dish_id` 且当前门店存在同名菜时拒绝下单。
        携带 `X-Client-Request-Id` 时，同门店、同键、同请求体在 24 小时内精确回放首次成功响应；同键不同请求体或跨接口复用返回 `code=409` 且不创建第二笔订单。失败响应释放键供修正后重试。不携带时保持旧版行为。
        `client_line_id` 可随每个请求行传入；套餐头行记录对应的 client_line_id，展开后的子菜组件行（combo_component）属于内部明细，通过 parent_detail_id 关联套餐头行，不占用独立客户端行号以避免唯一键约束冲突。成功响应发生在订单、明细、库存事务提交后，固定返回 `accepted=true`、`fulfillment_status=ready`；`cloud_acceptance_status` 才表示云端厨房接单状态。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [goods_list]
              properties:
                tableNumber: { type: string, description: 堂食必填且须为当前门店有效桌号；打包可不传，传入时不校验存在性 }
                table_number: { type: string, description: tableNumber 的兼容字段 }
                dineInOrTakeOut: { type: string, enum: [堂食, 打包], default: 堂食 }
                diningType: { type: string, description: dineInOrTakeOut 的兼容字段，支持 pickup/takeout/外带 }
                orderType: { type: string, description: dineInOrTakeOut 的兼容字段 }
                number_of_diners: { type: integer }
                goods_list: { type: array, items: { $ref: '#/components/schemas/OrderDetail' } }
                remark: { type: string }
      responses:
        '200':
          description: 成功，body 含 code、正式 order_no、正式 id、accepted=true、fulfillment_status=ready、cloud_acceptance_status、order_details、printSuccess；打包订单另含 packaging_fee、sett_amount
        '500': { description: 失败 }
  /cashier/order/addDishes:
    post:
      tags: [收银机端]
      summary: 加菜（收银机）
      description: |
        **`goods_list`** 支持套餐请求行，内部转发 **`POST /order/addDishes`**。收银端加菜同享商业化规则豁免（限购、可用时段等限制不阻断收银加菜）。
        成功加菜保持订单首次创建的 **`order_time`** 不变，仅更新明细、金额、费用、优惠及加菜轮次。
        携带 `X-Client-Request-Id` 时，同门店、同键在 24 小时内精确回放首次响应；同键跨接口复用返回 `code=409`。不携带时保持旧版行为。
        可选 `expectedVersion`（兼容 `expected_version`）用于订单乐观并发控制；成功返回递增后的 `revision`，冲突时不得盲重试。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no, table_number, goods_list]
              properties:
                order_no: { type: string }
                table_number: { type: string }
                goods_list: { type: array, items: { $ref: '#/components/schemas/OrderDetail' } }
                remark: { type: string }
                expectedVersion: { type: integer, minimum: 0, description: 客户端读取到的订单 revision；省略保持旧客户端兼容 }
                expected_version: { type: integer, minimum: 0, deprecated: true, description: expectedVersion 的兼容别名 }
      responses:
        '200': { description: 成功，body 含递增后的 revision }
        '409': { description: 订单版本冲突；error_code=ORDER_VERSION_CONFLICT，data 为最新订单摘要 }
        '500': { description: 失败 }
  /cashier/order/refundDish:
    post:
      tags: [收银机端]
      summary: 退菜
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        未支付订单退菜：整行或部分退 **`quantity`** 份；动作执行要求 `order:operate:refund`，仅入口权限返回 `REQUIRE_APPROVAL`，支持严格 `approvalToken` 或兼容现场凭证审批。标记 **`line_status=refunded`**（整行）或减数量，按 **`stock_action`**（默认 RESTORE 回退；NO_RESTORE 损耗不回退；OUT_OF_STOCK 缺货清零并置售罄）处理库存并 KDS void，重算 **`sett_amount`** 与服务费。服务端按当前门店锁定订单及明细，并与结账串行化。客户端应携带 `X-Client-Request-Id`。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no, detail_id, quantity]
              properties:
                authorization: { $ref: '#/components/schemas/SensitiveOperationAuthorization' }
                approvalToken: { type: string, description: 严格绑定的一次性退款审批令牌 }
                order_no: { type: string, description: 订单号 }
                detail_id: { type: integer, description: 订单明细 ID }
                quantity: { type: integer, minimum: 1, description: 退菜份数 }
                stock_action:
                  $ref: '#/components/schemas/RefundStockAction'
                reason: { type: string, description: 退菜原因 }
                remark: { type: string, description: 备注 }
                expectedVersion: { type: integer, minimum: 0, description: 客户端读取到的订单 revision；省略保持兼容 }
                expected_version: { type: integer, minimum: 0, deprecated: true, description: expectedVersion 的兼容别名 }
      responses:
        '200': { description: 成功，body 含递增后的 revision }
        '409': { description: 订单版本冲突；审批令牌不会被消费，data 为最新订单摘要 }
        '500': { description: 失败 }
  /cashier/order/refund:
    post:
      tags: [收银机端]
      summary: 人工退款（现金/组合支付订单）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        已支付订单的**线下人工退款**（现金/组合支付订单）：服务端按当前门店锁定订单，先写入负向 `REFUND` 权威流水并以 `original_ledger_id` 关联原现金 `PAYMENT`，再原子累加 **`t_order.refund_amount`**、扣减 **`pay_amount_cash`** 并追加 remark「【人工退款·现金】」；任一步失败全部回滚。默认退「现金列剩余 ∩ 剩余可退」全部；现金列已清零时拒绝（防止误扣微信/余额列）。客户端应携带 `X-Client-Request-Id` 作为退款幂等号；相同幂等号事实不一致时拒绝。纯微信/纯余额订单请走 `/admin/order/refund`；组合订单现金部分用本接口，微信部分经商户平台退款后由 `/order/refund/notify` 回调入账。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                authorization: { $ref: '#/components/schemas/SensitiveOperationAuthorization' }
                approvalToken: { type: string, description: '店长审批授权令牌 (通过 /cashier/access/authorize 现场授权签发，优先原子核销)' }
                order_no: { type: string, description: 订单号 }
                refundAmount: { type: number, minimum: 0.01, description: 可选，本次人工退款金额（元）；默认退现金列剩余与剩余可退的较小值 }
                refund_amount: { type: number, minimum: 0.01, description: refundAmount 的别名 }
                reason: { type: string, description: 退款原因，追加到订单 remark }
                remark: { type: string, description: 备注别名 }
      responses:
        '200':
          description: 成功，body 含 refund_amount（本次退款）、refund_total（累计退款）、cash_remaining（现金列剩余）
        '500':
          description: 失败（订单非已支付、无可退金额、无现金渠道可退、退款超限等）

  /cashier/access/authorize:
    post:
      tags: [收银机端, 权限管理]
      summary: 店长现场授权（凭证验证与签发审批 Token）
      description: |
        收银员触发敏感操作时签发一次性短期（120秒）审批 Token。
        `bindingVersion=2` 启用严格绑定：必须提供真实 `bizType`/`bizId` 与稳定 `terminalId`，
        核销时动作、资源、金额（双方均空或数值完全相等）、操作者、门店和终端必须全部一致。
        未传版本暂按 v1 兼容并返回 `legacyBinding=true`；v1 仅用于迁移观察。
        授权人必须拥有目标动作的精确 `<permission>:approve` 权限（`admin:super` 除外）。
        10 次/60秒后进入 300 秒请求限流；凭据连续失败 5 次进入 900 秒失败限流。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizerAccount, credential, permission]
              properties:
                authorizerAccount: { type: string, description: '店长工号或用户名' }
                credential: { type: string, description: '店长密码或6位PIN码' }
                authMethod: { type: string, enum: [PASSWORD, PIN], default: PASSWORD, description: '认证方式' }
                permission: { type: string, example: 'order:operate:refund', description: '待授权的精确业务动作权限码' }
                bizType: { type: string, example: 'ORDER', description: '资源类型；v2 必须与核销端一致，订单类操作统一使用 ORDER' }
                bizId: { type: string, description: '业务关联主键（如订单号）' }
                amount: { type: number, description: '涉及金额' }
                reason: { type: string, description: '授权申请原因' }
                requestId: { type: string, description: '客户端幂等请求ID' }
                terminalId: { type: string, description: '收银终端编号' }
                bindingVersion: { type: integer, enum: [1, 2], default: 1, description: '审批绑定策略；2=严格绑定，省略时为兼容 v1' }
      responses:
        '200':
          description: 授权成功，返回 approvalToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalNo: { type: string }
                  approvalToken: { type: string }
                  permission: { type: string }
                  requiredApprovalPermission: { type: string, example: 'order:operate:refund:approve' }
                  operatorId: { type: integer }
                  authorizerId: { type: integer }
                  authorizerName: { type: string }
                  shopId: { type: integer }
                  expiresAt: { type: string }
                  expireSeconds: { type: integer }
                  bindingVersion: { type: integer, enum: [1, 2] }
                  legacyBinding: { type: boolean, description: 'true 表示兼容绑定，客户端应迁移到 v2' }
        '401': { description: 店长凭据错误 / PIN错误 }
        '403': { description: 店长账号停用 / 无管辖门店 / 无审批权限 }
        '429':
          description: 审批请求或凭据失败次数超限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRateLimitError' }

  /cashier/access/qr/create:
    post:
      tags: [收银机端, 权限管理]
      summary: 收银端发起动态二维码扫码授权申请
      description: 收银员触发敏感操作时生成动态授权二维码。`bindingVersion=2` 的字段和核销语义与 `/cashier/access/authorize` 相同。
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: { type: string, example: 'order:operate:refund', description: '待授权的精确业务动作权限码' }
                bizType: { type: string, example: 'ORDER', description: '资源类型；v2 必须与核销端一致，订单类操作统一使用 ORDER' }
                bizId: { type: string, description: '业务关联主键（如订单号）' }
                amount: { type: number, description: '涉及金额' }
                reason: { type: string, description: '授权申请原因' }
                requestId: { type: string, description: '客户端幂等请求ID' }
                terminalId: { type: string, description: '收银终端编号' }
                bindingVersion: { type: integer, enum: [1, 2], default: 1, description: '审批绑定策略；2=严格绑定' }
      responses:
        '200':
          description: 二维码生成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalCode: { type: string, description: '扫码授权流水标识' }
                  qrPayload: { type: string, description: '二维码短链/唤起协议串' }
                  status: { type: string, example: 'PENDING' }
                  expiresAt: { type: string }
                  expireSeconds: { type: integer, example: 120 }
                  bindingVersion: { type: integer, enum: [1, 2] }
                  legacyBinding: { type: boolean }
                  requiredApprovalPermission: { type: string, example: 'order:operate:refund:approve' }
        '429':
          description: 同一操作人/门店二维码创建超过 10 次/60秒，阻断 300 秒
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRateLimitError' }

  /cashier/access/qr/status:
    get:
      tags: [收银机端, 权限管理]
      summary: 收银端轮询扫码授权审批状态
      description: 收银端展示二维码后轮询该接口获取店长移动端审批结果，成功后提取 approvalToken。数据库仅保存 SHA-256 哈希与使用审批号作 AAD 的 AES-256-GCM 短期加密信封；任意配置相同 APPROVAL_TOKEN_ENVELOPE_KEY 的实例均可安全提取。核销后清空信封，仅 APPROVED 且 120 秒有效期内可见；密钥缺失、密文篡改或哈希不一致时 fail closed。
      security: [{ BearerAuth: [] }]
      parameters:
        - name: approvalCode
          in: query
          required: true
          schema: { type: string }
          description: '扫码授权申请标识码'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalCode: { type: string }
                  status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
                  approvalToken: { type: string, description: '店长同意后返回的短期单次令牌' }
                  authorizerId: { type: integer }
                  authorizerName: { type: string }
                  expiresAt: { type: string }
                  bindingVersion: { type: integer, enum: [1, 2] }
                  legacyBinding: { type: boolean }
        '503': { description: 审批令牌信封密钥缺失、密文认证失败或哈希校验失败；令牌不会返回，请重新发起授权或检查部署配置 }

  /admin/access/qr/details:
    get:
      tags: [权限管理, 管理端]
      summary: 店长手机端扫码获取待审批详情
      description: 店长移动端扫收银机屏幕上的二维码后调用，展示申请门店、操作员、业务类型、金额及原因。
      security: [{ BearerAuth: [] }]
      parameters:
        - name: approvalCode
          in: query
          required: true
          schema: { type: string }
          description: '扫码授权申请标识码'
      responses:
        '200':
          description: 获取详情成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalCode: { type: string }
                  shopId: { type: integer }
                  permission: { type: string }
                  requiredApprovalPermission: { type: string, example: 'order:operate:refund:approve' }
                  bizType: { type: string }
                  bizId: { type: string }
                  amount: { type: number }
                  reason: { type: string }
                  operatorId: { type: integer }
                  operatorName: { type: string }
                  operatorWorkNo: { type: string }
                  expiresAt: { type: string }
                  bindingVersion: { type: integer, enum: [1, 2] }
                  legacyBinding: { type: boolean }
        '403': { description: 店长无该门店管辖权限 }
        '400': { description: 申请已过期 }

  /admin/access/qr/confirm:
    post:
      tags: [权限管理, 管理端]
      summary: 店长手机端确认或驳回扫码审批
      description: 店长在手机端核实信息后点击同意或拒绝；AGREE 与 REJECT 均要求目标动作精确 `<permission>:approve` 权限（仅 `admin:super` 旁路），同意时服务端签发单次有效 Token。
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalCode, action]
              properties:
                approvalCode: { type: string, description: '授权申请标识码' }
                action: { type: string, enum: [AGREE, REJECT], description: '审批动作' }
                rejectReason: { type: string, description: '驳回原因' }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalCode: { type: string }
                  status: { type: string, enum: [APPROVED, REJECTED] }
                  authorizerId: { type: integer }
                  authorizerName: { type: string }
        '403': { description: 缺少精确动作审批权限；data.requiredApprovalPermission 返回所需权限码 }
        '429':
          description: 同一审批人/门店确认超过 20 次/60秒，阻断 300 秒
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRateLimitError' }

  /cashier/order/updatePrice:
    post:
      tags: [收银机端]
      summary: 改价或赠送菜品
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        仅允许修改当前门店的未结账订单。`total_price=0` 表示赠送该明细，并记订单操作 `gift_dish`；
        修改明细、重算订单商品金额/服务费以及同步 `t_table.amount` 在同一事务完成。执行要求 `order:operate:changePrice`；仅入口权限返回 `REQUIRE_APPROVAL`。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no, detail_id, total_price]
              properties:
                authorization: { $ref: '#/components/schemas/SensitiveOperationAuthorization' }
                approvalToken: { type: string, description: 严格绑定的一次性改价审批令牌 }
                order_no: { type: string }
                detail_id: { type: integer }
                total_price: { type: number, minimum: 0, description: 明细新总价；0 表示赠送菜品 }
                expectedVersion: { type: integer, minimum: 0, description: 客户端读取到的订单 revision；省略保持兼容 }
                expected_version: { type: integer, minimum: 0, deprecated: true, description: expectedVersion 的兼容别名 }
      responses:
        '200': { description: 成功，body 含 msg、sett_amount、service_fee、revision }
        '409': { description: 订单版本冲突；审批令牌不会被消费，data 为最新订单摘要 }
        '500': { description: 失败 }
  /cashier/order/discount:
    post:
      tags: [收银机端]
      summary: 手动打折/优惠（未结账订单）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        对当前门店 `transac_status=unsettled` 订单写入 `discount_amount`，并同步堂食桌台全部未结订单合计金额及操作日志。
        优惠方式至少传一项：`discountAmount` 直接设置优惠金额；`payRate` 为实付倍率（如 0.9=九折）；`wipeZero` 在应付金额上抹零。可传 `reason` 写入订单备注。
        兼容 snake_case 字段。成功响应字段与原 `/admin/order/manualDiscount` 保持一致。执行要求 `order:operate:discount`；审批金额绑定服务端计算后的实际优惠额。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization: { $ref: '#/components/schemas/SensitiveOperationAuthorization' }
                approvalToken: { type: string, description: 严格绑定的一次性优惠审批令牌 }
                orderId: { type: integer, description: 与 orderNo 二选一 }
                orderNo: { type: string, description: 与 orderId 二选一 }
                order_no: { type: string, description: orderNo 的兼容字段 }
                discountAmount: { type: number, description: 固定优惠金额，覆盖原值 }
                discount_amount: { type: number, description: discountAmount 的兼容字段 }
                payRate: { type: number, minimum: 0, maximum: 1, description: 实付倍率，如0.9表示九折 }
                pay_rate: { type: number, description: payRate 的兼容字段 }
                wipeZero: { type: boolean, description: 是否抹零 }
                wipe_zero: { type: boolean, description: wipeZero 的兼容字段 }
                reason: { type: string, description: 优惠原因，写入订单备注 }
                expectedVersion: { type: integer, minimum: 0, description: 客户端读取到的订单 revision；省略保持兼容 }
                expected_version: { type: integer, minimum: 0, deprecated: true, description: expectedVersion 的兼容别名 }
      responses:
        '200': { description: 成功，body 含 order、grossYuan、discount_amount、payableYuan、revision }
        '409': { description: 订单版本冲突；审批令牌不会被消费，data 为最新订单摘要 }
        '500': { description: 失败 }

  /cashier/orders/{orderId}/details:
    get:
      tags: [收银机端]
      summary: 获取正式订单 KDS 重建快照
      description: 只读且可安全重试；只返回当前登录门店订单。quantity 为原始下单数量，refunded_quantity 为累计退款数，remaining_quantity 为当前有效数量。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 成功，body 含 code、order 与 lines；lines 使用正式 detail_id 并包含退款/套餐/客户端行映射字段
        '404': { description: 订单不存在或不属于当前门店 }
  /cashier/order/printContent:
    get:
      tags: [收银机端]
      summary: 生成订单小票内容并下发打印
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        按当前门店和订单主键读取订单，生成小票内容并下发该门店飞鹅打印机。`type=false` 为预结单/结账单，`type=true` 为加菜单。
        成功调用记录 `print_content` 操作日志；打印机调用失败时仍返回生成的 content，且 printSuccess=false。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderId
          in: query
          required: true
          schema: { type: integer }
        - name: type
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { description: 成功，body 含 content、printSuccess、order_no；订单不属于当前门店时 code 非0 }
        '500': { description: 订单不存在、无明细或打印处理失败 }
  /cashier/payment/wechat/micropay/orders:
    post:
      tags: [收银机端]
      summary: 扫描顾客微信付款码并发起支付
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: 金额、门店和商户均由服务端确定；authCode 仅用于本次请求，不持久化、不回显。USERPAYING/UNKNOWN 时必须查询，不得重复扫码或改用其他渠道。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo, authCode]
              properties:
                orderNo: { type: string }
                order_no: { type: string, description: 同 orderNo }
                authCode: { type: string, pattern: '^1[0-5][0-9]{16}$', description: 微信付款码，一次性敏感值 }
                auth_code: { type: string, pattern: '^1[0-5][0-9]{16}$', description: 同 authCode }
                terminalId: { type: string, maxLength: 64 }
                terminal_id: { type: string, maxLength: 64, description: 同 terminalId }
      responses:
        '200':
          description: code=0 表示 SUCCESS 或 USERPAYING；非零时按 msg 处理，未知结果必须继续查单
  /cashier/payment/wechat/micropay/orders/{orderNo}:
    get:
      tags: [收银机端]
      summary: 查询微信付款码支付状态并补偿入账
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 返回 paymentId/orderNo/outTradeNo/amountFen/tradeState/status/transactionId }
  /cashier/payment/wechat/micropay/orders/{orderNo}/reverse:
    post:
      tags: [收银机端]
      summary: 查单后安全撤销付款码交易
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: 创建满 15 秒后可调用；服务端先查单，已成功交易只入账不撤销。撤销使用商户 P12 客户端证书。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: code=0 表示已撤销、幂等撤销或查单确认已支付 }
  /cashier/payment/wechat/native/orders:
    post:
      tags: [收银机端]
      summary: 创建或复用微信 Native 动态支付二维码
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        按当前登录门店和订单号向微信统一下单并生成展示 Native 动态支付二维码，支持以下核心机制：
        - **金额服务端闭环计算**：支付金额严格由服务端依据订单净应付金额（`netRevenueFen`）计算得出，客户端请求体无法指定金额（传金额无效且不被接收），杜绝篡改金额风险。
        - **独立开关控制**：独立使用收银端微信支付开关（`clients.cashier.channels.wechat` / `cashierWechatEnabled`），仅当门店收银端微信开启且微信商户配置就绪时可用；**完全不受小程序端微信支付开关影响**。
        - **保留原有微信收款码渠道**：原有微信收款码渠道（`wechat_qr` / `offline_wechat_qr`，人工核验到账）完整保留并存，互不影响。
        - **商户凭据与响应可信校验**：继续复用当前门店既有微信商户号、商户 API 证书序列号和私钥签名；微信返回的 `code_url` 仅在平台公钥 ID、五分钟时间窗口及 `Wechatpay-*` 响应签名全部校验通过后才会被接受。
        - **失败结果分流**：微信明确返回 HTTP 4xx 时返回 `code=40231` 并释放本地活动占用；微信 5xx、网络/超时、验签或报文异常仍返回 `code=50331` 并保持 `UNKNOWN`，客户端必须先查单。
        - **二维码有效复用**：同一订单存在金额一致且未过期的 `ACTIVE` 支付尝试时，直接复用已生成的 `codeUrl` 与 `paymentId`（`reused: true`），避免频繁创建微信单。
        - **并发防重与未知状态阻断**：基于数据库唯一索引 `active_key` (`shop_id:order_no`) 拦截并发重复出码；并发请求观察到 `CREATING` 或唯一键竞争时，会短暂有界等待并复用胜出请求生成的有效二维码，且不会再次调用微信下单；等待超时或状态仍不确定时返回 `code=40931`。微信下单抛出异常时将本地尝试置为 `UNKNOWN` 并返回 `code=50331`，强制收银端必须先发起主动查单，严禁未知状态下重新出码导致重复收款。
        - **订单前置校验**：订单必须属于当前门店、非并台从单（从单须主桌统一结账）、交易状态必须为未结（`transac_status = 'unsettled'`），已支付订单返回 `code=40934`，净应付金额必须大于 0。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNo]
              properties:
                orderNo: { type: string, description: '订单编号' }
                order_no: { type: string, description: '同 orderNo（兼容别名）' }
                terminalId: { type: string, maxLength: 64, description: '可选，收银机终端设备标识（如 POS-01）' }
                terminal_id: { type: string, maxLength: 64, description: '同 terminalId（兼容别名）' }
      responses:
        '200':
          description: 业务响应；code=0 时返回动态支付二维码信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0, description: '业务状态码（0 成功，401 缺少门店上下文，40231 微信明确拒绝下单，40931 正在创建或上一笔结果待确认，40934 订单已支付，50331 微信下单结果不确定请查单，50011 渠道未开启，50012 商户未配置，500 业务校验失败）' }
                  msg: { type: string, description: '提示信息（失败时包含详细原因）' }
                  wechatCode: { type: string, description: '微信明确拒绝时的安全化错误码，仅 code=40231 时可能返回' }
                  requestId: { type: string, description: '微信 Request-ID，仅 code=40231 时可能返回，供服务端排障' }
                  paymentId: { type: integer, format: int64, description: '支付尝试记录 ID' }
                  orderNo: { type: string, description: '订单编号' }
                  outTradeNo: { type: string, description: '微信统一下单商户单号（格式：orderNo_timestamp）' }
                  codeUrl: { type: string, description: '微信 Native 二维码链接（收银端用于渲染动态支付二维码）' }
                  amountFen: { type: integer, description: '服务端依据订单净应付严格计算出的实付金额（单位：分）' }
                  expiresAt: { type: string, format: date-time, description: '动态二维码过期时间（默认 5 分钟）' }
                  tradeState: { type: string, example: NOTPAY, description: '交易状态（默认 NOTPAY）' }
                  reused: { type: boolean, description: '是否复用之前生成的有效支付二维码' }
  /cashier/payment/wechat/native/orders/{orderNo}:
    get:
      tags: [收银机端]
      summary: 主动查询微信 Native 支付状态并补偿入账
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        向微信支付官方权威接口主动查询该订单最新 Native 支付尝试的交易状态，具备以下核心能力：
        - **补偿异步回调丢失**：若微信官方返回 `SUCCESS`，由服务端统一入账引擎（`WechatPaymentSuccessService`）原子执行与微信异步回调完全相同的幂等入账逻辑，即使公网回调丢失或收银局域网延迟也能确保订单秒级完成结算。
        - **同步响应验签**：交易状态只有在平台公钥 ID、五分钟时间窗口及 `Wechatpay-*` RSA-SHA256 响应签名校验通过后才会进入业务字段校验与补偿入账；验签失败按查单暂时失败处理，不改变支付成功状态。
        - **五维严格安全校验**：严格校验 `out_trade_no` 一致性、实付金额与服务端应付金额完全一致、交易类型（`trade_type` 必须为 `NATIVE` 或 `JSAPI`）、商户号 `mchid` 以及应用标识 `appid`。
        - **全链路业务履约复用**：订单入账成功后，自动执行标准履约副作用：
          - 记录不可变支付台账（`PaymentLedger`）；
          - 触发飞鹅/本地结账单与后厨小票打印调度；
          - 堂食订单自动更新桌台状态为闲置并清台；
          - 联动 KDS 厨显工单流转；
          - 外卖订单联动通知配送系统；
          - 订单后续退款继续使用系统统一微信退款能力（`/admin/order/refund`），对账流程复用微信官方对账单导入与勾稽。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
          description: '订单编号'
      responses:
        '200':
          description: 业务响应；code=0 时返回查单及入账结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0, description: '业务状态码（0 成功，401 缺少门店上下文，40431 查无记录，40932 入账处理冲突或校验失败，50332 微信查单暂时失败，500 订单不存在）' }
                  msg: { type: string, description: '提示信息' }
                  paymentId: { type: integer, format: int64, description: '支付尝试记录 ID' }
                  orderNo: { type: string, description: '订单编号' }
                  outTradeNo: { type: string, description: '商户单号' }
                  amountFen: { type: integer, description: '支付金额（分）' }
                  tradeState: { type: string, example: SUCCESS, description: '微信官方权威交易状态（SUCCESS-支付成功，NOTPAY-未支付，CLOSED-已关闭，REVOKED-已撤销，USERPAYING-用户支付中，PAYERROR-支付失败）' }
                  status: { type: string, example: SUCCESS, description: '本地支付尝试内部状态（ACTIVE, SUCCESS, CLOSED, UNKNOWN）' }
                  transactionId: { type: string, description: '微信支付官方订单号（SUCCESS 时非空）' }
  /cashier/payment/wechat/native/orders/{orderNo}/close:
    post:
      tags: [收银机端]
      summary: 关闭未支付的微信 Native 支付单
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        仅用于主动关闭未支付的微信 Native 支付尝试（例如顾客改选现金/其它渠道支付，或取消结账）：
        - **同步响应验签**：微信关单响应必须通过平台公钥 ID、五分钟时间窗口及 `Wechatpay-*` RSA-SHA256 签名校验；验签失败不得将本地尝试标记为已关闭。
        - **防误关单保护**：若本地订单已被标记为支付成功（`transac_status = 'success'`），强制拦截拒绝关单并返回 `code=40933`（"订单已支付，不能关单"），防止因竞态误关已到账交易。
        - **幂等安全关闭**：若本地已无活动支付尝试，直接幂等返回成功（`closed: true`, `idempotent: true`）；存在活动尝试时，向微信发起权威关单并同步将本地状态置为 `CLOSED`、将数据库 `active_key` 写为 NULL。释放后同一订单可再次创建新的 Native 支付单。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
          description: '订单编号'
      responses:
        '200':
          description: 业务响应；code=0 表示已关闭或幂等关闭
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0, description: '业务状态码（0 成功，401 缺少门店上下文，40933 订单已支付不能关单，50333 微信关单失败需先查单，500 订单不存在）' }
                  msg: { type: string, description: '提示信息' }
                  closed: { type: boolean, example: true, description: '是否已关闭' }
                  idempotent: { type: boolean, description: '若此前已无活动支付尝试则为 true（幂等成功）' }
                  outTradeNo: { type: string, description: '被成功关单的商户订单号（真实发起微信关单时返回）' }
  /cashier/order/checkout:
    post:
      tags: [收银机端]
      summary: 结账（收银机）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        以 `X-Shop-Id + order_no` 锁定订单并在一个数据库事务内完成渠道/分项/会员校验、余额本金与赠送金拆分扣减、优惠券核销、权威支付流水、订单结算及桌台更新；任一步失败会整体回滚。写入顺序固定为：收敛活动 JSAPI 交易 → 写入/精确校验 `t_payment_ledger` → 更新 `t_order` 结清状态。若 JSAPI 已支付或状态不确定、订单已有另一笔成功支付流水、流水渠道/金额/第三方交易号不一致，均拒绝手工结账；流水落库失败时订单不会进入成功状态。
        同一订单相同支付方式的重复或并发请求幂等返回，不会重复扣减余额；已用不同支付方式结账时拒绝请求。默认 **`payment_method=cash`**。仅接受支付目录已登记的稳定 code、兼容旧 code 或标准中文名，未知文案直接拒绝，避免只写余额渠道而未真实扣款。
        推荐使用统一渠道 code；`online_combined` 支持 `cash`、`offline_wechat_qr`、`offline_alipay_qr`、`online_balance` 中任意至少两个正数分项，四个分项合计必须精确等于应付金额，且每个分项渠道须已在当前门店启用。微信/支付宝分项必须由收银端展示临时收款码并人工确认到账后提交。
        余额分项可小于应付总额；只扣该分项，并按会员当前 `principal_balance + gift_balance` 的既有比例以分为单位拆分。请求可显式传付款会员 `openid`；仅当锁定订单的 `openid` / `pay_openid` 已携带同一付款会员身份时才可省略。提交身份与订单身份不一致时拒绝；最终解析出的会员账户必须已绑定非空手机号。传 `member_phone` 时还必须与该账户及订单绑定手机号一致。
        当余额分项等于全部应付金额时，订单存在 `discount_amount` 或已绑定优惠券会被拒绝；真实组合支付中的部分余额仍允许与优惠并存。
        成功响应返回规范化 `split`（含 `balance_principal` / `balance_gift`）及最新 `remaining_balance`、`remaining_principal_balance`、`remaining_gift_balance`。
        支持找零字段：**`checkout_cash_tender`**、**`checkout_change_amount`**、**`checkout_change_channel`**（与运营结账一致）。
        支持在到账确认前更换支付方式：历史 `PENDING` 扫码意图不会阻止改用现金、余额或其他扫码渠道，后端会在订单锁事务内自动将最终支付不再使用的待确认记录置为 `CANCELLED`。微信/支付宝分项必须逐渠道存在同一 `collection_session_id` 的 `CONFIRMED` 意图且分金额完全一致；任何已确认到账但不在最终支付分摊中的扫码款仍拒绝结账，须先完成退款与账务核对。订单锁与收款意图锁采用固定顺序，避免出码与结账竞态。
        携带 `X-Client-Request-Id` 时，同门店、同键在 24 小时内精确回放首次响应；同键跨接口复用返回 `code=409`。不携带时保持旧版行为。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no: { type: string }
                orderNo: { type: string, description: '同 order_no' }
                payment_method: { type: string, description: '统一支付渠道 code、响应字段名（如 cashier_wechat_enabled）、JSON 路径（如 clients.cashier.channels.wechat / cashier.wechat / offlineCollect.wechat）或业务中文名（如 微信支付 / 微信收款码 / 现金 / 余额支付 / 组合支付）' }
                paymentMethod: { type: string, description: '同 payment_method' }
                openid: { type: string, description: '余额分项大于 0 时用于指定付款会员；仅锁定订单的 openid/pay_openid 已携带同一付款会员身份时可省略，解析后的会员必须已绑定手机号' }
                member_phone: { type: string, description: '可选；传入时必须与 openid 及订单绑定会员一致' }
                pay_amount_wechat: { type: number, description: '组合支付微信部分（元）' }
                pay_amount_alipay: { type: number, description: '组合支付支付宝部分（元）' }
                pay_amount_balance: { type: number, description: '组合支付余额总部分（元）；服务端再拆为本金/赠送金' }
                cash_amount: { type: number, description: '现金实收部分（元）' }
                pay_amount_cash: { type: number, description: '组合支付分项中的现金分配金额（元）；计入 online_combined 四渠道精确合计，不表示客人递交的现金总额' }
                checkout_cash_tender: { type: number, description: '客人实际递交的现金总额（元），与 pay_amount_cash 的现金分配分开记录' }
                checkout_change_amount: { type: number, description: '找零金额（元），与 pay_amount_cash 的现金分配分开记录' }
                checkout_change_channel: { type: string, enum: [wechat, cash, alipay] }
                change_channel: { type: string }
                collection_session_id: { type: string, maxLength: 64, description: '微信/支付宝扫码分项大于 0 时必填；必须与已确认到账的收款会话一致' }
                request_id: { type: string, description: '结算台账幂等请求防重键（唯一），用于防止重复划账' }
                terminal_id: { type: string, description: '收银端设备终端标识（如 CASHIER-01）' }
                drawer_session_id: { type: integer, format: int64, description: '关联钱箱开闭会话 ID' }
                employee_shift_id: { type: integer, format: int64, description: '关联当班班次 ID' }
                operator_id: { type: integer, description: '执行收银操作员 ID（为空时自动读取登录身份）' }
                business_day: { type: string, format: date, description: '归属营业日（YYYY-MM-DD，若不传则依据门店 settle_time 自动计算）' }
                force: { type: boolean, description: '是否强制结账（需要 admin:manage 权限），放行收款意向冲突并收敛所有意向' }
                approvalToken: { type: string, description: '店长审批令牌（用于普通收银员授权调用强制结账）' }
      responses:
        '200':
          description: 成功（业务 code=0）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  order_no: { type: string }
                  idempotent: { type: boolean, description: '是否为已结订单的幂等重放' }
                  forced: { type: boolean, description: '是否为特权强制结账' }
                  payment_method: { type: string }
                  payment_channel_code: { type: string }
                  payableYuan: { type: number }
                  split:
                    type: object
                    properties:
                      wechat: { type: number }
                      alipay: { type: number }
                      cash: { type: number }
                      balance: { type: number }
                      balance_principal: { type: number }
                      balance_gift: { type: number }
                  remaining_balance: { type: number }
                  remaining_principal_balance: { type: number }
                  remaining_gift_balance: { type: number }
        '403': { description: 权限不足（缺少 admin:manage 权限） }
        '500': { description: 失败 }

  /cashier/order/force-checkout:
    post:
      tags: [收银机端]
      summary: 强制结账（需要 admin:manage 权限）
      security: [{ BearerAuth: [] }]
      x-permission: admin:manage
      description: |
        收银端强制结账专用接口，自动携带 `force=true`。
        当订单存在未入账的其他收款会话冲突时，持有 `admin:manage` 权限的管理员、店长或通过现场密码/审批令牌授权的操作员可强制放行并完成入账，
        结账成功后原子收敛该订单名下所有待确认与已确认收款意向为 COMPLETED，记录特权安全审计日志并返回 `forced: true`。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
        - $ref: '#/components/parameters/XClientRequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no: { type: string }
                orderNo: { type: string }
                payment_method: { type: string }
                paymentMethod: { type: string }
                openid: { type: string }
                member_phone: { type: string }
                pay_amount_wechat: { type: number }
                pay_amount_alipay: { type: number }
                pay_amount_balance: { type: number }
                cash_amount: { type: number }
                pay_amount_cash: { type: number }
                checkout_cash_tender: { type: number }
                checkout_change_amount: { type: number }
                checkout_change_channel: { type: string, enum: [wechat, cash, alipay] }
                approvalToken: { type: string, description: '可选，店长审批令牌' }
      responses:
        '200':
          description: '强制结账成功（body 含 forced: true）'
        '403':
          description: 权限不足（缺少 admin:manage）
        '500':
          description: 失败

  /cashier/table/checkout:
    post:
      tags: [收银机端]
      summary: 整桌结账/强制结账
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        收银端整桌结账接口，支持合并并台/多单统一结账。
        支持传 `force: true`（或 `force_checkout: true`、`forceCheckout: true`）；
        当整桌订单包含未入账或冲突的收款意向时，携带强制结账参数需具备 `admin:manage` 权限（或超管身份、店长密码授权、`approvalToken` 审批令牌），
        成功后整桌所有订单原子完成入账，意向收敛为 COMPLETED，并在响应中返回 `forced: true`。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableNumber]
              properties:
                tableNumber: { type: string, description: '桌号（亦支持 table_number / number）' }
                paymentMethod: { type: string, description: '支付渠道（如 cash、online_wechat_qr 等，默认 cash）' }
                cashAmount: { type: number, description: '实收现金金额（元）' }
                force: { type: boolean, description: '是否整桌强制结账（需要 admin:manage 权限）' }
                approvalToken: { type: string, description: '店长审批令牌（用于普通收银员授权整桌强制结账）' }
                authorization:
                  type: object
                  description: '店长现场账号密码授权凭证'
                  properties:
                    account: { type: string }
                    password: { type: string }
      responses:
        '200':
          description: 整桌结账成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: 整桌结账成功 }
                  tableNumber: { type: string }
                  settledOrders: { type: array, items: { type: string } }
                  totalAmount: { type: number }
                  cashAmount: { type: number }
                  changeAmount: { type: number }
                  forced: { type: boolean, description: '是否为特权强制结账' }
                  table: { type: object }
        '403': { description: 权限不足（缺少 admin:manage 权限） }
        '500': { description: 失败 }

  /cashier/order/hang:
    post:
      tags: [收银机端]
      summary: 挂单
      description: 将未结账订单设为挂单状态并记录挂单时间与原因，以便收银台暂存当前单据继续服务下一位顾客。强校验门店归属及未结账状态。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no: { type: string, description: 订单号 }
                reason: { type: string, description: 挂单原因或备注（可选） }
      responses:
        '200': { description: 成功，返回 order_no、hang_status=1、hang_time、hang_reason }
        '500': { description: 失败 }
  /cashier/order/unhang:
    post:
      tags: [收银机端]
      summary: 取单（解挂）
      description: 收银员恢复挂起订单时调用，清除订单挂单状态（hang_status=0），以便快速调入收银台进入正常结算。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no: { type: string, description: 订单号 }
      responses:
        '200': { description: 成功，返回 order_no、hang_status=0 }
        '500': { description: 失败 }
  /cashier/order/hang-list:
    get:
      tags: [收银机端]
      summary: 获取当前门店挂单池列表
      description: 查询当前门店所有处于挂单中（hang_status=1）的未结账订单列表，按挂单时间升序排列，附带挂单时长分钟数。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      responses:
        '200':
          description: 成功，返回 list（包含 order_no、table_number、diners、sett_amount、hang_time、hang_minutes、hang_reason、hang_admin_id）与 total
        '500': { description: 失败 }
  /cashier/order/unCheckout:
    post:
      tags: [收银机端]
      summary: 反结账
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: 执行要求 `order:operate:reopen`；仅入口权限返回 `REQUIRE_APPROVAL`，支持严格 token 或兼容现场凭证审批。按当前门店锁定订单并在事务内恢复为未结账；若原结账含余额分项，按订单保存的本金/赠送金实际扣款分别退回钱包后再清空支付列。重复调用幂等，不会重复入账。任何含现金、微信临时收款码或支付宝临时收款码实收的订单（包括单渠道和组合支付）都禁止直接反结账，必须先完成线下退款与账务核对，防止已到账外部资金被清空或触发重复收款。桌台恢复 status=1，order_no 指向当前未结订单，amount 重算为同桌全部未结订单合计。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no: { type: string }
                reason: { type: string }
                authorization: { $ref: '#/components/schemas/SensitiveOperationAuthorization' }
                approvalToken: { type: string, description: 严格绑定的一次性反结账审批令牌 }
      responses:
        '200': { description: 成功 }
        '500': { description: 失败 }
  /cashier/order/updateDiners:
    post:
      tags: [收银机端]
      summary: 修改订单用餐人数
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      description: |
        收银员根据实际情况修改订单用餐人数（1 ~ 999 人），保障人均消费分析等报表精确。
        未结账订单与未日结已结账订单均支持修改；已作废/已关闭订单或所属营业日已完成日结封账的订单禁止修改。
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XShopCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number_of_diners]
              properties:
                orderNo: { type: string, description: 订单编号（与 orderId 二选一） }
                order_no: { type: string, description: 订单编号别名 }
                orderId: { type: integer, description: 订单ID（与 orderNo 二选一） }
                order_id: { type: integer, description: 订单ID别名 }
                number_of_diners: { type: integer, minimum: 1, maximum: 999, description: 就餐人数 }
                numberOfDiners: { type: integer, description: 就餐人数别名 }
                diners: { type: integer, description: 就餐人数别名 }
      responses:
        '200':
          description: 成功，返回 order_no、number_of_diners、previous_diners
        '400': { description: 参数错误（未传人数或非 1~999 整数） }
        '4001': { description: 缺少门店上下文 }
        '4003': { description: 已作废或已关闭订单不允许修改用餐人数 }
        '404': { description: 订单不存在或不属于当前门店 }
        '40936': { description: 该订单所属营业日已完成日结封账，禁止修改用餐人数 }
        '500': { description: 失败 }
  /cashier/order/today:
    get:
      tags: [收银机端]
      summary: 收银账单列表（默认未结账及最近3小时）
      description: |
        不传时间参数时，返回当前门店全部 `transac_status=unsettled` 订单，以及 `order_time` 位于最近 3 小时内的其他订单。
        `startTime/endTime` 可指定 `order_time` 闭区间，两者必须同时提供、最大跨度 31 天；接受 `yyyy-MM-dd HH:mm:ss`、分钟、ISO `T` 或日期格式。
        旧 `date` 参数保留，用于返回指定营业班次 24 小时窗口；不能与 `startTime/endTime` 混用。
        任一显式时间选择（范围或 `date`）均在 `cashier:operate` 基础权限之外额外要求精确权限码 **`admin:super`**，否则返回 403。
        查询强制使用鉴权后解析的门店上下文；`shopId` 如传入，必须与当前门店一致，否则返回 `4003`。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - name: shopId
          in: query
          schema: { type: integer }
        - name: transac_status
          in: query
          schema: { type: string, enum: [success, unsettled, cancelled] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: 超管兼容参数：营业班次起始日（yyyy-MM-dd），要求 admin:super，不可与 startTime/endTime 混用
        - name: startTime
          in: query
          required: false
          schema: { type: string, example: '2026/10/25' }
          description: 自定义开始时间/日期（含），支持 yyyy/MM/dd、yyyy-MM-dd 或含时分秒，须与 endTime 同传并具备 admin:super
        - name: endTime
          in: query
          required: false
          schema: { type: string, example: '2026/10/25' }
          description: 自定义结束时间/日期（含），支持 yyyy/MM/dd、yyyy-MM-dd 或含时分秒，与 startTime 最大跨度 31 天
      responses:
        '200':
          description: 成功，body 含 code、list（Order[]）
        '400': { description: 时间参数非法（body.code=4002）或门店上下文非法 }
        '403': { description: 自定义时间查询缺少 admin:super 权限 }
        '500': { description: 失败 }
  /cashier/order/search:
    get:
      tags: [收银机端]
      summary: 订单搜索
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - name: tableNumber
          in: query
          schema: { type: string }
        - name: startTime
          in: query
          schema: { type: string, example: '2026/10/25' }
          description: 开始时间或日期（yyyy/MM/dd、yyyy-MM-dd 或含时分秒）
        - name: endTime
          in: query
          schema: { type: string, example: '2026/10/25' }
          description: 结束时间或日期（yyyy/MM/dd、yyyy-MM-dd 或含时分秒）
        - name: cashierId
          in: query
          schema: { type: integer }
        - name: pageNum
          in: query
          schema: { type: integer }
        - name: pageSize
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功，body 含 code、list、total
        '500': { description: 失败 }

  /cashier/print/dispatch:
    post:
      tags: [收银机端]
      summary: 统一出票与补打调度
      description: |
        收银端统一出票调度入口。支持全场景出票，前端只需调用一个接口即可打印所有不同场景的小票。
        比如补打厨房订单，前端只需要传入订单号即可自动识别并下发后厨出票。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedPrintRequest'
      responses:
        '200':
          description: 出票调度结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedPrintResponse'
        '400': { description: 请求参数错误或订单未结账禁止打印结账单（code=ORDER_NOT_CHECKED_OUT） }
        '403': { description: 跨店订单拒绝（code=SHOP_SCOPE_MISMATCH） }
        '404': { description: 订单或设备不存在（code=ORDER_NOT_FOUND） }

  /cashier/print/kitchen:
    post:
      tags: [收银机端]
      summary: 厨房小票补打（兼容旧版）
      description: 兼容旧版收银端后厨小票补打接口，内部自动委托统一出票调度服务。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no: { type: string, description: 订单号 }
                cid_list: { type: array, items: { type: string }, description: 指定分类过滤 }
      responses:
        '200':
          description: 成功，返回统一出票调度结果

  # ---------- 收银系统扩展：钱箱与交班 ----------
  /cashier/shift/current:
    get:
      tags: [收银机端]
      summary: 获取当前班次与钱箱会话状态（盲盘保护）
      description: |
        查询当前收银员/钱箱活动班次。为满足商业级盲盘合规要求，此接口严禁返回 expected_cash（系统应有现金），普通收银员不可见应有现金。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      responses:
        '200':
          description: 成功，返回当前班次与钱箱会话对象
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  shift:
                    type: object
                    properties:
                      id: { type: integer }
                      shop_id: { type: integer }
                      admin_id: { type: integer }
                      start_time: { type: string }
                      start_cash: { type: number }
                      order_count: { type: integer }
                      total_amount: { type: number }
                      drawer_session_id: { type: integer }
                      terminal_id: { type: string }
                      state: { type: string }
                      business_day: { type: string }
                  member_recharge_summary:
                    type: object
                    description: 当前员工班次明确归属的成功人工充值汇总；充值本金为实际收款，赠送额不计销售实收
                    properties:
                      success_count: { type: integer, format: int64 }
                      principal_fen: { type: integer, format: int64 }
                      gift_fen: { type: integer, format: int64 }
                      credited_total_fen: { type: integer, format: int64 }
                  drawer_session:
                    type: object
                    properties:
                      id: { type: integer }
                      terminal_id: { type: string }
                      drawer_code: { type: string }
                      state: { type: string }
                      opened_at: { type: string }
                      business_day: { type: string }

  /cashier/shift/start:
    post:
      tags: [收银机端]
      summary: 开班与打开钱箱会话
      description: |
        开启新班次并初始化终端钱箱会话，在不可变账本 t_cash_movement 中写入 OPENING_FLOAT 备用金事件。具备幂等防重支持。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_cash]
              properties:
                start_cash: { type: number, description: '开班备用金额（元）' }
                terminal_id: { type: string, description: '终端标识，默认 MAIN-POS' }
                drawer_code: { type: string, description: '钱箱编号，默认 D01' }
                request_id: { type: string, description: '客户端幂等防重键' }
                idempotency_key: { type: string, maxLength: 64, description: '客户端幂等键（优先，request_id 为兼容别名）' }
                shop_id: { type: integer, description: '门店 ID' }
      responses:
        '200':
          description: 开班成功，返回班次 ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  shiftId: { type: integer }
        '400': { description: 重复开班或已有活动钱箱 }

  /cashier/shift/handover:
    post:
      tags: [收银机端]
      summary: 盲盘交班与长短款审批
      description: |
        收银员清点现金并提交盲盘实数。服务端自动复算现金流水账本差额：
        - 差额绝对值 <= 50 元时直接记录差异并关班；
        - 差额绝对值 > 50 元时，强制要求店长密码授权（approved_by）并记录 variance_reason_code 与 variance_note。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [end_cash]
              properties:
                end_cash: { type: number, description: '盲盘实点现金（元）' }
                counted_cash: { type: number, description: '盲盘实点现金（同 end_cash）' }
                variance_reason_code: { type: string, enum: [SHORTAGE, OVERAGE, SYSTEM_CALC, OTHER], description: '差异原因代码' }
                variance_note: { type: string, description: '长短款差异说明' }
                approved_by: { type: integer, description: '审批人 ID' }
                request_id: { type: string, description: '客户端幂等防重键' }
                idempotency_key: { type: string, maxLength: 64, description: '交班幂等键' }
                shop_id: { type: integer, description: '门店 ID' }
      responses:
        '200':
          description: 交班成功，返回汇总结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  order_count: { type: integer }
                  total_amount: { type: number }
                  session_id: { type: integer }
                  drawer_session_id: { type: integer }
                  state: { type: string }
                  counted_cash: { type: number }
                  variance: { type: number }
                  variance_approved: { type: boolean }
        '400': { description: 超限长短款未审批或无活动钱箱 }
        '409': { description: '班次已关闭，error_code=SHIFT_ALREADY_CLOSED（兼容 error）' }

  /cashier/shift/cash-movement:
    post:
      tags: [收银机端]
      summary: 记录钱箱人工现金事件（加钞/支出/投库）
      description: |
        记录人工钱箱变动至不可变现金事件台账：
        - CASH_IN: 零钱加钞（补充找零备用金）
        - CASH_OUT: 现金支出（日常零星采购/杂费）
        - CASH_DROP: 大钞投库（大额现钞转移至保险柜）
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movement_type, amount]
              properties:
                movement_type: { type: string, enum: [CASH_IN, CASH_OUT, CASH_DROP], description: '变动类型' }
                amount: { type: number, description: '变动金额（元）' }
                reason_code: { type: string, description: '原因代码' }
                remark: { type: string, description: '说明备注' }
                approver_id: { type: integer, description: '授权审批人 ID' }
                request_id: { type: string, description: '幂等防重键' }
                idempotency_key: { type: string, maxLength: 64, description: '幂等键（优先）' }
                shop_id: { type: integer, description: '门店 ID' }
      responses:
        '200':
          description: 变动记录成功
        '400': { description: 钱箱余额不足或无活动钱箱 }

  /cashier/shift/report/{sessionId}:
    get:
      tags: [收银机端]
      summary: 获取钱箱班次综合报表
      description: |
