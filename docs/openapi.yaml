        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: 营业时段完整订单快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      shopId: { type: integer }
                      businessDay: { type: string, format: date }
                      businessDayStart: { type: string, format: date-time }
                      businessDayEnd: { type: string, format: date-time }
                      openTime: { type: string, example: '16:00' }
                      closeTime: { type: string, example: '04:00' }
                      orders: { type: array, items: { type: object, additionalProperties: true } }
                      nextCursor: { type: string, nullable: true }
                      complete: { type: boolean }
