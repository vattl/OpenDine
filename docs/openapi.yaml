        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: 成功，分页结构 }
    post:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 新增供应商
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                contactName: { type: string }
                contactPhone: { type: string }
                supplyScope: { type: string }
                settlementInfo: { type: string }
      responses:
        '200': { description: 成功 }
        '400': { description: 校验失败 }
    put:
      tags: [系统设置, 库存与成本, 运营后台]
      summary: 更新供应商
      security: [{ BearerAuth: [] }]
      x-permission: inventory:manage
      parameters:
        - $ref: '#/components/parameters/XShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
