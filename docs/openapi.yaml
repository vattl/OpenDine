      responses:
        '200': { description: 成功，含 refund_quantity、sold_out_applied、line_status }
        '400': { description: 参数错误或队列不支持 }
        '401': { description: 缺少或无效 X-Kds-Device-Token }

  /kds/workflow/revoke:
    post:
      deprecated: true
      x-kds-retired: true
      x-kds-retired-status: 410
      tags: [KDS-Client]
      summary: KDS 工作流撤销（撤销划菜/配菜）
      description: |
        美团对齐：从当前队列回退一步，按批次 LIFO 撤销最近推进的份数。
        - `from_queue=ready_serve`：撤销划菜，份数回到 `pending_cook`。
        - `from_queue=pending_cook`：撤销配菜，份数回到 `pending_prep`。
        传 **`quantity`**（默认 1）表示撤销份数。
      parameters:
        - $ref: '#/components/parameters/XKdsDeviceToken'
