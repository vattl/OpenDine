  # ---------- 云端多渠道订单可靠交付到收银本地 KDS ----------
  /cashier/kds/authority/lease:
    post:
      tags: [收银机端]
      summary: 获取或续租本店 KDS 主收银 authority（别名 /cashier/kds/delivery/lease）
      description: |
        一个门店同时只允许一个主 authority 向 LAN KDS 写入。
        首次请求获取递增 `authority_epoch` 和短期 lease token；续租必须携带当前 token。
        建议 10 秒续租、30 秒过期。发生接管时新 epoch 会 fence 掉旧主机。
        兼容路径别名：`/cashier/kds/delivery/lease`、`/admin/cashier/kds/delivery/lease`、`/api/admin/cashier/kds/delivery/lease`。
      x-implementation-status: implemented
      x-since-version: 1.2.189
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashierKdsAuthorityLeaseRequest' }
      responses:
        '200':
          description: 获取或续租成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierKdsAuthorityLeaseResponse' }
        '409': { description: 当前存在未过期主 authority，或续租 token/epoch 已失效 }

  /cashier/kds/delivery/lease:
    post:
      tags: [收银机端]
      summary: 获取或续租本店 KDS 主收银 authority（同 /cashier/kds/authority/lease）
      description: |
        一个门店同时只允许一个主 authority 向 LAN KDS 写入。
        首次请求获取递增 `authority_epoch` 和短期 lease token；续租必须携带当前 token。
      x-implementation-status: implemented
      x-since-version: 1.2.189
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashierKdsAuthorityLeaseRequest' }
      responses:
        '200':
          description: 获取或续租成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierKdsAuthorityLeaseResponse' }
        '409': { description: 当前存在未过期主 authority，或续租 token/epoch 已失效 }

  /cashier/kds/delivery/bootstrap:
    get:
      tags: [收银机端]
      summary: 分页重建当前门店活跃厨房订单
      description: |
        新设备、磁盘恢复、authority 接管或 cursor 超出保留窗口时调用。
        首次请求不传 `nextPageToken`；响应固定 `baseCursor`。后续分页必须沿用 token。
        全部分页提交到 SQLite 后，从 `afterCursor=baseCursor` 追赶增量，避免快照期间变化丢失。
        缺失投影时返回 HTTP503/code5030（BOOTSTRAP_PROJECTION_PENDING），后台每批最多修复32单；客户端持续按租约响应续租，建议1至5秒抖动退避后重试首屏。不能提交部分页面或ACK解除门禁。分页读取不持租约行锁，返回前重新校验epoch及有效期；全部完成后才可ACK。页token仍为10分钟有效，过期须重新首屏。
      x-implementation-status: implemented
      x-since-version: 1.2.189
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
        - $ref: '#/components/parameters/XCashierAuthorityEpoch'
        - $ref: '#/components/parameters/XCashierLeaseToken'
        - name: nextPageToken
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: 稳定分页快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierKdsBootstrapResponse' }
        '503': { description: code5030 BOOTSTRAP_PROJECTION_PENDING，投影恢复中，续租并重试首屏；不返回完整快照 }
        '409': { description: authority epoch 或 lease 已过期，客户端停止写 LAN 并重新获取租约 }

  /cashier/kds/delivery/events:
    get:
      tags: [收银机端]
      summary: 按持久 cursor 拉取厨房投递事件
      description: |
        至少一次返回，事件可能重复；客户端必须按 `eventId` 和
        `projection.projectionVersion` 幂等。只有 SQLite Inbox、订单投影、LAN Outbox 和 checkpoint
        在同一事务提交后，才能推进 cursor 和调用 ACK。WebSocket 不可替代本接口。
      x-implementation-status: implemented
      x-since-version: 1.2.189
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
        - $ref: '#/components/parameters/XCashierAuthorityEpoch'
        - $ref: '#/components/parameters/XCashierLeaseToken'
        - name: afterCursor
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: 增量事件；无事件时 events 为空，cursor 仍保持可继续使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashierKdsDeliveryEventsResponse' }
        '409': { description: authority epoch/lease 失效，或 cursor 过期且响应指示 snapshotRequired=true }

  /cashier/kds/delivery/business-day/orders/detail:
    get:
      tags: [收银机端]
      summary: 分页回填营业时间内全量订单及厨房完成状态
      description: |
        bootstrap 的历史回填补充接口，不生成投递事件或更新 ack 游标。
        data 包含 businessDayStart/businessDayEnd、orders、nextCursor、complete，按 ID 升序分页。
        窗口为开始含、结束不含，包含完成、未接单和取消订单。
        orders 增加 completed、completedAtMs（未知为 null）、archived=false、orderStatus(active/completed/cancelled)、transactionStatus。
        厨房完成依据 kds_order_status=40 或 order_receiving=off_order，结账不代表厨房完成；取消优先。
        details/lines 含 detailId、dishName、quantity、lineQuantity、doneLine、workflowQueue、readyRemaining、prepRemaining、cookRemaining。
        完成单明细为 done/1/0；未完成行读取云端复制进度，未同步进度为 null。
        历史回填不得触发新来单打印/制作。与 bootstrap 使用相同凭证请求头，不接受查询参数凭证。
      security: [{ BearerAuth: [] }]
      x-permission: cashier:operate
      parameters:
        - $ref: '#/components/parameters/XShopId'
        - $ref: '#/components/parameters/XCashierDeviceCode'
        - $ref: '#/components/parameters/XCashierAuthorityEpoch'
        - $ref: '#/components/parameters/XCashierLeaseToken'
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200':
          description: 营业时段订单全量分页及厨房明细
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: 无效 cursor 或缺少门店上下文 }
        '409': { description: 租约过期或凭证无效 }

  /cashier/kds/delivery/business-day/orders:
    get:
      tags: [收银机端]
      summary: 获取当前营业时段完整订单快照
      description: |
        以 `t_shop.open_time` 和 `t_shop.close_time` 动态计算当前营业时段，返回该时段内全部订单，
        包括已完成、已归档订单及可用于回撤定位的订单明细。结果按 order_time、order_id 升序稳定排序。
        cursor 使用 `order_time:order_id` 复合格式；仍兼容旧版纯数字 cursor。
      x-implementation-status: implemented
