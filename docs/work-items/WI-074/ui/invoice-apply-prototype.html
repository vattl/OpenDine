<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老肥家餐饮 · 电子发票抬头登记 (Prototype)</title>
    <style>
        :root {
            --primary: #1aad19;
            --primary-hover: #179b16;
            --bg: #f7f7f7;
            --card-bg: #ffffff;
            --text-main: #1f1f1f;
            --text-sub: #8c8c8c;
            --border: #e8e8e8;
            --danger: #fa5151;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 40px;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: linear-gradient(135deg, #2b32b2 0%, #1488cc 100%);
            color: #ffffff;
            padding: 32px 20px 24px;
            text-align: center;
        }
        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
        .header p { font-size: 13px; opacity: 0.88; font-weight: 400; }
        .main-container { max-width: 480px; margin: -16px auto 0; padding: 0 16px; }
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .order-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .order-meta .label { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
        .order-meta .value { font-size: 15px; font-weight: 500; }
        .amount-box { text-align: right; }
        .amount-box .label { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
        .amount-box .amount { font-size: 20px; font-weight: 700; color: #fa5151; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending { background: #fff7e6; color: #fa8c16; }
        .status-submitted { background: #e6f7ff; color: #1890ff; }
        .status-success { background: #f6ffed; color: #52c41a; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .form-label .required { color: var(--danger); margin-right: 4px; }
        .form-input {
            width: 100%;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 12px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--primary); }
        .form-tip { font-size: 12px; color: var(--text-sub); margin-top: 6px; }
        .type-selector { display: flex; gap: 12px; margin-bottom: 8px; }
        .type-option {
            flex: 1;
            text-align: center;
            height: 38px;
            line-height: 36px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-sub);
        }
        .type-option.active {
            border-color: var(--primary);
            color: var(--primary);
            background-color: rgba(26, 173, 25, 0.05);
            font-weight: 500;
        }
        .btn-submit {
            width: 100%;
            height: 46px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:disabled {
            background-color: #a0d995;
            cursor: not-allowed;
        }
        .submitted-info { display: none; text-align: center; padding: 24px 16px; }
        .submitted-icon {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #f6ffed;
            color: #52c41a;
            font-size: 32px;
            line-height: 60px;
            margin: 0 auto 16px;
        }
        .submitted-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .submitted-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .detail-label { color: var(--text-sub); }
        .detail-val { font-weight: 500; }
        .privacy-banner {
            background: #f0f7ff;
            border: 1px solid #d0e7ff;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #0050b3;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>老肥家餐饮 · 电子发票服务</h1>
        <p>门店发票抬头在线登记与开具申请</p>
    </div>

    <div class="main-container">
        <!-- 订单概览卡片 -->
        <div class="card">
            <div class="order-summary">
                <div class="order-meta">
                    <div class="label">消费订单编号</div>
                    <div class="value" id="displayOrderNo">ORDER_20261028_001</div>
                </div>
                <div class="amount-box">
                    <div class="label">可开票金额</div>
                    <div class="amount" id="displayAmount">¥ 128.00</div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 13px; color: var(--text-sub);">发票类型：增值税普通发票 (电子)</span>
                <span class="status-badge status-pending" id="statusBadge">待填写抬头</span>
            </div>
        </div>

        <div class="privacy-banner">
            <span>🛡️</span>
            <span>本次申请受安全凭据保护，提交后敏感信息将加密脱敏显示。</span>
        </div>

        <!-- 填写发票抬头卡片 -->
        <div class="card" id="formCard">
            <div class="form-group">
                <label class="form-label">抬头类型</label>
                <div class="type-selector">
                    <div class="type-option active" id="optCompany">企业 / 单位</div>
                    <div class="type-option" id="optPersonal">个人 / 非企业</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="buyerTitle"><span class="required">*</span>发票抬头名称</label>
                <input type="text" class="form-input" id="buyerTitle" value="北京老肥家餐饮管理有限公司" placeholder="请输入单位全称">
            </div>

            <div class="form-group" id="taxNoGroup">
                <label class="form-label" for="buyerTaxNo"><span class="required">*</span>统一社会信用代码 / 税号</label>
                <input type="text" class="form-input" id="buyerTaxNo" value="91110108MA00ABCD12" placeholder="请输入15-20位信用代码或税号" maxlength="20">
            </div>

            <div class="form-group">
                <label class="form-label" for="buyerEmail">电子邮箱（接收电子发票凭证）</label>
                <input type="email" class="form-input" id="buyerEmail" value="finance@laofeijia.com" placeholder="例如：example@domain.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="buyerPhone">手机号码（接收开票提醒通知）</label>
                <input type="tel" class="form-input" id="buyerPhone" value="13800138000" placeholder="请输入11位手机号码" maxlength="11">
            </div>

            <button type="button" class="btn-submit" id="btnSubmit">提交开票申请</button>
        </div>

        <!-- 已提交信息脱敏回显卡片 -->
        <div class="card submitted-info" id="submittedCard">
            <div class="submitted-icon">✓</div>
            <div class="submitted-title" id="submittedTitle">开票申请已提交</div>
            <div class="submitted-desc" id="submittedDesc">发票抬头登记已提交，商家财务将核对订单并处理开票凭证，开具结果将通知您的预留联系方式。</div>

            <div style="background: #fafafa; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px;">
                <div class="detail-row">
                    <span class="detail-label">发票抬头</span>
                    <span class="detail-val" id="viewTitle">北京老肥家餐饮管理有限公司</span>
                </div>
                <div class="detail-row" id="viewTaxNoRow">
                    <span class="detail-label">纳税人识别号</span>
                    <span class="detail-val" id="viewTaxNo">9111****CD12</span>
                </div>
                <div class="detail-row" id="viewEmailRow">
                    <span class="detail-label">接收邮箱</span>
                    <span class="detail-val" id="viewEmail">f***@laofeijia.com</span>
                </div>
                <div class="detail-row" id="viewPhoneRow">
                    <span class="detail-label">手机号码</span>
                    <span class="detail-val" id="viewPhone">138****8000</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
